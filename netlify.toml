[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.1"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)"
Content-Security-Policy-Report-Only = "default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.shahrmeeting.ir; font-src 'self'; connect-src 'self' https://api.shahrmeeting.ir wss://api.shahrmeeting.ir https://api.ipify.org https://accounts.google.com https://api.groq.com https://api.openai.com; frame-src https://accounts.google.com; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; report-uri https://api.shahrmeeting.ir/functions/v1/csp-report"

# Vite production filenames under /assets/ contain content hashes. They can be
# cached forever because a changed file is emitted under a new URL.
[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Fonts are stable static assets. Cache them aggressively but not forever under
# their current non-hashed filenames.
[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# The application shell must always be allowed to discover a new deployment.
[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"

# Service workers need prompt revalidation; caching an old worker can keep an
# otherwise fast deployment on stale runtime caching rules.
[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"
Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.json"

[headers.values]
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

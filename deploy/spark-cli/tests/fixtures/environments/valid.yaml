schema_version: 1
environment:
  name: production
  mode: online
nodes:
  reverse_proxy:
    role: reverse_proxy
    host: 10.0.0.10
    secondary_hosts:
      - 10.0.0.11
    vlan: 100
  application:
    role: application
    host: 10.0.1.10
    vlan: 101
  database:
    role: database
    host: 10.0.2.10
    vlan: 102
jump_server:
  enabled: true
external_services:
  bale:
    host: api.bale.ai
    port: 443
    protocol: https
    required: true
network:
  rules:
    - id: proxy-to-app
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 80
    - id: app-to-db
      source: application
      destination: database
      protocol: tcp
      ports:
        - 5432
    - id: app-to-bale
      source: application
      destination: bale
      protocol: tcp
      ports:
        - 443

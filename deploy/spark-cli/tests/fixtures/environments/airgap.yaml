schema_version: 1
environment:
  name: airgap
  mode: airgap
nodes:
  reverse_proxy:
    role: reverse_proxy
    host: 10.40.0.10
  application:
    role: application
    host: 10.40.1.10
  database:
    role: database
    host: 10.40.2.10
network:
  rules:
    - id: proxy-to-app
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 80
    - id: app-to-db
      source: application
      destination: database
      protocol: tcp
      ports:
        - 5432

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: spark-livekit

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: livekit
    static_configs:
      - targets:
          - 127.0.0.1:6789

  - job_name: livekit-egress
    static_configs:
      - targets:
          - 127.0.0.1:6788

  - job_name: livekit-ingress
    static_configs:
      - targets:
          - 127.0.0.1:6787

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9115

  - job_name: alloy
    static_configs:
      - targets:
          - 127.0.0.1:12345

  - job_name: loki
    static_configs:
      - targets:
          - 127.0.0.1:3100

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

schema_version: 1
environment:
  name: staging
  mode: online
nodes:
  reverse_proxy:
    role: reverse_proxy
    host: 10.20.0.10
    vlan: 200
  application:
    role: application
    host: 10.20.1.10
    vlan: 201
  database:
    role: database
    host: 10.20.2.10
    vlan: 202
runtime:
  docker:
    install_policy: install-if-missing
    replace_conflicting_packages: false
    version_policy: compatible-stable
database:
  supabase:
    release: self-hosted/v0.8.1
    source_url: https://github.com/supabase/supabase.git
    destination: /opt/spark/database/supabase
    capabilities:
      auth: true
      rest: true
      realtime: true
      storage: true
      gateway: true
      studio: true
      pooler: true
      meta: true
      imgproxy: true
  secret_file: /etc/spark-manager/secrets/database.env
  compose:
    project_name: spark-supabase
  schema:
    owned_schemas:
      - public
  startup:
    postgres:
      normal_timeout_seconds: 120
      initialization_timeout_seconds: 600
    service_retry:
      attempts: 3
      delay_seconds: 10
    supabase_timeout_seconds: 300
    image_pull_timeout_seconds: 900
jump_server:
  enabled: false
network:
  rules:
    - id: proxy-to-app
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 80
    - id: app-to-database
      source: application
      destination: database
      protocol: tcp
      ports:
        - 5432

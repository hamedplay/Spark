schema_version: 1
environment:
  name: production
  mode: online
nodes:
  reverse_proxy:
    role: reverse_proxy
    host: 10.211.36.178
    secondary_hosts:
      - 10.211.36.179
    vlan: 843
  application:
    role: application
    host: 10.211.19.74
    vlan: 1367
  database:
    role: database
    host: 10.211.96.194
    vlan: 1140
runtime:
  docker:
    install_policy: install-if-missing
    replace_conflicting_packages: false
    version_policy: compatible-stable
database:
  supabase:
    release: self-hosted/v0.8.1
    source_url: https://github.com/supabase/supabase.git
    destination: /opt/spark/database/supabase
    capabilities:
      auth: true
      rest: true
      realtime: true
      storage: true
      gateway: true
      studio: true
      pooler: true
      meta: true
      imgproxy: true
  secret_file: /etc/spark-manager/secrets/database.env
  compose:
    project_name: spark-supabase
  schema:
    owned_schemas:
      - public
  startup:
    postgres:
      normal_timeout_seconds: 120
      initialization_timeout_seconds: 600
    service_retry:
      attempts: 3
      delay_seconds: 10
    supabase_timeout_seconds: 300
    image_pull_timeout_seconds: 900
application:
  source:
    repository: https://github.com/hamedplay/Spark.git
    revision: main
    releases_root: /opt/spark/application/releases
    current_link: /opt/spark/application/current
    shared_root: /opt/spark/application/shared
  secret_file: /etc/spark-manager/secrets/application.env
  runtime_env_file: /opt/spark/application/shared/runtime.env
  node_command: node
  npm_command: npm
  required_secret_keys:
    - SUPABASE_ANON_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - JWT_SECRET
  edge:
    image: supabase/edge-runtime:v1.76.2
    root: /opt/spark/application/edge
    port: 9000
    project_name: spark-edge
    probe_function: auth-health-check
    verify_jwt: false
  livekit:
    root: /opt/spark/application/livekit
    source_dir: deploy/livekit
    image: livekit/livekit-server:v1.13.5
    redis_image: redis:7.4.5-alpine
    api_port: 7880
    rtc_tcp_port: 7881
    rtc_udp_start: 50000
    rtc_udp_end: 60000
    embedded_turn: false
  coturn:
    enabled: true
    listener_port: 3478
    tls_port: 5349
    relay_min_port: 49152
    relay_max_port: 65535
    realm: ""
    certificate_file: ""
    key_file: ""
reverse_proxy:
  public_host: ""
  config_path: /etc/nginx/conf.d/spark.conf
  install_nginx_if_missing: true
  tls:
    mode: provided
    certificate_file: ""
    key_file: ""
jump_server:
  enabled: true
  ssh_user: ""
  remote:
    known_hosts_file: /etc/ssh/ssh_known_hosts
    connect_timeout_seconds: 5
    command_timeout_seconds: 1800
    remote_profile_path: /tmp/spark-production.yaml
    state_file: /var/lib/spark-manager/environment/production.json
external_services:
  bale:
    host: api.bale.ai
    port: 443
    protocol: https
    required: true
  rahyab:
    host: api.rahyab.ir
    port: 443
    protocol: https
    required: true
network:
  rules:
    - id: proxy-to-app
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 80
    - id: proxy-to-database-supabase
      source: reverse_proxy
      destination: database
      protocol: tcp
      ports:
        - 8000
    - id: app-to-database-postgres
      source: application
      destination: database
      protocol: tcp
      ports:
        - 5432
    - id: app-to-database-supabase
      source: application
      destination: database
      protocol: tcp
      ports:
        - 8000
    - id: app-to-bale
      source: application
      destination: bale
      protocol: tcp
      ports:
        - 443
    - id: app-to-rahyab
      source: application
      destination: rahyab
      protocol: tcp
      ports:
        - 443
full_environment:
  mode: GUIDED
  network_rules:
    - id: internet-to-reverse-proxy
      source: internet
      destination: reverse_proxy
      protocol: tcp
      ports:
        - 443
      verification: GUIDED
    - id: reverse-proxy-to-frontend
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 80
      verification: AUTO_VERIFY
    - id: reverse-proxy-to-edge
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 9000
      verification: AUTO_VERIFY
    - id: reverse-proxy-to-livekit
      source: reverse_proxy
      destination: application
      protocol: tcp
      ports:
        - 7880
      verification: AUTO_VERIFY
    - id: reverse-proxy-to-supabase
      source: reverse_proxy
      destination: database
      protocol: tcp
      ports:
        - 8000
      verification: AUTO_VERIFY
    - id: application-to-database
      source: application
      destination: database
      protocol: tcp
      ports:
        - 5432
        - 8000
      verification: AUTO_VERIFY
    - id: clients-to-livekit-tcp
      source: clients
      destination: application
      protocol: tcp
      ports:
        - 7881
      verification: GUIDED
    - id: clients-to-livekit-udp
      source: clients
      destination: application
      protocol: udp
      port_ranges:
        - 50000-60000
      verification: GUIDED
    - id: clients-to-turn
      source: clients
      destination: application
      protocol: udp
      ports:
        - 3478
        - 5349
      port_ranges:
        - 49152-65535
      verification: GUIDED

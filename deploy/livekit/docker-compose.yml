services:
  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    network_mode: host
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: ["server", "/data", "--address", "127.0.0.1:9000", "--console-address", "127.0.0.1:9001"]
    volumes:
      - livekit_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: ${MINIO_CPU_LIMIT:-1.0}
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    pids_limit: 512
    stop_grace_period: 2m

  minio-init:
    image: ${MINIO_MC_IMAGE}
    restart: "no"
    network_mode: host
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://127.0.0.1:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$S3_BUCKET"
    cpus: ${MINIO_INIT_CPU_LIMIT:-0.25}
    mem_limit: ${MINIO_INIT_MEMORY_LIMIT:-128m}
    pids_limit: 128

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - livekit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    pids_limit: 256
    stop_grace_period: 1m

  livekit:
    image: ${LIVEKIT_SERVER_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-127.0.0.1:6379}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        prometheus_port: 6789
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN}
          udp_port: 443
          tls_port: 5349
          cert_file: /etc/livekit/turn-cert/fullchain.pem
          key_file: /etc/livekit/turn-cert/privkey.pem
        ingress:
          rtmp_base_url: rtmp://${LIVEKIT_INGRESS_DOMAIN}:1935/live
          whip_base_url: https://${LIVEKIT_INGRESS_DOMAIN}/whip
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
        room:
          auto_create: false
          empty_timeout: 300
          departure_timeout: 60
          max_participants: 20
    volumes:
      - ./certs/turn:/etc/livekit/turn-cert:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${LIVEKIT_CPU_LIMIT:-4.0}
    mem_limit: ${LIVEKIT_MEMORY_LIMIT:-4g}
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    stop_grace_period: ${LIVEKIT_STOP_GRACE_PERIOD:-5h}

  egress:
    image: ${LIVEKIT_EGRESS_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      EGRESS_CONFIG_BODY: |
        ws_url: ws://127.0.0.1:7880
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-127.0.0.1:6379}
        health_port: 9091
        prometheus_port: 6788
        log_level: info
        s3:
          access_key: ${S3_ACCESS_KEY}
          secret: ${S3_SECRET_KEY}
          region: ${S3_REGION}
          endpoint: ${S3_ENDPOINT}
          bucket: ${S3_BUCKET}
          force_path_style: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${EGRESS_CPU_LIMIT:-4.0}
    mem_limit: ${EGRESS_MEMORY_LIMIT:-4g}
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: ${EGRESS_STOP_GRACE_PERIOD:-15m}

  ingress:
    image: ${LIVEKIT_INGRESS_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      INGRESS_CONFIG_BODY: |
        ws_url: ws://127.0.0.1:7880
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-127.0.0.1:6379}
        health_port: 9092
        prometheus_port: 6787
        rtmp_port: 1935
        whip_port: 8080
        rtc_config:
          udp_port: 7885
          use_external_ip: true
        log_level: info
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9092/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: ${INGRESS_CPU_LIMIT:-2.0}
    mem_limit: ${INGRESS_MEMORY_LIMIT:-2g}
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    stop_grace_period: ${INGRESS_STOP_GRACE_PERIOD:-2m}

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      livekit:
        condition: service_healthy
      ingress:
        condition: service_healthy
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      LIVEKIT_INGRESS_DOMAIN: ${LIVEKIT_INGRESS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - livekit_caddy_data:/data
      - livekit_caddy_config:/config
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    pids_limit: 256
    stop_grace_period: 30s

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - livekit_prometheus_data:/prometheus
    cpus: ${PROMETHEUS_CPU_LIMIT:-1.0}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-1g}
    pids_limit: 512
    stop_grace_period: 30s

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - livekit_alertmanager_data:/alertmanager
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.25}
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-256m}
    pids_limit: 256
    stop_grace_period: 30s

  loki:
    image: ${LOKI_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - livekit_loki_data:/loki
    cpus: ${LOKI_CPU_LIMIT:-1.0}
    mem_limit: ${LOKI_MEMORY_LIMIT:-1g}
    pids_limit: 512
    stop_grace_period: 30s

  alloy:
    image: ${ALLOY_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - livekit_alloy_data:/var/lib/alloy
    depends_on:
      - loki
    cpus: ${ALLOY_CPU_LIMIT:-0.5}
    mem_limit: ${ALLOY_MEMORY_LIMIT:-512m}
    pids_limit: 512
    stop_grace_period: 30s

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    cpus: ${NODE_EXPORTER_CPU_LIMIT:-0.25}
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-256m}
    pids_limit: 256
    stop_grace_period: 30s

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cpus: ${BLACKBOX_CPU_LIMIT:-0.25}
    mem_limit: ${BLACKBOX_MEMORY_LIMIT:-128m}
    pids_limit: 256
    stop_grace_period: 30s

  grafana:
    image: ${GRAFANA_IMAGE}
    profiles:
      - observability
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - livekit_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alertmanager
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    pids_limit: 512
    stop_grace_period: 30s

volumes:
  livekit_minio_data:
  livekit_redis_data:
  livekit_caddy_data:
  livekit_caddy_config:
  livekit_prometheus_data:
  livekit_alertmanager_data:
  livekit_loki_data:
  livekit_alloy_data:
  livekit_grafana_data:

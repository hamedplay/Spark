groups:
  - name: spark-livekit
    interval: 30s
    rules:
      - record: spark_livekit:network_in_bps
        expr: sum(rate(livekit_packet_bytes{direction="incoming"}[1m])) * 8

      - record: spark_livekit:network_out_bps
        expr: sum(rate(livekit_packet_bytes{direction="outgoing"}[1m])) * 8

      - record: spark_livekit:packet_loss_p95_percent
        expr: histogram_quantile(0.95, sum by (le) (rate(livekit_packet_loss_percent_bucket[5m])))

      - record: spark_livekit:rtc_join_failures_5m
        expr: sum(increase(livekit_participant_join_total{state="rtc_failure"}[5m]))

      - alert: SparkLiveKitMetricsDown
        expr: up{job="livekit"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: LiveKit metrics endpoint is down
          description: Prometheus cannot scrape the LiveKit SFU metrics endpoint.

      - alert: SparkLiveKitEgressMetricsDown
        expr: up{job="livekit-egress"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: LiveKit Egress metrics endpoint is down
          description: The recording worker is not exposing Prometheus metrics.

      - alert: SparkLiveKitIngressMetricsDown
        expr: up{job="livekit-ingress"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: LiveKit Ingress metrics endpoint is down
          description: The RTMP/WHIP ingress worker is not exposing Prometheus metrics.

      - alert: SparkLiveKitHighPacketLoss
        expr: spark_livekit:packet_loss_p95_percent > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated LiveKit packet loss
          description: 95th percentile packet loss has remained above 5 percent for five minutes.

      - alert: SparkLiveKitRtcJoinFailures
        expr: spark_livekit:rtc_join_failures_5m >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Repeated LiveKit RTC join failures
          description: At least three RTC join failures were observed in five minutes.

      - alert: SparkLiveKitHostCpuHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LiveKit host CPU is high
          description: Host CPU utilization has remained above 85 percent for ten minutes.

      - alert: SparkLiveKitHostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LiveKit host memory is high
          description: Host memory utilization has remained above 90 percent for ten minutes.

      - alert: SparkLiveKitApiProbeDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Spark/LiveKit HTTP probe failed
          description: The monitored HTTPS endpoint is not returning a successful response.

      - alert: SparkLiveKitApiLatencyHigh
        expr: probe_duration_seconds{job="blackbox-http",probe="spark-api"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Spark API latency is high
          description: The public API health probe has exceeded two seconds for five minutes.

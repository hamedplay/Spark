name: Temporary calendar timeline overlay fix

on:
  push:
    paths:
      - '.github/workflows/temporary-calendar-timeline-overlay-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Raise current-time overlay above meeting cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Calendar/MultiDayView.tsx')
          text = path.read_text()
          start = text.index('function renderCurrentTime(')
          end = text.index('function renderCurrentTimeRailLabel(', start)
          block = text[start:end]
          old = 'className="pointer-events-none absolute left-0 right-0 z-40"'
          new = 'className="pointer-events-none absolute left-0 right-0 z-[80]"'
          if block.count(old) != 1:
              raise SystemExit(f'expected exactly one current-time overlay z-40 marker, found {block.count(old)}')
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Validate overlay layering
        run: |
          grep -Fq 'pointer-events-none absolute left-0 right-0 z-[80]' src/components/Calendar/MultiDayView.tsx
          grep -Fq 'zIndex: (isBeingDragged || isBeingResized) ? 30 : blockZIndex' src/components/Calendar/CalendarViewShared.tsx

      - name: Commit patch
        run: |
          git config user.name "spark-automation"
          git config user.email "spark-automation@users.noreply.github.com"
          git add src/components/Calendar/MultiDayView.tsx
          git commit -m "fix(calendar): keep timeline above meeting cards"
          git push origin HEAD:main

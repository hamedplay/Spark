name: Temporary npm dependency update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-update-npm-deps.yml

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Update scoped dependencies only
        run: |
          npm install docx@9.11.0 lucide-react@1.57.0 --save
          npm install oxlint@1.88.0 postcss@8.5.30 --save-dev

      - name: Validate build
        run: npm run build

      - name: Validate docx-related test
        run: npm run test:word-export

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: update npm dependencies"
          git push origin HEAD:main

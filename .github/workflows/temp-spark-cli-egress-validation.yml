name: Temporary Spark CLI Egress Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/lib/install-livekit.sh
      - name: Validate Egress repair wiring
        run: |
          grep -q 'spark_prepare_livekit_step_20' deploy/spark-cli/spark
          grep -q 'Sync latest LiveKit deployment assets' deploy/spark-cli/spark
          grep -q 'Force-recreate existing LiveKit Egress' deploy/spark-cli/spark
          grep -q 'insecure: true' deploy/livekit/docker-compose.yml
          grep -q 'insecure: true' deploy/livekit/egress.yaml

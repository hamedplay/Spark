name: Temporary calendar performance validation

on:
  push:
    branches: [main]
    paths:
      - 'src/AuthenticatedRoot.tsx'
      - 'src/components/Calendar/CalendarPageView.tsx'
      - '.github/workflows/calendar-perf-temp.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:calendar-url

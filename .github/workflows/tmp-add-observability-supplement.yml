name: Temporary Add Observability Supplement

on:
  push:
    paths:
      - '.github/workflows/tmp-add-observability-supplement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply observability supplement patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_add_observability_supplement.py
          bash -n deploy/spark-cli/lib/airgap-build.sh
          bash -n deploy/spark-cli/spark-airgap
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          python3 deploy/spark-cli/spark-ui.py --self-test
          git diff --check

      - name: Validate exact observability image list
        shell: bash
        run: |
          set -Eeuo pipefail
          export SPARK_ROOT="$PWD"
          fail(){ echo "FAIL: $*" >&2; return 1; }
          source deploy/spark-cli/lib/airgap-build.sh
          mapfile -t images < <(airgap_observability_image_list)
          test "${#images[@]}" -eq 7
          expected=(
            'prom/prometheus:v3.14.0'
            'prom/alertmanager:v0.34.0'
            'grafana/grafana:13.2.0'
            'grafana/loki:3.7.0'
            'grafana/alloy:v1.19.0'
            'prom/node-exporter:v1.12.1'
            'prom/blackbox-exporter:v0.28.0'
          )
          for image in "${expected[@]}"; do printf '%s\n' "${images[@]}" | grep -Fxq "$image"; done
          echo 'Observability image manifest: PASS'

      - name: Validate supplement import mechanics with Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl start docker
          docker pull --platform=linux/amd64 busybox:1.36 >/dev/null
          work="$(mktemp -d)"
          root="$work/spark-observability-images"
          mkdir -p "$root"
          # Seven manifest lines are required by the supplement contract; use the
          # same tiny image under seven temporary tags so CI stays lightweight.
          : >"$root/images.txt"
          : >"$root/image-ids.txt"
          for n in 1 2 3 4 5 6 7; do
            tag="spark-test-observability:${n}"
            docker tag busybox:1.36 "$tag"
            printf '%s\n' "$tag" >>"$root/images.txt"
            printf '%s %s\n' "$tag" "$(docker image inspect --format '{{.Id}}' "$tag")" >>"$root/image-ids.txt"
          done
          docker image save $(cat "$root/images.txt") | gzip -1 >"$root/docker-images.tar.gz"
          cat >"$root/manifest.env" <<'EOF'
          FORMAT_VERSION=1
          PACK_TYPE=SPARK_OBSERVABILITY_IMAGE_SUPPLEMENT
          ARCH=amd64
          IMAGE_COUNT=7
          SPARK_COMMIT=test
          CREATED_AT=2026-09-12T00:00:00Z
          EOF
          (cd "$root" && sha256sum manifest.env images.txt image-ids.txt docker-images.tar.gz >SHA256SUMS)
          pack="$work/test-observability-pack.tar.gz"
          tar -czf "$pack" -C "$work" spark-observability-images
          while read -r image; do docker image rm -f "$image" >/dev/null; done <"$root/images.txt"

          export CURRENT_LOG="$(mktemp)"
          export AIRGAP_REAL_DOCKER="$(command -v docker)"
          title(){ :; }; new_log(){ :; }; info(){ :; }; ok(){ :; }; warn(){ :; }
          fail(){ echo "FAIL: $*" >&2; return 1; }
          run_visible(){ local _label="$1"; shift; "$@"; }
          source deploy/spark-cli/lib/airgap-build.sh
          airgap_import_observability_pack "$pack"
          for n in 1 2 3 4 5 6 7; do docker image inspect "spark-test-observability:${n}" >/dev/null; done
          echo 'Observability supplement import: PASS'

      - name: Validate action wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'airgap-build-observability-pack)' deploy/spark-cli/spark-airgap
          grep -Fq 'airgap-import-observability-pack)' deploy/spark-cli/spark-airgap
          grep -Fq -- '--build-observability-pack' deploy/spark-cli/spark-airgap
          grep -Fq -- '--import-observability-pack' deploy/spark-cli/spark-airgap
          grep -Fq '10  Build observability image supplement' deploy/spark-cli/spark-ui.py
          grep -Fq '11  Import observability image supplement' deploy/spark-cli/spark-ui.py
          echo 'Observability supplement action wiring: PASS'

      - name: Commit minimal fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-build.sh deploy/spark-cli/spark-airgap deploy/spark-cli/spark-ui.py
          git commit -m 'feat(airgap): add Step 22 observability image supplement'
          git pull --rebase origin main
          git push origin HEAD:main

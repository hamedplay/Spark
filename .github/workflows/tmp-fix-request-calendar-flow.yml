name: Temporary request-calendar fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-request-calendar-flow.yml'

permissions:
  contents: write

concurrency:
  group: tmp-fix-request-calendar-flow
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Capture validation base
        shell: bash
        run: echo "VALIDATION_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply minimal scoped fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'src/components/CalendarMeetingForm.tsx',
              """        setEditDecision({ changeSet, snapshot });
        return;
""",
              """        if (isFirstSchedule) {
          await commitEdit(snapshot, true);
          return;
        }

        setEditDecision({ changeSet, snapshot });
        return;
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """      if (diff.added_participant_ids.length) {
        const eventType = getMeetingTemplateKey('participant', 'invite');
        for (const recipientId of diff.added_participant_ids) {
""",
              """      const participantInviteIds = isFirstSchedule
        ? [...new Set([...diff.retained_participant_ids, ...diff.added_participant_ids])]
        : diff.added_participant_ids;
      if (participantInviteIds.length) {
        const eventType = getMeetingTemplateKey('participant', 'invite');
        for (const recipientId of participantInviteIds) {
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """      const removedObserverIds = [...previousNotifyForMeeting].filter(id => !observerIds.includes(id));

      if (addedObserverIds.length) {
        const eventType = getMeetingTemplateKey('observer', 'invite');
        for (const recipientId of addedObserverIds) {
""",
              """      const removedObserverIds = [...previousNotifyForMeeting].filter(id => !observerIds.includes(id));
      const observerInviteIds = isFirstSchedule ? observerIds : addedObserverIds;

      if (observerInviteIds.length) {
        const eventType = getMeetingTemplateKey('observer', 'invite');
        for (const recipientId of observerInviteIds) {
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """        const externalDiff = computeExternalDiff(previousExternal, selectedExternal);
        const inviteFallback = `دعوت به جلسه: «${meetingSubject}» | تاریخ: ${jalaliDate || meetingDateStr} | ساعت: ${currentTime}${currentPlaceholders.location_part}`;
        if (externalDiff.added.length > 0) {
          externalSmsResults.push(await sendSmsToExternals(
            externalDiff.added,
""",
              """        const externalDiff = computeExternalDiff(previousExternal, selectedExternal);
        const externalInviteTargets = isFirstSchedule
          ? [...new Set([...externalDiff.retained, ...externalDiff.added])]
          : externalDiff.added;
        const inviteFallback = `دعوت به جلسه: «${meetingSubject}» | تاریخ: ${jalaliDate || meetingDateStr} | ساعت: ${currentTime}${currentPlaceholders.location_part}`;
        if (externalInviteTargets.length > 0) {
          externalSmsResults.push(await sendSmsToExternals(
            externalInviteTargets,
""",
          )

          replace_exact(
              'src/app/layout/components/LayoutTopBar.tsx',
              """  const { userPermissions } = usePermissions();
  const showPortalConfig = canOpenPortalConfig(isAdmin, userPermissions);

  return (
""",
              """  const { userPermissions } = usePermissions();
  const showPortalConfig = canOpenPortalConfig(isAdmin, userPermissions);

  if (activePage === 'calendar') return null;

  return (
""",
          )

          form = Path('src/components/CalendarMeetingForm.tsx').read_text(encoding='utf-8')
          commit = Path('src/components/CalendarMeetingForm/commitEdit.ts').read_text(encoding='utf-8')
          topbar = Path('src/app/layout/components/LayoutTopBar.tsx').read_text(encoding='utf-8')
          checks = {
              'first schedule bypass': "if (isFirstSchedule) {\n          await commitEdit(snapshot, true);" in form,
              'normal edit modal preserved': 'setEditDecision({ changeSet, snapshot });' in form,
              'participant first invites': 'const participantInviteIds = isFirstSchedule' in commit and 'diff.retained_participant_ids' in commit,
              'observer first invites': 'const observerInviteIds = isFirstSchedule ? observerIds : addedObserverIds;' in commit,
              'external first invites': 'const externalInviteTargets = isFirstSchedule' in commit and 'externalDiff.retained' in commit,
              'calendar topbar hidden': "if (activePage === 'calendar') return null;" in topbar,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('contract checks failed: ' + ', '.join(failed))

          changed = {line[3:] for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines() if line.strip()}
          expected = {
              'src/components/CalendarMeetingForm.tsx',
              'src/components/CalendarMeetingForm/commitEdit.ts',
              'src/app/layout/components/LayoutTopBar.tsx',
          }
          if changed != expected:
              raise SystemExit(f'unexpected working tree changes: {sorted(changed)}')
          PY
          git diff --check
          git diff > /tmp/request-calendar.patch

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          package-manager-cache: false

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:meeting-prefill
          npm run test:layout-navigation
          npm run test:notification-producer

      - name: Reapply validated patch to latest compatible main and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          sensitive_paths=(
            src/components/CalendarMeetingForm.tsx
            src/components/CalendarMeetingForm/commitEdit.ts
            src/app/layout/components/LayoutTopBar.tsx
            src/components/CalendarMeetingForm/types.ts
            src/components/CalendarMeetingForm/services.ts
            src/lib/meetingEditDiff.ts
            src/lib/notifications.ts
            src/config/templateCatalog.ts
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            vite.config.ts
          )

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            remote_sha="$(git rev-parse origin/main)"
            overlap="$(git diff --name-only "$VALIDATION_BASE"..origin/main -- "${sensitive_paths[@]}")"
            if [ -n "$overlap" ]; then
              echo 'Validation-sensitive files changed after validation base; refusing unvalidated integration:'
              echo "$overlap"
              exit 1
            fi

            git reset --hard origin/main
            git apply --check /tmp/request-calendar.patch
            git apply /tmp/request-calendar.patch
            git diff --check

            rm .github/workflows/tmp-fix-request-calendar-flow.yml
            rm -f .tmp-request-calendar-status.txt
            git add src/components/CalendarMeetingForm.tsx src/components/CalendarMeetingForm/commitEdit.ts src/app/layout/components/LayoutTopBar.tsx
            git add -u .github/workflows/tmp-fix-request-calendar-flow.yml
            git add -u .tmp-request-calendar-status.txt 2>/dev/null || true

            changed="$(git diff --cached --name-only | sort)"
            expected="$(printf '%s\n%s\n%s\n%s\n' '.github/workflows/tmp-fix-request-calendar-flow.yml' 'src/app/layout/components/LayoutTopBar.tsx' 'src/components/CalendarMeetingForm.tsx' 'src/components/CalendarMeetingForm/commitEdit.ts' | sort)"
            test "$changed" = "$expected"
            git diff --cached --check
            git commit -m 'fix: separate request scheduling from calendar edits [skip ci]'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Fast-forward race on attempt $attempt; retrying against newer compatible main"
          done

          echo 'Could not obtain a stable fast-forward after 8 attempts'
          exit 1

name: Temporary request-calendar fix validator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-request-calendar-flow.yml'

permissions:
  contents: write

concurrency:
  group: tmp-fix-request-calendar-flow
  cancel-in-progress: true

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          package-manager-cache: false

      - name: Transform, validate, and safely integrate latest main
        shell: bash
        run: |
          set -euo pipefail

          validate_current_tree() {
            git diff --check
            npm ci
            npm run build
            npm run test:meeting-prefill
            npm run test:layout-navigation
            npm run test:notification-producer
          }

          apply_transform() {
            python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'src/components/CalendarMeetingForm.tsx',
              """        setEditDecision({ changeSet, snapshot });
        return;
""",
              """        if (isFirstSchedule) {
          await commitEdit(snapshot, true);
          return;
        }

        setEditDecision({ changeSet, snapshot });
        return;
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """      if (diff.added_participant_ids.length) {
        const eventType = getMeetingTemplateKey('participant', 'invite');
        for (const recipientId of diff.added_participant_ids) {
""",
              """      const participantInviteIds = isFirstSchedule
        ? [...new Set([...diff.retained_participant_ids, ...diff.added_participant_ids])]
        : diff.added_participant_ids;
      if (participantInviteIds.length) {
        const eventType = getMeetingTemplateKey('participant', 'invite');
        for (const recipientId of participantInviteIds) {
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """      const removedObserverIds = [...previousNotifyForMeeting].filter(id => !observerIds.includes(id));

      if (addedObserverIds.length) {
        const eventType = getMeetingTemplateKey('observer', 'invite');
        for (const recipientId of addedObserverIds) {
""",
              """      const removedObserverIds = [...previousNotifyForMeeting].filter(id => !observerIds.includes(id));
      const observerInviteIds = isFirstSchedule ? observerIds : addedObserverIds;

      if (observerInviteIds.length) {
        const eventType = getMeetingTemplateKey('observer', 'invite');
        for (const recipientId of observerInviteIds) {
""",
          )

          replace_exact(
              'src/components/CalendarMeetingForm/commitEdit.ts',
              """        const externalDiff = computeExternalDiff(previousExternal, selectedExternal);
        const inviteFallback = `دعوت به جلسه: «${meetingSubject}» | تاریخ: ${jalaliDate || meetingDateStr} | ساعت: ${currentTime}${currentPlaceholders.location_part}`;
        if (externalDiff.added.length > 0) {
          externalSmsResults.push(await sendSmsToExternals(
            externalDiff.added,
""",
              """        const externalDiff = computeExternalDiff(previousExternal, selectedExternal);
        const externalInviteTargets = isFirstSchedule
          ? [...new Set([...externalDiff.retained, ...externalDiff.added])]
          : externalDiff.added;
        const inviteFallback = `دعوت به جلسه: «${meetingSubject}» | تاریخ: ${jalaliDate || meetingDateStr} | ساعت: ${currentTime}${currentPlaceholders.location_part}`;
        if (externalInviteTargets.length > 0) {
          externalSmsResults.push(await sendSmsToExternals(
            externalInviteTargets,
""",
          )

          replace_exact(
              'src/components/Layout.tsx',
              """        <LayoutTopBar
          userProfile={userProfile}
          onPageChange={handlePageChange}
          onLogout={handleLogout}
          isAdmin={isAdmin}
          activePage={activePage}
          accentColor={accentColor}
          installPrompt={installPrompt}
          onPromptInstall={promptInstall}
        />
""",
              """        {activePage !== 'calendar' && (
          <LayoutTopBar
            userProfile={userProfile}
            onPageChange={handlePageChange}
            onLogout={handleLogout}
            isAdmin={isAdmin}
            activePage={activePage}
            accentColor={accentColor}
            installPrompt={installPrompt}
            onPromptInstall={promptInstall}
          />
        )}
""",
          )
          PY

            python - <<'PY'
          from pathlib import Path
          import subprocess

          form = Path('src/components/CalendarMeetingForm.tsx').read_text(encoding='utf-8')
          commit = Path('src/components/CalendarMeetingForm/commitEdit.ts').read_text(encoding='utf-8')
          layout = Path('src/components/Layout.tsx').read_text(encoding='utf-8')
          checks = {
              'first schedule bypass': "if (isFirstSchedule) {\n          await commitEdit(snapshot, true);" in form,
              'normal edit modal preserved': 'setEditDecision({ changeSet, snapshot });' in form,
              'retained participants invited': 'const participantInviteIds = isFirstSchedule' in commit and 'diff.retained_participant_ids' in commit,
              'retained observers invited': 'const observerInviteIds = isFirstSchedule ? observerIds : addedObserverIds;' in commit,
              'retained externals invited': 'const externalInviteTargets = isFirstSchedule' in commit and 'externalDiff.retained' in commit,
              'calendar top bar hidden': "{activePage !== 'calendar' && (\n          <LayoutTopBar" in layout,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('contract checks failed: ' + ', '.join(failed))

          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = {line[3:] for line in status.splitlines() if line.strip()}
          expected = {
              'src/components/CalendarMeetingForm.tsx',
              'src/components/CalendarMeetingForm/commitEdit.ts',
              'src/components/Layout.tsx',
          }
          if changed != expected:
              raise SystemExit(f'unexpected source changes: {sorted(changed)}')
          print('Scoped transformation contracts verified')
          PY
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for transform_attempt in 1 2 3 4 5; do
            echo "Transform attempt $transform_attempt"
            git fetch origin main
            git reset --hard origin/main
            validation_base="$(git rev-parse HEAD)"

            apply_transform
            validate_current_tree

            rm .github/workflows/tmp-fix-request-calendar-flow.yml
            git add src/components/CalendarMeetingForm.tsx src/components/CalendarMeetingForm/commitEdit.ts src/components/Layout.tsx
            git add -u .github/workflows/tmp-fix-request-calendar-flow.yml

            python - <<'PY'
          import subprocess
          staged = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()))
          expected = {
              '.github/workflows/tmp-fix-request-calendar-flow.yml',
              'src/components/CalendarMeetingForm.tsx',
              'src/components/CalendarMeetingForm/commitEdit.ts',
              'src/components/Layout.tsx',
          }
          if staged != expected:
              raise SystemExit(f'unexpected staged changes: {sorted(staged)}')
          PY

            git diff --cached --check
            git commit -m "fix: separate request scheduling from calendar edits [skip ci]"

            restart_transform=false
            for integration_attempt in 1 2 3 4 5; do
              git fetch origin main
              remote_sha="$(git rev-parse origin/main)"

              if [ "$remote_sha" != "$validation_base" ]; then
                overlap="$(git diff --name-only "$validation_base"..origin/main -- \
                  src/components/CalendarMeetingForm.tsx \
                  src/components/CalendarMeetingForm/commitEdit.ts \
                  src/components/Layout.tsx)"
                if [ -n "$overlap" ]; then
                  echo "Scoped source changed during validation; re-transforming latest source:"
                  echo "$overlap"
                  restart_transform=true
                  break
                fi

                git rebase origin/main
                validation_base="$remote_sha"
                validate_current_tree
              fi

              if git push origin HEAD:main; then
                echo "Validated fix committed to main; temporary workflow removed"
                exit 0
              fi

              echo "Push raced with another unrelated main update; re-validating integrated result"
            done

            if [ "$restart_transform" = false ]; then
              echo "Could not push after 5 safe integration attempts"
              exit 1
            fi
          done

          echo "Scoped files kept changing; no unvalidated source was committed"
          exit 1

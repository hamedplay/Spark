name: Temporary Airgap APT Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-airgap-apt-debug.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply minimal parser fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/airgap-build.sh')
          s = p.read_text()
          old = 'm=re.fullmatch(r"v(\\\\d+)\\\\.\\\\d+\\\\.\\\\d+",v)'
          new = 'm=re.fullmatch(r"v(\\d+)\\.\\d+\\.\\d+",v)'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 over-escaped regex occurrences, found {count}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify parser source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(grep -F 'm=re.fullmatch(r"v(\d+)\.\d+\.\d+",v)' deploy/spark-cli/lib/airgap-build.sh | wc -l)" -eq 2
          ! grep -Fq 'm=re.fullmatch(r"v(\\d+)\\.\\d+\\.\\d+",v)' deploy/spark-cli/lib/airgap-build.sh
      - name: Validate APT payload builder on Ubuntu 26.04
        shell: bash
        run: |
          set -Eeuo pipefail
          fail(){ echo "FAIL: $*" >&2; }
          info(){ echo "INFO: $*"; }
          SCRIPT_DIR="$PWD/deploy/spark-cli"
          source "$SCRIPT_DIR/lib/airgap-build.sh"
          airgap_build_apt_payload /tmp/spark-airgap-debug 26.04
          test -s /tmp/spark-airgap-debug/requested-packages.txt
          test -s /tmp/spark-airgap-debug/package-versions.tsv
          test "$(find /tmp/spark-airgap-debug -maxdepth 1 -type f -name '*.deb' | wc -l)" -gt 0
      - name: Verify scoped diff
        shell: bash
        run: |
          set -Eeuo pipefail
          files="$(git diff --name-only | sort)"
          test "$files" = "deploy/spark-cli/lib/airgap-build.sh"
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add deploy/spark-cli/lib/airgap-build.sh
          git rm .github/workflows/temp-airgap-apt-debug.yml
          git commit -m "fix(airgap): parse latest Node major correctly"
          git push origin HEAD:main

name: Temporary Airgap APT Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-airgap-apt-debug.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trace Ubuntu 26.04 repository setup
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -i --pull=always --platform linux/amd64 ubuntu:26.04 bash -s <<'TRACE'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo 'MARK 1 apt update'
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get -o APT::Update::Error-Mode=any update
          echo 'MARK 2 bootstrap install'
          apt-get install -y ca-certificates curl gnupg python3
          echo 'MARK 3 os-release'
          cat /etc/os-release
          . /etc/os-release
          echo "ID=$ID VERSION_ID=$VERSION_ID UBUNTU_CODENAME=${UBUNTU_CODENAME:-} VERSION_CODENAME=${VERSION_CODENAME:-}"
          [[ "$ID" == ubuntu && "$VERSION_ID" == "26.04" ]]
          codename="${UBUNTU_CODENAME:-${VERSION_CODENAME:-}}"
          [[ -n "$codename" ]]
          echo "MARK 4 docker gpg codename=$codename"
          install -m 0755 -d /etc/apt/keyrings
          curl -vfsSL https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.gpg.asc
          gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg.asc
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo 'MARK 5 docker source'
          cat >/etc/apt/sources.list.d/docker.list <<EOF_DOCKER
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${codename} stable
          EOF_DOCKER
          echo 'MARK 6 nodesource gpg'
          curl -vfsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o /tmp/nodesource.gpg.asc
          gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource.gpg.asc
          chmod a+r /etc/apt/keyrings/nodesource.gpg
          echo 'MARK 7 node index'
          curl -vfsSL https://nodejs.org/dist/index.json -o /tmp/node-index.json
          python3 - <<'PY'
          import json,re
          data=json.load(open('/tmp/node-index.json'))
          for item in data:
              v=str(item.get('version',''))
              m=re.fullmatch(r'v(\d+)\.\d+\.\d+',v)
              if m:
                  print('latest major', m.group(1))
                  break
          else:
              raise SystemExit(1)
          PY
          echo 'MARK 8 success'
          TRACE

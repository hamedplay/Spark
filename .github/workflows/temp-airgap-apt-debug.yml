name: Temporary Airgap APT Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-airgap-apt-debug.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trace exact Ubuntu 26.04 APT payload builder
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/airgap-build.sh')
          s = p.read_text()
          old = "<<'BUNDLE_APT'\nset -Eeuo pipefail\n"
          new = "<<'BUNDLE_APT'\nset -Eeuxo pipefail\ntrap 'rc=$?; echo TRACE_ERR rc=$rc line=$LINENO cmd=$BASH_COMMAND >&2' ERR\n"
          if old not in s:
              raise SystemExit('BUNDLE_APT marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          fail(){ echo "FAIL: $*" >&2; }
          info(){ echo "INFO: $*"; }
          SCRIPT_DIR="$PWD/deploy/spark-cli"
          source "$SCRIPT_DIR/lib/airgap-build.sh"
          airgap_build_apt_payload /tmp/spark-airgap-debug 26.04

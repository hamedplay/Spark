name: Temporary notification context fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-notification-context.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal notification context fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/CalendarPageCore.tsx')
          text = path.read_text(encoding='utf-8')
          old = "      location_part: m.location ? ` | ${m.location}` : '',\n      sender_name: senderName,"
          new = "      location_part: m.location ? ` | ${m.location}` : '',\n      agenda: '',\n      sender_name: senderName,"
          if old not in text:
              raise SystemExit('Expected buildMeetingPlaceholders block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify exact diff
        run: |
          git diff --check
          git diff --exit-code -- src/components/CalendarPageCore.tsx --word-diff=porcelain >/tmp/diff || true
          git diff -- src/components/CalendarPageCore.tsx
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/CalendarPageCore.tsx').read_text(encoding='utf-8')
          needle = "      location_part: m.location ? ` | ${m.location}` : '',\n      agenda: '',\n      sender_name: senderName,"
          if needle not in text:
              raise SystemExit('Minimal fix verification failed')
          PY

      - name: Commit fix to main
        run: |
          git config user.name "spark-automation"
          git config user.email "spark-automation@users.noreply.github.com"
          git add src/components/CalendarPageCore.tsx
          git commit -m "fix(calendar): preserve agenda placeholder for notifications"
          git push origin HEAD:main

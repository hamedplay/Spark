name: Temporary meeting detail modal z-index fix

on:
  push:
    paths:
      - '.github/workflows/temporary-meeting-detail-modal-zfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Raise meeting detail modal above app top bar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Calendar/MeetingDetailModal.tsx')
          text = path.read_text()
          old = '<div className="fixed inset-0 z-[60]" onClick={onClose}>'
          new = '<div className="fixed inset-0 z-[300]" onClick={onClose}>'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one modal root match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate close header remains reachable
        run: |
          grep -Fq 'fixed inset-0 z-[300]' src/components/Calendar/MeetingDetailModal.tsx
          grep -Fq 'button onClick={onClose}' src/components/Calendar/MeetingDetailModal.tsx
          grep -Fq '<X className="w-5 h-5" />' src/components/Calendar/MeetingDetailModal.tsx

      - name: Commit patch
        run: |
          git config user.name "spark-automation"
          git config user.email "spark-automation@users.noreply.github.com"
          git add src/components/Calendar/MeetingDetailModal.tsx
          git commit -m "fix(calendar): keep meeting detail header above top bar"
          git push origin HEAD:main

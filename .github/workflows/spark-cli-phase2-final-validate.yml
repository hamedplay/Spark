name: spark-cli-phase2-final-validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-phase2-final-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply bootstrap symlink minimal fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/bootstrap.sh')
          text = path.read_text()
          anchor = 'ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"'
          replacement = 'ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"'
          if 'ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate"' not in text:
              if anchor not in text:
                  raise SystemExit('bootstrap symlink anchor not found')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text)
          PY
          bash -n deploy/spark-cli/bootstrap.sh
      - name: Phase 0 baseline smoke tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.smoke.test_manager_baseline -v
      - name: Phase 1 workflow core tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v
      - name: Phase 2 architecture tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -v
      - name: UI self test
        working-directory: deploy/spark-cli
        run: python3 spark-ui.py --self-test
      - name: Architecture CLI profile validation
        working-directory: deploy/spark-cli
        run: |
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture validate
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture show
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture status
          SPARK_ENV_PROFILE=config/environments/example.staging.yaml python3 spark-architecture validate
          SPARK_ENV_PROFILE=config/environments/example.airgap.yaml python3 spark-architecture validate
      - name: Syntax and bootstrap structural checks
        working-directory: deploy/spark-cli
        run: |
          python3 -m py_compile spark-ui.py spark-ui-core.py spark-architecture architecture/*.py config/*.py
          bash -n bootstrap.sh
          grep -Fq 'spark-architecture' bootstrap.sh
          grep -Fq 'ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"' bootstrap.sh
      - name: Commit minimal bootstrap fix if needed
        run: |
          if ! git diff --quiet -- deploy/spark-cli/bootstrap.sh; then
            git config user.name "spark-phase2-bot"
            git config user.email "spark-phase2-bot@users.noreply.github.com"
            git add deploy/spark-cli/bootstrap.sh
            git commit -m "fix: install spark architecture command symlink"
            git push origin HEAD:main
          fi

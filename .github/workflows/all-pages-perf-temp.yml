name: Temporary authenticated pages performance validation

on:
  push:
    branches: [main]
    paths:
      - 'src/app/navigation/PageRenderer.tsx'
      - 'src/AuthenticatedApp.tsx'
      - 'src/app/hooks/useMinutesFollowupAccess.ts'
      - 'src/features/meetings/**'
      - 'src/components/Chat/**'
      - 'src/components/ProfilePage.tsx'
      - 'src/components/Minutes/**'
      - 'src/components/TasksPage.tsx'
      - 'src/components/NotesPage.tsx'
      - 'src/components/Channels/**'
      - 'src/components/PortalConfigPage.tsx'
      - 'src/components/UserManagementPanel.tsx'
      - '.github/workflows/all-pages-perf-temp.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:meeting-prefill
      - run: npm run test:meeting-record
      - run: npm run test:minutes-entry-flow
      - run: npm run test:notification-lifecycle
      - name: Validate performance wiring
        run: |
          grep -Fq "currentUserId={props.currentUserId}" src/app/navigation/PageRenderer.tsx
          grep -Fq "useMeetingCardReadModel(meeting, currentUserId, prefetchedReadModel)" src/features/meetings/components/MeetingCard/MeetingCardMain.tsx
          grep -Fq "useOrgUsers(userId, assignNote !== null)" src/components/NotesPage.tsx
          grep -Fq "orgDirectoryNeeded" src/components/TasksPage.tsx
          grep -Fq "lazy(() => import('./ChannelConversationView')" src/components/Channels/ChannelsPage.tsx
          grep -Fq "lazy(() => import('./ChatActionsPanel')" src/components/Chat/ChatPage.tsx
          grep -Fq "import('../../features/meetings/pages/MeetingsPage')" src/app/navigation/PageRenderer.tsx
          grep -Fq "immediate: activePage === 'minutes-followup' || activePage === 'minutes-hub'" src/AuthenticatedApp.tsx
          grep -Fq "requestIdleCallback" src/app/hooks/useMinutesFollowupAccess.ts
          grep -Fq "useMeetingCardsBatchReadModel" src/features/meetings/pages/MeetingsPage.tsx
          grep -Fq "lazy(() => import('./UserManagement/UserProfileForm')" src/components/UserManagementPanel.tsx
          grep -Fq "lazy(() => import('./PortalConfig/PhoneAuthCard')" src/components/PortalConfigPage.tsx
          grep -Fq "lazy(() => import('./ChatConversationView')" src/components/Chat/ChatPage.tsx

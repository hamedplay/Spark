name: Temporary Fix Manager Permissions

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-manager-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix installed manager directory permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Patch target not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          patch('deploy/spark-cli/bootstrap.sh', [
              (
                  'stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"\nmigrate_stage="$(mktemp -d /usr/local/lib/spark-migrate.new.XXXXXX)"\nbackup=',
                  'stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"\nmigrate_stage="$(mktemp -d /usr/local/lib/spark-migrate.new.XXXXXX)"\nchmod 0755 "$stage" "$migrate_stage"\nbackup='
              ),
              (
                  'if ! mv "$stage" "$TARGET"; then\n',
                  'if ! mv "$stage" "$TARGET"; then\n'
              ),
              (
                  'ln -sfn "$TARGET/spark" "$CLI_PATH"\nln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"\n',
                  'chmod 0755 "$TARGET" "$MIGRATE_TARGET"\nln -sfn "$TARGET/spark" "$CLI_PATH"\nln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"\n'
              ),
          ])

          patch('deploy/spark-cli/spark', [
              (
                  'stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"\n  backup=',
                  'stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"\n  chmod 0755 "$stage"\n  backup='
              ),
              (
                  '  ln -sfn /usr/local/lib/spark-manager/spark "$CLI_PATH"\n\n  if ! version_output=',
                  '  chmod 0755 /usr/local/lib/spark-manager\n  ln -sfn /usr/local/lib/spark-manager/spark "$CLI_PATH"\n\n  if ! version_output='
              ),
          ])

          patch('deploy/spark-cli/bootstrap-airgap.sh', [
              (
                  '  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n  mkdir -p "$stage/lib" "$stage/livekit"\n',
                  '  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n  chmod 0755 "$stage"\n  install -d -m 0755 "$stage/lib" "$stage/livekit"\n'
              ),
              (
                  '  mv "$stage" "$TARGET"\n  ln -sfn "$TARGET/spark" "$CLI_PATH"\n',
                  '  mv "$stage" "$TARGET"\n  chmod 0755 "$TARGET"\n  ln -sfn "$TARGET/spark" "$CLI_PATH"\n'
              ),
              (
                  '  rm -rf "$MIGRATE_TARGET"\n  mkdir -p "$MIGRATE_TARGET"\n',
                  '  rm -rf "$MIGRATE_TARGET"\n  install -d -m 0755 "$MIGRATE_TARGET"\n'
              ),
          ])
          PY

      - name: Validate syntax and permission guards
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/bootstrap-airgap.sh
          bash -n deploy/spark-cli/spark
          grep -Fq 'chmod 0755 "$stage" "$migrate_stage"' deploy/spark-cli/bootstrap.sh
          grep -Fq 'chmod 0755 "$TARGET" "$MIGRATE_TARGET"' deploy/spark-cli/bootstrap.sh
          grep -Fq 'chmod 0755 "$stage"' deploy/spark-cli/spark
          grep -Fq 'chmod 0755 /usr/local/lib/spark-manager' deploy/spark-cli/spark
          grep -Fq 'chmod 0755 "$TARGET"' deploy/spark-cli/bootstrap-airgap.sh
          git diff --check

      - name: Commit minimal permission fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/bootstrap.sh deploy/spark-cli/bootstrap-airgap.sh deploy/spark-cli/spark
          git commit -m 'fix(manager): make installed manager executable by users'
          git push origin HEAD:main

name: livekit-unified-controls-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify unified controls behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tools = fs.readFileSync('src/features/video-conference/components/controls/ConferenceToolsBar.tsx', 'utf8');
          const media = fs.readFileSync('src/features/video-conference/components/controls/RoomMediaControls.tsx', 'utf8');
          const page = fs.readFileSync('src/features/video-conference/components/room/ConferenceRoomPage.tsx', 'utf8');
          const consent = fs.readFileSync('src/features/video-conference/components/recording/RecordingConsentBanner.tsx', 'utf8');

          if (!tools.includes('conference-media-controls-slot')) throw new Error('unified media slot missing');
          if (tools.includes('پایان برای همه')) throw new Error('duplicate end-for-all button still exists in tools bar');
          if (!media.includes('createPortal(controls, portalTarget)')) throw new Error('media controls are not mounted into unified dock');
          if (!media.includes('خروج از جلسه') || !media.includes('اتمام جلسه برای همه')) throw new Error('single exit menu does not contain both actions');
          if (!media.includes('جلسه برای سایر افراد ادامه دارد')) throw new Error('leave-only behavior is not explicit');
          if (!page.includes("leave_conference_room")) throw new Error('leave-only RPC missing');
          if (!page.includes("runHostAction(sparkRoom.id, 'end'")) throw new Error('end-for-all lifecycle missing');
          if (!page.includes('<RecordingConsentBanner consent={recordingConsent} />')) throw new Error('recording consent indicator missing from header');
          const acceptedBlock = consent.slice(consent.indexOf('if (consent.accepted)'), consent.indexOf("return (\n    <div className=\"absolute", consent.indexOf('if (consent.accepted)')));
          if (acceptedBlock.includes('absolute right-3 top-[68px]')) throw new Error('accepted consent indicator still overlays video');
          console.log('unified LiveKit controls verified');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit
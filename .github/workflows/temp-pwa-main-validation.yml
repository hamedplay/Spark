name: Temporary PWA Main Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/pwaNotificationBridge.ts'
      - 'public/pwa-bootstrap.js'
      - '.github/workflows/temp-pwa-main-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:notification-lifecycle
      - run: npm run test:notification-producer
      - run: npm run build

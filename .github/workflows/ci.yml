name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tmp/management-dashboard-reorder-trigger.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify Edge dependency pins
        run: node scripts/check-edge-import-pins.mjs

      - name: Validate production deployment scripts
        run: |
          bash -n deploy/production/server-1-web-gateway.sh
          bash -n deploy/production/server-2-supabase-core.sh
          bash -n deploy/production/server-3-edge-integration.sh
          bash -n deploy/production/server-4-turn.sh
          bash -n deploy/production/single-host.sh

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high

      # The repository currently has a large pre-existing lint baseline across
      # legacy UI, tests and Edge Functions. Keep the full ruleset enabled and
      # surface the report on every run without letting unrelated legacy debt
      # bypass the production build/test/security gates above.
      - name: Full lint report (legacy baseline)
        continue-on-error: true
        run: npm run lint

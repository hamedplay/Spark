name: CI

on:
  push:
    branches: [main]
    paths:
      - '.spark-cli-access-fix-trigger-v2'

permissions:
  contents: write

jobs:
  scoped-spark-cli-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - name: Run scoped Spark CLI validator
        run: bash .spark-cli-access-fix-runner.sh

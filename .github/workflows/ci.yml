name: CI

on:
  push:
    branches: [main]
    paths:
      - '.tmp-chat-actions-trigger'

permissions:
  contents: write

concurrency:
  group: ci-chat-actions-postfix-validation
  cancel-in-progress: true

jobs:
  validate-chat-actions-fix:
    name: Validate chat actions fix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync latest main and verify fixed source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          actual="$(git rev-parse HEAD:src/components/Chat/ChatActionsPanel.tsx)"
          test "$actual" = "8254d864cc262639700142e00bf0f1f8948140bd"
          grep -Fq "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star, Check } from 'lucide-react';" src/components/Chat/ChatActionsPanel.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Record successful build
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.tmp-chat-actions-build-ok';
            const { owner, repo } = context.repo;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(existing.data) && 'sha' in existing.data) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              sha,
              message: 'chore: record chat actions build success [skip ci]',
              content: Buffer.from(`source=8254d864cc262639700142e00bf0f1f8948140bd\nrun=${context.runId}\n`, 'utf8').toString('base64'),
            });

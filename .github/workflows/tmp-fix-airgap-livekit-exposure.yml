name: Temporary Fix Air-Gap LiveKit Exposure Probe

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-livekit-exposure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LiveKit exposure probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_airgap_livekit_exposure.py
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          git diff --check

      - name: Validate probe semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deploy/spark-cli/lib/airgap-ip.sh').read_text()
          start=s.index('livekit_internal_api_exposure_probe() {')
          end=s.index('\nlivekit_secret_file_permissions_probe()', start)
          block=s[start:end]
          assert '\\*):${LIVEKIT_INTERNAL_API_PORT}\\b' in block
          assert 'index($0, ip) && index($0, port) && $0 ~ /ALLOW/' in block
          print('Static LiveKit exposure probe semantics: PASS')
          PY

      - name: Validate wildcard listener and UFW scoping
        shell: bash
        run: |
          set -Eeuo pipefail
          f='deploy/spark-cli/lib/airgap-ip.sh'
          python3 - "$f" <<'PY' >/tmp/livekit-exposure-probe.sh
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          start=s.index('livekit_internal_api_exposure_probe() {')
          end=s.index('\nlivekit_secret_file_permissions_probe()', start)
          print(s[start:end])
          PY
          cat >/tmp/harness.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          AIRGAP_SERVER_IP='10.211.36.178'
          LIVEKIT_INTERNAL_API_PORT='7880'
          MODE='exact'
          livekit_airgap_http_reachable(){ return 0; }
          ss(){ printf 'LISTEN 0 4096 *:7880 *:*\n'; }
          ufw(){
            case "$MODE" in
              exact)
                printf 'Status: active\nTo Action From\n10.211.36.178 7880/tcp ALLOW IN Anywhere\n'
                ;;
              broad)
                printf 'Status: active\nTo Action From\n7880/tcp ALLOW IN Anywhere\n'
                ;;
              inactive)
                printf 'Status: inactive\n'
                ;;
            esac
          }
          source /tmp/livekit-exposure-probe.sh
          MODE=exact
          livekit_internal_api_exposure_probe
          MODE=broad
          if livekit_internal_api_exposure_probe; then
            echo 'ERROR: broad 7880/tcp rule was incorrectly accepted' >&2
            exit 1
          fi
          MODE=inactive
          if livekit_internal_api_exposure_probe; then
            echo 'ERROR: inactive UFW was incorrectly accepted' >&2
            exit 1
          fi
          echo 'Runtime wildcard listener + exact-IP UFW validation: PASS'
          SH
          bash /tmp/harness.sh

      - name: Commit minimal fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): accept LiveKit wildcard listener with scoped UFW'
          git pull --rebase origin main
          git push origin HEAD:main

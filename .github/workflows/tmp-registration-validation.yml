name: Temporary registration validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Validate deployment scripts
        run: |
          bash -n deploy/spark-cli/apply-registration-repair.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Validate focused registration contract
        run: |
          grep -Fq "APPROVE_REGISTRATION" supabase/functions/admin-user-lifecycle/index.ts
          grep -Fq "REJECT_REGISTRATION" supabase/functions/admin-user-lifecycle/index.ts
          grep -Fq "PROFILE_COMPLETION_NOT_REQUIRED" supabase/migrations/20260914184500_align_registration_security_controls.sql
          grep -Fq "profile_completion_status <> 'IN_PROGRESS'" supabase/migrations/20260914184500_align_registration_security_controls.sql
          grep -Fq "APPROVE_REGISTRATION" supabase/migrations/20260914184500_align_registration_security_controls.sql
          grep -Fq "بررسی ثبت‌نام" src/components/UserManagement/DeactivatePanel.tsx
          grep -Fq "بررسی ثبت‌نام" src/components/UserManagement/utils.ts
          grep -Fq "پس از تأیید مدیر امکان ورود خواهید داشت" src/PublicAuthRoot.tsx
          grep -Fq "apply-registration-repair.sh" deploy/spark-cli/apply-daily-report-scheduler.sh

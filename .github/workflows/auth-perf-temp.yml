name: Temporary auth performance validation

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/PublicAuthRoot.tsx'
      - 'src/components/AuthPage.tsx'
      - '.github/workflows/auth-perf-temp.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Validate public auth RPC contract
        run: |
          grep -Fq "supabase.rpc('get_public_auth_config')" src/components/AuthPage.tsx
          grep -Fq "supabase.rpc('get_public_login_methods')" src/components/AuthPage.tsx
          grep -Fq "initialAuthBootstrapRef" src/components/AuthPage.tsx
      - run: npm run test:auth-unified-login
      - run: npm run test:phase5-login

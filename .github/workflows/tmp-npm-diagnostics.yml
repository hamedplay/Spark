name: Temporary npm diagnostics validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-npm-diagnostics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Validate Manager wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/lib/application-maintenance.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          python3 deploy/spark-cli/spark-ui.py --self-test

          for action in             app-npm-outdated             app-npm-audit-production             app-npm-audit-all             app-npm-list             app-npm-doctor
          do
            grep -Fq "$action)" deploy/spark-cli/spark
          done

          grep -Fq 'npm audit --omit=dev' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'npm audit"' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'npm list --depth=0' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'npm doctor' deploy/spark-cli/lib/application-maintenance.sh
          ! grep -Fq 'npm audit fix' deploy/spark-cli/lib/application-maintenance.sh

      - name: Clean install
        run: npm ci

      - name: Run read-only npm diagnostics
        shell: bash
        run: |
          set +e
          npm outdated
          echo "outdated_rc=$?"
          npm audit --omit=dev
          echo "audit_prod_rc=$?"
          npm audit
          echo "audit_all_rc=$?"
          npm list --depth=0
          echo "list_rc=$?"
          npm doctor
          echo "doctor_rc=$?"
          exit 0

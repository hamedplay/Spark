name: Temporary offline app update source-independent fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-offline-app-update-source-independent.yml'
      - '.github/scripts/patch_offline_app_update.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply patch
        run: python3 .github/scripts/patch_offline_app_update.py

      - name: Validate syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/application-maintenance.sh
          python3 -m py_compile deploy/spark-cli/spark-ui-core.py
          if grep -Fq '[[ -d "${SPARK_ROOT}/.git" ]] || { fail "Spark source repository not found: ${SPARK_ROOT}"' deploy/spark-cli/lib/application-maintenance.sh; then exit 1; fi
          grep -Fq 'Initialize isolated Offline App staging repository' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'A local /opt/spark checkout is optional' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'STATE_DIR / "application-active.env"' deploy/spark-cli/spark-ui-core.py

      - name: Validate bundle use without source checkout
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git init -q "$work/source"
          git -C "$work/source" config user.name test
          git -C "$work/source" config user.email test@example.invalid
          echo one >"$work/source/file.txt"
          git -C "$work/source" add file.txt
          git -C "$work/source" commit -qm one
          git -C "$work/source" branch -M main
          git -C "$work/source" bundle create "$work/update.bundle" main
          git init -q "$work/verify"
          git -C "$work/verify" bundle verify "$work/update.bundle"
          git init -q "$work/stage"
          git -C "$work/stage" fetch "$work/update.bundle" main
          test "$(git -C "$work/stage" rev-parse FETCH_HEAD)" = "$(git -C "$work/source" rev-parse HEAD)"

      - name: Build validation
        run: |
          npm ci
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          git add deploy/spark-cli/lib/application-maintenance.sh deploy/spark-cli/spark-ui-core.py
          git commit -m 'fix(manager): update offline app without local source checkout'
          git push origin HEAD:main

name: Temporary Fix AirGap Gateway Bind

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-gateway-bind.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate Step 10 gateway reconciliation
        run: python3 .github/tmp_fix_airgap_gateway.py
      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): reconcile internal Supabase gateway bind in step 10'
          git push origin HEAD:main

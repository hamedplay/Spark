name: Temporary Manager pretty progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-pretty-progress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/bootstrap.sh
          grep -Fq 'Receiving objects:' deploy/spark-cli/bootstrap.sh
          grep -Fq '"█" * filled + "░" *' deploy/spark-cli/bootstrap.sh
          grep -Fq 'percent:3d}%' deploy/spark-cli/bootstrap.sh
      - name: Real install and percentage check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh | sudo bash 2>&1 | tee /tmp/manager-install.log
          for p in 0 25 50 75 100; do
            grep -Eq "[[:space:]]${p}%([[:space:]]|$)" /tmp/manager-install.log
          done
          /usr/local/bin/spark --version

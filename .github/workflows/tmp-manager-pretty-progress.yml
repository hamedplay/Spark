name: Temporary Manager pretty progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-pretty-progress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark shallow git download
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          GIT_PROGRESS_DELAY=0 git clone --depth 1 --single-branch --branch main --progress https://github.com/hamedplay/Spark.git /tmp/spark-clone 2>&1 | tee /tmp/git-progress.log
          end=$(date +%s%3N)
          echo "CLONE_MS=$((end-start))"
          du -sh /tmp/spark-clone
          grep -E 'Receiving objects:.*%|Resolving deltas:.*%' /tmp/git-progress.log | tail -20 || true
          test -f /tmp/spark-clone/deploy/spark-cli/bootstrap.sh

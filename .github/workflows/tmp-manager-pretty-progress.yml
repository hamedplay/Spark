name: Temporary Manager pretty progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-pretty-progress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/bootstrap.sh
          grep -Fq 'percent = min(100' deploy/spark-cli/bootstrap.sh
          grep -Fq '"█" * filled + "░" *' deploy/spark-cli/bootstrap.sh
          grep -Fq "f\"  [{bar}] {percent:3d}%" deploy/spark-cli/bootstrap.sh
      - name: Real install with captured output
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh | sudo bash 2>&1 | tee /tmp/manager-install.log
          grep -Eq '[[:space:]]100%[[:space:]]' /tmp/manager-install.log
          /usr/local/bin/spark --version

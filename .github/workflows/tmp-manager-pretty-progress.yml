name: Temporary Manager pretty progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-pretty-progress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect archive headers
        shell: bash
        run: |
          set -euo pipefail
          echo '== HEAD codeload =='
          curl -sSIL https://codeload.github.com/hamedplay/Spark/tar.gz/refs/heads/main | sed -n '1,80p'
          echo '== Range codeload =='
          curl -sSL -r 0-0 -D /tmp/range.headers -o /tmp/range.byte https://codeload.github.com/hamedplay/Spark/tar.gz/refs/heads/main
          cat /tmp/range.headers
          wc -c /tmp/range.byte
          echo '== HEAD github archive URL =='
          curl -sSIL https://github.com/hamedplay/Spark/archive/refs/heads/main.tar.gz | sed -n '1,100p'

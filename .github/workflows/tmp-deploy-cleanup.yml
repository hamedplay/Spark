name: Temporary deploy artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated Python artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Spark Deploy Consolidator'
          git config user.email 'actions@users.noreply.github.com'
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.gitignore')
          text = p.read_text(encoding='utf-8')
          additions = ['__pycache__/', '*.py[cod]']
          lines = text.splitlines()
          for item in additions:
              if item not in lines:
                  lines.append(item)
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
          test "$(find deploy -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'spark-cli'
          test -d deploy/spark-cli/livekit
          test -f deploy/spark-cli/spark-build.yaml
          test ! -e deploy/livekit
          test ! -e deploy/production
          test ! -e deploy/manual-production

      - name: Commit cleanup and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-deploy-cleanup.yml
          git add -A
          git commit -m 'chore: remove generated deploy artifacts'
          git push origin HEAD:main

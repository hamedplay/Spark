name: tmp-e2ee-call-diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: ${{ github.event.issue.title == 'tmp-e2ee-call-diagnostic-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate without lint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          {
            echo '=== STATIC ==='
            grep -F 'onStartE2EECall?.()' src/components/Chat/Conversation/ConversationHeader.tsx
            grep -F 'title="تماس امن E2EE"' src/components/Chat/Conversation/ConversationHeader.tsx
            grep -F 'fixed inset-0 z-[9998]' src/components/Chat/E2EECall/index.tsx
            ! grep -F "from './IdleView'" src/components/Chat/E2EECall/index.tsx
            ! grep -F '<IdleView' src/components/Chat/E2EECall/index.tsx
            ! grep -F 'تماس امن E2EE' src/components/Chat/CallHistoryPage.tsx
            grep -F 'e2ee-global-inbox-${currentUserId}' src/context/GlobalCallContext.tsx
            grep -F 'Global E2EE incoming call overlay' src/context/GlobalCallContext.tsx
          } > /tmp/static.log 2>&1
          static_status=$?

          npm ci > /tmp/npm-ci.log 2>&1
          ci_status=$?

          if [ "$ci_status" -eq 0 ]; then
            npm run build > /tmp/build.log 2>&1
            build_status=$?
          else
            build_status=99
            echo 'build skipped because npm ci failed' > /tmp/build.log
          fi

          if [ "$ci_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            npm test > /tmp/test.log 2>&1
            test_status=$?
          else
            test_status=99
            echo 'tests skipped because install/build failed' > /tmp/test.log
          fi

          {
            echo "static=$static_status npm_ci=$ci_status build=$build_status test=$test_status"
            echo '--- static ---'
            tail -n 30 /tmp/static.log
            echo '--- npm ci ---'
            tail -n 30 /tmp/npm-ci.log
            echo '--- build ---'
            tail -n 60 /tmp/build.log
            echo '--- test ---'
            tail -n 60 /tmp/test.log
          } > /tmp/report.txt

          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/report.txt

          if [ "$static_status" -ne 0 ] || [ "$ci_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup after success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/tmp-e2ee-call-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: E2EE diagnostic passed [skip ci]'
          git push origin HEAD:main
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Cleanup after failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/tmp-e2ee-call-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: E2EE diagnostic failed cleanup [skip ci]' || true
          git push origin HEAD:main || true
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason not_planned || true

name: Temporary SMS compatibility validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sms-compat-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate compatibility fallback
        run: |
          grep -q 'SMS_TEMPLATE_CONTEXT_MISSING' supabase/functions/send-sms/requestModes.ts
          grep -q 'const legacyMessage' supabase/functions/send-sms/requestModes.ts
          grep -q 'rendered.ok ? rendered.text : legacyMessage' supabase/functions/send-sms/requestModes.ts
          grep -q 'TEMPLATE_CONTEXT_FALLBACK' supabase/functions/send-sms/requestModes.ts

name: Temporary Node npm baseline migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-node-npm-baseline.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Upgrade npm runtime and declare project baseline
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@12.2.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.2.0"

          npm pkg set engines.node='>=24.21.0 <25'
          npm pkg set engines.npm='>=12.2.0 <13'
          npm pkg set packageManager='npm@12.2.0'

          npm install --package-lock-only --ignore-scripts

      - name: Clean install with Node 24.21 and npm 12.2
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:recurrence
          npm run test:meeting-record
          npm run test:calendar-url
          npm run test:meeting-prefill
          npm run test:layout-presence
          npm run test:user-preferences-mapping
          npm run test:user-preferences-lifecycle

      - name: Validate build runtime gates
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/spark-cli/tests/application/test_m43_static_build_deploy.py
          grep -Fq '>=24.21.0 <25' package.json
          grep -Fq '>=12.2.0 <13' package.json
          grep -Fq '"packageManager": "npm@12.2.0"' package.json

      - name: Commit package baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package baseline changes."
            exit 0
          fi
          git commit -m "chore: raise Node and npm project baseline"
          git push origin HEAD:main

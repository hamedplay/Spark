# final-pass rerun after dead-code and duplication cleanup
name: One-time dead code audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-dead-code.mjs
      - .github/workflows/dead-code-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static reachability audit
        run: node scripts/audit-dead-code.mjs

      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.dead-code-audit.json
          git commit -m "chore: record one-time dead code audit" || exit 0
          git push origin HEAD:main

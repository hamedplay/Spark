name: Temporary Google Calendar Mobile Validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/features/meetings/components/MeetingCard/MeetingCardMain.tsx'
      - 'src/features/meetings/builders/buildGoogleCalendarEventUrl.ts'
      - 'tests/meetings/buildGoogleCalendarEventUrl.test.ts'
      - '.github/workflows/tmp-google-calendar-mobile-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calendar URL tests
        run: npm run test:calendar-url

      - name: Build
        run: npm run build

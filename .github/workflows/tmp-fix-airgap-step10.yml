name: Temporary Fix AirGap Step10

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-step10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate Step 10
        run: python3 .github/tmp_fix_airgap_step10.py
      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-runtime.sh deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): harden step 10 logging and gateway binding'
          git push origin HEAD:main

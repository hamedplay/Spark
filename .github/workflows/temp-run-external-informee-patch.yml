name: Temporary run external informee patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/temp_patch_external_informee_lifecycle.py
      - run: npm ci
      - name: Targeted tests
        run: |
          npm run test:meeting-prefill
          npm run test:recurrence
          npm run test:notification-lifecycle
      - run: npm run build
      - name: Commit source patch
        run: |
          git config user.name spark-fix-bot
          git config user.email spark-fix-bot@users.noreply.github.com
          git add src/components/CalendarMeetingForm/commitEdit.ts src/components/Calendar/useCalendarDataActions.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(meetings): notify external informees on change and cancel"
          git push origin HEAD:main

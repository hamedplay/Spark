name: Remove dead legacy security island

on:
  push:
    branches: [main]
    paths:
      - scripts/remove-dead-security-island.mjs
      - .github/workflows/remove-dead-security-island.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guarded cleanup and regression validation
        id: guarded
        shell: bash
        run: |
          set +e
          : > /tmp/dead-island.log
          mapfile -t TEST_FILES < <(find tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.mjs' -o -name '*.test.js' \) | sort)

          NO_COLOR=1 node --import tsx --test "${TEST_FILES[@]}" > /tmp/tests-before.log 2>&1
          baseline_test_rc=$?

          node scripts/remove-dead-security-island.mjs >> /tmp/dead-island.log 2>&1
          transform_rc=$?
          build_rc=99
          test_rc=99
          audit_rc=99

          if [ "$transform_rc" -eq 0 ]; then
            npm run build >> /tmp/dead-island.log 2>&1
            build_rc=$?
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            NO_COLOR=1 node --import tsx --test "${TEST_FILES[@]}" > /tmp/tests-after.log 2>&1
            after_test_rc=$?
            python3 - <<'PY' >> /tmp/dead-island.log 2>&1
          import collections
          import json
          import re
          from pathlib import Path

          def names(path, failed_only=False):
              out = []
              for line in Path(path).read_text(errors='replace').splitlines():
                  s = line.strip()
                  if failed_only:
                      if not s.startswith('✖ '):
                          continue
                  elif not (s.startswith('✔ ') or s.startswith('✖ ')):
                      continue
                  name = s[2:]
                  name = re.sub(r'\s+\([^)]*ms\)$', '', name)
                  out.append(name)
              return collections.Counter(out)

          manifest = json.loads(Path('/tmp/dead-island-transform.json').read_text())
          expected_removed = collections.Counter(x['title'] for x in manifest['removedTests'])
          before_all = names('/tmp/tests-before.log')
          after_all = names('/tmp/tests-after.log')
          before_fail = names('/tmp/tests-before.log', True)
          after_fail = names('/tmp/tests-after.log', True)

          actual_removed = before_all - after_all
          unexpected_removed = actual_removed - expected_removed
          expected_but_present = expected_removed - actual_removed
          new_failures = after_fail - before_fail

          print(f'tests before={sum(before_all.values())} after={sum(after_all.values())}')
          print(f'failures before={sum(before_fail.values())} after={sum(after_fail.values())}')
          print(f'expected obsolete tests removed={sum(expected_removed.values())}')

          if unexpected_removed:
              print('UNEXPECTED_TEST_REMOVALS', list(unexpected_removed.elements()))
              raise SystemExit(1)
          if expected_but_present:
              print('EXPECTED_DEAD_TESTS_STILL_PRESENT', list(expected_but_present.elements()))
              raise SystemExit(1)
          if new_failures:
              print('NEW_TEST_FAILURES', list(new_failures.elements()))
              raise SystemExit(1)
          PY
            test_rc=$?
            echo "baseline_test_rc=$baseline_test_rc after_test_rc=$after_test_rc comparison_rc=$test_rc" >> /tmp/dead-island.log
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            node scripts/audit-dead-code.mjs >> /tmp/dead-island.log 2>&1
            audit_exec_rc=$?
            python3 - <<'PY' >> /tmp/dead-island.log 2>&1
          import json
          from pathlib import Path
          report = json.loads(Path('scripts/.dead-code-audit.json').read_text())
          remaining = report['production_unreachable']
          print('remaining production_unreachable=', remaining)
          if remaining != ['src/vite-env.d.ts']:
              raise SystemExit(1)
          PY
            audit_assert_rc=$?
            if [ "$audit_exec_rc" -eq 0 ] && [ "$audit_assert_rc" -eq 0 ]; then audit_rc=0; else audit_rc=1; fi
          fi

          if [ "$transform_rc" -ne 0 ] || [ "$build_rc" -ne 0 ] || [ "$test_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "VALIDATION_FAILED"
              echo "transform_rc=$transform_rc"
              echo "build_rc=$build_rc"
              echo "test_rc=$test_rc"
              echo "audit_rc=$audit_rc"
              echo
              tail -n 400 /tmp/dead-island.log
              echo
              echo '--- AFTER TEST TAIL ---'
              tail -n 120 /tmp/tests-after.log 2>/dev/null || true
            } > scripts/.dead-island-status.txt
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f scripts/.dead-island-status.txt
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated cleanup
        if: steps.guarded.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u src tests
          git commit -m "cleanup: remove dead legacy security UI island"
          git push origin HEAD:main

      - name: Commit failure evidence
        if: steps.guarded.outputs.success != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.dead-island-status.txt
          git commit -m "chore: record dead security island validation failure" || exit 0
          git push origin HEAD:main

name: phase23-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Video conference tests
        run: node --test tests/video-conference/phase*.test.mjs

      - name: Shell syntax
        run: bash -n deploy/spark-cli/lib/install-livekit.sh

      - name: Docker Compose config
        run: |
          docker compose \
            -f deploy/livekit/docker-compose.yml \
            -f deploy/livekit/docker-compose.spark-cli.yml \
            --env-file deploy/livekit/.env.example \
            --profile observability \
            config --quiet

      - name: Core healthcheck tooling
        run: |
          set -euo pipefail
          source <(grep -E '^[A-Z0-9_]+=' deploy/livekit/.env.example)

          docker run --rm --entrypoint sh "$MINIO_IMAGE" -ec 'command -v curl >/dev/null'
          docker run --rm --entrypoint sh "$REDIS_IMAGE" -ec 'command -v redis-cli >/dev/null'
          docker run --rm --entrypoint sh "$LIVEKIT_SERVER_IMAGE" -ec 'command -v wget >/dev/null'
          docker run --rm --entrypoint sh "$LIVEKIT_EGRESS_IMAGE" -ec 'command -v curl >/dev/null'
          docker run --rm --entrypoint sh "$LIVEKIT_INGRESS_IMAGE" -ec 'command -v wget >/dev/null'

      - name: Prometheus config
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy/livekit/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/livekit/monitoring/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/deploy/livekit/monitoring/targets:/etc/prometheus/targets:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Build
        run: npm run build

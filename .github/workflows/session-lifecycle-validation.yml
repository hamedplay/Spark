name: Temporary session lifecycle validation
on:
  push:
    branches: [main]
    paths:
      - 'src/features/auth/**'
      - 'tests/auth/sessionHeartbeatErrors.test.ts'
      - '.github/workflows/session-lifecycle-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx --test tests/auth/sessionHeartbeatErrors.test.ts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:8000
          VITE_SUPABASE_ANON_KEY: validation-only

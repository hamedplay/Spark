name: Temporary minutes delegate cartable fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-minutes-delegate-cartable.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Apply minimal delegate cartable fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          approvals_path = Path('src/components/Minutes/MinutesApprovalsPage.tsx')
          source = approvals_path.read_text()

          old_import = "import { Eye, Check, CircleAlert as AlertCircle, Loader as Loader2, UserCheck, Users, X } from 'lucide-react';"
          new_import = "import { Eye, Check, CircleAlert as AlertCircle, Loader as Loader2, UserCheck } from 'lucide-react';"
          if source.count(old_import) != 1:
              raise SystemExit('unexpected MinutesApprovalsPage lucide import')
          source = source.replace(old_import, new_import)

          candidate_block = """interface DelegateCandidate {
            user_id: string;
            full_name: string;
          }

          """
          if source.count(candidate_block) != 1:
              raise SystemExit('unexpected DelegateCandidate block')
          source = source.replace(candidate_block, '')

          state_block = """  const [delegateModalApprovalId, setDelegateModalApprovalId] = useState<string | null>(null);
            const [delegateCandidates, setDelegateCandidates] = useState<DelegateCandidate[]>([]);
            const [delegateLoading, setDelegateLoading] = useState(false);
            const [selectedDelegateId, setSelectedDelegateId] = useState<string | null>(null);
            const [delegatingApproval, setDelegatingApproval] = useState<string | null>(null);
          """
          if source.count(state_block) != 1:
              raise SystemExit('unexpected delegate state block')
          source = source.replace(state_block, '')

          source, count = re.subn(
              r"\n  const openDelegateModal = async \(approvalId: string, minuteId: string, revisionNumber: number\) => \{.*?\n  return \(",
              "\n  return (",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('delegate handlers block not found exactly once')

          action_pattern = re.compile(
              r"\n\s+\{!row\.is_delegate && !row\.delegate_user_id && \(\n.*?\n\s+\)\}",
              re.S,
          )
          source, count = action_pattern.subn('', source)
          if count != 2:
              raise SystemExit(f'expected 2 delegate action controls, found {count}')

          source, count = re.subn(
              r"\n      \{/\* Delegate selection modal \*/\}.*?\n      \{/\* Keep ApprovalStatusBadge import used \*/\}",
              "\n      {/* Keep ApprovalStatusBadge import used */}",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('delegate modal block not found exactly once')

          for forbidden in ('assign_minutes_approval_delegate', 'openDelegateModal', 'delegateModalApprovalId', 'title="انتخاب جانشین"'):
              if forbidden in source:
                  raise SystemExit(f'forbidden approval-time delegation UI remains: {forbidden}')
          if 'delegate_user_id.eq.' not in source or 'جانشین تأییدکننده' not in source:
              raise SystemExit('delegate inbox/read display contract was accidentally removed')
          approvals_path.write_text(source)

          detail_path = Path('src/components/Minutes/MinutesDetailPage.tsx')
          detail = detail_path.read_text()
          old = "  const myApproval = approvals.find(a => a.approver_user_id === currentUserId && a.status === 'pending');"
          new = """  const myApproval = approvals.find(a =>
            (a.approver_user_id === currentUserId || a.delegate_user_id === currentUserId)
            && a.status === 'pending'
          );"""
          if detail.count(old) != 1:
              raise SystemExit('unexpected MinutesDetailPage myApproval expression')
          detail_path.write_text(detail.replace(old, new))

          test_path = Path('tests/minutes/approvalDelegate.test.ts')
          tests = test_path.read_text()
          stale = re.compile(
              r"test\('MinutesApprovalsPage shows delegate selection button only for approver', \(\) => \{.*?\n\}\);\n\n"
              r"test\('MinutesApprovalsPage handles delegate RPC error codes', \(\) => \{.*?\n\}\);",
              re.S,
          )
          replacement = """test('MinutesApprovalsPage does not expose approval-time delegate selection', () => {
            const source = fs.readFileSync(
              path.join(__dirname, '../../src/components/Minutes/MinutesApprovalsPage.tsx'),
              'utf-8',
            );
            assert.ok(!source.includes('assign_minutes_approval_delegate'), 'cartable must not call delegate assignment RPC');
            assert.ok(!source.includes('openDelegateModal'), 'cartable must not expose delegate selection modal');
            assert.ok(!source.includes('انتخاب جانشین تأییدکننده'), 'cartable must not render delegate selector UI');
          });

          test('MinutesDetailPage treats a delegate as the pending approver', () => {
            const source = fs.readFileSync(
              path.join(__dirname, '../../src/components/Minutes/MinutesDetailPage.tsx'),
              'utf-8',
            );
            assert.ok(source.includes('a.approver_user_id === currentUserId || a.delegate_user_id === currentUserId'));
          });

          test('delegate cartable access migration lets delegate read the parent minute', () => {
            const migrationSource = fs.readFileSync(
              path.join(__dirname, '../../supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql'),
              'utf-8',
            );
            assert.ok(migrationSource.includes('private._user_can_view_minute'));
            assert.ok(migrationSource.includes('ma.delegate_user_id = auth.uid()'));
          });"""
          tests, count = stale.subn(replacement, tests, count=1)
          if count != 1:
              raise SystemExit('stale frontend delegate tests block not found exactly once')
          test_path.write_text(tests)
          PY

          cat > supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql <<'SQL'
          -- Existing approval delegates could read their minutes_approvals row, but the
          -- parent minutes row was filtered by RLS because this visibility helper only
          -- recognized the original approver. Keep all existing access paths and add
          -- the assigned delegate to the approval visibility branch.
          CREATE OR REPLACE FUNCTION private._user_can_view_minute(p_minute_id uuid)
          RETURNS boolean
          LANGUAGE sql
          STABLE SECURITY DEFINER
          SET search_path TO ''
          AS $function$
          SELECT EXISTS (
            SELECT 1
            FROM public.minutes m
            WHERE m.id = p_minute_id
              AND (
                public.is_current_user_admin()

                OR m.created_by_user_id = auth.uid()
                OR m.secretary_user_id   = auth.uid()
                OR m.chair_user_id       = auth.uid()

                OR EXISTS (
                  SELECT 1
                  FROM public.minutes_participants mp
                  WHERE mp.minute_id = m.id
                    AND mp.user_id = auth.uid()
                )

                OR EXISTS (
                  SELECT 1
                  FROM public.minutes_approvals ma
                  WHERE ma.minute_id = m.id
                    AND (
                      ma.approver_user_id = auth.uid()
                      OR ma.delegate_user_id = auth.uid()
                    )
                )

                OR EXISTS (
                  SELECT 1
                  FROM public.minutes_decisions md
                  WHERE md.minute_id = m.id
                    AND md.primary_owner_user_id = auth.uid()
                )

                OR public._minutes_user_belongs_to_meeting(m.meeting_id, auth.uid())

                OR (
                  m.confidentiality = 'restricted'
                  AND public.can_view_restricted_minutes_meeting(m.meeting_id)
                )
              )
          );
          $function$;
          SQL

      - name: Install dependencies
        run: npm ci

      - name: Targeted delegate approval tests
        run: npm run test:approval-delegate

      - name: Production build
        run: npm run build

      - name: Verify diff
        run: |
          git diff --check
          git status --short
          test -z "$(git diff --name-only | grep -v -E '^(src/components/Minutes/MinutesApprovalsPage.tsx|src/components/Minutes/MinutesDetailPage.tsx|tests/minutes/approvalDelegate.test.ts|supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql)$')"

      - name: Commit validated fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Minutes/MinutesApprovalsPage.tsx \
                  src/components/Minutes/MinutesDetailPage.tsx \
                  tests/minutes/approvalDelegate.test.ts \
                  supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql
          git commit -m "fix(minutes): align delegate approval cartable"
          git push origin HEAD:main

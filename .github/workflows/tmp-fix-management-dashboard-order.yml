name: tmp-fix-management-dashboard-order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-management-dashboard-order.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - id: transform
        name: Apply scoped dashboard order change
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD:src/components/ManagementDashboardPage.tsx > /tmp/dashboard-source-base-sha
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/ManagementDashboardPage.tsx')
          text = path.read_text(encoding='utf-8')

          trend = '          <Panel title="روند تکمیل تسک‌ها"'
          decisions = '          <Panel title="عملکرد واحدها"'
          distribution = '          <Panel title="توزیع تسک‌ها بر اساس وضعیت"'
          meetings = '          <Panel title="جلسات اخیر"'
          actions = '          <Panel title="تسک‌های مهم"'
          schedule = '          <Panel title="برنامه امروز"'

          for anchor in (trend, decisions, distribution, meetings, actions, schedule):
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected exactly one anchor {anchor!r}; found {text.count(anchor)}')

          trend_start = text.index(trend)
          decisions_start = text.index(decisions, trend_start)
          distribution_start = text.index(distribution, decisions_start)
          if not trend_start < decisions_start < distribution_start:
              raise SystemExit('unexpected analytics order before transform')

          trend_block = text[trend_start:decisions_start]
          decisions_block = text[decisions_start:distribution_start]
          text = text[:trend_start] + decisions_block + trend_block + text[distribution_start:]

          meetings_start = text.index(meetings)
          actions_start = text.index(actions, meetings_start)
          schedule_start = text.index(schedule, actions_start)
          if not meetings_start < actions_start < schedule_start:
              raise SystemExit('unexpected operational order before transform')

          meetings_block = text[meetings_start:actions_start]
          actions_block = text[actions_start:schedule_start]
          text = text[:meetings_start] + actions_block + meetings_block + text[schedule_start:]

          if not (
              text.index(decisions) < text.index(trend)
              and text.index(actions) < text.index(meetings) < text.index(schedule)
          ):
              raise SystemExit('final dashboard order contract failed')

          path.write_text(text, encoding='utf-8')
          print('dashboard order contract OK: decisions -> actions -> meetings')
          PY
          git diff --check -- src/components/ManagementDashboardPage.tsx
          test "$(git diff --name-only)" = "src/components/ManagementDashboardPage.tsx"

      - name: Setup Node
        if: steps.transform.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: Install dependencies
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - id: build
        name: Build
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: test
        name: Test
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test

      - id: freshness
        name: Confirm source was not concurrently changed
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(cat /tmp/dashboard-source-base-sha)"
          remote_sha="$(git rev-parse origin/main:src/components/ManagementDashboardPage.tsx)"
          test "$base_sha" = "$remote_sha"

      - name: Commit validated fix and clean temporary tooling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          transform='${{ steps.transform.outcome }}'
          install='${{ steps.install.outcome }}'
          build='${{ steps.build.outcome }}'
          test_result='${{ steps.test.outcome }}'
          freshness='${{ steps.freshness.outcome }}'

          git show 3cc52d6d113d3dd8e669fb656f861b45fb5a09fa:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/tmp-fix-management-dashboard-order.yml
          rm -f .github/workflows/tmp-reorder-management-dashboard.yml
          rm -f tmp/management-dashboard-reorder-trigger.txt
          rm -f .tmp-management-dashboard-reorder-trigger

          if [ "$transform" = success ] && [ "$install" = success ] && [ "$build" = success ] && [ "$test_result" = success ] && [ "$freshness" = success ]; then
            message='fix: reorder management dashboard sections [skip ci]'
          else
            git restore --source=HEAD -- src/components/ManagementDashboardPage.tsx
            message="chore: dashboard reorder validation failed transform-$transform install-$install build-$build test-$test_result freshness-$freshness [skip ci]"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main

name: Temporary application-layer validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-application-layer-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Application-only contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/application.sh
          bash -n deploy/spark-cli/lib/runtime-fixes.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          python3 deploy/spark-cli/spark-ui.py --self-test

          grep -Fq 'source "${SCRIPT_DIR}/lib/application.sh"' deploy/spark-cli/lib/runtime-fixes.sh
          grep -Fq 'Update Internet App' deploy/spark-cli/spark-ui.py
          grep -Fq 'app-update) update_spark' deploy/spark-cli/spark

          app=deploy/spark-cli/lib/application.sh
          grep -Fq 'npm ci' "$app"
          grep -Fq 'npm run build' "$app"
          grep -Fq 'git -C "$SPARK_ROOT" fetch origin main' "$app"
          grep -Fq 'rsync -a --delete "${stage}/dist/"' "$app"

          # Application update must not mutate database/runtime/control-plane layers.
          ! grep -Eqi 'psql|pg_dump|supabase_migrations|schema_migrations|stage_update_edge_functions|docker[[:space:]]+compose|avatar-worker|apply-daily-report-scheduler|test_supabase_source|install_manager_from_dir|service-supabase' "$app"

          echo APPLICATION_LAYER_CONTRACT_PASS

      - name: Build real frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VITE_SUPABASE_URL='https://example.invalid' VITE_SUPABASE_ANON_KEY='test-anon-key' npm run build
          test -f dist/index.html
          echo APPLICATION_BUILD_PASS

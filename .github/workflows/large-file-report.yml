name: Large source file audit

on:
  push:
    paths:
      - '.github/workflows/large-file-report.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source line-count report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          find src supabase tests scripts -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.mjs' -o -name '*.css' \) -print0 \
            | xargs -0 wc -l \
            | sort -nr \
            | head -120 > tmp/large-files.txt
          cat tmp/large-files.txt
      - name: Commit temporary report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/large-files.txt
          git commit -m 'chore: record large source audit'
          git push origin HEAD:main

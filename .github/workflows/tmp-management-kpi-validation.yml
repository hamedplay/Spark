name: Temporary management KPI validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-management-kpi-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate exact filter wiring
        run: |
          grep -q "get_management_tasks_v2" src/components/ManagementDashboardPage.tsx
          grep -q "get_management_minutes_v1" src/components/Minutes/ManagementMinutesOverview.tsx
          grep -q "get_management_decisions_v3" src/components/Minutes/ManagementMinutesOverview.tsx
          grep -q "focus.detail.type === 'decisions'" src/components/ManagementScopeWorkspace.tsx

name: Temporary database updater validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-database-update-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Manager database wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/lib/database.sh
          bash -n deploy/spark-cli/lib/runtime-fixes.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          python3 deploy/spark-cli/spark-ui.py --self-test

          grep -Fq 'database-update-supabase) spark_database_update_supabase' deploy/spark-cli/spark
          grep -Fq 'source "${SCRIPT_DIR}/lib/database.sh"' deploy/spark-cli/lib/runtime-fixes.sh
          grep -Fq '"Update Supabase"' deploy/spark-cli/spark-ui.py
          grep -Fq 'NOTIFY pgrst' deploy/spark-cli/lib/database.sh
          grep -Fq 'supabase_migrations.schema_migrations' deploy/spark-cli/lib/database.sh

      - name: Validate pending migration detection and transaction payload
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export SPARK_ROOT="$tmp/spark"
          export SUPABASE_ROOT="$tmp/supabase"
          export CURRENT_LOG="$tmp/test.log"
          mkdir -p "$SPARK_ROOT/supabase/migrations" "$SUPABASE_ROOT"
          touch "$SUPABASE_ROOT/docker-compose.yml" "$CURRENT_LOG"
          printf '%s\n' 'select 1;' > "$SPARK_ROOT/supabase/migrations/20261001000000_first.sql"
          printf '%s\n' 'create table if not exists public.test_second(id bigint);' > "$SPARK_ROOT/supabase/migrations/20261002000000_second.sql"

          fail() { printf 'FAIL: %s\n' "$*" >&2; }
          compose() {
            if [[ "$*" == *'select version from supabase_migrations.schema_migrations'* ]]; then
              printf '%s\n' '20261001000000'
              return 0
            fi
            cat > "$tmp/psql-input.sql"
          }

          source deploy/spark-cli/lib/database.sh

          pending="$(spark_database_pending_migrations)"
          [[ "$pending" == *'20261002000000_second.sql' ]]
          [[ "$pending" != *'20261001000000_first.sql' ]]

          spark_database_apply_migration_file "$SPARK_ROOT/supabase/migrations/20261002000000_second.sql"
          grep -Fq 'BEGIN;' "$tmp/psql-input.sql"
          grep -Fq "VALUES ('20261002000000', 'second')" "$tmp/psql-input.sql"
          grep -Fq "NOTIFY pgrst, 'reload schema';" "$tmp/psql-input.sql"
          grep -Fq 'COMMIT;' "$tmp/psql-input.sql"

          printf '%s\n' 'BEGIN;' > "$SPARK_ROOT/supabase/migrations/20261003000000_unsafe.sql"
          if spark_database_apply_migration_file "$SPARK_ROOT/supabase/migrations/20261003000000_unsafe.sql"; then
            echo 'transaction-sensitive migration was not rejected' >&2
            exit 1
          fi

          echo DATABASE_UPDATE_CONTRACT_PASS

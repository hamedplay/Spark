name: Temporary Fix Nginx Server Tokens

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-nginx-server-tokens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Nginx writers and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Air-Gap writer: keep server_tokens in server context, never http/include context.
          p = Path('deploy/spark-cli/lib/airgap-ip.sh')
          text = p.read_text(encoding='utf-8')
          old = '''  cat >/etc/nginx/sites-available/spark <<EOF_NGINX\nserver_tokens off;\nlimit_req_zone'''
          new = '''  cat >/etc/nginx/sites-available/spark <<EOF_NGINX\nlimit_req_zone'''
          if old not in text:
              raise SystemExit('Air-Gap top-level server_tokens block not found')
          text = text.replace(old, new, 1)
          old = '''server {\n    listen ${ip}:80 default_server;\n    server_name _;\n    root /var/www/spark;'''
          new = '''server {\n    listen ${ip}:80 default_server;\n    server_name _;\n    server_tokens off;\n    root /var/www/spark;'''
          if old not in text:
              raise SystemExit('Air-Gap server block marker not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Online production writer: same directive must live inside each server context.
          p = Path('deploy/spark-cli/lib/install-platform-b.sh')
          text = p.read_text(encoding='utf-8')
          old = '''  cat >/etc/nginx/sites-available/spark <<EOF\nserver_tokens off;\n\n# Per-IP protection'''
          new = '''  cat >/etc/nginx/sites-available/spark <<EOF\n# Per-IP protection'''
          if old not in text:
              raise SystemExit('Online top-level server_tokens block not found')
          text = text.replace(old, new, 1)

          markers = [
              '''server {\n    listen 80;\n    server_name ${APP_DOMAIN} ${WWW_DOMAIN} ${API_DOMAIN} ${TURN_DOMAIN};''',
              '''server {\n    listen 443 ssl http2;\n    server_name ${APP_DOMAIN} ${WWW_DOMAIN};''',
              '''server {\n    listen 443 ssl http2;\n    server_name ${API_DOMAIN};''',
          ]
          for marker in markers:
              if marker not in text:
                  raise SystemExit(f'Online server block marker not found: {marker!r}')
              text = text.replace(marker, marker + '\n    server_tokens off;', 1)
          p.write_text(text, encoding='utf-8')
          PY

          bash -n deploy/spark-cli/lib/airgap-ip.sh
          bash -n deploy/spark-cli/lib/install-platform-b.sh

          # Source-level invariant: no generated Spark site begins with an http-context
          # server_tokens directive, while every server block gets the hardening directive.
          python3 - <<'PY'
          from pathlib import Path
          a = Path('deploy/spark-cli/lib/airgap-ip.sh').read_text(encoding='utf-8')
          b = Path('deploy/spark-cli/lib/install-platform-b.sh').read_text(encoding='utf-8')
          assert '<<EOF_NGINX\nserver_tokens off;' not in a
          assert 'server_name _;\n    server_tokens off;' in a
          assert '<<EOF\nserver_tokens off;' not in b
          assert b.count('    server_tokens off;') >= 3
          PY

          # Real nginx syntax fixture with an existing global hardening directive.
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx >/dev/null
          tmp="$(mktemp -d)"
          cat >"$tmp/nginx.conf" <<EOF
          events {}
          http {
              server_tokens off;
              limit_req_zone \$binary_remote_addr zone=spark_auth_limit_test:10m rate=10r/s;
              map \$http_upgrade \$spark_connection_upgrade_test {
                  default upgrade;
                  '' close;
              }
              server {
                  listen 127.0.0.1:18080;
                  server_name _;
                  server_tokens off;
                  location / { return 200 'ok'; }
              }
          }
          EOF
          sudo nginx -t -c "$tmp/nginx.conf"
          rm -rf "$tmp"
          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh deploy/spark-cli/lib/install-platform-b.sh
          git commit -m 'fix(nginx): scope server_tokens to server blocks'
          git push origin HEAD:main

name: Spark CLI M4.3 Final Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m43-final-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        working-directory: deploy/spark-cli
        run: python3 -m compileall -q roles/application adapters config core secrets architecture
      - name: Application tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/application -p 'test_*.py' -v
      - name: Database regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Architecture regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -p 'test_*.py' -v
      - name: Secrets regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/secrets -p 'test_*.py' -v
      - name: Workflow core regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v
      - name: M4.3 static safety boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('deploy/spark-cli/roles/application')
          text = '\n'.join(p.read_text() for p in app.rglob('*.py'))
          assert 'spark-app.service' not in text
          for forbidden in ('edge functions', 'livekit', 'coturn'):
              assert forbidden not in text.lower()
          build = Path('deploy/spark-build.yaml').read_text()
          assert 'npm\n    - ci' in build
          assert '>=24.18.1 <25' in build
          bootstrap = Path('deploy/spark-cli/bootstrap.sh').read_text()
          for needle in (
              'roles/application/build/builder.py',
              'roles/application/deployment/activator.py',
              '"$tmp/roles/application/build"',
              '"$stage/roles/application/build"',
              'for file in "$tmp"/roles/application/build/*.py',
              'for file in "$tmp"/roles/application/deployment/*.py',
          ):
              assert needle in bootstrap, needle
          print('M4.3 boundary and bootstrap structure OK')
          PY
          bash -n deploy/spark-cli/bootstrap.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Real reproducible frontend build
        run: |
          test "$(node --version)" = "v24.18.1"
          npm ci
          npm run build
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"

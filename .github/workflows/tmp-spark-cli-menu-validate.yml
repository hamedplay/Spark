name: Temporary Spark CLI menu validation

on:
  push:
    branches: [main]
    paths:
      - 'deploy/spark-cli/spark-ui.py'
      - '.github/workflows/tmp-spark-cli-menu-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Spark CLI UI
        run: python3 -m py_compile deploy/spark-cli/spark-ui.py
      - name: Validate requested menu contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          path = Path('deploy/spark-cli/spark-ui.py')
          source = path.read_text(encoding='utf-8')
          ast.parse(source)

          required = [
              '"Installation Internet"',
              '"Installation Air-Gap"',
              '"Diagnostics"',
              '"Linux System"',
              '"Build Manager Offline Update"',
              '"Update Manager — Offline"',
              '"Update Manager — Internet"',
              '"Recent Manager Logs"',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'Missing requested UI contract tokens: {missing}')

          if '"Diagnostics"' not in source:
              raise SystemExit('Diagnostics category was renamed unexpectedly')

          block_start = source.index('elif category in ("Installation Air-Gapped", "Installation Air-Gap")')
          block_end = source.index('elif category == "System"', block_start)
          block = source[block_start:block_end]
          if 'existing = [action for action in actions if not action.action_id.startswith("manager-airgap-")]' not in block:
              raise SystemExit('Manager offline actions are not removed from Installation Air-Gap')

          manager_start = source.index('elif category == "Manager"')
          manager_end = source.index('elif category == "Cleanup / Remove"', manager_start)
          if '_manager_actions(actions)' not in source[manager_start:manager_end]:
              raise SystemExit('Manager category does not use the rebuilt Manager actions')

          print('Spark CLI menu contract validation: PASS')
          PY

name: Temporary shared Spark CLI progress UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-shared-progress-ui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/progress-ui.sh
          bash -n deploy/spark-cli/lib/runtime-fixes.sh
          bash -n deploy/spark-cli/lib/airgap-observability-quiet-base.sh
          grep -Fq 'source "${SCRIPT_DIR}/lib/progress-ui.sh"' deploy/spark-cli/lib/runtime-fixes.sh
          grep -Fq 'source "${SCRIPT_DIR}/lib/progress-ui.sh"' deploy/spark-cli/lib/airgap-observability-quiet-base.sh
          sudo bash deploy/spark-cli/spark --version
          sudo bash deploy/spark-cli/spark-airgap --version
      - name: PTY activity progress
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/progress-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          CURRENT_LOG=/tmp/progress-command.log
          : >"$CURRENT_LOG"
          C_GREEN=$'\033[32m'; C_RED=$'\033[31m'; C_CYAN=$'\033[36m'; C_RESET=$'\033[0m'
          info() { printf '• %s\n' "$*"; }
          ok() { printf '✓ %s\n' "$*"; }
          fail() { printf '✗ %s\n' "$*"; }
          show_failure_log() { cat "$CURRENT_LOG"; }
          new_log() { CURRENT_LOG=/tmp/progress-command.log; : >"$CURRENT_LOG"; }
          source deploy/spark-cli/lib/progress-ui.sh
          run_logged 'Synthetic long operation' bash -c 'printf start; sleep 1; printf done'
          grep -q start "$CURRENT_LOG"
          grep -q done "$CURRENT_LOG"
          EOF
          chmod +x /tmp/progress-test.sh
          script -qefc "bash /tmp/progress-test.sh" /tmp/progress-pty.log
          tr '\r' '\n' < /tmp/progress-pty.log | sed -r 's/\x1B\[[0-9;]*[mK]//g' > /tmp/progress-clean.log
          grep -q 'WORKING' /tmp/progress-clean.log
          grep -q '100%' /tmp/progress-clean.log
          cat /tmp/progress-clean.log

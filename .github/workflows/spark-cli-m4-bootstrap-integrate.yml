name: Spark CLI M4 Bootstrap Integrate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m4-bootstrap-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('deploy/spark-cli/bootstrap.sh'); s=p.read_text(); s=s.replace('\"$tmp/roles/database/lifecycle\" \"$tmp/roles/database/schema\"','\"$tmp/roles/database/lifecycle\" \"$tmp/roles/database/schema\" \"$tmp/roles/application/tasks\"',1); s=s.replace('roles/__init__.py\\n','roles/__init__.py\\nroles/application/__init__.py\\nroles/application/context.py\\nroles/application/detector.py\\nroles/application/preflight.py\\nroles/application/source.py\\nroles/application/configuration.py\\nroles/application/workflow.py\\nroles/application/manifest.yaml\\nroles/application/tasks/__init__.py\\n',1); s=s.replace('\"$stage/roles/database/lifecycle\" \"$stage/roles/database/schema\"','\"$stage/roles/database/lifecycle\" \"$stage/roles/database/schema\" \"$stage/roles/application/tasks\"',1); marker='for file in \"$tmp\"/roles/*.py; do install -m 0644 \"$file\" \"$stage/roles/$(basename \"$file\")\"; done\\n'; extra='for file in \"$tmp\"/roles/application/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/$(basename \"$file\")\"; done\\ninstall -m 0644 \"$tmp/roles/application/manifest.yaml\" \"$stage/roles/application/manifest.yaml\"\\nfor file in \"$tmp\"/roles/application/tasks/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/tasks/$(basename \"$file\")\"; done\\n'; s=s.replace(marker, marker+extra,1); p.write_text(s)"
      - name: Validate
        run: |
          bash -n deploy/spark-cli/bootstrap.sh
          cd deploy/spark-cli
          python3 -m compileall -q roles/application config
          python3 -m unittest discover -s tests/application -p 'test_*.py' -v
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Commit
        run: |
          git config user.name spark-ci
          git config user.email spark-ci@users.noreply.github.com
          git add deploy/spark-cli/bootstrap.sh
          git commit -m 'feat: install M4 application role modules with spark manager'
          git push origin HEAD:main

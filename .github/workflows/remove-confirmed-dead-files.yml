name: Remove confirmed dead files

on:
  push:
    branches: [main]
    paths:
      - scripts/remove-confirmed-dead-files.mjs
      - .github/workflows/remove-confirmed-dead-files.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guarded cleanup and validation
        id: guarded
        shell: bash
        run: |
          set +e
          : > /tmp/dead-file-cleanup.log
          node scripts/remove-confirmed-dead-files.mjs >> /tmp/dead-file-cleanup.log 2>&1
          remove_rc=$?
          build_rc=99
          audit_rc=99
          if [ "$remove_rc" -eq 0 ]; then
            npm run build >> /tmp/dead-file-cleanup.log 2>&1
            build_rc=$?
          fi
          if [ "$remove_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            node scripts/audit-dead-code.mjs >> /tmp/dead-file-cleanup.log 2>&1
            audit_rc=$?
          fi

          if [ "$remove_rc" -ne 0 ] || [ "$build_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "VALIDATION_FAILED"
              echo "remove_rc=$remove_rc"
              echo "build_rc=$build_rc"
              echo "audit_rc=$audit_rc"
              echo
              cat /tmp/dead-file-cleanup.log
            } > scripts/.dead-file-cleanup-status.txt
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f scripts/.dead-file-cleanup-status.txt
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated cleanup
        if: steps.guarded.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u src
          git commit -m "cleanup: remove confirmed dead application files"
          git push origin HEAD:main

      - name: Commit failure evidence
        if: steps.guarded.outputs.success != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.dead-file-cleanup-status.txt
          git commit -m "chore: record dead file cleanup validation failure" || exit 0
          git push origin HEAD:main

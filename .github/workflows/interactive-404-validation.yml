name: Temporary Interactive 404 Validation

on:
  push:
    branches:
      - work/interactive-404-20260818
    paths-ignore:
      - '.interactive-404-validation-status.txt'

permissions:
  contents: write

concurrency:
  group: interactive-404-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect frontend path handling
        shell: bash
        run: |
          echo '--- pathname references ---'
          grep -RInE "location\.pathname|window\.location\.pathname|/admin|conference" src \
            --include='*.ts' --include='*.tsx' | tee /tmp/path-references.txt || true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Targeted 404 tests
        shell: bash
        run: |
          if [ -f tests/app/rootPath404.test.ts ]; then
            node --import tsx --test tests/app/rootPath404.test.ts
            echo 'targeted_test=passed' > /tmp/targeted-test.txt
          else
            echo 'targeted_test=not_added_yet' > /tmp/targeted-test.txt
          fi

      - name: Verify no unintended database changes
        shell: bash
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^supabase/'; then
            echo 'Unexpected Supabase/database change in 404 scope.' >&2
            exit 1
          fi

      - name: Record successful validation
        shell: bash
        run: |
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo 'build=passed'
            cat /tmp/targeted-test.txt
            echo 'database_scope=clean'
            echo '--- path references ---'
            cat /tmp/path-references.txt
          } > .interactive-404-validation-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .interactive-404-validation-status.txt
          git commit -m 'chore: record temporary interactive 404 validation [skip ci]'
          git push

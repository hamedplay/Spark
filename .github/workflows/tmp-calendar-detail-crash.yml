name: Temporary calendar detail crash validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-calendar-detail-crash.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate stale delegate refs removed
        run: |
          ! grep -q "ownerDelegate" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "myDelegate" src/components/Calendar/MeetingDetailModal.tsx

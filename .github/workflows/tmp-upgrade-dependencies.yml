name: Temporary dependency upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-upgrade-dependencies.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Upgrade runtime dependencies to latest
        shell: bash
        run: |
          set -euo pipefail
          npm install --save \
            @react-oauth/google@latest \
            @supabase/supabase-js@latest \
            @types/react-datepicker@latest \
            docx@latest \
            exceljs@latest \
            html-to-image@latest \
            livekit-client@latest \
            lucide-react@latest \
            moment@latest \
            moment-jalaali@latest \
            react@latest \
            react-datepicker@latest \
            react-dom@latest \
            react-hot-toast@latest \
            uuid@latest

      - name: Upgrade development dependencies to latest
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev \
            @eslint/js@latest \
            @tailwindcss/postcss@latest \
            @types/moment-jalaali@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @typescript-eslint/eslint-plugin@latest \
            @typescript-eslint/parser@latest \
            @vitejs/plugin-react@latest \
            autoprefixer@latest \
            dotenv@latest \
            eslint@latest \
            eslint-plugin-react-hooks@latest \
            eslint-plugin-react-refresh@latest \
            globals@latest \
            postcss@latest \
            tailwindcss@latest \
            tsx@latest \
            typescript@latest \
            typescript-eslint@latest \
            vite@latest

      - name: Clean install from regenerated lockfile
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Core test suite
        run: npm test

      - name: Video conference contract tests
        run: npm run test:video-conference:contract

      - name: Report remaining outdated direct dependencies
        shell: bash
        run: npm outdated || true

      - name: Commit dependency upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: upgrade application dependencies"
          git push origin HEAD:main

name: Temporary Cleanup UI Fix

on:
  push:
    paths:
      - '.github/workflows/tmp-cleanup-ui-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Cleanup category with explicit English registry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/spark-cli/spark-ui.py')
          text = path.read_text(encoding='utf-8')

          marker = '\n\ndef patch_categories() -> None:\n'
          if marker not in text:
              raise SystemExit('patch_categories marker not found')

          cleanup_block = '''\n\nCLEANUP_ACTIONS = [\n    core.Action(\n        "cleanup-database",\n        "Delete Database data",\n        "Stop Supabase and delete only the detected PostgreSQL data bind. The operation refuses to guess the data path.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-supabase",\n        "Delete Supabase runtime",\n        "Delete the complete local Supabase runtime, volumes/data, runtime configuration and runtime secrets.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-frontend",\n        "Delete deployed Frontend",\n        "Delete /var/www/spark only; the local Spark source repository remains.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-source",\n        "Delete Spark source",\n        "Delete the local /opt/spark repository; GitHub and the installed Spark Manager remain.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-logs",\n        "Delete Manager logs",\n        "Delete Spark Manager logs only; system journal and Docker logs are not changed.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-backups",\n        "Backup cleanup / free space",\n        "Safely prune old Spark backups with a configurable retention period, or explicitly delete all retained backups.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-history",\n        "Reset install history",\n        "Clear installation-step DONE markers only. Runtime data and live service state are not changed.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-livekit",\n        "Delete LiveKit runtime",\n        "Remove only the LiveKit runtime and secrets, then restore the legacy Coturn fallback.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-full",\n        "Delete complete Spark project",\n        "Remove Spark-specific runtime, data, configuration, certificates, schedulers, TURN, source, logs and backups while keeping the Manager and shared OS packages.",\n        "confirm",\n    ),\n    core.Action(\n        "cleanup-manager",\n        "Uninstall Spark Manager",\n        "Remove the installed Spark Manager and /usr/local/bin/spark only; the project runtime is left untouched.",\n        "confirm",\n    ),\n]\n'''

          if 'CLEANUP_ACTIONS = [' not in text:
              text = text.replace(marker, cleanup_block + marker, 1)

          old = '''        elif category == "Cleanup / Remove":\n            idx = next((i for i, a in enumerate(new_actions) if a.action_id == "cleanup-full"), len(new_actions))\n            new_actions.insert(idx, core.Action(\n                "cleanup-livekit",\n                "Delete LiveKit runtime",\n                "Remove only LiveKit runtime and secrets; restore legacy Coturn.",\n                "confirm",\n            ))\n        rebuilt.append((category, new_actions))\n'''
          new = '''        elif category == "Cleanup / Remove":\n            rebuilt.append(("Cleanup / Remove", list(CLEANUP_ACTIONS)))\n            continue\n        rebuilt.append((category, new_actions))\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('Cleanup / Remove patch target not found')
          else:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Cleanup registry and UI
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile deploy/spark-cli/spark-ui.py deploy/spark-cli/spark-ui-core.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/spark-cli/spark-ui.py --self-test
          python3 - <<'PY'
          import importlib.util
          import re
          import sys
          from pathlib import Path

          path = Path('deploy/spark-cli/spark-ui.py')
          spec = importlib.util.spec_from_file_location('spark_ui_validate', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.patch_categories()
          hits = [(name, action.label, action.description) for name, actions in module.core.CATEGORIES if name == 'Cleanup / Remove' for action in actions]
          if len(hits) != 10:
              raise SystemExit(f'Unexpected cleanup action count: {len(hits)}')
          pattern = re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          for category, label, description in hits:
              if pattern.search(category + label + description):
                  raise SystemExit(f'Non-English cleanup UI text found: {(category, label, description)!r}')
          print('CLEANUP_UI_ENGLISH_ONLY=PASS')
          for _, label, _ in hits:
              print(label)
          PY
          rm -rf deploy/spark-cli/__pycache__

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/spark-ui.py
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix(manager): force English Cleanup Remove registry'
          git push origin HEAD:main

# Trigger build-only validation; remove after completion.
name: Temporary recovery build validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-recovery-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

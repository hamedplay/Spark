name: Temporary scope validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Meeting tests
        id: meetings
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            npm run test:meeting-prefill
            a=$?
            npm run test:meeting-delegation
            b=$?
            npm run test:recurrence
            c=$?
            echo "exit_codes=$a,$b,$c"
            exit $(( a || b || c ))
          } 2>&1 | tee meeting-tests.log
          exit ${PIPESTATUS[0]}
      - name: Notification lifecycle tests
        id: notifications
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            npm run test:notification-lifecycle
            a=$?
            npm run test:notification-producer
            b=$?
            echo "exit_codes=$a,$b"
            exit $(( a || b ))
          } 2>&1 | tee notification-tests.log
          exit ${PIPESTATUS[0]}
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-validation-logs
          path: |
            build.log
            meeting-tests.log
            notification-tests.log
      - name: Fail if validation failed
        if: steps.build.outcome != 'success' || steps.meetings.outcome != 'success' || steps.notifications.outcome != 'success'
        run: exit 1

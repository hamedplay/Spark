name: Temporary - Create Similar Meeting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-create-similar-meeting.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Apply scoped create-similar changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Extend calendar meeting prefill contract with clone-safe values only.
          replace_once(
              'src/components/CalendarMeetingForm/types.ts',
              '''    participantUserIds?: string[];\n    repeatEnabled?: boolean;''',
              '''    participantUserIds?: string[];\n    notifyUserIds?: string[];\n    externalParticipants?: string[];\n    meetingManager?: string;\n    reminderMinutes?: number;\n    isOnline?: boolean;\n    agendaItems?: Array<{\n      title: string;\n      presenter?: string | null;\n      duration_minutes?: number | null;\n      description?: string | null;\n    }>;\n    repeatEnabled?: boolean;'''
          )

          # 2) Consume clone prefill without setting meetingId/date/time/recurrence.
          replace_once(
              'src/components/CalendarMeetingForm.tsx',
              '''    if (prefillData.participantUserIds && prefillData.participantUserIds.length > 0) {\n      setSelectedParticipants(prefillData.participantUserIds.map((id: string) => ({ id, name: '' })));\n    }\n  }, [prefillData]);''',
              '''    if (prefillData.participantUserIds && prefillData.participantUserIds.length > 0) {\n      setSelectedParticipants(prefillData.participantUserIds.map((id: string) => ({ id, name: '' })));\n    }\n    if (prefillData.notifyUserIds && prefillData.notifyUserIds.length > 0) {\n      setSelectedNotifyUsers(prefillData.notifyUserIds.map((id: string) => ({ id, name: '' })));\n    }\n    if (prefillData.externalParticipants && prefillData.externalParticipants.length > 0) {\n      setSelectedExternal(prefillData.externalParticipants);\n    }\n    if (prefillData.meetingManager !== undefined) setMeetingManager(prefillData.meetingManager);\n    if (prefillData.reminderMinutes !== undefined) setReminderMinutes(prefillData.reminderMinutes);\n    if (prefillData.isOnline !== undefined) setIsOnline(prefillData.isOnline);\n    if (prefillData.agendaItems && prefillData.agendaItems.length > 0) {\n      setAgendaEnabled(true);\n      setAgendaItems(prefillData.agendaItems.map((item, idx) => ({\n        id: `prefill-${idx}`,\n        meeting_id: '',\n        title: item.title,\n        presenter: item.presenter ?? null,\n        duration_minutes: item.duration_minutes ?? null,\n        description: item.description ?? null,\n        sort_order: idx,\n        created_at: '',\n      })) as unknown as AgendaItem[]);\n    }\n  }, [prefillData]);'''
          )

          # 3) Add the action to meeting details and pass only reusable agenda content.
          replace_once(
              'src/components/Calendar/MeetingDetailModal.tsx',
              '''  duration_minutes: number | null;\n  sort_order: number;''',
              '''  duration_minutes: number | null;\n  description: string | null;\n  sort_order: number;'''
          )
          replace_once(
              'src/components/Calendar/MeetingDetailModal.tsx',
              '''  onGoogleCalendar: (m: MeetingData) => void;\n  onRegisterMinutes?: (meetingId: string, existingMinuteId: string | null) => void;''',
              '''  onGoogleCalendar: (m: MeetingData) => void;\n  onCreateSimilar?: (m: MeetingData, agendaItems: AgendaItem[]) => void;\n  onRegisterMinutes?: (meetingId: string, existingMinuteId: string | null) => void;'''
          )
          replace_once(
              'src/components/Calendar/MeetingDetailModal.tsx',
              '''  getMeetingColor, onClose, onEdit, onDelete, onGoogleCalendar, onRegisterMinutes,\n}: Props) {''',
              '''  getMeetingColor, onClose, onEdit, onDelete, onGoogleCalendar, onCreateSimilar, onRegisterMinutes,\n}: Props) {'''
          )
          replace_once(
              'src/components/Calendar/MeetingDetailModal.tsx',
              ".select('id, title, presenter, duration_minutes, sort_order')",
              ".select('id, title, presenter, duration_minutes, description, sort_order')"
          )
          replace_once(
              'src/components/Calendar/MeetingDetailModal.tsx',
              '''          {canEdit && (\n            <button onClick={() => onEdit(m)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-sm font-medium hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">\n              <Edit2 className="w-4 h-4" />ویرایش\n            </button>\n          )}\n          <button onClick={handleNativeShare}''',
              '''          {canEdit && (\n            <button onClick={() => onEdit(m)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-sm font-medium hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">\n              <Edit2 className="w-4 h-4" />ویرایش\n            </button>\n          )}\n          {onCreateSimilar && (\n            <button onClick={() => onCreateSimilar(m, agendaItems)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-violet-50 dark:bg-violet-900/20 text-violet-600 dark:text-violet-400 text-sm font-medium hover:bg-violet-100 dark:hover:bg-violet-900/40 transition-colors">\n              <Copy className="w-4 h-4" />ایجاد جلسه مشابه\n            </button>\n          )}\n          <button onClick={handleNativeShare}'''
          )

          # 4) Wire the detail action to the existing create form with a clean prefill.
          replace_once(
              'src/components/Calendar/CalendarPageView.tsx',
              '''          onGoogleCalendar={handleSendToGoogleCalendar}\n          onRegisterMinutes={onRegisterMinutes}\n        />''',
              '''          onGoogleCalendar={handleSendToGoogleCalendar}\n          onCreateSimilar={(meeting, sourceAgendaItems) => {\n            const eligibleCalendarId = [...calendars, ...subscribedCalendars].some(\n              (calendar) => calendar.id === meeting.calendar_id && !calendar.is_occasions && calendar.type !== 'private'\n            ) ? meeting.calendar_id : undefined;\n            setPrefillData({\n              subject: meeting.subject || '',\n              location: meeting.location || '',\n              representative: meeting.representative || '',\n              phone: meeting.phone || '',\n              notes: meeting.notes || '',\n              priority: meeting.priority || 'medium',\n              calendarId: eligibleCalendarId,\n              membersOnly: meeting.members_only ?? undefined,\n              participantUserIds: [...(meeting.participant_user_ids || [])],\n              notifyUserIds: (meeting.notify_users || []).filter((id) => id !== meeting.user_id),\n              externalParticipants: [...(meeting.external_participants || [])],\n              meetingManager: meeting.meeting_manager && meeting.meeting_manager !== meeting.user_id\n                ? meeting.meeting_manager\n                : '',\n              reminderMinutes: meeting.reminder_minutes ?? 15,\n              isOnline: Boolean(meeting.is_online),\n              agendaItems: sourceAgendaItems.map((item) => ({\n                title: item.title,\n                presenter: item.presenter ?? null,\n                duration_minutes: item.duration_minutes ?? null,\n                description: item.description ?? null,\n              })),\n            });\n            setActivePendingSchedule(null);\n            setDetailMeeting(null);\n            setShowMeetingForm(true);\n          }}\n          onRegisterMinutes={onRegisterMinutes}\n        />'''
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit scoped implementation
        shell: bash
        run: |
          git config user.name "spark-automation"
          git config user.email "spark-automation@users.noreply.github.com"
          git add src/components/Calendar/MeetingDetailModal.tsx \
                  src/components/Calendar/CalendarPageView.tsx \
                  src/components/CalendarMeetingForm.tsx \
                  src/components/CalendarMeetingForm/types.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: create similar meeting from details"
          git push origin HEAD:main

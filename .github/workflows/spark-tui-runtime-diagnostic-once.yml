name: One-time Spark TUI runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-tui-runtime-diagnostic-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install expect
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y expect

      - name: Install Spark Manager from checked-out revision
        shell: bash
        run: |
          sudo bash deploy/spark-cli/bootstrap.sh
          spark --version | tee /tmp/spark-version.txt

      - name: Reproduce first-action navigation in a PTY
        shell: bash
        run: |
          cat > /tmp/spark-tui.exp <<'EOF'
          log_user 1
          log_file -noappend /tmp/spark-tui-session.log
          set timeout 15
          spawn sudo env TERM=xterm-256color COLORTERM=truecolor spark
          after 1500
          send "\r"
          after 1500
          send "q"
          after 1000
          send "q"
          expect {
            eof {}
            timeout {
              puts "\nEXPECT_TIMEOUT"
              exit 124
            }
          }
          catch wait result
          puts "\nWAIT_RESULT=$result"
          EOF
          set +e
          expect /tmp/spark-tui.exp
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/spark-tui.rc
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/spark-tui-session.log')
          raw = p.read_text(errors='replace') if p.exists() else ''
          clean = re.sub(r'\x1b(?:[@-_]|\[[0-?]*[ -/]*[@-~])', '', raw)
          Path('/tmp/spark-tui-session.clean.log').write_text(clean)
          print(clean[-12000:])
          PY

      - name: Persist diagnostic and self-clean
        if: always()
        shell: bash
        run: |
          {
            echo '# Spark TUI runtime diagnostic'
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Runner: $(uname -a)"
            echo "TERM used: xterm-256color"
            echo "Version: $(cat /tmp/spark-version.txt 2>/dev/null || echo unavailable)"
            echo "Expect RC: $(cat /tmp/spark-tui.rc 2>/dev/null || echo unavailable)"
            echo
            echo '## Sanitized PTY output'
            echo '```text'
            tail -n 300 /tmp/spark-tui-session.clean.log 2>/dev/null || true
            echo '```'
          } > .spark-tui-runtime-diagnostic.md

          rm -f .github/workflows/spark-tui-runtime-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .spark-tui-runtime-diagnostic.md .github/workflows/spark-tui-runtime-diagnostic-once.yml
          git diff --cached --check
          git commit -m 'chore: record Spark TUI runtime diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main

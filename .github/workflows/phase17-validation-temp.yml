name: phase17-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Video conference tests
        run: node --test tests/video-conference/phase*.test.mjs

      - name: Shell syntax
        run: bash -n deploy/spark-cli/lib/install-livekit.sh

      - name: Build
        run: npm run build

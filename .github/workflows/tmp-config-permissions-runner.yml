name: One-time config backend permission validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-config-permissions-runner.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/config-permissions-dashboard-20260819-v4
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          package-manager-cache: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Transform backend permission alignment
        id: transform
        run: node scripts/tmp-config-permissions-fix.mjs

      - name: Align monitoring relation with current Shahr schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const monitorPath = 'src/components/SystemMonitoring/TasksMonitor.tsx';
          let monitor = fs.readFileSync(monitorPath, 'utf8');
          const monitorNeedle = "from('task_workflow')";
          const monitorCount = monitor.split(monitorNeedle).length - 1;
          if (monitorCount !== 2) throw new Error(`Expected 2 legacy task_workflow references, found ${monitorCount}`);
          monitor = monitor.split(monitorNeedle).join("from('task_workflow_steps')");
          fs.writeFileSync(monitorPath, monitor);

          const migrationPath = 'supabase/migrations/20260819024500_delegate_config_backend_operations.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const policyNeedle = 'config_monitoring_task_workflow_select ON public.task_workflow';
          const policyCount = migration.split(policyNeedle).length - 1;
          if (policyCount !== 2) throw new Error(`Expected 2 task workflow policy references, found ${policyCount}`);
          migration = migration.split(policyNeedle).join('config_monitoring_task_workflow_steps_select ON public.task_workflow_steps');
          fs.writeFileSync(migrationPath, migration);
          NODE

      - name: Repair generated test harness
        run: |
          cat > tests/app/configBackendPermissions.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const read = (p: string) => fs.readFileSync(p, 'utf8');

          test('delegated config Edge Functions use exact RBAC keys', () => {
            assert.ok(read('supabase/functions/backup-data/index.ts').includes('hasCurrentPermission(auth, "config_backup")'));
            assert.ok(read('supabase/functions/restore-backup/index.ts').includes('hasCurrentPermission(auth, "config_backup")'));
            assert.ok(read('supabase/functions/send-daily-meetings/dailyReportSupport.ts').includes('config_notifications.daily_report'));
            assert.ok(read('supabase/functions/messenger-proxy/index.ts').includes('config_notifications.social_notifications'));
            assert.ok(read('supabase/functions/check-phone-password-reset-runtime/index.ts').includes('config_access.security'));
            assert.ok(read('supabase/functions/send-sms/index.ts').includes('config_notifications.sms'));
          });

          test('monitoring uses the actual workflow relation and remains read-policy scoped', () => {
            const monitor = read('src/components/SystemMonitoring/TasksMonitor.tsx');
            const migration = read('supabase/migrations/20260819024500_delegate_config_backend_operations.sql');
            assert.ok(monitor.includes("from('task_workflow_steps')"));
            assert.ok(!monitor.includes("from('task_workflow')"));
            assert.ok(migration.includes('ON public.task_workflow_steps'));
            assert.ok(migration.includes("config_modules.monitoring"));
          });

          test('special identity-repair gate remains untouched', () => {
            const source = read('src/components/PortalConfig/IdentityRepairCard.tsx');
            assert.match(source, /is_security_admin/);
            assert.match(source, /MFA_STEP_UP_REQUIRED|mfa/i);
          });

          test('delegated group rights do not expose group metadata mutation', () => {
            const source = read('src/components/UserGroupsPanel.tsx');
            assert.match(source, /isAdmin.*ویرایش گروه/s);
            assert.match(source, /canManageAccess.*مدیریت اعضا/s);
            assert.match(source, /canManageAccess.*حقوق دسترسی/s);
          });
          EOF

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Test configuration permission routing
        id: config_test
        run: node --import tsx --test tests/app/configPermissions.test.ts tests/app/configBackendPermissions.test.ts

      - name: Test existing navigation contract
        id: nav_test
        run: npm run test:layout-navigation

      - name: Check changed Edge Functions
        id: deno_check
        run: |
          deno check supabase/functions/backup-data/index.ts
          deno check supabase/functions/restore-backup/index.ts
          deno check supabase/functions/send-daily-meetings/index.ts
          deno check supabase/functions/messenger-proxy/index.ts
          deno check supabase/functions/check-phone-password-reset-runtime/index.ts
          deno check supabase/functions/send-sms/index.ts
          deno check supabase/functions/management-dashboard/index.ts

      - name: Production build
        id: build
        run: npm run build

      - name: Inspect transformed diff
        id: diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit validated backend alignment
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/requireFullAuthAccess.ts \
            supabase/functions/backup-data/index.ts \
            supabase/functions/restore-backup/index.ts \
            supabase/functions/send-daily-meetings/dailyReportSupport.ts \
            supabase/functions/messenger-proxy/index.ts \
            supabase/functions/check-phone-password-reset-runtime/index.ts \
            supabase/functions/send-sms/index.ts \
            src/components/UserManagementPanel.tsx \
            src/components/UserGroupsPanel.tsx \
            src/components/SystemMonitoring/TasksMonitor.tsx \
            supabase/migrations/20260819024500_delegate_config_backend_operations.sql \
            tests/app/configBackendPermissions.test.ts
          git diff --cached --check
          git commit -m "fix: align config permissions with backend authorization"
          git push origin HEAD:fix/config-permissions-dashboard-20260819-v4

      - name: Record diagnostic failure without transformed source
        if: failure()
        env:
          TRANSFORM: ${{ steps.transform.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CONFIG_TEST: ${{ steps.config_test.outcome }}
          NAV_TEST: ${{ steps.nav_test.outcome }}
          DENO_CHECK: ${{ steps.deno_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DIFF: ${{ steps.diff.outcome }}
          COMMIT_STEP: ${{ steps.commit.outcome }}
        run: |
          git reset --hard HEAD
          git clean -fd
          cat > .tmp-config-permissions-status-v4.txt <<EOF
          result=FAILED
          run_id=${GITHUB_RUN_ID}
          transform=${TRANSFORM}
          install=${INSTALL}
          config_test=${CONFIG_TEST}
          nav_test=${NAV_TEST}
          deno_check=${DENO_CHECK}
          build=${BUILD}
          diff=${DIFF}
          commit=${COMMIT_STEP}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-config-permissions-status-v4.txt
          git commit -m "chore: record backend permission validation failure"
          git push origin HEAD:fix/config-permissions-dashboard-20260819-v4

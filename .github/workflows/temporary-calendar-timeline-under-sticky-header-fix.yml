name: Temporary calendar timeline under sticky header fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-calendar-timeline-under-sticky-header-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Place timeline between meetings and sticky summary header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Calendar/MultiDayView.tsx')
          text = path.read_text()
          old_global = 'style={{ top: `${top}px`, zIndex: 900 }}'
          old_today = 'style={{ top: `${top}px`, zIndex: 1000 }}'
          if text.count(old_global) != 1:
              raise SystemExit(f'expected one global timeline marker, found {text.count(old_global)}')
          if text.count(old_today) != 1:
              raise SystemExit(f'expected one today timeline marker, found {text.count(old_today)}')
          text = text.replace(old_global, 'style={{ top: `${top}px`, zIndex: 35 }}', 1)
          text = text.replace(old_today, 'style={{ top: `${top}px`, zIndex: 35 }}', 1)
          path.write_text(text)
          PY

      - name: Validate stacking contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -F 'style={{ top: `${top}px`, zIndex: 35 }}' src/components/Calendar/MultiDayView.tsx | wc -l)" -eq 2
          grep -Fq 'sticky top-0 z-40' src/components/Calendar/MultiDayView.tsx
          grep -Fq 'zIndex: (isBeingDragged || isBeingResized) ? 30 : blockZIndex' src/components/Calendar/CalendarViewShared.tsx
          ! grep -Fq 'zIndex: 900' src/components/Calendar/MultiDayView.tsx
          ! grep -Fq 'zIndex: 1000' src/components/Calendar/MultiDayView.tsx

      - name: Build validation
        run: |
          npm ci
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          git add src/components/Calendar/MultiDayView.tsx
          git commit -m 'fix(calendar): keep timeline below sticky summary rows'
          git push origin HEAD:main

name: Temporary app dependency sync validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-app-dependency-sync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Validate shell and dependency sync contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/application.sh
          grep -Fq 'Stage active application dependencies' deploy/spark-cli/lib/application.sh
          grep -Fq 'rsync -a --delete "${stage}/node_modules/" "${modules_next}/"' deploy/spark-cli/lib/application.sh
          grep -Fq 'mv "${SPARK_ROOT}/node_modules" "$modules_prev"' deploy/spark-cli/lib/application.sh
          grep -Fq 'mv "$modules_next" "${SPARK_ROOT}/node_modules"' deploy/spark-cli/lib/application.sh
          ! grep -Eq 'psql|supabase_migrations|spark_database_' deploy/spark-cli/lib/application.sh

      - name: Clean install and build
        shell: bash
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Confirm outdated state
        shell: bash
        run: npm outdated || true

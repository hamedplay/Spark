name: Temporary calendar default view fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-calendar-default-view.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch only default calendar view initialization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/CalendarPageCore.tsx')
          text = path.read_text()
          old = """  // Apply user's default calendar view preference (once)\n  const prefViewApplied = useRef(false);\n  useEffect(() => {\n    if (prefViewApplied.current) return;\n    if (!prefs.default_calendar_view) return;\n    prefViewApplied.current = true;\n    const map: Record<string, ViewMode> = { month: 'month', week: 'week', day: 'day', list: 'list-month' };\n    const mapped = map[prefs.default_calendar_view];\n    if (mapped) {\n      setViewMode(mapped);\n      localStorage.setItem('user_prefs_calendar_view', mapped);\n    }\n  }, [prefs.default_calendar_view]);\n"""
          new = """  // Apply user's default calendar view preference (once, after preferences finish loading)\n  const prefViewApplied = useRef(false);\n  useEffect(() => {\n    if (prefsLoading || prefViewApplied.current) return;\n    if (!prefs.default_calendar_view) return;\n    prefViewApplied.current = true;\n    const map: Record<string, ViewMode> = { month: 'month', week: 'week', day: 'day', list: 'list-month' };\n    const mapped = map[prefs.default_calendar_view];\n    if (mapped) {\n      setViewMode(mapped);\n      localStorage.setItem('user_prefs_calendar_view', mapped);\n    }\n  }, [prefsLoading, prefs.default_calendar_view]);\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run relevant user preferences lifecycle test
        run: npm run test:user-preferences-lifecycle

      - name: Build
        run: npm run build

      - name: Verify scoped diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/components/CalendarPageCore.tsx').read_text()
          assert "if (prefsLoading || prefViewApplied.current) return;" in text
          assert "}, [prefsLoading, prefs.default_calendar_view]);" in text
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "src/components/CalendarPageCore.tsx"
          git diff --check

      - name: Remove temporary workflow and commit validated fix
        shell: bash
        run: |
          git config user.name "spark-maintenance-bot"
          git config user.email "spark-maintenance-bot@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-calendar-default-view.yml
          git add src/components/CalendarPageCore.tsx
          git diff --cached --check
          git commit -m "fix: honor saved default calendar view after refresh"
          git push origin HEAD:main

name: Temporary Offline App Update Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-offline-app-update.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: node
          cache: npm

      - name: Validate syntax and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/application-maintenance.sh
          bash -n deploy/spark-cli/spark
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          grep -Fq 'SPARK_MANAGER_VERSION=' deploy/spark-cli/spark
          grep -Fq 'MANAGER_CONF=' deploy/spark-cli/spark
          grep -Fq 'app-build-offline-update) application_build_offline_update ;;' deploy/spark-cli/spark
          grep -Fq 'core.Action("app-build-offline-update", "Build Offline App Update"' deploy/spark-cli/spark-ui.py
          grep -Fq '"Build Offline App Update",' deploy/spark-cli/spark-ui.py

      - name: Build real standalone Offline App update
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/spark /var/backups/spark/application-updates
          sudo ln -s "$GITHUB_WORKSPACE" /opt/spark
          sudo -E bash "$GITHUB_WORKSPACE/deploy/spark-cli/spark" --backend-action app-build-offline-update

      - name: Validate produced artifact contract and consumer fetch
        shell: bash
        run: |
          set -euo pipefail
          archive="$(sudo find /var/backups/spark/application-updates -maxdepth 1 -type f -name 'spark-app-update-*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p /tmp/app-update
          sudo tar -xzf "$archive" -C /tmp/app-update
          sudo chown -R "$USER:$USER" /tmp/app-update
          root="$(find /tmp/app-update -mindepth 1 -maxdepth 1 -type d -name 'spark-app-update-*' -print -quit)"
          test -n "$root"
          test -f "$root/metadata/manifest.env"
          test -f "$root/sources/spark.git.bundle"
          test -f "$root/npm/frontend-node-modules.tar.gz"
          test -f "$root/SHA256SUMS"
          grep -Fxq 'FORMAT_VERSION=1' "$root/metadata/manifest.env"
          grep -Fxq 'TYPE=application-update' "$root/metadata/manifest.env"
          grep -Fq 'SOURCE_REF=refs/remotes/origin/main' "$root/metadata/manifest.env"
          (cd "$root" && sha256sum --quiet -c SHA256SUMS)
          git -C "$GITHUB_WORKSPACE" bundle verify "$root/sources/spark.git.bundle"

          tar -tzf "$root/npm/frontend-node-modules.tar.gz" >/tmp/frontend-node-modules.list
          grep -q '^node_modules/' /tmp/frontend-node-modules.list

          target_sha="$(sed -n 's/^SPARK_COMMIT=//p' "$root/metadata/manifest.env" | tail -n1)"
          rm -rf /tmp/app-consumer
          git clone -q "$GITHUB_WORKSPACE" /tmp/app-consumer
          git -C /tmp/app-consumer fetch "$root/sources/spark.git.bundle" refs/remotes/origin/main
          test "$(git -C /tmp/app-consumer rev-parse FETCH_HEAD)" = "$target_sha"

          ! find "$root" -mindepth 1 -maxdepth 1 -type d \( -name docker -o -name apt -o -name database -o -name manager \) | grep -q .
          ! find "$root" -type f -name '*.sql' | grep -q .

          echo "Artifact: $archive"
          du -h "$archive"

name: Temporary Management Scope Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-management-scope-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - run: npm run build

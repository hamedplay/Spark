name: Spark CLI M4.3 Bootstrap Finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m43-bootstrap-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap directories and install loops
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('deploy/spark-cli/bootstrap.sh'); s=p.read_text(); old='mkdir -p \"$tmp/lib\" \"$tmp/livekit\" \"$tmp/architecture\" \"$tmp/config/environments\" \"$tmp/roles/database/tasks\" \"$tmp/secrets\" \"$tmp/roles/database/package\" \"$tmp/adapters\" \"$tmp/roles/database/runtime\" \"$tmp/roles/database/lifecycle\" \"$tmp/roles/database/schema\"'; new=old+' \"$tmp/roles/application/tasks\" \"$tmp/roles/application/build\" \"$tmp/roles/application/deployment\"'; assert old in s; s=s.replace(old,new,1); olds='install -d -m 0755 \"$stage/lib\" \"$stage/livekit\" \"$stage/architecture\" \"$stage/config/environments\" \"$stage/roles/database/tasks\" \"$stage/secrets\" \"$stage/roles/database/package\" \"$stage/adapters\" \"$stage/roles/database/runtime\" \"$stage/roles/database/lifecycle\" \"$stage/roles/database/schema\"'; news=olds+' \"$stage/roles/application/tasks\" \"$stage/roles/application/build\" \"$stage/roles/application/deployment\"'; assert olds in s; s=s.replace(olds,news,1); root='for file in \"$tmp\"/roles/*.py; do install -m 0644 \"$file\" \"$stage/roles/$(basename \"$file\")\"; done\\n'; loops='for file in \"$tmp\"/roles/application/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/$(basename \"$file\")\"; done\\ninstall -m 0644 \"$tmp/roles/application/manifest.yaml\" \"$stage/roles/application/manifest.yaml\"\\nfor file in \"$tmp\"/roles/application/tasks/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/tasks/$(basename \"$file\")\"; done\\nfor file in \"$tmp\"/roles/application/build/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/build/$(basename \"$file\")\"; done\\nfor file in \"$tmp\"/roles/application/deployment/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/deployment/$(basename \"$file\")\"; done\\n'; assert root in s; s=s.replace(root,root+loops,1); p.write_text(s)"
      - name: Validate final bootstrap
        run: |
          bash -n deploy/spark-cli/bootstrap.sh
          grep -Fq '"$tmp/roles/application/build"' deploy/spark-cli/bootstrap.sh
          grep -Fq '"$stage/roles/application/build"' deploy/spark-cli/bootstrap.sh
          grep -Fq 'for file in "$tmp"/roles/application/build/*.py' deploy/spark-cli/bootstrap.sh
          grep -Fq 'for file in "$tmp"/roles/application/deployment/*.py' deploy/spark-cli/bootstrap.sh
          cd deploy/spark-cli
          python3 -m compileall -q roles/application adapters
          python3 -m unittest discover -s tests/application -p 'test_*.py' -v
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Commit bootstrap fix
        run: |
          git config user.name spark-ci
          git config user.email spark-ci@users.noreply.github.com
          git add deploy/spark-cli/bootstrap.sh
          git commit -m 'fix: install M4.3 nested application modules in bootstrap'
          git push origin HEAD:main

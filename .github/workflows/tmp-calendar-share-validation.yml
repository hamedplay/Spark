name: Temporary calendar share validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-calendar-share-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate calendar share parity
        run: |
          grep -q "MeetingShareDialog" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "navigator.clipboard.writeText" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "setShareImageUrl(dataUrl)" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "handleNativeShareImage" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "handleDownloadShareImage" src/components/Calendar/MeetingDetailModal.tsx

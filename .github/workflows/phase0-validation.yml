name: Temporary Phase 0 Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase0-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and TypeScript check
        run: npm run build

      - name: Repository tests
        run: npm test

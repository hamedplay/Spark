name: phase4-validation-temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-validation-temp.yml

jobs:
  baseline-regression-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 788143a6eb231c32aac3f7942f4a3383194b9e5b
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Run baseline npm-test scripts independently
        shell: bash
        run: |
          mapfile -t scripts < <(node -e "const p=require('./package.json'); for (const part of p.scripts.test.split('&&')) { const m=part.trim().match(/^npm run ([^ ]+)/); if (m) console.log(m[1]); }")
          echo "BASELINE_TOTAL=${#scripts[@]}"
          for script in "${scripts[@]}"; do
            if npm run "$script"; then
              echo "BASELINE_PASS=$script"
            else
              echo "BASELINE_FAIL=$script"
            fi
          done

  current-regression-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Run current npm-test scripts independently
        shell: bash
        run: |
          mapfile -t scripts < <(node -e "const p=require('./package.json'); for (const part of p.scripts.test.split('&&')) { const m=part.trim().match(/^npm run ([^ ]+)/); if (m) console.log(m[1]); }")
          echo "CURRENT_TOTAL=${#scripts[@]}"
          for script in "${scripts[@]}"; do
            if npm run "$script"; then
              echo "CURRENT_PASS=$script"
            else
              echo "CURRENT_FAIL=$script"
            fi
          done
      - name: Video conference phases 1-4
        run: node --test tests/video-conference/phase1FrontendFoundation.test.mjs tests/video-conference/phase2Rbac.test.mjs tests/video-conference/phase3LiveKitPermissions.test.mjs tests/video-conference/phase4SpeakerTimer.test.mjs
      - name: Spark Manager syntax
        run: bash -n deploy/spark-cli/lib/install-livekit.sh
      - name: Production build
        run: npm run build

name: Temporary calendar viewmode hydration fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-calendar-viewmode-hydration-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fix calendar view mode hydration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/CalendarPageCore.tsx')
          text = path.read_text()

          old_import = "import { PRIORITY_COLORS, SLOT_HEIGHT, HOURS_START, HOURS_END, DEFAULT_CALENDAR_COLOR, toJalaali, jalaaliToDate, jalaaliToYYYYMMDD, parseRequestDateToDateStr, timeToMinutes, minutesToTime, minutesToSlotIndex } from './Calendar/utils';"
          new_import = "import { PRIORITY_COLORS, SLOT_HEIGHT, HOURS_START, HOURS_END, DEFAULT_CALENDAR_COLOR, VIEW_OPTIONS, toJalaali, jalaaliToDate, jalaaliToYYYYMMDD, parseRequestDateToDateStr, timeToMinutes, minutesToTime, minutesToSlotIndex } from './Calendar/utils';"
          if old_import not in text:
              raise SystemExit('calendar utils import marker not found')
          text = text.replace(old_import, new_import, 1)

          old_type = "type ViewMode = CalendarViewMode;\n"
          new_type = """type ViewMode = CalendarViewMode;\n\nconst VALID_CALENDAR_VIEW_MODES = new Set<CalendarViewMode>(VIEW_OPTIONS.map(option => option.key));\n\nfunction readStoredCalendarView(): CalendarViewMode | null {\n  if (typeof window === 'undefined') return null;\n  const stored = window.localStorage.getItem('user_prefs_calendar_view');\n  return stored && VALID_CALENDAR_VIEW_MODES.has(stored as CalendarViewMode)\n    ? stored as CalendarViewMode\n    : null;\n}\n"""
          if old_type not in text:
              raise SystemExit('ViewMode marker not found')
          text = text.replace(old_type, new_type, 1)

          old_state = """  const [viewMode, setViewMode] = useState<ViewMode>(() => {\n    const p = localStorage.getItem('user_prefs_calendar_view') as ViewMode | null;\n    return p ?? 'week';\n  });\n"""
          new_state = """  const [viewMode, setViewMode] = useState<ViewMode>(() => readStoredCalendarView() ?? 'week');\n"""
          if old_state not in text:
              raise SystemExit('viewMode state marker not found')
          text = text.replace(old_state, new_state, 1)

          old_effect = """  // Apply user's default calendar view preference (once, after preferences finish loading)\n  const prefViewApplied = useRef(false);\n  useEffect(() => {\n    if (prefsLoading || prefViewApplied.current) return;\n    if (!prefs.default_calendar_view) return;\n    prefViewApplied.current = true;\n    const map: Record<string, ViewMode> = { month: 'month', week: 'week', day: 'day', list: 'list-month' };\n    const mapped = map[prefs.default_calendar_view];\n    if (mapped) {\n      setViewMode(mapped);\n      localStorage.setItem('user_prefs_calendar_view', mapped);\n    }\n  }, [prefsLoading, prefs.default_calendar_view]);\n"""
          new_effect = """  // Apply the DB default only when the user does not already have a valid explicit\n  // calendar view selection. This prevents late preference hydration from overwriting\n  // toolbar choices such as 3-day / 4-day / week.\n  const prefViewApplied = useRef(false);\n  useEffect(() => {\n    if (prefsLoading || prefViewApplied.current) return;\n    prefViewApplied.current = true;\n\n    const stored = readStoredCalendarView();\n    if (stored) {\n      if (stored !== viewMode) setViewMode(stored);\n      return;\n    }\n\n    const map: Partial<Record<string, ViewMode>> = {\n      month: 'month',\n      week: 'week',\n      day: 'day',\n      list: 'schedule',\n    };\n    const mapped = prefs.default_calendar_view ? map[prefs.default_calendar_view] : undefined;\n    if (mapped) {\n      setViewMode(mapped);\n      window.localStorage.setItem('user_prefs_calendar_view', mapped);\n    }\n  }, [prefsLoading, prefs.default_calendar_view, viewMode]);\n"""
          if old_effect not in text:
              raise SystemExit('preference hydration effect marker not found')
          text = text.replace(old_effect, new_effect, 1)

          path.write_text(text)
          PY

      - name: Validate view mode contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VALID_CALENDAR_VIEW_MODES' src/components/CalendarPageCore.tsx
          grep -Fq "list: 'schedule'" src/components/CalendarPageCore.tsx
          grep -Fq 'const stored = readStoredCalendarView();' src/components/CalendarPageCore.tsx
          ! grep -Fq "list: 'list-month'" src/components/CalendarPageCore.tsx
          grep -Fq "{ key: '3-day' as const" src/components/Calendar/utils.ts
          grep -Fq "{ key: '4-day' as const" src/components/Calendar/utils.ts
          grep -Fq "{ key: 'week' as const" src/components/Calendar/utils.ts

      - name: Build validation
        run: |
          npm ci
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          git add src/components/CalendarPageCore.tsx
          git commit -m 'fix(calendar): preserve multi-day view selection after hydration'
          git push origin HEAD:main

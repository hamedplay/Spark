name: Temporary minutes obstacle validation

on:
  push:
    branches: [main]
    paths:
      - '.tmp-minutes-obstacle-validation-trigger'

permissions:
  contents: write

concurrency:
  group: tmp-minutes-obstacle-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Build and focused minutes test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync latest main and verify scoped source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          actual="$(git rev-parse HEAD:src/components/Minutes/DecisionsFollowupPage.tsx)"
          test "$actual" = "679031435083bb70788fbf31cee7da377af1f7fc"
          grep -Fq "onAction('obstacle_resolved')" src/components/Minutes/DecisionsFollowupPage.tsx
          grep -Fq 'obstacleUpdateId={obstacleUpdateId}' src/components/Minutes/DecisionsFollowupPage.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Focused minutes follow-up test
        run: npm run test:minutes-followup-runtime

      - name: Record successful validation
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.tmp-minutes-obstacle-build-ok';
            const { owner, repo } = context.repo;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(existing.data) && 'sha' in existing.data) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              sha,
              message: 'chore: record minutes obstacle validation success [skip ci]',
              content: Buffer.from(`source=679031435083bb70788fbf31cee7da377af1f7fc\nrun=${context.runId}\n`, 'utf8').toString('base64'),
            });

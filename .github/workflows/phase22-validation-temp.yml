name: phase22-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Video conference tests
        run: node --test tests/video-conference/phase*.test.mjs

      - name: Shell syntax
        run: bash -n deploy/spark-cli/lib/install-livekit.sh

      - name: Dashboard JSON
        run: |
          python -m json.tool deploy/livekit/monitoring/grafana/dashboards/spark-livekit-overview.json >/dev/null
          python -m json.tool deploy/livekit/monitoring/grafana/dashboards/spark-livekit-operations.json >/dev/null
          python -m json.tool deploy/livekit/monitoring/targets/blackbox.json >/dev/null

      - name: Docker Compose config
        run: |
          docker compose \
            -f deploy/livekit/docker-compose.yml \
            -f deploy/livekit/docker-compose.spark-cli.yml \
            --env-file deploy/livekit/.env.example \
            --profile observability \
            config --quiet

      - name: Prometheus config
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy/livekit/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/livekit/monitoring/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/deploy/livekit/monitoring/targets:/etc/prometheus/targets:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Alertmanager config
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/deploy/livekit/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.34.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Alloy config
        run: |
          docker run --rm \
            -v "$PWD/deploy/livekit/monitoring/alloy.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.19.0 \
            validate /etc/alloy/config.alloy

      - name: Loki config
        run: |
          docker run --rm \
            -v "$PWD/deploy/livekit/monitoring/loki.yml:/etc/loki/loki.yml:ro" \
            grafana/loki:3.7.0 \
            -config.file=/etc/loki/loki.yml \
            -verify-config=true

      - name: Build
        run: npm run build

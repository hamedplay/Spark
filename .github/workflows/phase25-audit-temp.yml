name: phase25-audit-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit breakout references outside migrations
        shell: bash
        run: |
          set -euo pipefail
          echo "=== breakout references outside migrations ==="
          git grep -n -i -E 'BreakoutPanel|conference_breakout|create_conference_breakouts|assign_conference_breakout|clear_conference_breakout_assignment|end_conference_breakouts' --             ':!supabase/migrations/**'             ':!.github/workflows/phase25-audit-temp.yml' || true

      - name: Audit LiveKit compatibility entrypoints
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LiveKitConferenceRoom references ==="
          git grep -n 'LiveKitConferenceRoom' -- ':!.github/workflows/phase25-audit-temp.yml' || true
          echo "=== LiveKitConferenceTools references ==="
          git grep -n 'LiveKitConferenceTools' -- ':!.github/workflows/phase25-audit-temp.yml' || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Video conference tests
        run: npm run test:video-conference

      - name: Build
        run: npm run build

name: Temporary calendar current-time layering fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-calendar-current-time-layer.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply scoped patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/Calendar/MultiDayView.tsx')
          text = path.read_text()
          start = text.index('function renderCurrentTime(')
          end = text.index('function renderCurrentTimeRailLabel(', start)
          block = text[start:end]
          old = 'className="pointer-events-none absolute left-0 right-0 z-20"'
          new = 'className="pointer-events-none absolute left-0 right-0 z-40"'
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly one current-time z-20 marker, found {block.count(old)}')
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-calendar-current-time-layer.yml
          git add src/components/Calendar/MultiDayView.tsx
          git commit -m 'fix(calendar): keep current-time line above meetings'
          git push origin HEAD:main

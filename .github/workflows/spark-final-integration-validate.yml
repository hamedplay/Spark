name: Spark Final Integration Validation
on:
  push:
    branches: [main]
    paths:
      - 'deploy/spark-cli/**'
      - '.github/workflows/spark-final-integration-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        working-directory: deploy/spark-cli
        run: python3 -m compileall -q config roles architecture adapters core secrets
      - name: Bootstrap syntax
        working-directory: deploy/spark-cli
        run: bash -n bootstrap.sh bootstrap-base.sh
      - name: Bootstrap integration contract
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('bootstrap.sh').read_text()
          required = {
              'deploy/spark-cli/core/',
              'deploy/spark-cli/config/',
              'deploy/spark-cli/architecture/',
              'deploy/spark-cli/adapters/',
              'deploy/spark-cli/secrets/',
              'deploy/spark-cli/roles/',
              'roles/environment/orchestrator.py',
              'roles/reverse_proxy/workflow.py',
              'roles/application/edge/runtime.py',
              'roles/application/livekit/runtime.py',
              'roles/application/coturn/runtime.py',
          }
          missing = sorted(value for value in required if value not in text)
          assert not missing, f'bootstrap integration contract missing: {missing}'
          print('bootstrap integration contract OK')
          PY
      - name: Provisioning UI self-test
        working-directory: deploy/spark-cli
        run: python3 spark-ui.py --self-test
      - name: Architecture backend contract
        working-directory: deploy/spark-cli
        env:
          SPARK_ENV_PROFILE: config/environments/example.production.yaml
        run: python3 spark-architecture --backend-action architecture-profile
      - name: Production profile load
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          from config.loader import load_environment
          e=load_environment('config/environments/example.production.yaml')
          assert e.application.edge.image == 'supabase/edge-runtime:v1.76.2'
          assert not e.application.livekit.embedded_turn
          assert e.reverse_proxy.tls.mode == 'provided'
          assert len(e.full_environment.network_rules) >= 8
          print('profile contract OK')
          PY
      - name: Application tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/application -p 'test_*.py' -v
      - name: Database regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Architecture regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -p 'test_*.py' -v
      - name: Secrets regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/secrets -p 'test_*.py' -v
      - name: Workflow core regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v

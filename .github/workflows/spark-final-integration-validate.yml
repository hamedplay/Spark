name: Spark Final Integration Validation
on:
  push:
    branches: [main]
    paths:
      - 'deploy/spark-cli/config/**'
      - 'deploy/spark-cli/roles/application/**'
      - 'deploy/spark-cli/roles/reverse_proxy/**'
      - 'deploy/spark-cli/roles/environment/**'
      - 'deploy/spark-cli/architecture/**'
      - '.github/workflows/spark-final-integration-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        working-directory: deploy/spark-cli
        run: python3 -m compileall -q config roles architecture adapters core secrets
      - name: Production profile load
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          from config.loader import load_environment
          e=load_environment('config/environments/example.production.yaml')
          assert e.application.edge.image == 'supabase/edge-runtime:v1.76.2'
          assert not e.application.livekit.embedded_turn
          assert e.reverse_proxy.tls.mode == 'provided'
          assert len(e.full_environment.network_rules) >= 8
          print('profile contract OK')
          PY
      - name: Application tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/application -p 'test_*.py' -v
      - name: Database regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Architecture regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -p 'test_*.py' -v
      - name: Secrets regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/secrets -p 'test_*.py' -v
      - name: Workflow core regression
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v

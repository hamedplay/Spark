name: Temporary calendar share card style validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-calendar-share-card-style.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate share card visual parity
        run: |
          grep -q "Spark Meeting Manager" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "linear-gradient(90deg, #8b5cf6" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "سیستم مدیریت جلسات اسپارک" src/components/Calendar/MeetingDetailModal.tsx
          ! grep -q "backgroundColor: getMeetingColor(m)" src/components/Calendar/MeetingDetailModal.tsx

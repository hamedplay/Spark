name: Split auth reference CSS

on:
  push:
    branches: [main]
    paths:
      - scripts/split-auth-reference-css.mjs
      - .github/workflows/split-auth-reference-css.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Split CSS
        run: node scripts/split-auth-reference-css.mjs

      - name: Build
        run: npm run build

      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth-reference-login.css src/auth-reference-login-hero.css src/main.tsx
          if git diff --cached --quiet; then
            echo "No CSS split changes"
            exit 1
          fi
          git commit -m "refactor: split oversized auth reference stylesheet"
          git push origin HEAD:main

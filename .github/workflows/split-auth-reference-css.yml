name: Split auth reference CSS

on:
  push:
    branches: [main]
    paths:
      - scripts/split-auth-reference-css.mjs
      - .github/workflows/split-auth-reference-css.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci > /tmp/install.log 2>&1

      - name: Split CSS
        id: split
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/split-auth-reference-css.mjs > /tmp/split.log 2>&1

      - name: Build
        id: build
        if: steps.split.outcome == 'success'
        continue-on-error: true
        run: npm run build > /tmp/build.log 2>&1

      - name: Commit split
        if: steps.install.outcome == 'success' && steps.split.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/.auth-css-split-status.txt
          git add src/auth-reference-login.css src/auth-reference-login-hero.css src/main.tsx scripts/.auth-css-split-status.txt
          if git diff --cached --quiet; then
            echo "No CSS split changes"
            exit 1
          fi
          git commit -m "refactor: split oversized auth reference stylesheet"
          git push origin HEAD:main

      - name: Record failure
        if: steps.install.outcome != 'success' || steps.split.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          INSTALL_OUTCOME='${{ steps.install.outcome }}'
          SPLIT_OUTCOME='${{ steps.split.outcome }}'
          BUILD_OUTCOME='${{ steps.build.outcome }}'
          git reset --hard HEAD
          {
            echo "install=$INSTALL_OUTCOME"
            echo "split=$SPLIT_OUTCOME"
            echo "build=$BUILD_OUTCOME"
            echo "--- install log ---"
            tail -n 120 /tmp/install.log 2>/dev/null || true
            echo "--- split log ---"
            tail -n 120 /tmp/split.log 2>/dev/null || true
            echo "--- build log ---"
            tail -n 120 /tmp/build.log 2>/dev/null || true
          } > scripts/.auth-css-split-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.auth-css-split-status.txt
          git commit -m "chore: record auth css split failure"
          git push origin HEAD:main
          exit 1

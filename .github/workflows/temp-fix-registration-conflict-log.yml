name: Temporary registration conflict log fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-registration-conflict-log.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply minimal source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/request-public-registration-otp/index.ts')
          text = path.read_text()
          old = '''    const dispatchLogId = await createRegistrationDispatchLog(supabase, {
      phoneDigits,
      providerId: provider.id,
      providerName: provider.title ?? "",
    });
    if (!dispatchLogId) return await json({ error: "ثبت‌نام در حال حاضر فعال نیست" }, 503);

    const hasConflict = conflicts.username || conflicts.email || conflicts.phone;
    if (hasConflict) {
      await updateRegistrationDispatchLog(supabase, dispatchLogId, {
        status: "skipped",
        error_text: "REGISTRATION_IDENTIFIER_CONFLICT",
      });

      return await json({
        ok: false,
        error: registrationConflictMessage(conflicts),
        code: "REGISTRATION_IDENTIFIER_CONFLICT",
        conflicts,
      }, 409);
    }
'''
          new = '''    const hasConflict = conflicts.username || conflicts.email || conflicts.phone;
    if (hasConflict) {
      return await json({
        ok: false,
        error: registrationConflictMessage(conflicts),
        code: "REGISTRATION_IDENTIFIER_CONFLICT",
        conflicts,
      }, 409);
    }

    const dispatchLogId = await createRegistrationDispatchLog(supabase, {
      phoneDigits,
      providerId: provider.id,
      providerName: provider.title ?? "",
    });
    if (!dispatchLogId) return await json({ error: "ثبت‌نام در حال حاضر فعال نیست" }, 503);
'''
          if old not in text:
              raise SystemExit('expected source block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify conflict cannot create SMS dispatch log
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('supabase/functions/request-public-registration-otp/index.ts').read_text()
          conflict = text.index('const hasConflict = conflicts.username || conflicts.email || conflicts.phone;')
          conflict_return = text.index('code: "REGISTRATION_IDENTIFIER_CONFLICT"', conflict)
          log_create = text.index('const dispatchLogId = await createRegistrationDispatchLog', conflict)
          assert conflict < conflict_return < log_create, 'dispatch log must only be created after conflict return path'
          conflict_block = text[conflict:log_create]
          assert 'updateRegistrationDispatchLog' not in conflict_block, 'conflict path must not mutate SMS dispatch logs'
          print('registration conflict logging regression check passed')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Phase 4 registration tests
        run: npm run test:phase4-lifecycle
      - name: Build
        run: npm run build
      - name: Commit fix to main
        run: |
          if git diff --quiet -- supabase/functions/request-public-registration-otp/index.ts; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/request-public-registration-otp/index.ts
          git commit -m 'fix(auth): avoid SMS log for registration identifier conflicts'
          git push origin HEAD:main

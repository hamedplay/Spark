name: standalone-conference-session-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify standalone conference architecture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const routes = fs.readFileSync('src/app/navigation/rootPath.ts', 'utf8');
          const lobby = fs.readFileSync('src/components/VideoConference/Page/VideoConferenceLobby.tsx', 'utf8');
          const standalone = fs.readFileSync('src/components/VideoConference/StandaloneConferencePage.tsx', 'utf8');
          if (!routes.includes("'/conference/'") || !app.includes('StandaloneConferenceRoot')) throw new Error('standalone root route missing');
          if (!lobby.includes('window.open') || !lobby.includes('/conference/')) throw new Error('lobby does not launch standalone room');
          if (!standalone.includes('sessionStorage') || !standalone.includes('sessionIdRef')) throw new Error('per-window session marker missing');
          if (!standalone.includes("table: 'conference_rooms'") || !standalone.includes("status === 'ended'")) throw new Error('room lifecycle realtime close missing');
          if (!standalone.includes('window.close()')) throw new Error('standalone session close missing');
          if (!standalone.includes('join_conference_room')) throw new Error('standalone join flow missing');
          console.log('standalone conference architecture verified');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit

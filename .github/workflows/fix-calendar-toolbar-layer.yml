name: Temporary Calendar Toolbar Layer Fix

on:
  push:
    paths:
      - '.github/workflows/fix-calendar-toolbar-layer.yml'

permissions:
  contents: write

concurrency:
  group: temporary-calendar-toolbar-layer-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply minimal stacking fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/Calendar/CalendarToolbar.tsx')
          text = path.read_text(encoding='utf-8')
          old = "${compactMobile && showMobileSidebar ? 'z-20' : 'z-[80]'}"
          new = "${compactMobile && showMobileSidebar ? 'z-20' : 'z-40'}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one toolbar z-index target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-calendar-toolbar-layer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Calendar/CalendarToolbar.tsx .github/workflows/fix-calendar-toolbar-layer.yml
          git diff --cached --check
          git commit -m "fix: keep calendar toolbar below modals [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

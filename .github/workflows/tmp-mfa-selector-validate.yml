name: Temporary MFA selector validation

"on":
  push:
    branches:
      - main
    paths:
      - scripts/tmp-wire-mfa-selector.mjs

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused profile wiring
        run: node scripts/tmp-wire-mfa-selector.mjs

      - name: Validate repair script syntax
        run: bash -n deploy/spark-cli/apply-custom-mfa-repair.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProfilePage.tsx
          if git diff --cached --quiet; then
            echo "No profile change to commit."
            exit 0
          fi
          git commit -m "feat: expose MFA method choice in profile"
          git push origin HEAD:main

name: Temporary Chat Actions Fix

on:
  push:
    branches: [main]
    paths:
      - '.tmp-chat-actions-trigger'

permissions:
  contents: write

concurrency:
  group: tmp-chat-actions-fix
  cancel-in-progress: false

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify scoped source baseline
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:src/components/Chat/ChatActionsPanel.tsx)"
          test "$actual" = "921cc0dbf9e3b7977d2ad7022786f5de6666154f"

      - name: Apply minimal fix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/components/Chat/ChatActionsPanel.tsx';
          const before = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star } from 'lucide-react';";
          const after = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star, Check } from 'lucide-react';";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before)) throw new Error('Expected lucide import baseline not found');
          const checkUsages = (source.match(/<Check\b/g) || []).length;
          if (checkUsages < 1) throw new Error('No local Check JSX usage found');
          const updated = source.replace(before, after);
          if (updated === source) throw new Error('No source change produced');
          fs.writeFileSync(path, updated);
          NODE
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/components/Chat/ChatActionsPanel.tsx"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Chat/ChatActionsPanel.tsx
          git commit -m "fix(chat): import Check in actions panel [skip ci]"
          git push origin HEAD:main

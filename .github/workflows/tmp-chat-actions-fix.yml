name: Temporary Chat Actions Fix

on:
  push:
    branches: [main]
    paths:
      - '.tmp-chat-actions-trigger'

permissions:
  contents: write

concurrency:
  group: tmp-chat-actions-fix
  cancel-in-progress: true

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync latest main and verify scoped baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          actual="$(git rev-parse HEAD:src/components/Chat/ChatActionsPanel.tsx)"
          test "$actual" = "921cc0dbf9e3b7977d2ad7022786f5de6666154f"

      - name: Apply minimal fix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/components/Chat/ChatActionsPanel.tsx';
          const before = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star } from 'lucide-react';";
          const after = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star, Check } from 'lucide-react';";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before)) throw new Error('Expected lucide import baseline not found');
          const checkUsages = (source.match(/<Check\b/g) || []).length;
          if (checkUsages < 1) throw new Error('No local Check JSX usage found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/components/Chat/ChatActionsPanel.tsx"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write validated minimal fix to current main
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = 'src/components/Chat/ChatActionsPanel.tsx';
            const before = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star } from 'lucide-react';";
            const after = "import { Search, SlidersHorizontal, X, ChevronDown, Clock, Star, Check } from 'lucide-react';";
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            if (Array.isArray(response.data) || !('content' in response.data)) core.setFailed('Expected a file response');
            const current = Buffer.from(response.data.content, 'base64').toString('utf8');
            if (current.includes(after)) {
              core.info('Fix already present on main');
              return;
            }
            if (!current.includes(before)) core.setFailed('Current main no longer matches scoped import baseline');
            const updated = current.replace(before, after);
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              sha: response.data.sha,
              message: 'fix(chat): import Check in actions panel [skip ci]',
              content: Buffer.from(updated, 'utf8').toString('base64'),
            });

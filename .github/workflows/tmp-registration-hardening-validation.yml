name: Temporary registration hardening validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registration repair shell
        run: |
          bash -n deploy/spark-cli/apply-registration-repair.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
      - name: Validate hardened lifecycle contract
        run: |
          grep -Fq 'HARDEN_SQL=' deploy/spark-cli/apply-registration-repair.sh
          grep -Fq "NOT has_function_privilege('authenticated', 'public.admin_set_user_lifecycle_service" deploy/spark-cli/apply-registration-repair.sh
          grep -Fq 'REVOKE ALL ON FUNCTION public.admin_set_user_lifecycle_service' supabase/migrations/20260914190000_harden_registration_lifecycle_rpc.sql
          grep -Fq 'TO service_role' supabase/migrations/20260914190000_harden_registration_lifecycle_rpc.sql

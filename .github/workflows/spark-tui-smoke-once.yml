name: One-time Spark TUI smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-tui-smoke-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax validation
        shell: bash
        run: |
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/bootstrap.sh
          for f in deploy/spark-cli/lib/*.sh; do bash -n "$f"; done

      - name: Install manager with pinned TUI
        shell: bash
        run: |
          sudo bash deploy/spark-cli/bootstrap.sh
          test "$(spark --version)" = "Spark Server Manager 1.3.0"
          test -s /usr/local/share/spark-manager/terminal-menus.sh
          test "$(cat /usr/local/share/spark-manager/terminal-menus.ref)" = "52d8e84ce008531f25dfe8339ac9474e1d6feb49"

      - name: Fullscreen PTY startup and keyboard smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pty, select, signal, time

          pid, fd = pty.fork()
          if pid == 0:
              os.execvp('sudo', ['sudo', 'env', 'TERM=xterm-256color', 'spark'])

          output = bytearray()
          deadline = time.time() + 8
          sent_q = False
          status = None

          while time.time() < deadline:
              ready, _, _ = select.select([fd], [], [], 0.2)
              if ready:
                  try:
                      chunk = os.read(fd, 65536)
                  except OSError:
                      chunk = b''
                  if chunk:
                      output.extend(chunk)
              if not sent_q and time.time() + 5 > deadline:
                  os.write(fd, b'q')
                  sent_q = True
              done, status = os.waitpid(pid, os.WNOHANG)
              if done == pid:
                  break
          else:
              os.kill(pid, signal.SIGTERM)
              raise SystemExit('spark TUI did not exit after q')

          text = output.decode('utf-8', 'replace')
          if 'SPARK' not in text:
              raise SystemExit('SPARK branding was not rendered in PTY output')
          if status is None or os.waitstatus_to_exitcode(status) != 0:
              raise SystemExit(f'spark TUI exit status was not zero: {status}')
          print('PTY_SMOKE_OK=1')
          PY

      - name: Record success
        shell: bash
        run: |
          printf 'version=1.3.0\nvendor=52d8e84ce008531f25dfe8339ac9474e1d6feb49\npty=ok\n' > .spark-tui-smoke-ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .spark-tui-smoke-ok
          git commit -m 'chore: record Spark TUI smoke success'
          git push

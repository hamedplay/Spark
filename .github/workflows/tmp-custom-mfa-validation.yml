name: Temporary custom MFA validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Validate deployment scripts
        run: |
          bash -n deploy/spark-cli/apply-custom-mfa-repair.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Validate focused custom MFA contract
        run: |
          grep -Fq 'MFA پیامکی (سفارشی)' src/features/security-settings/components/SecuritySettingsConsole.tsx
          grep -Fq 'custom_mfa_allowed_factors: v ? [' src/features/security-settings/components/SecuritySettingsConsole.tsx
          ! grep -Fq 'label="الزام MFA سفارشی"' src/features/security-settings/components/SecuritySettingsConsole.tsx
          ! grep -Fq 'label="عمر مجوز (دقیقه)"' src/features/security-settings/components/SecuritySettingsConsole.tsx
          ! grep -Fq "['bale', 'بله']" src/features/security-settings/components/SecuritySettingsConsole.tsx
          grep -Fq 'CUSTOM_MFA_REQUIRED_UNSUPPORTED' src/features/security-settings/utils/validateSecuritySettings.ts
          grep -Fq 'CUSTOM_MFA_FACTOR_UNSUPPORTED' src/features/security-settings/types/securitySettings.ts
          grep -Fq 'mode === "enroll_bale"' supabase/functions/custom-mfa/index.ts
          grep -Fq 'FACTOR_UNSUPPORTED' supabase/functions/custom-mfa/index.ts
          grep -Fq 'edgePepperReady' supabase/functions/custom-mfa/index.ts
          grep -Fq 'supported_factors' supabase/migrations/20260914180500_align_custom_sms_mfa_contract.sql
          ! grep -Fq 'app.mfa_pepper' deploy/spark-cli/db-repairs/20260914180500_align_custom_sms_mfa_contract.sql
          grep -Fq 'apply-custom-mfa-repair.sh' deploy/spark-cli/apply-daily-report-scheduler.sh

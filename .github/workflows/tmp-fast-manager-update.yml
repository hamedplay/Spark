name: Temporary fast Manager update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fast-manager-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fast Manager update implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('deploy/spark-cli')

          # 1) Fast online bootstrap: one archive download, no revision pinning,
          # no second integration sync, no checksum work.
          bootstrap = r'''#!/usr/bin/env bash
          set -Eeuo pipefail
          IFS=$'\n\t'

          TARGET="/usr/local/lib/spark-manager"
          MIGRATE_TARGET="/usr/local/lib/spark-migrate"
          BIN_DIR="/usr/local/bin"
          INBOX="/var/tmp/spark-manager-inbox"
          ARCHIVE_URL="https://codeload.github.com/hamedplay/Spark/tar.gz/refs/heads/main"

          if [[ ${EUID:-$(id -u)} -ne 0 ]]; then
            echo 'Run this installer as root (example: curl -fsSL .../bootstrap.sh | sudo bash).' >&2
            exit 1
          fi

          for cmd in curl tar find install ln mv rm mktemp cp bash python3; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "Required command missing: $cmd" >&2; exit 1; }
          done

          tmp="$(mktemp -d)"
          stage=""
          trap 'rm -rf "$tmp" "${stage:-}"' EXIT

          echo 'Downloading latest Spark Manager...'
          curl -fsSL --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 300 \
            "$ARCHIVE_URL" -o "$tmp/spark-main.tar.gz"
          tar -xzf "$tmp/spark-main.tar.gz" -C "$tmp"
          source_dir="$(find "$tmp" -type d -path '*/deploy/spark-cli' -print -quit)"
          [[ -n "$source_dir" && -f "$source_dir/spark" && -f "$source_dir/spark-ui.py" && -d "$source_dir/lib" ]] || {
            echo 'Downloaded Spark Manager payload is incomplete.' >&2
            exit 1
          }

          # Fast local syntax checks only; no revision/version/checksum matching.
          bash -n "$source_dir/spark"
          [[ ! -f "$source_dir/spark-airgap" ]] || bash -n "$source_dir/spark-airgap"
          [[ ! -f "$source_dir/spark-architecture" ]] || bash -n "$source_dir/spark-architecture"
          [[ ! -f "$source_dir/spark-database" ]] || bash -n "$source_dir/spark-database"
          [[ ! -f "$source_dir/spark-migrate" ]] || bash -n "$source_dir/spark-migrate"
          for file in "$source_dir"/lib/*.sh; do bash -n "$file"; done
          python3 - "$source_dir/spark-ui.py" "$source_dir/spark-ui-core.py" <<'PYCODE'
          from pathlib import Path
          import sys
          for value in sys.argv[1:]:
              path = Path(value)
              if path.is_file():
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PYCODE

          install -d -m 0755 /usr/local/lib "$BIN_DIR"
          stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"
          cp -a "$source_dir/." "$stage/"
          chmod 0755 "$stage/spark"
          for file in spark-airgap spark-architecture spark-database spark-migrate spark-manager-airgap-bootstrap; do
            [[ ! -f "$stage/$file" ]] || chmod 0755 "$stage/$file"
          done
          for file in "$stage/lib/spark-manager-airgap" "$stage/lib/build-manager-airgap"; do
            [[ ! -f "$file" ]] || chmod 0755 "$file"
          done

          backup="${TARGET}.previous.$$"
          [[ ! -e "$TARGET" ]] || mv "$TARGET" "$backup"
          if ! mv "$stage" "$TARGET"; then
            [[ ! -e "$backup" ]] || mv "$backup" "$TARGET"
            exit 1
          fi
          stage=""

          ln -sfn "$TARGET/spark" "$BIN_DIR/spark"
          [[ ! -f "$TARGET/spark-airgap" ]] || ln -sfn "$TARGET/spark-airgap" "$BIN_DIR/spark-airgap"
          [[ ! -f "$TARGET/spark-architecture" ]] || ln -sfn "$TARGET/spark-architecture" "$BIN_DIR/spark-architecture"
          [[ ! -f "$TARGET/spark-database" ]] || ln -sfn "$TARGET/spark-database" "$BIN_DIR/spark-database"
          [[ ! -f "$TARGET/lib/spark-manager-airgap" ]] || ln -sfn "$TARGET/lib/spark-manager-airgap" "$BIN_DIR/spark-manager-airgap"
          [[ ! -f "$TARGET/lib/build-manager-airgap" ]] || ln -sfn "$TARGET/lib/build-manager-airgap" "$BIN_DIR/build-manager-airgap"

          if [[ -f "$TARGET/spark-migrate" ]]; then
            install -d -m 0755 "$MIGRATE_TARGET"
            install -m 0755 "$TARGET/spark-migrate" "$MIGRATE_TARGET/spark-migrate"
            ln -sfn "$MIGRATE_TARGET/spark-migrate" "$BIN_DIR/spark-migrate"
          fi
          if [[ -f "$TARGET/spark-manager-airgap-bootstrap" ]]; then
            install -m 0755 "$TARGET/spark-manager-airgap-bootstrap" /usr/local/sbin/spark-manager-airgap-bootstrap
            install -d -m 1777 "$INBOX"
          fi

          rm -rf "$backup"
          echo 'Spark Manager installed/updated successfully.'
          echo 'Run: spark'
          '''
          # Dedent shell payload written inside Python source.
          import textwrap
          (root / 'bootstrap.sh').write_text(textwrap.dedent(bootstrap), encoding='utf-8')

          # 2) Make Manager self-update call the fast bootstrap directly from main.
          spark_path = root / 'spark'
          spark = spark_path.read_text(encoding='utf-8')
          replacement = r'''self_update() {
            title
            new_log "manager-self-update"
            local tmp
            tmp="$(mktemp)"
            if ! run_logged "Download latest Spark Manager installer" \
              curl -fsSL --retry 3 --retry-delay 1 \
                "https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh" \
                -o "$tmp"; then
              rm -f "$tmp"
              return 1
            fi
            if ! bash -n "$tmp" >>"$CURRENT_LOG" 2>&1; then
              fail "Downloaded Manager installer has invalid syntax."
              rm -f "$tmp"
              return 1
            fi
            if ! run_visible "Install latest Spark Manager" bash "$tmp"; then
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
            ok "Spark Manager updated. Exit and run spark again to load the new version."
          }

          spark_backend_prepare() {'''
          spark, count = re.subn(r'self_update\(\) \{.*?\n\}\n\nspark_backend_prepare\(\) \{', replacement, spark, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Unable to patch Spark Manager self_update()')
          spark_path.write_text(spark, encoding='utf-8')

          # 3) Manager offline bundle build: remove all checksum/CRC/revision-match work.
          p = root / 'lib/airgap-full-source.sh'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n\s*bad = zf\.testzip\(\)\n\s*if bad:\n\s*raise SystemExit\(f"Corrupt ZIP member: \{bad\}"\)\n', '\n', s)
          s = re.sub(r'\n\s*\(cd "\$root" && find \. -type f ! -name SHA256SUMS -print0 \| sort -z \| xargs -0 sha256sum >SHA256SUMS\)\n\s*\(cd "\$root" && sha256sum -c SHA256SUMS >/dev/null\)\n', '\n', s)
          s = s.replace('  SPARK_MANAGER_REVISION="$revision" SPARK_ENV_PROFILE="$root/manager/config/environments/example.production.yaml" \\\n    PYTHONPATH="$root/manager" python3 "$root/manager/spark-architecture" revision | grep -Fq "Revision: $revision"\n', '')
          s = s.replace('  SPARK_MANAGER_REVISION="$revision" "$root/manager/lib/spark-manager-airgap" --help >/dev/null\n', '  "$root/manager/lib/spark-manager-airgap" --help >/dev/null\n')
          s = s.replace('  gzip -t "$partial"\n', '')
          s = re.sub(r'\n\s*sha256sum "\$archive" >"\$\{archive\}\.sha256"\n', '\n', s)
          p.write_text(s, encoding='utf-8')

          # 4) Legacy Manager offline helper also loses checksum generation/verification.
          p = root / 'lib/airgap-manager.sh'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n\s*\(cd "\$root" && find \. -type f ! -name SHA256SUMS -print0 \| sort -z \| xargs -0 sha256sum >SHA256SUMS\)\n\s*\(cd "\$root" && sha256sum -c SHA256SUMS >/dev/null\)\n', '\n', s)
          s = s.replace('  SPARK_MANAGER_REVISION="$revision" SPARK_ENV_PROFILE="$root/manager/config/environments/example.production.yaml" \\\n    PYTHONPATH="$root/manager" python3 "$root/manager/spark-architecture" revision | grep -Fq "Revision: $revision"\n', '')
          s = s.replace('  SPARK_MANAGER_REVISION="$revision" "$root/manager/lib/spark-manager-airgap" --help >/dev/null\n', '  "$root/manager/lib/spark-manager-airgap" --help >/dev/null\n')
          s = s.replace('  gzip -t "$partial"\n', '')
          s = re.sub(r'\n\s*sha256sum "\$archive" >"\$\{archive\}\.sha256"\n', '\n', s)
          s = re.sub(r'\n\s*\(cd "\$root" && sha256sum -c SHA256SUMS >/dev/null\) \|\| \{ fail \'Manager bundle checksum verification failed\.\'; return 1; \}\n', '\n', s)
          s = s.replace('  spark_manager_airgap_verify_revisions "$profile" "$revision"\n', '')
          p.write_text(s, encoding='utf-8')

          # 5) Restricted offline bootstrap: keep archive-path safety, remove checksum pass.
          p = root / 'spark-manager-airgap-bootstrap'
          s = p.read_text(encoding='utf-8')
          s = s.replace('for cmd in tar find sha256sum; do', 'for cmd in tar find; do')
          s = s.replace('(cd "$root" && sha256sum -c SHA256SUMS >/dev/null)\n', '')
          p.write_text(s, encoding='utf-8')

          # 6) Full-source offline installer: no SHA256SUMS requirement/check and no revision parity gate.
          p = root / 'bootstrap-full-source-airgap.sh'
          s = p.read_text(encoding='utf-8')
          s = s.replace('[[ -f "$ROOT/SHA256SUMS" && -f "$ROOT/metadata/manifest.json" && -d "$ROOT/manager" && -f "$SOURCE_ZIP" ]] || {', '[[ -f "$ROOT/metadata/manifest.json" && -d "$ROOT/manager" && -f "$SOURCE_ZIP" ]] || {')
          s = s.replace('for cmd in sha256sum python3 install ln mv rm mktemp cp mkdir; do', 'for cmd in python3 install ln mv rm mktemp cp mkdir; do')
          s = s.replace('(cd "$ROOT" && sha256sum -c SHA256SUMS)\n\n', '')
          s = s.replace('[[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo \'Invalid Spark revision in bundle.\' >&2; exit 1; }\n', '')
          s = re.sub(r'\n\s*bad = zf\.testzip\(\)\n\s*if bad:\n\s*raise SystemExit\(f\'Corrupt Spark ZIP member: \{bad\}\'\)\n', '\n', s)
          s = s.replace('  [[ "$(cat "$SPARK_SOURCE_TARGET/.spark-source-revision")" == "$revision" ]] &&\n', '')
          s = s.replace('  SPARK_MANAGER_REVISION="$revision" "$BIN_DIR/spark-architecture" revision | grep -Fq "Revision: $revision" &&\n', '')
          p.write_text(s, encoding='utf-8')

          # 7) Manager Air-Gap CLI: status is reachability/readiness only, never revision matching.
          p = root / 'lib/spark-manager-airgap'
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'spark_airgap_sync_source_main\(\) \{.*?\n\}',
              '''spark_airgap_sync_source_main() {\n  local remote_head\n  [[ -d "${SPARK_ROOT}/.git" ]] || { fail "Spark source repository is required at ${SPARK_ROOT} on the connected builder."; return 1; }\n  GIT_TERMINAL_PROMPT=0 command git -c http.version=HTTP/1.1 -C "$SPARK_ROOT" fetch --depth=1 origin main || { fail "Unable to fetch Spark main."; return 1; }\n  remote_head="$(command git -C "$SPARK_ROOT" rev-parse FETCH_HEAD)"\n  printf '%s\\n' "$remote_head"\n}''',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('    manager-airgap-verify-revisions|manager-airgap-status) spark_manager_airgap_verify_revisions "${1:-$(spark_manager_airgap_profile_path)}" "${2:-$(spark_manager_airgap_revision)}" ;;', '    manager-airgap-verify-revisions|manager-airgap-status) spark_manager_airgap_status "${1:-$(spark_manager_airgap_profile_path)}" ;;')
          s = s.replace('  --verify-revisions|--status) shift; spark_manager_airgap_verify_revisions "${1:-$(spark_manager_airgap_profile_path)}" "${2:-$(spark_manager_airgap_revision)}" ;;', '  --verify-revisions|--status) shift; spark_manager_airgap_status "${1:-$(spark_manager_airgap_profile_path)}" ;;')
          s = s.replace('  --verify-revisions [profile]        Verify all node Manager revisions against Jump\n  --status [profile]                  Alias for revision/status verification', '  --verify-revisions [profile]        Legacy alias for Manager node readiness\n  --status [profile]                  Show Manager node reachability/readiness')
          p.write_text(s, encoding='utf-8')

          # Add non-version-comparing status helper in airgap-manager.sh.
          p = root / 'lib/airgap-manager.sh'
          s = p.read_text(encoding='utf-8')
          if 'spark_manager_airgap_status()' not in s:
              marker = 'spark_manager_airgap_verify_revisions() {'
              idx = s.index(marker)
              helper = '''spark_manager_airgap_status() {\n  local profile="${1:-$(spark_manager_airgap_profile_path)}"\n  [[ -f "$profile" ]] || { fail "Production profile not found: $profile"; return 1; }\n  printf 'SPARK MANAGER NODES\\n\\n'\n  printf '%-18s %s\\n' 'Node' 'Status'\n  local id role host user known connect command status overall=0\n  while IFS=$'\\t' read -r id role host user known connect command; do\n    if [[ -z "$user" ]]; then\n      status=SSH_USER_MISSING; overall=1\n    elif ssh -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o "ConnectTimeout=$connect" \\\n      "$user@$host" 'test -x /usr/local/bin/spark' </dev/null >/dev/null 2>&1; then\n      status=READY\n    else\n      status=UNREACHABLE; overall=1\n    fi\n    printf '%-18s %s\\n' "$id" "$status"\n  done < <(spark_manager_airgap_inventory "$profile")\n  return "$overall"\n}\n\n'''
              s = s[:idx] + helper + s[idx:]
          p.write_text(s, encoding='utf-8')

          # 8) UI wording: no claims about checksum or exact revision verification.
          p = root / 'spark-ui.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('Build a checksum-verified offline bundle containing the complete Spark repository and Manager, pinned to one exact commit.', 'Build an offline Spark + Manager update bundle from the latest fetched main source.')
          s = s.replace('Install or update Spark and Spark Manager from one verified offline bundle across the configured environment.', 'Install or update Spark and Spark Manager from one offline bundle across the configured environment.')
          p.write_text(s, encoding='utf-8')
          PY

          # Validation: syntax + explicit absence of checksum gates in Manager paths.
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/lib/airgap-manager.sh
          bash -n deploy/spark-cli/lib/airgap-full-source.sh
          bash -n deploy/spark-cli/lib/spark-manager-airgap
          bash -n deploy/spark-cli/spark-manager-airgap-bootstrap
          bash -n deploy/spark-cli/bootstrap-full-source-airgap.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py

          if grep -nE 'SHA256SUMS|sha256sum|checksum verification|VERSION_MISMATCH' \
            deploy/spark-cli/bootstrap.sh \
            deploy/spark-cli/lib/airgap-manager.sh \
            deploy/spark-cli/lib/airgap-full-source.sh \
            deploy/spark-cli/lib/spark-manager-airgap \
            deploy/spark-cli/spark-manager-airgap-bootstrap \
            deploy/spark-cli/bootstrap-full-source-airgap.sh; then
            echo 'Manager checksum/version mismatch gate still present.' >&2
            exit 1
          fi

          if grep -Fq 'Synchronizing final integration package' deploy/spark-cli/bootstrap.sh; then
            echo 'Slow final integration sync still present.' >&2
            exit 1
          fi
          if grep -Fq 'commits/main' deploy/spark-cli/bootstrap.sh; then
            echo 'Online bootstrap still resolves/pins commit SHA.' >&2
            exit 1
          fi

          git config user.name 'Spark Manager Automation'
          git config user.email 'spark-manager@users.noreply.github.com'
          git add deploy/spark-cli
          git commit -m 'perf: streamline Spark Manager updates'
          git push origin HEAD:main

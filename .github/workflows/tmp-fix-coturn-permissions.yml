name: Temporary Fix Coturn Config Permissions

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-coturn-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Coturn config permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_coturn_permissions.py
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          bash -n deploy/spark-cli/lib/install-platform-c.sh
          git diff --check

      - name: Validate real Coturn service can read config
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq coturn >/dev/null
          sudo ip addr add 10.255.255.1/32 dev lo
          secret="$(openssl rand -base64 32 | tr -d '\n')"
          sudo tee /etc/turnserver.conf >/dev/null <<EOF
          listening-port=3478
          listening-ip=10.255.255.1
          relay-ip=10.255.255.1
          fingerprint
          use-auth-secret
          static-auth-secret=${secret}
          realm=10.255.255.1
          server-name=10.255.255.1
          min-port=49160
          max-port=49200
          no-tls
          no-dtls
          no-cli
          no-loopback-peers
          no-multicast-peers
          stale-nonce=600
          EOF
          sudo chown root:root /etc/turnserver.conf
          sudo chmod 0600 /etc/turnserver.conf
          if sudo -u turnserver test -r /etc/turnserver.conf; then
            echo 'Expected turnserver user to be unable to read root:root 0600 config' >&2
            exit 1
          fi
          sudo chown root:turnserver /etc/turnserver.conf
          sudo chmod 0640 /etc/turnserver.conf
          sudo -u turnserver test -r /etc/turnserver.conf
          if sudo grep -q '^TURNSERVER_ENABLED=' /etc/default/coturn 2>/dev/null; then
            sudo sed -i 's/^TURNSERVER_ENABLED=.*/TURNSERVER_ENABLED=1/' /etc/default/coturn
          else
            echo 'TURNSERVER_ENABLED=1' | sudo tee -a /etc/default/coturn >/dev/null
          fi
          sudo systemctl restart coturn
          sleep 1
          sudo systemctl is-active --quiet coturn
          sudo ss -H -ltnp | awk '$4=="10.255.255.1:3478" {found=1} END{exit !found}'
          sudo ss -H -lunp | awk '$4=="10.255.255.1:3478" {found=1} END{exit !found}'
          stat -c '%U:%G %a %n' /etc/turnserver.conf

      - name: Commit minimal fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh deploy/spark-cli/lib/install-platform-c.sh
          git commit -m 'fix(turn): allow coturn service to read config'
          git push origin HEAD:main

name: One-time Spark TUI dispatch repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spark-tui-dispatch-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair mainmenu command dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('deploy/spark-cli/spark')
          text = path.read_text(encoding='utf-8')

          if 'SPARK_MANAGER_VERSION="1.3.0"' not in text:
              raise SystemExit('Expected Spark Manager 1.3.0 before repair')
          text = text.replace('SPARK_MANAGER_VERSION="1.3.0"', 'SPARK_MANAGER_VERSION="1.3.1"', 1)

          dispatch = r'''spark_tui_dispatch_command() {
            local command="${1:-}"
            [[ -n "$command" ]] || return 0

            case "$command" in
              "spark_tui_open install") spark_tui_open install ;;
              "spark_tui_open health") spark_tui_open health ;;
              "spark_tui_open npm") spark_tui_open npm ;;
              "spark_tui_open certs") spark_tui_open certs ;;
              "spark_tui_open backup") spark_tui_open backup ;;
              "spark_tui_open services") spark_tui_open services ;;
              "spark_plain_action update") spark_plain_action update ;;
              "spark_plain_action linux") spark_plain_action linux ;;
              "spark_plain_action resources") spark_plain_action resources ;;
              "spark_plain_action open-admin") spark_plain_action open-admin ;;
              "spark_plain_action close-admin") spark_plain_action close-admin ;;
              "spark_plain_action versions") spark_plain_action versions ;;
              "spark_plain_action manager-update") spark_plain_action manager-update ;;
              "spark_tui_exit") spark_tui_exit ;;
              spark_plain_install_step\ *)
                local step="${command##* }"
                [[ "$step" =~ ^([1-9]|1[0-9]|20|21)$ ]] || {
                  fail "Rejected invalid installation step command: $command"
                  return 2
                }
                spark_plain_install_step "$step"
                ;;
              *)
                fail "Rejected unknown TUI command: $command"
                return 2
                ;;
            esac
          }
'''

          if 'spark_tui_dispatch_command() {' not in text:
              marker = '\nmain_menu() {'
              if marker not in text:
                  raise SystemExit('main_menu() marker not found')
              text = text.replace(marker, '\n' + dispatch + '\nmain_menu() {', 1)

          main_menu = r'''main_menu() {
            spark_tui_init || return 1
            spark_tui_extra_keys

            BACKTITLE="⚡ SPARK SERVER MANAGER · v${SPARK_MANAGER_VERSION} · $(hostname -s 2>/dev/null || hostname)"
            export BACKTITLE
            TUI_PERSISTENT_FILTERS=true
            export TUI_PERSISTENT_FILTERS

            local config command rc
            while true; do
              spark_tui_write_main_data
              config="$(spark_tui_main_config)"

              set +e +u
              command="$(TUI_MODE="fullscreen" mainmenu \
                "SPARK CONTROL CENTER" \
                "Production deployment · operations · security · observability" \
                "$config" 1)"
              rc=$?
              set -Eeuo pipefail

              (( rc == 0 )) || return 0
              [[ -n "$command" ]] || continue
              spark_tui_dispatch_command "$command" || true
            done
          }'''

          install_menu = r'''install_menu() {
            spark_tui_init || return 1
            spark_tui_extra_keys

            BACKTITLE="⚡ SPARK · INSTALLATION · $(hostname -s 2>/dev/null || hostname)"
            export BACKTITLE
            TUI_PERSISTENT_FILTERS=true
            export TUI_PERSISTENT_FILTERS

            local config command rc
            while true; do
              spark_tui_write_install_data
              config="$(spark_tui_install_config)"

              set +e +u
              command="$(TUI_MODE="fullscreen" mainmenu \
                "SPARK INSTALLATION" \
                "Guided single-host deployment · completed steps are tracked automatically" \
                "$config" 1)"
              rc=$?
              set -Eeuo pipefail

              (( rc == 0 )) || return 0
              [[ -n "$command" ]] || continue
              spark_tui_dispatch_command "$command" || true
            done
          }'''

          def replace_function(src: str, name: str, replacement: str) -> str:
              pattern = re.compile(rf'(?ms)^{re.escape(name)}\(\) \{{\n.*?^\}}\n')
              out, count = pattern.subn(replacement.rstrip() + '\n', src, count=1)
              if count != 1:
                  raise SystemExit(f'Could not replace {name}(); matches={count}')
              return out

          text = replace_function(text, 'install_menu', install_menu)
          text = replace_function(text, 'main_menu', main_menu)
          path.write_text(text, encoding='utf-8')
          PY

          bash -n deploy/spark-cli/spark

          python3 - <<'PY'
          from pathlib import Path
          text = Path('deploy/spark-cli/spark').read_text(encoding='utf-8')
          checks = {
              'version bump': 'SPARK_MANAGER_VERSION="1.3.1"',
              'allowlisted dispatcher': 'spark_tui_dispatch_command() {',
              'main captures mainmenu output': 'command="$(TUI_MODE="fullscreen" mainmenu',
              'dispatches selected command': 'spark_tui_dispatch_command "$command"',
              'install step allowlist': 'spark_plain_install_step\ *)',
          }
          for label, needle in checks.items():
              if needle not in text:
                  raise SystemExit(f'Validation failed: {label}')
          if text.count('spark_tui_dispatch_command "$command"') != 2:
              raise SystemExit('Expected dispatcher in both main and install dashboards')
          print('Spark TUI dispatch repair validation passed')
          PY

      - name: Commit validated repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-spark-tui-dispatch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/spark .github/workflows/fix-spark-tui-dispatch-once.yml
          git diff --cached --check
          git commit -m 'fix: execute Spark TUI selections'
          git push origin HEAD:main

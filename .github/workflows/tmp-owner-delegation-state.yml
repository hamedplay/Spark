name: Temporary owner delegation state validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-owner-delegation-state.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate owner delegation wiring
        run: |
          grep -q "decline_meeting_invitation_v2" src/components/MeetingInboxButton.tsx
          grep -q "درخواست جانشینی از طرف" src/components/MeetingInboxButton.tsx
          grep -q "get_my_meeting_owner_delegations_v1" src/components/Calendar/useCalendarDataActions.ts
          grep -q "owner_delegate_status" src/components/Calendar/CalendarViewShared.tsx
          grep -q "در انتظار پاسخ جانشین" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "20260827062537_fix_owner_delegate_acceptance_state_machine" <(find supabase/migrations -type f -printf '%f\n')

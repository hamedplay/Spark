# final-head execution trigger
name: Remove single-reference dead symbols

on:
  push:
    branches: [main]
    paths:
      - scripts/remove-single-reference-dead-symbols.mjs
      - .github/workflows/remove-single-reference-dead-symbols.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm ci

      - name: Guarded symbol cleanup
        id: guarded
        shell: bash
        run: |
          set +e
          : > /tmp/dead-symbols.log
          mapfile -t TEST_FILES < <(find tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.mjs' -o -name '*.test.js' \) | sort)
          NO_COLOR=1 node --import tsx --test "${TEST_FILES[@]}" > /tmp/tests-before.log 2>&1

          node scripts/remove-single-reference-dead-symbols.mjs >> /tmp/dead-symbols.log 2>&1
          transform_rc=$?
          build_rc=99; test_rc=99; audit_rc=99
          if [ "$transform_rc" -eq 0 ]; then npm run build >> /tmp/dead-symbols.log 2>&1; build_rc=$?; fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            NO_COLOR=1 node --import tsx --test "${TEST_FILES[@]}" > /tmp/tests-after.log 2>&1
            python3 - <<'PY' >> /tmp/dead-symbols.log 2>&1
          import collections,re
          from pathlib import Path
          def n(p,fail=False):
              out=[]
              for l in Path(p).read_text(errors='replace').splitlines():
                  s=l.strip()
                  if fail:
                      if not s.startswith('✖ '): continue
                  elif not (s.startswith('✔ ') or s.startswith('✖ ')): continue
                  out.append(re.sub(r'\s+\([^)]*ms\)$','',s[2:]))
              return collections.Counter(out)
          ba,aa=n('/tmp/tests-before.log'),n('/tmp/tests-after.log')
          bf,af=n('/tmp/tests-before.log',True),n('/tmp/tests-after.log',True)
          print('tests',sum(ba.values()),sum(aa.values()),'failures',sum(bf.values()),sum(af.values()))
          if ba != aa or (af-bf): raise SystemExit(1)
          PY
            test_rc=$?
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            node scripts/audit-dead-code.mjs >> /tmp/dead-symbols.log 2>&1
            python3 - <<'PY' >> /tmp/dead-symbols.log 2>&1
          import json
          from pathlib import Path
          r=json.loads(Path('scripts/.dead-code-audit.json').read_text())
          if r['production_unreachable'] != ['src/vite-env.d.ts']:
              print('unexpected unreachable=',r['production_unreachable']); raise SystemExit(1)
          removed=json.loads(Path('/tmp/dead-symbol-removals.json').read_text())
          print('removed dead symbols=',len(removed))
          if not removed:
              print('no single-reference dead symbols found')
          PY
            audit_rc=$?
          fi

          if [ "$transform_rc" -ne 0 ] || [ "$build_rc" -ne 0 ] || [ "$test_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then
            git reset --hard HEAD
            { echo VALIDATION_FAILED; echo transform_rc=$transform_rc; echo build_rc=$build_rc; echo test_rc=$test_rc; echo audit_rc=$audit_rc; tail -n 350 /tmp/dead-symbols.log; } > scripts/.dead-symbol-cleanup-status.txt
            echo success=false >> "$GITHUB_OUTPUT"
          else
            rm -f scripts/.dead-symbol-cleanup-status.txt
            echo success=true >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated source cleanup
        if: steps.guarded.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/functions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cleanup: remove single-reference dead symbols"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Commit failure evidence
        if: steps.guarded.outputs.success != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.dead-symbol-cleanup-status.txt
          git commit -m "chore: record dead symbol cleanup failure" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Retry validated minutes delegate cartable fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-minutes-delegate-cartable-retry.yml'

permissions:
  contents: write

concurrency:
  group: tmp-fix-minutes-delegate-cartable-retry
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal scoped fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          approvals_path = Path('src/components/Minutes/MinutesApprovalsPage.tsx')
          source = approvals_path.read_text(encoding='utf-8')

          old_import = "import { Eye, Check, CircleAlert as AlertCircle, Loader as Loader2, UserCheck, Users, X } from 'lucide-react';"
          new_import = "import { Eye, Check, CircleAlert as AlertCircle, Loader as Loader2, UserCheck } from 'lucide-react';"
          if source.count(old_import) != 1:
              raise SystemExit(f'Unexpected cartable icon import count: {source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)

          candidate_block = """interface DelegateCandidate {
            user_id: string;
            full_name: string;
          }

          """
          if source.count(candidate_block) != 1:
              raise SystemExit(f'Unexpected DelegateCandidate count: {source.count(candidate_block)}')
          source = source.replace(candidate_block, '', 1)

          for line in [
              "  const [delegateModalApprovalId, setDelegateModalApprovalId] = useState<string | null>(null);\n",
              "  const [delegateCandidates, setDelegateCandidates] = useState<DelegateCandidate[]>([]);\n",
              "  const [delegateLoading, setDelegateLoading] = useState(false);\n",
              "  const [selectedDelegateId, setSelectedDelegateId] = useState<string | null>(null);\n",
              "  const [delegatingApproval, setDelegatingApproval] = useState<string | null>(null);\n",
          ]:
              if source.count(line) != 1:
                  raise SystemExit(f'Unexpected delegate state count for: {line.strip()}')
              source = source.replace(line, '', 1)

          handler_start = source.find('\n  const openDelegateModal = async ')
          handler_end = source.find('\n  return (', handler_start)
          if handler_start < 0 or handler_end < 0:
              raise SystemExit('Delegate handler block was not found')
          handler_block = source[handler_start:handler_end]
          if 'handleAssignDelegate' not in handler_block or 'assign_minutes_approval_delegate' not in handler_block:
              raise SystemExit('Delegate handler block shape changed')
          source = source[:handler_start] + source[handler_end:]

          action_pattern = re.compile(
              r"\n\s+\{!row\.is_delegate && !row\.delegate_user_id && \(\n.*?\n\s+\)\}",
              re.S,
          )
          source, action_count = action_pattern.subn('', source)
          if action_count != 2:
              raise SystemExit(f'Expected two delegate action controls, found {action_count}')

          modal_start = source.find('\n      {/* Delegate selection modal */}')
          keep_start = source.find('\n      {/* Keep ApprovalStatusBadge import used */}', modal_start)
          if modal_start < 0 or keep_start < 0:
              raise SystemExit('Delegate modal block was not found')
          source = source[:modal_start] + source[keep_start:]

          for forbidden in [
              'assign_minutes_approval_delegate',
              'openDelegateModal',
              'delegateModalApprovalId',
              'title="انتخاب جانشین"',
              'انتخاب جانشین تأییدکننده',
          ]:
              if forbidden in source:
                  raise SystemExit(f'Approval-time delegate selector remains: {forbidden}')

          if 'delegate_user_id.eq.' not in source:
              raise SystemExit('Delegate inbox query was accidentally removed')
          if 'جانشین تأییدکننده:' not in source:
              raise SystemExit('Delegate display label was accidentally removed')
          approvals_path.write_text(source, encoding='utf-8')

          detail_path = Path('src/components/Minutes/MinutesDetailPage.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          old_my_approval = "  const myApproval = approvals.find(a => a.approver_user_id === currentUserId && a.status === 'pending');"
          new_my_approval = """  const myApproval = approvals.find(a =>
            (a.approver_user_id === currentUserId || a.delegate_user_id === currentUserId)
            && a.status === 'pending'
          );"""
          if detail.count(old_my_approval) != 1:
              raise SystemExit(f'Unexpected myApproval anchor count: {detail.count(old_my_approval)}')
          detail_path.write_text(detail.replace(old_my_approval, new_my_approval, 1), encoding='utf-8')

          test_path = Path('tests/minutes/approvalDelegate.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          stale_start = tests.find("test('MinutesApprovalsPage shows delegate selection button only for approver'")
          next_test = tests.find("test('TabApprovals shows delegate, actor, and delegation time columns'", stale_start)
          if stale_start < 0 or next_test < 0:
              raise SystemExit('Stale cartable delegate tests were not found')
          stale_block = tests[stale_start:next_test]
          if "MinutesApprovalsPage handles delegate RPC error codes" not in stale_block:
              raise SystemExit('Stale delegate test block shape changed')

          replacement = """test('MinutesApprovalsPage does not expose approval-time delegate selection', () => {
            const source = fs.readFileSync(
              path.join(__dirname, '../../src/components/Minutes/MinutesApprovalsPage.tsx'),
              'utf-8',
            );
            assert.ok(!source.includes('assign_minutes_approval_delegate'), 'cartable must not call delegate assignment RPC');
            assert.ok(!source.includes('openDelegateModal'), 'cartable must not expose delegate selection modal');
            assert.ok(!source.includes('انتخاب جانشین تأییدکننده'), 'cartable must not render delegate selector UI');
          });

          test('MinutesDetailPage treats a delegate as the pending approver', () => {
            const source = fs.readFileSync(
              path.join(__dirname, '../../src/components/Minutes/MinutesDetailPage.tsx'),
              'utf-8',
            );
            assert.ok(source.includes('a.approver_user_id === currentUserId || a.delegate_user_id === currentUserId'));
          });

          test('delegate cartable access migration lets delegate read the parent minute', () => {
            const migrationSource = fs.readFileSync(
              path.join(__dirname, '../../supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql'),
              'utf-8',
            );
            assert.ok(migrationSource.includes('private._user_can_view_minute'));
            assert.ok(migrationSource.includes('ma.delegate_user_id = auth.uid()'));
          });

          """
          test_path.write_text(tests[:stale_start] + replacement + tests[next_test:], encoding='utf-8')
          PY

          cat > supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql <<'SQL'
          -- Existing approval delegates could read their minutes_approvals row, but the
          -- parent minutes row was filtered by RLS because this visibility helper only
          -- recognized the original approver. Keep all existing access paths and add
          -- the assigned delegate to the approval visibility branch.
          CREATE OR REPLACE FUNCTION private._user_can_view_minute(p_minute_id uuid)
          RETURNS boolean
          LANGUAGE sql
          STABLE SECURITY DEFINER
          SET search_path TO ''
          AS $function$
          SELECT EXISTS (
            SELECT 1
            FROM public.minutes m
            WHERE m.id = p_minute_id
              AND (
                public.is_current_user_admin()
                OR m.created_by_user_id = auth.uid()
                OR m.secretary_user_id = auth.uid()
                OR m.chair_user_id = auth.uid()
                OR EXISTS (
                  SELECT 1 FROM public.minutes_participants mp
                  WHERE mp.minute_id = m.id AND mp.user_id = auth.uid()
                )
                OR EXISTS (
                  SELECT 1 FROM public.minutes_approvals ma
                  WHERE ma.minute_id = m.id
                    AND (
                      ma.approver_user_id = auth.uid()
                      OR ma.delegate_user_id = auth.uid()
                    )
                )
                OR EXISTS (
                  SELECT 1 FROM public.minutes_decisions md
                  WHERE md.minute_id = m.id AND md.primary_owner_user_id = auth.uid()
                )
                OR public._minutes_user_belongs_to_meeting(m.meeting_id, auth.uid())
                OR (
                  m.confidentiality = 'restricted'
                  AND public.can_view_restricted_minutes_meeting(m.meeting_id)
                )
              )
          );
          $function$;
          SQL

      - name: Verify scoped transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          approvals = Path('src/components/Minutes/MinutesApprovalsPage.tsx').read_text(encoding='utf-8')
          detail = Path('src/components/Minutes/MinutesDetailPage.tsx').read_text(encoding='utf-8')
          migration = Path('supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql').read_text(encoding='utf-8')

          checks = {
              'selector removed': 'assign_minutes_approval_delegate' not in approvals and 'انتخاب جانشین تأییدکننده' not in approvals,
              'delegate inbox retained': 'delegate_user_id.eq.' in approvals,
              'delegate label retained': 'جانشین تأییدکننده:' in approvals,
              'detail actions support delegate': 'a.approver_user_id === currentUserId || a.delegate_user_id === currentUserId' in detail,
              'RLS visibility supports delegate': 'ma.delegate_user_id = auth.uid()' in migration,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Contract checks failed: ' + ', '.join(failed))

          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = {line[3:] for line in status.splitlines() if line.strip()}
          expected = {
              'src/components/Minutes/MinutesApprovalsPage.tsx',
              'src/components/Minutes/MinutesDetailPage.tsx',
              'tests/minutes/approvalDelegate.test.ts',
              'supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected changed files before validation: {sorted(changed)}')
          PY

          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Targeted delegate tests
        run: npm run test:approval-delegate

      - name: Production build
        run: npm run build

      - name: Ensure main did not move during validation
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Commit validated fix and remove temporary tooling
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-minutes-delegate-cartable.yml
          rm .github/workflows/tmp-fix-minutes-delegate-cartable-retry.yml

          git add src/components/Minutes/MinutesApprovalsPage.tsx \
                  src/components/Minutes/MinutesDetailPage.tsx \
                  tests/minutes/approvalDelegate.test.ts \
                  supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql \
                  .github/workflows/tmp-fix-minutes-delegate-cartable.yml \
                  .github/workflows/tmp-fix-minutes-delegate-cartable-retry.yml

          git diff --cached --check

          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n' \
            '.github/workflows/tmp-fix-minutes-delegate-cartable-retry.yml' \
            '.github/workflows/tmp-fix-minutes-delegate-cartable.yml' \
            'src/components/Minutes/MinutesApprovalsPage.tsx' \
            'src/components/Minutes/MinutesDetailPage.tsx' \
            'supabase/migrations/20260819180000_fix_minutes_delegate_cartable_access.sql' \
            'tests/minutes/approvalDelegate.test.ts' | sort)"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(minutes): align delegate approval cartable'
          git push origin HEAD:main

name: Temporary malformed phone RPC validation

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260914120500_restore_malformed_phone_cleanup_rpc.sql'
      - 'deploy/spark-cli/apply-db-repairs.sh'
      - 'deploy/spark-cli/apply-daily-report-scheduler.sh'
      - '.github/workflows/tmp-malformed-phone-rpc-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n deploy/spark-cli/apply-db-repairs.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
      - name: Validate repair contract
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260914120500_restore_malformed_phone_cleanup_rpc.sql').read_text()
          repair = Path('deploy/spark-cli/apply-db-repairs.sh').read_text()
          scheduler = Path('deploy/spark-cli/apply-daily-report-scheduler.sh').read_text()

          required_sql = [
              'FUNCTION public.list_malformed_phone_records()',
              'FUNCTION public.clear_malformed_phone_record(p_user_id uuid)',
              "NOTIFY pgrst, 'reload schema'",
              'SECURITY DEFINER',
          ]
          for marker in required_sql:
              assert marker in migration, marker

          assert "to_regprocedure('public.list_malformed_phone_records()')" in repair
          assert "to_regprocedure('public.clear_malformed_phone_record(uuid)')" in repair
          assert 'apply-db-repairs.sh' in scheduler
          print('malformed-phone RPC repair contract: OK')
          PY

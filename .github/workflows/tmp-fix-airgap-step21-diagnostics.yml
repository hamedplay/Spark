name: Temporary Fix Air-Gap Step 21 Diagnostics

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-step21-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Step 21 diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_airgap_step21_diagnostics.py
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          git diff --check

      - name: Validate Step 21 diagnostic semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          export CONFIG_DIR="$(mktemp -d)"
          export LIVEKIT_ROOT="$(mktemp -d)"
          export SUPABASE_ROOT="$(mktemp -d)"
          export AIRGAP_SERVER_IP='10.211.36.178'
          export LIVEKIT_TURN_UDP_PORT=443
          export LIVEKIT_INTERNAL_API_PORT=7880
          export CURRENT_LOG="$(mktemp)"

          save_config(){ :; }
          patch_compose(){ :; }
          install_step_10(){ :; }
          airgap_status(){ :; }
          airgap_build_bundle(){ :; }
          airgap_import_bundle(){ :; }
          source deploy/spark-cli/lib/airgap-ip.sh

          pass_probe(){ return 0; }
          fail_probe(){ return 7; }
          livekit_airgap_validation_check 'sentinel pass' pass_probe
          if livekit_airgap_validation_check 'sentinel failure' fail_probe; then
            echo 'Expected diagnostic wrapper to preserve failure.' >&2
            exit 1
          fi
          grep -Fq '[PASS] sentinel pass' "$CURRENT_LOG"
          grep -Fq '[FAIL] sentinel failure (rc=7)' "$CURRENT_LOG"

          stun_args="$(mktemp)"
          turnutils_stunclient(){ printf '%s\n' "$*" >"$stun_args"; }
          livekit_turn_tls_probe
          grep -Fq -- '-L 10.211.36.178 -p 443 10.211.36.178' "$stun_args"

          curl(){ printf '404'; }
          livekit_airgap_http_reachable 'http://10.211.36.178:7880/'
          curl(){ printf '000'; return 7; }
          if livekit_airgap_http_reachable 'http://10.211.36.178:7880/'; then
            echo 'HTTP 000 must not pass reachability.' >&2
            exit 1
          fi
          echo 'Step 21 diagnostic semantics: PASS'

      - name: Validate Step 21 markers
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'LiveKit embedded TURN STUN UDP 443' deploy/spark-cli/lib/airgap-ip.sh
          grep -Fq 'LiveKit RoomService API smoke test' deploy/spark-cli/lib/airgap-ip.sh
          grep -Fq 'Edge Function unauthorized guard: ${function}' deploy/spark-cli/lib/airgap-ip.sh
          grep -Fq '=== Listening sockets ===' deploy/spark-cli/lib/airgap-ip.sh
          grep -Fq 'return 0' deploy/spark-cli/lib/airgap-ip.sh
          echo 'Step 21 marker validation: PASS'

      - name: Commit minimal Step 21 fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): make LiveKit validation diagnostic and IP-aware'
          git pull --rebase origin main
          git push origin HEAD:main

# rerun with complete source environment

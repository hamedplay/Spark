name: phase3-final-validation-temp

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase3-final-validation-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install
        run: npm ci
      - name: Video conference tests
        run: node --test tests/video-conference/phase1FrontendFoundation.test.mjs tests/video-conference/phase2Rbac.test.mjs tests/video-conference/phase3LiveKitPermissions.test.mjs
      - name: Build
        run: npm run build
      - name: Full regression
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee full-test.log
          code=${PIPESTATUS[0]}
          echo "FULL_TEST_EXIT=${code}"
          exit 0

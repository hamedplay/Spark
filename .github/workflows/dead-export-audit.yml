name: One-time dead export audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-dead-exports.mjs
      - .github/workflows/dead-export-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit high-confidence dead exports
        run: node scripts/audit-dead-exports.mjs
      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.dead-export-audit.json
          git commit -m "chore: record one-time dead export audit" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

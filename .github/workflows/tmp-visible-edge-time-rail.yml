name: Temporary visible-edge time rail validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-visible-edge-time-rail.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate time rail anchors to visible edge
        run: |
          test "$(grep -c 'dir="rtl"' src/components/Calendar/WeekView.tsx)" -ge 3
          test "$(grep -c 'sticky right-0 z-40' src/components/Calendar/WeekView.tsx)" -ge 3
          grep -q 'border-l border-slate-100' src/components/Calendar/WeekView.tsx

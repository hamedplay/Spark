name: Deduplicate Edge security primitives

on:
  push:
    branches: [main]
    paths:
      - scripts/deduplicate-edge-security-primitives.mjs
      - .github/workflows/deduplicate-edge-security-primitives.yml

permissions:
  contents: write

jobs:
  deduplicate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Guarded transform and validation
        id: guarded
        shell: bash
        run: |
          set +e
          : > /tmp/security-primitives.log
          EDGE_FILES=(
            supabase/functions/admin-delete-user/index.ts
            supabase/functions/admin-retire-user/index.ts
            supabase/functions/admin-user-lifecycle/index.ts
            supabase/functions/bulk-sync-profile-phones/index.ts
            supabase/functions/auth-health-check/index.ts
          )
          NO_COLOR=1 deno check --node-modules-dir=auto "${EDGE_FILES[@]}" > /tmp/deno-before.log 2>&1
          baseline_deno_rc=$?

          node scripts/deduplicate-edge-security-primitives.mjs >> /tmp/security-primitives.log 2>&1
          transform_rc=$?
          build_rc=99
          deno_rc=99
          audit_rc=99

          if [ "$transform_rc" -eq 0 ]; then
            npm run build >> /tmp/security-primitives.log 2>&1
            build_rc=$?
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            NO_COLOR=1 deno check --node-modules-dir=auto "${EDGE_FILES[@]}" supabase/functions/_shared/securityPrimitives.ts > /tmp/deno-after.log 2>&1
            after_deno_rc=$?
            python3 - <<'PY' >> /tmp/security-primitives.log 2>&1
          import collections,re
          from pathlib import Path
          def d(p):
              t=Path(p).read_text(errors='replace')
              r=re.compile(r'TS(\d+) \[ERROR\]: ([^\n]+).*?at (?:file://)?[^\n]*?/(supabase/functions/[^:\n]+):\d+:\d+',re.S)
              return collections.Counter((f,c,re.sub(r'\s+',' ',m).strip()) for c,m,f in r.findall(t))
          before=d('/tmp/deno-before.log'); after=d('/tmp/deno-after.log'); new=after-before
          print('deno before=',sum(before.values()),'after=',sum(after.values()))
          if new:
              print('NEW_DENO_DIAGNOSTICS')
              for x,n in sorted(new.items()): print(n,x)
              raise SystemExit(1)
          PY
            deno_rc=$?
            echo "baseline_deno_rc=$baseline_deno_rc after_deno_rc=$after_deno_rc comparison_rc=$deno_rc" >> /tmp/security-primitives.log
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ] && [ "$deno_rc" -eq 0 ]; then
            node scripts/audit-dead-code.mjs >> /tmp/security-primitives.log 2>&1
            audit_exec_rc=$?
            python3 - <<'PY' >> /tmp/security-primitives.log 2>&1
          import json
          from pathlib import Path
          r=json.loads(Path('scripts/.dead-code-audit.json').read_text())
          if r['production_unreachable'] != ['src/vite-env.d.ts']:
              print(r['production_unreachable']); raise SystemExit(1)
          PY
            audit_assert_rc=$?
            if [ "$audit_exec_rc" -eq 0 ] && [ "$audit_assert_rc" -eq 0 ]; then audit_rc=0; else audit_rc=1; fi
          fi

          if [ "$transform_rc" -ne 0 ] || [ "$build_rc" -ne 0 ] || [ "$deno_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "VALIDATION_FAILED"
              echo "transform_rc=$transform_rc"
              echo "build_rc=$build_rc"
              echo "deno_rc=$deno_rc"
              echo "audit_rc=$audit_rc"
              echo
              tail -n 300 /tmp/security-primitives.log
            } > scripts/.security-primitives-status.txt
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f scripts/.security-primitives-status.txt
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated source changes
        if: steps.guarded.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions
          git commit -m "cleanup: centralize Edge security primitives"
          git push origin HEAD:main

      - name: Commit failure evidence
        if: steps.guarded.outputs.success != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.security-primitives-status.txt
          git commit -m "chore: record security primitive dedup failure" || exit 0
          git push origin HEAD:main

name: One-time commit validated duplicate stage1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/commit-validated-duplicate-stage1.yml

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Transform validated exact duplicates
        run: |
          mkdir -p src/shared/ui src/shared/chat
          node scripts/consolidate-final-exact-duplicates.mjs
      - name: Build gate
        run: npm run build
      - name: Audit expected single remainder
        run: |
          node scripts/final-dead-code-audit.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('scripts/.final-dead-code-audit.json').read_text())
          assert r['production_unreachable'] == ['src/vite-env.d.ts'], r['production_unreachable']
          groups=r['exact_duplicate_function_groups']
          assert len(groups) == 1, groups
          files=sorted(item['file'] for item in groups[0]['items'])
          assert files == ['src/components/Channels/ChannelInputBar.tsx','src/components/Chat/ChatInputBar.tsx'], files
          print('stage1 audit accepted one known remainder')
          PY
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/functions/send-daily-meetings
          git commit -m "cleanup: consolidate validated duplicate logic"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# trigger on stable main

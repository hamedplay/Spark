name: Temporary wire MFA method selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'tmp: wire MFA method selector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Profile security UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/ProfilePage.tsx')
          text = path.read_text()

          old = "import { TotpFactorManager } from '../features/auth/components/TotpFactorManager';\nimport { SessionManagementPanel } from '../features/auth/components/SessionManagementPanel';"
          new = "import { TotpFactorManager } from '../features/auth/components/TotpFactorManager';\nimport { MfaMethodSelector } from '../features/auth/components/MfaMethodSelector';\nimport { SessionManagementPanel } from '../features/auth/components/SessionManagementPanel';"
          assert old in text, 'auth component import anchor missing'
          text = text.replace(old, new, 1)

          old = "  const [openSection, setOpenSection] = useState<'personal' | 'work' | 'social' | 'calendar' | 'security'>('personal');\n  const [saved, setSaved] = useState(false);"
          new = "  const [openSection, setOpenSection] = useState<'personal' | 'work' | 'social' | 'calendar' | 'security'>('personal');\n  const [mfaMethodRefreshKey, setMfaMethodRefreshKey] = useState(0);\n  const [saved, setSaved] = useState(false);"
          assert old in text, 'profile state anchor missing'
          text = text.replace(old, new, 1)

          old = "  useEffect(() => {\n    return () => { stopAvatarPoll(); };\n  }, []);"
          new = "  useEffect(() => {\n    return () => { stopAvatarPoll(); };\n  }, []);\n\n  useEffect(() => {\n    const handleMfaMethodChanged = () => setMfaMethodRefreshKey((value) => value + 1);\n    window.addEventListener('spark:mfa-method-changed', handleMfaMethodChanged);\n    return () => window.removeEventListener('spark:mfa-method-changed', handleMfaMethodChanged);\n  }, []);"
          assert old in text, 'effect anchor missing'
          text = text.replace(old, new, 1)

          old = '''      {/* Security / TOTP — outside profile form to prevent submit on Enter */}
      <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mt-4">
        <SectionHeader id="security" title="امنیت حساب" subtitle="مدیریت احراز هویت دومرحله‌ای (TOTP)" />
        {openSection === 'security' && (
          <div className="p-6 space-y-6">
            <TotpFactorManager />
            <div className="border-t border-gray-100 dark:border-gray-700 pt-6">
              <SessionManagementPanel />
            </div>
          </div>
        )}
      </div>'''
          new = '''      {/* Security / MFA — outside profile form to prevent submit on Enter */}
      <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mt-4">
        <SectionHeader id="security" title="امنیت حساب" subtitle="انتخاب و مدیریت روش احراز هویت دومرحله‌ای" />
        {openSection === 'security' && (
          <div className="p-6 space-y-6">
            <MfaMethodSelector
              refreshKey={mfaMethodRefreshKey}
              onRequestTotpEnrollment={() => {
                document.getElementById('totp-factor-manager')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }}
              onCanonicalStateChanged={() => setMfaMethodRefreshKey((value) => value + 1)}
            />
            <div id="totp-factor-manager" className="border-t border-gray-100 dark:border-gray-700 pt-6">
              <TotpFactorManager />
            </div>
            <div className="border-t border-gray-100 dark:border-gray-700 pt-6">
              <SessionManagementPanel />
            </div>
          </div>
        )}
      </div>'''
          assert old in text, 'security section anchor missing'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProfilePage.tsx
          git commit -m "feat: expose MFA method choice in profile"
          git push origin HEAD:main

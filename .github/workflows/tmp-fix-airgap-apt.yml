name: Temporary Fix AirGap APT

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-apt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Air-Gap offline APT handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          airgap = Path('deploy/spark-cli/lib/airgap.sh')
          text = airgap.read_text(encoding='utf-8')
          old = '''airgap_install_local_debs() {\n  local root="$1"\n  local -a debs=()\n  mapfile -t debs < <(find "${root}/apt" -maxdepth 1 -type f -name '*.deb' -print | sort)\n  ((${#debs[@]} > 0)) || { fail "No .deb packages found in bundle."; return 1; }\n  DEBIAN_FRONTEND=noninteractive apt-get \\\n    -o Dir::Etc::sourcelist=/dev/null \\\n    -o Dir::Etc::sourceparts=- \\\n    -o APT::Get::List-Cleanup=0 \\\n    install -y "${debs[@]}"\n}\n'''
          new = '''airgap_install_local_debs() {\n  local root="$1" apt_guard rc=0\n  local -a debs=()\n  mapfile -t debs < <(find "${root}/apt" -maxdepth 1 -type f -name '*.deb' -print | sort)\n  ((${#debs[@]} > 0)) || { fail "No .deb packages found in bundle."; return 1; }\n\n  apt_guard="$(mktemp -d /run/spark-airgap-apt.XXXXXX)"\n  install -d -m 0755 "${apt_guard}/sources.list.d"\n  : >"${apt_guard}/sources.list"\n\n  DEBIAN_FRONTEND=noninteractive apt-get \\\n    -o "Dir::Etc::sourcelist=${apt_guard}/sources.list" \\\n    -o "Dir::Etc::sourceparts=${apt_guard}/sources.list.d" \\\n    -o APT::Get::List-Cleanup=0 \\\n    install -y --allow-downgrades "${debs[@]}" || rc=$?\n\n  rm -rf "$apt_guard"\n  return "$rc"\n}\n'''
          if old not in text:
              raise SystemExit('airgap_install_local_debs expected block not found')
          text = text.replace(old, new, 1)

          # Air-Gap step 3 must not reinstall the Manager with a root-only parent directory.
          old_stage = '  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n  mkdir -p "$stage/lib" "$stage/livekit"\n'
          new_stage = '  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n  chmod 0755 "$stage"\n  install -d -m 0755 "$stage/lib" "$stage/livekit"\n'
          if old_stage not in text:
              raise SystemExit('airgap Manager stage block not found')
          text = text.replace(old_stage, new_stage, 1)
          old_target = '  rm -rf "$target"\n  mv "$stage" "$target"\n  ln -sfn "$target/spark" /usr/local/bin/spark\n'
          new_target = '  rm -rf "$target"\n  mv "$stage" "$target"\n  chmod 0755 "$target"\n  ln -sfn "$target/spark" /usr/local/bin/spark\n'
          if old_target not in text:
              raise SystemExit('airgap Manager target block not found')
          text = text.replace(old_target, new_target, 1)
          old_migrate = '  rm -rf "$migrate_target"\n  mkdir -p "$migrate_target"\n'
          new_migrate = '  rm -rf "$migrate_target"\n  install -d -m 0755 "$migrate_target"\n'
          if old_migrate not in text:
              raise SystemExit('airgap migrate target block not found')
          text = text.replace(old_migrate, new_migrate, 1)
          airgap.write_text(text, encoding='utf-8')

          bootstrap = Path('deploy/spark-cli/bootstrap-airgap.sh')
          text = bootstrap.read_text(encoding='utf-8')
          old = '''export DEBIAN_FRONTEND=noninteractive\napt-get \\\n  -o Dir::Etc::sourcelist=/dev/null \\\n  -o Dir::Etc::sourceparts=- \\\n  -o APT::Get::List-Cleanup=0 \\\n  install -y "${debs[@]}"\n'''
          new = '''export DEBIAN_FRONTEND=noninteractive\napt_guard="$(mktemp -d)"\ninstall -d -m 0755 "${apt_guard}/sources.list.d"\n: >"${apt_guard}/sources.list"\napt_rc=0\napt-get \\\n  -o "Dir::Etc::sourcelist=${apt_guard}/sources.list" \\\n  -o "Dir::Etc::sourceparts=${apt_guard}/sources.list.d" \\\n  -o APT::Get::List-Cleanup=0 \\\n  install -y --allow-downgrades "${debs[@]}" || apt_rc=$?\nrm -rf "$apt_guard"\n(( apt_rc == 0 )) || exit "$apt_rc"\n'''
          if old not in text:
              raise SystemExit('bootstrap-airgap apt block not found')
          bootstrap.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax and real downgrade behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/lib/airgap.sh
          bash -n deploy/spark-cli/bootstrap-airgap.sh

          grep -Fq -- '--allow-downgrades' deploy/spark-cli/lib/airgap.sh
          grep -Fq -- '--allow-downgrades' deploy/spark-cli/bootstrap-airgap.sh
          ! grep -Fq -- '--no-download' deploy/spark-cli/lib/airgap.sh
          ! grep -Fq 'Dir::Etc::sourceparts=-' deploy/spark-cli/lib/airgap.sh
          ! grep -Fq 'Dir::Etc::sourceparts=-' deploy/spark-cli/bootstrap-airgap.sh

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/v1/DEBIAN" "$work/v2/DEBIAN" "$work/bundle/apt"
          cat >"$work/v1/DEBIAN/control" <<'EOF'
          Package: spark-airgap-downgrade-test
          Version: 1.0
          Section: misc
          Priority: optional
          Architecture: all
          Maintainer: Spark Test <noreply@example.invalid>
          Description: Spark Air-Gap downgrade validation package
          EOF
          cat >"$work/v2/DEBIAN/control" <<'EOF'
          Package: spark-airgap-downgrade-test
          Version: 2.0
          Section: misc
          Priority: optional
          Architecture: all
          Maintainer: Spark Test <noreply@example.invalid>
          Description: Spark Air-Gap downgrade validation package
          EOF
          dpkg-deb --build "$work/v1" "$work/spark-airgap-downgrade-test_1.0_all.deb" >/dev/null
          dpkg-deb --build "$work/v2" "$work/spark-airgap-downgrade-test_2.0_all.deb" >/dev/null
          cp "$work/spark-airgap-downgrade-test_1.0_all.deb" "$work/bundle/apt/"
          sudo dpkg -i "$work/spark-airgap-downgrade-test_2.0_all.deb" >/dev/null
          test "$(dpkg-query -W -f='${Version}' spark-airgap-downgrade-test)" = '2.0'

          sed -n '/^airgap_install_local_debs() {/,/^}/p' deploy/spark-cli/lib/airgap.sh >"$work/function.sh"
          cat >"$work/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          fail() { printf 'FAIL: %s\n' "$*" >&2; }
          source "$1"
          airgap_install_local_debs "$2"
          EOF
          chmod +x "$work/run.sh"
          set +e
          sudo "$work/run.sh" "$work/function.sh" "$work/bundle" >"$work/apt.out" 2>&1
          rc=$?
          set -e
          cat "$work/apt.out"
          test "$rc" -eq 0
          test "$(dpkg-query -W -f='${Version}' spark-airgap-downgrade-test)" = '1.0'
          ! grep -Fq 'Unable to read /etc/apt/-' "$work/apt.out"
          ! grep -Fq 'Unable to read /dev/null' "$work/apt.out"
          sudo dpkg -r spark-airgap-downgrade-test >/dev/null

          grep -Fq 'chmod 0755 "$stage"' deploy/spark-cli/lib/airgap.sh
          grep -Fq 'chmod 0755 "$target"' deploy/spark-cli/lib/airgap.sh
          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap.sh deploy/spark-cli/bootstrap-airgap.sh
          git commit -m 'fix(airgap): allow verified offline package downgrades'
          git push origin HEAD:main

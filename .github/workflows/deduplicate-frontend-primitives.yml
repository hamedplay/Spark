name: Deduplicate frontend primitives

on:
  push:
    branches: [main]
    paths:
      - scripts/deduplicate-frontend-primitives.mjs
      - .github/workflows/deduplicate-frontend-primitives.yml

permissions:
  contents: write

jobs:
  deduplicate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guarded transform and validation
        id: guarded
        shell: bash
        run: |
          set +e
          : > /tmp/frontend-dedup.log
          node scripts/deduplicate-frontend-primitives.mjs >> /tmp/frontend-dedup.log 2>&1
          transform_rc=$?
          build_rc=99
          audit_rc=99

          if [ "$transform_rc" -eq 0 ]; then
            npm run build >> /tmp/frontend-dedup.log 2>&1
            build_rc=$?
          fi

          if [ "$transform_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            node scripts/audit-dead-code.mjs >> /tmp/frontend-dedup.log 2>&1
            audit_exec_rc=$?
            python3 - <<'PY' >> /tmp/frontend-dedup.log 2>&1
          import json
          from pathlib import Path
          r = json.loads(Path('scripts/.dead-code-audit.json').read_text())
          if r['production_unreachable'] != ['src/vite-env.d.ts']:
              print('unexpected unreachable:', r['production_unreachable'])
              raise SystemExit(1)
          forbidden = {
              'src/components/NotificationsConfig/Toggle.tsx',
              'src/components/SmsConfig/Toggle.tsx',
              'src/components/OrgStructure/Spinner.tsx',
          }
          if any(forbidden.intersection(group) for group in r['duplicate_files']):
              raise SystemExit(1)
          PY
            audit_assert_rc=$?
            if [ "$audit_exec_rc" -eq 0 ] && [ "$audit_assert_rc" -eq 0 ]; then audit_rc=0; else audit_rc=1; fi
          fi

          if [ "$transform_rc" -ne 0 ] || [ "$build_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "VALIDATION_FAILED"
              echo "transform_rc=$transform_rc"
              echo "build_rc=$build_rc"
              echo "audit_rc=$audit_rc"
              echo
              tail -n 300 /tmp/frontend-dedup.log
            } > scripts/.frontend-dedup-status.txt
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            rm -f scripts/.frontend-dedup-status.txt
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated source changes
        if: steps.guarded.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "cleanup: consolidate duplicated frontend primitives"
          git push origin HEAD:main

      - name: Commit failure evidence
        if: steps.guarded.outputs.success != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.frontend-dedup-status.txt
          git commit -m "chore: record frontend dedup validation failure" || exit 0
          git push origin HEAD:main

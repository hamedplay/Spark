name: Temporary update-no-migrations validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-update-no-migrations.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n deploy/spark-cli/lib/update.sh
      - name: Ensure update does not manage DB migrations
        run: |
          ! grep -q 'reconcile_spark_migrations' deploy/spark-cli/lib/update.sh
          ! grep -q 'list_pending_spark_migrations' deploy/spark-cli/lib/update.sh
          ! grep -q 'apply_one_spark_migration' deploy/spark-cli/lib/update.sh
          ! grep -q "NOTIFY pgrst, 'reload schema'" deploy/spark-cli/lib/update.sh
          ! grep -q 'supabase_migrations.schema_migrations' deploy/spark-cli/lib/update.sh

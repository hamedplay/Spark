name: phase26-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 26 documentation contract
        run: node --test tests/video-conference/phase26Documentation.test.mjs

      - name: Video conference tests
        run: npm run test:video-conference

      - name: Build
        run: npm run build

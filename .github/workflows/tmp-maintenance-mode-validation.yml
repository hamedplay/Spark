name: Temporary maintenance mode validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-maintenance-mode-validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Validate deploy scripts
        run: |
          bash -n deploy/spark-cli/apply-maintenance-mode-repair.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Validate focused contract
        run: |
          grep -Fq "set_maintenance_mode" src/components/PortalConfig/MaintenanceModeField.tsx
          grep -Fq "maintenance-mode-changed" src/app/hooks/useAppRuntimeConfig.ts
          grep -Fq "MaintenanceModeField" src/components/PortalConfig/ConfigField.tsx
          grep -Fq "system_config_authenticated_read_maintenance_mode" deploy/spark-cli/db-repairs/20260914142500_maintenance_mode_runtime_visibility.sql
          grep -Fq "apply-maintenance-mode-repair.sh" deploy/spark-cli/apply-daily-report-scheduler.sh

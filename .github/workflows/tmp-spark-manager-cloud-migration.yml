name: TEMP Spark Manager Cloud Migration

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.event.issue.title == 'TEMP: Spark Manager cloud migration transfer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply scoped Spark Manager changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          VERSION_OLD = '2.1.0+20260821.1'
          VERSION_NEW = '2.2.0+20260822.1'

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Version/build bump in backend, UI and bootstrap.
          for path in ['deploy/spark-cli/spark', 'deploy/spark-cli/spark-ui.py', 'deploy/spark-cli/bootstrap.sh', 'deploy/spark-cli/README.md']:
              p = Path(path)
              text = p.read_text()
              if VERSION_OLD not in text:
                  raise SystemExit(f'{path}: old version not found')
              p.write_text(text.replace(VERSION_OLD, VERSION_NEW))

          tests = Path('deploy/spark-cli/lib/tests-backup.sh')
          text = tests.read_text()
          anchor = '\nlist_backups() {\n'
          if anchor not in text:
              raise SystemExit('tests-backup.sh: list_backups anchor missing')
          if 'create_migration_backup() {' in text:
              raise SystemExit('tests-backup.sh: migration functions already exist')

          block = r'''

# Portable Supabase Cloud migration backup/restore.
# Uses the official Supabase CLI dump format plus an explicit application ACL
# snapshot because managed target defaults may otherwise re-grant EXECUTE.
MIGRATION_SUPABASE_CLI_PACKAGE="${MIGRATION_SUPABASE_CLI_PACKAGE:-supabase@latest}"
MIGRATION_PG_IMAGE="${MIGRATION_PG_IMAGE:-postgres:17-alpine}"

migration_require_tools() {
  command -v docker >/dev/null 2>&1 || { fail "Docker is required for Cloud migration backup/restore."; return 1; }
  command -v npx >/dev/null 2>&1 || { fail "Node/npx is required for the Supabase CLI."; return 1; }
  docker info >/dev/null 2>&1 || { fail "Docker daemon is not available."; return 1; }
}

migration_prompt_db_url() {
  local __var="$1" label="$2" value
  printf '%s\n' "Use Supabase Dashboard -> Connect -> Session pooler connection string."
  printf '%s\n' "The password in the URL must be percent-encoded if it contains reserved URL characters."
  read -r -s -p "${label}: " value
  printf '\n'
  [[ "$value" == postgres://* || "$value" == postgresql://* ]] || {
    fail "Database URL must start with postgres:// or postgresql://"
    return 1
  }
  printf -v "$__var" '%s' "$value"
}

migration_project_hint() {
  local url="$1"
  DB_URL="$url" python3 - <<'PY_HINT'
import os
from urllib.parse import urlsplit
u = urlsplit(os.environ['DB_URL'])
user = u.username or ''
host = u.hostname or ''
ref = ''
if user.startswith('postgres.'):
    ref = user.split('.', 1)[1]
elif host.startswith('db.') and host.endswith('.supabase.co'):
    ref = host.split('.', 2)[1]
print(ref or f'{user}@{host}')
PY_HINT
}

migration_psql_query() {
  local url="$1" sql="$2"
  docker run --rm "$MIGRATION_PG_IMAGE" \
    psql "$url" -X --set=ON_ERROR_STOP=1 -Atqc "$sql"
}

migration_test_connection() {
  local url="$1"
  [[ "$(migration_psql_query "$url" 'select 1')" == "1" ]]
}

migration_source_security_check() {
  local url="$1" result
  result="$(migration_psql_query "$url" "
    select
      count(*) filter (where has_function_privilege('anon', p.oid, 'EXECUTE'))::text || '|' ||
      count(*) filter (where has_function_privilege('authenticated', p.oid, 'EXECUTE'))::text
    from pg_proc p
    join pg_namespace n on n.oid=p.pronamespace
    where n.nspname='public' and p.prosecdef;
  ")" || return 1
  if [[ "$result" != "0|0" ]]; then
    fail "Source database is not hardened: client-executable SECURITY DEFINER count is ${result}."
    return 1
  fi
}

migration_write_security_snapshot() {
  local url="$1" output="$2"
  cat >"$output" <<'SQL_HEADER'
-- Spark portable function ACL snapshot.
-- Generated from the hardened source database; no credentials are stored here.
\set ON_ERROR_STOP on
SQL_HEADER

  # Reset browser/service EXECUTE for every public function, then grant exactly
  # what the source currently grants to PUBLIC/anon/authenticated/service_role.
  migration_psql_query "$url" "
    select format(
      'REVOKE EXECUTE ON FUNCTION %I.%s FROM PUBLIC, anon, authenticated, service_role;',
      n.nspname, p.oid::regprocedure::text
    )
    from pg_proc p
    join pg_namespace n on n.oid=p.pronamespace
    where n.nspname='public' and p.prokind='f'
    order by p.proname, p.oid;
  " >>"$output" || return 1

  migration_psql_query "$url" "
    with f as (
      select p.oid, n.nspname, p.oid::regprocedure::text as sig,
             x.grantee, x.privilege_type
      from pg_proc p
      join pg_namespace n on n.oid=p.pronamespace
      cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) x
      where n.nspname='public' and p.prokind='f'
    )
    select format(
      'GRANT EXECUTE ON FUNCTION %I.%s TO %s;',
      nspname, sig,
      case when grantee=0 then 'PUBLIC' else quote_ident(pg_get_userbyid(grantee)) end
    )
    from f
    where privilege_type='EXECUTE'
      and (grantee=0 or pg_get_userbyid(grantee) in ('anon','authenticated','service_role'))
    order by sig, grantee;
  " >>"$output" || return 1

  cat >>"$output" <<'SQL_DEFAULTS'

-- Restore Spark's secure default for future postgres-owned public functions.
ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
  REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC, anon, authenticated, service_role;
SQL_DEFAULTS

  migration_psql_query "$url" "
    with d as (
      select x.grantee, x.privilege_type
      from pg_default_acl a
      join pg_namespace n on n.oid=a.defaclnamespace
      cross join lateral aclexplode(a.defaclacl) x
      where a.defaclrole='postgres'::regrole
        and n.nspname='public'
        and a.defaclobjtype='f'
    )
    select format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO %s;',
      case when grantee=0 then 'PUBLIC' else quote_ident(pg_get_userbyid(grantee)) end
    )
    from d
    where privilege_type='EXECUTE'
      and (grantee=0 or pg_get_userbyid(grantee) in ('anon','authenticated','service_role'))
    order by grantee;
  " >>"$output" || return 1

  cat >>"$output" <<'SQL_ASSERT'

-- Fail the whole restore if a browser role can execute any public SECURITY DEFINER.
DO $spark_security$
DECLARE
  v_anon integer;
  v_auth integer;
BEGIN
  SELECT count(*) INTO v_anon
  FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
  WHERE n.nspname='public' AND p.prosecdef
    AND has_function_privilege('anon', p.oid, 'EXECUTE');

  SELECT count(*) INTO v_auth
  FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
  WHERE n.nspname='public' AND p.prosecdef
    AND has_function_privilege('authenticated', p.oid, 'EXECUTE');

  IF v_anon <> 0 OR v_auth <> 0 THEN
    RAISE EXCEPTION 'Spark security restore failed: client SECURITY DEFINER exposure anon=%, authenticated=%', v_anon, v_auth;
  END IF;
END
$spark_security$;
SQL_ASSERT
}

migration_cli_dump() {
  local url="$1" output="$2"
  shift 2
  npx --yes "$MIGRATION_SUPABASE_CLI_PACKAGE" db dump --db-url "$url" -f "$output" "$@"
}

create_migration_backup() {
  migration_require_tools || return 1

  local source_url stamp dest source_hint
  migration_prompt_db_url source_url "Source Supabase Cloud DB URL (hidden)" || return 1
  info "Testing source Cloud database connection..."
  migration_test_connection "$source_url" || { fail "Cannot connect to source Supabase database."; unset source_url; return 1; }
  migration_source_security_check "$source_url" || { unset source_url; return 1; }

  stamp="$(date +%Y%m%d-%H%M%S)"
  dest="${BACKUP_DIR}/migration-${stamp}"
  mkdir -p "$dest"
  chmod 700 "$dest"
  source_hint="$(migration_project_hint "$source_url")"

  info "Creating Supabase portable roles/schema/data backup..."
  migration_cli_dump "$source_url" "$dest/roles.sql" --role-only || { rm -rf "$dest"; unset source_url; return 1; }
  migration_cli_dump "$source_url" "$dest/schema.sql" || { rm -rf "$dest"; unset source_url; return 1; }
  migration_cli_dump "$source_url" "$dest/data.sql" --use-copy --data-only -x 'storage.buckets_vectors' -x 'storage.vector_indexes' || { rm -rf "$dest"; unset source_url; return 1; }

  info "Preserving Supabase migration history..."
  migration_cli_dump "$source_url" "$dest/history_schema.sql" --schema supabase_migrations || { rm -rf "$dest"; unset source_url; return 1; }
  migration_cli_dump "$source_url" "$dest/history_data.sql" --use-copy --data-only --schema supabase_migrations || { rm -rf "$dest"; unset source_url; return 1; }

  info "Snapshotting Spark function ACLs and secure defaults..."
  migration_write_security_snapshot "$source_url" "$dest/security.sql" || { rm -rf "$dest"; unset source_url; return 1; }

  cat >"$dest/manifest.txt" <<EOF_MANIFEST
format=spark-supabase-migration-v1
created_at=$(date -Is)
source=${source_hint}
manager_version=${SPARK_MANAGER_VERSION}
restore_mode=single-transaction-on-error-stop
EOF_MANIFEST

  (cd "$dest" && sha256sum roles.sql schema.sql data.sql history_schema.sql history_data.sql security.sql manifest.txt >SHA256SUMS)
  chmod -R go-rwx "$dest"
  echo "$dest" >"${STATE_DIR}/last-migration-backup-path"
  unset source_url

  ok "Portable Cloud migration backup created: $dest"
  printf '%s\n' "Files: roles.sql schema.sql data.sql history_schema.sql history_data.sql security.sql"
}

restore_migration_backup() {
  migration_require_tools || return 1

  local backup_dir target_url source_hint target_hint
  read -r -p "Migration backup directory: " backup_dir
  [[ -d "$backup_dir" ]] || { fail "Backup directory does not exist."; return 1; }
  backup_dir="$(readlink -f "$backup_dir")"

  local required=(roles.sql schema.sql data.sql history_schema.sql history_data.sql security.sql manifest.txt SHA256SUMS)
  local f
  for f in "${required[@]}"; do
    [[ -s "$backup_dir/$f" ]] || { fail "Required migration file missing: $f"; return 1; }
  done
  (cd "$backup_dir" && sha256sum -c SHA256SUMS) || { fail "Backup checksum validation failed."; return 1; }

  source_hint="$(awk -F= '$1=="source" {print substr($0,index($0,"=")+1)}' "$backup_dir/manifest.txt" | head -n1)"
  migration_prompt_db_url target_url "Target Supabase Cloud DB URL (hidden)" || return 1
  target_hint="$(migration_project_hint "$target_url")"
  if [[ -n "$source_hint" && "$source_hint" == "$target_hint" ]]; then
    fail "Target appears to be the same Supabase project as the backup source. Refusing restore."
    unset target_url
    return 1
  fi

  info "Testing target Cloud database connection..."
  migration_test_connection "$target_url" || { fail "Cannot connect to target Supabase database."; unset target_url; return 1; }

  if ! confirm_word "This will restore the migration bundle into target ${target_hint}. Use a fresh Supabase project. Any SQL error rolls back the transaction." "RESTORE"; then
    warn "Restore cancelled."
    unset target_url
    return 1
  fi

  info "Restoring roles, schema, data, migration history and Spark ACLs atomically..."
  if ! docker run --rm \
      -v "$backup_dir:/backup:ro" \
      "$MIGRATION_PG_IMAGE" \
      psql \
        --single-transaction \
        --set=ON_ERROR_STOP=1 \
        --file=/backup/roles.sql \
        --file=/backup/schema.sql \
        --command='SET session_replication_role = replica' \
        --file=/backup/data.sql \
        --file=/backup/history_schema.sql \
        --file=/backup/history_data.sql \
        --file=/backup/security.sql \
        --dbname="$target_url"; then
    fail "Cloud migration restore failed. PostgreSQL rolled back the transaction."
    unset target_url
    return 1
  fi

  local security_state
  security_state="$(migration_psql_query "$target_url" "
    select
      count(*) filter (where has_function_privilege('anon', p.oid, 'EXECUTE'))::text || '|' ||
      count(*) filter (where has_function_privilege('authenticated', p.oid, 'EXECUTE'))::text
    from pg_proc p
    join pg_namespace n on n.oid=p.pronamespace
    where n.nspname='public' and p.prosecdef;
  ")" || { unset target_url; return 1; }
  unset target_url

  [[ "$security_state" == "0|0" ]] || {
    fail "Post-restore security validation failed: ${security_state}"
    return 1
  }
  ok "Cloud migration restore completed. SECURITY DEFINER exposure: anon=0 authenticated=0."
}
'''
          text = text.replace(anchor, block + anchor, 1)

          # Keep the legacy text menu complete too.
          old_menu = "printf '0) بازگشت\\n1) ایجاد Backup دستی DB + config\\n2) لیست Backupها\\n\\n'"
          new_menu = "printf '0) بازگشت\\n1) ایجاد Backup دستی DB + config\\n2) لیست Backupها\\n3) Cloud migration backup\\n4) Cloud migration restore\\n\\n'"
          if old_menu not in text:
              raise SystemExit('tests-backup.sh: backup menu label anchor missing')
          text = text.replace(old_menu, new_menu, 1)
          old_case = "      2) new_log \"backup-list\"; run_report \"Backupها\" list_backups; pause ;;\n      *)"
          new_case = "      2) new_log \"backup-list\"; run_report \"Backupها\" list_backups; pause ;;\n      3) new_log \"backup-migration-create\"; run_visible \"Cloud migration backup\" create_migration_backup || true; pause ;;\n      4) new_log \"backup-migration-restore\"; run_visible \"Cloud migration restore\" restore_migration_backup || true; pause ;;\n      *)"
          if old_case not in text:
              raise SystemExit('tests-backup.sh: backup case anchor missing')
          text = text.replace(old_case, new_case, 1)
          tests.write_text(text)

          spark = Path('deploy/spark-cli/spark')
          text = spark.read_text()
          old = '''    backup-create)\n      new_log "backup-manual"\n      run_visible "Create DB + config backup" create_backup manual\n      ;;\n    backup-list) new_log "backup-list"; run_report "Backups" list_backups ;;'''
          new = '''    backup-create)\n      new_log "backup-manual"\n      run_visible "Create DB + config backup" create_backup manual\n      ;;\n    backup-migration-create) new_log "backup-migration-create"; run_visible "Cloud migration backup" create_migration_backup ;;\n    backup-migration-restore) new_log "backup-migration-restore"; run_visible "Cloud migration restore" restore_migration_backup ;;\n    backup-list) new_log "backup-list"; run_report "Backups" list_backups ;;'''
          if old not in text:
              raise SystemExit('spark: backup dispatch anchor missing')
          spark.write_text(text.replace(old, new, 1))

          ui = Path('deploy/spark-cli/spark-ui.py')
          text = ui.read_text()
          old = '''    ("Backups", [\n        Action("backup-create", "Create manual backup", "Create PostgreSQL plus runtime/config backup.", "controlled"),\n        Action("backup-list", "List backups", "Show retained backup directories."),'''
          new = '''    ("Backups", [\n        Action("backup-create", "Create manual backup", "Create PostgreSQL plus runtime/config backup.", "controlled"),\n        Action("backup-migration-create", "Cloud migration backup", "Create portable Supabase Cloud roles/schema/data/history plus exact Spark function ACL snapshot.", "controlled"),\n        Action("backup-migration-restore", "Cloud migration restore", "Atomically restore a migration bundle to a fresh Supabase Cloud project and verify security.", "confirm"),\n        Action("backup-list", "List backups", "Show retained backup directories."),'''
          if old not in text:
              raise SystemExit('spark-ui.py: Backups category anchor missing')
          ui.write_text(text.replace(old, new, 1))

          bootstrap = Path('deploy/spark-cli/bootstrap.sh')
          text = bootstrap.read_text()
          anchor = '''grep -q 'cleanup_database_data' "$tmp/lib/cleanup.sh" || {\n  echo "Spark cleanup module validation failed." >&2\n  exit 1\n}\n'''
          addition = anchor + '''grep -q 'create_migration_backup' "$tmp/lib/tests-backup.sh" || {\n  echo "Spark Cloud migration backup validation failed." >&2\n  exit 1\n}\ngrep -q 'restore_migration_backup' "$tmp/lib/tests-backup.sh" || {\n  echo "Spark Cloud migration restore validation failed." >&2\n  exit 1\n}\n'''
          if anchor not in text:
              raise SystemExit('bootstrap.sh: cleanup validation anchor missing')
          bootstrap.write_text(text.replace(anchor, addition, 1))

          readme = Path('deploy/spark-cli/README.md')
          text = readme.read_text()
          anchor = '- Backup management.\n'
          addition = '''- Backup management.\n- Supabase Cloud migration backup/restore: official Supabase roles/schema/data/history dump + Spark function ACL snapshot, checksum validation, single-transaction restore and post-restore SECURITY DEFINER check.\n'''
          if anchor not in text:
              raise SystemExit('README.md: backup management anchor missing')
          readme.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Validate scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/spark
          for f in deploy/spark-cli/lib/*.sh; do bash -n "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/spark-ui.py')
          compile(p.read_text(), str(p), 'exec')
          PY
          python3 deploy/spark-cli/spark-ui.py --self-test
          grep -q 'SPARK_MANAGER_VERSION="2.2.0+20260822.1"' deploy/spark-cli/spark
          grep -q 'SPARK_UI_VERSION = "2.2.0+20260822.1"' deploy/spark-cli/spark-ui.py
          grep -q 'EXPECTED_VERSION="2.2.0+20260822.1"' deploy/spark-cli/bootstrap.sh
          grep -q 'create_migration_backup()' deploy/spark-cli/lib/tests-backup.sh
          grep -q 'restore_migration_backup()' deploy/spark-cli/lib/tests-backup.sh
          grep -q 'backup-migration-create' deploy/spark-cli/spark-ui.py
          grep -q 'backup-migration-restore' deploy/spark-cli/spark-ui.py
          git diff --check

      - name: Commit direct to main and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-spark-manager-cloud-migration.yml
          git config user.name 'hamedplay'
          git config user.email 'hamedkhaleghi493@gmail.com'
          git add deploy/spark-cli .github/workflows/tmp-spark-manager-cloud-migration.yml
          git commit -m 'feat(cli): add atomic Supabase cloud migration transfer [skip ci]'
          git push origin HEAD:main

name: phase2-validation-temp

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase2-validation-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1 and Phase 2 targeted tests
        run: node --test tests/video-conference/phase1FrontendFoundation.test.mjs tests/video-conference/phase2Rbac.test.mjs

      - name: Production build
        run: npm run build

      - name: Full regression suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee full-test.log
          code=${PIPESTATUS[0]}
          echo "FULL_TEST_EXIT=${code}"
          exit 0

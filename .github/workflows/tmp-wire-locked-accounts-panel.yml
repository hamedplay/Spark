name: Temporary wire locked accounts panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-wire-locked-accounts-panel.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wire panel into account lock section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/security-settings/components/SecuritySettingsConsole.tsx')
          text = path.read_text()
          import_anchor = "import { MalformedPhoneCleanupPanel } from './MalformedPhoneCleanupPanel';\n"
          import_line = "import { LockedAccountsPanel } from './LockedAccountsPanel';\n"
          if import_line not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          anchor = '''        <p className="text-xs text-gray-500 dark:text-gray-400">
          در حالت تصاعدی، مقادیر به‌ترتیب دفعات قفل اعمال می‌شوند؛ در حالت خاموش، مدت قفل ثابت استفاده می‌شود.
        </p>
      </SectionCard>'''
          replacement = '''        <p className="text-xs text-gray-500 dark:text-gray-400">
          در حالت تصاعدی، مقادیر به‌ترتیب دفعات قفل اعمال می‌شوند؛ در حالت خاموش، مدت قفل ثابت استفاده می‌شود.
        </p>
        <LockedAccountsPanel />
      </SectionCard>'''
          if '<LockedAccountsPanel />' not in text:
              assert anchor in text
              text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY

      - name: Validate deploy shell
        run: bash -n deploy/spark-cli/apply-db-repairs.sh

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify focused wiring
        run: |
          grep -Fq "import { LockedAccountsPanel } from './LockedAccountsPanel';" src/features/security-settings/components/SecuritySettingsConsole.tsx
          grep -Fq '<LockedAccountsPanel />' src/features/security-settings/components/SecuritySettingsConsole.tsx
          grep -Fq 'purpose="account_security_change"' src/features/security-settings/components/LockedAccountsPanel.tsx
          grep -Fq 'security_admin_unlock_account' src/features/security-settings/services/securitySettingsService.ts

      - name: Publish validated console file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE='src/features/security-settings/components/SecuritySettingsConsole.tsx'
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq '.sha')"
          CONTENT="$(base64 -w0 "$FILE")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
            -f message='feat(security): show locked accounts in account lock section' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main' >/dev/null

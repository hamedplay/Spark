name: video-create-realtime-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify create-room stays in lobby
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/components/VideoConference/VideoConferencePage.tsx', 'utf8');
          const start = source.indexOf('const handleCreate = async');
          const end = source.indexOf('const handleJoinByCode = async');
          if (start < 0 || end < 0 || end <= start) throw new Error('handleCreate block not found');
          const block = source.slice(start, end);
          if (/window\.open|window\.location|location\.assign|location\.replace/.test(block)) {
            throw new Error('handleCreate still performs browser navigation');
          }
          if (!block.includes('setRooms(')) throw new Error('handleCreate does not update lobby state');
          if (!block.includes("setShowCreate(false)")) throw new Error('create form is not closed after success');
          console.log('create-room lobby behavior verified');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit

name: Temporary Fix AirGap TURN Validation Order

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-turn-validation-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TURN validation responsibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_patch_turn_validation.py
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          git diff --check

      - name: Real Coturn listener and STUN smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq coturn >/dev/null
          sudo ip addr add 10.255.255.1/32 dev lo
          secret="$(openssl rand -base64 32 | tr -d '\n')"
          sudo tee /etc/turnserver.conf >/dev/null <<EOF
          listening-port=3478
          listening-ip=10.255.255.1
          relay-ip=10.255.255.1
          fingerprint
          use-auth-secret
          static-auth-secret=${secret}
          realm=10.255.255.1
          server-name=10.255.255.1
          min-port=49160
          max-port=49200
          no-tls
          no-dtls
          no-cli
          no-loopback-peers
          no-multicast-peers
          stale-nonce=600
          EOF
          if sudo grep -q '^TURNSERVER_ENABLED=' /etc/default/coturn 2>/dev/null; then
            sudo sed -i 's/^TURNSERVER_ENABLED=.*/TURNSERVER_ENABLED=1/' /etc/default/coturn
          else
            echo 'TURNSERVER_ENABLED=1' | sudo tee -a /etc/default/coturn >/dev/null
          fi
          sudo systemctl restart coturn
          sleep 1
          sudo ss -lunp | grep -E '10\.255\.255\.1:3478([[:space:]]|$)'
          sudo ss -ltnp | grep -E '10\.255\.255\.1:3478([[:space:]]|$)'
          timeout 8s turnutils_stunclient -L 10.255.255.1 -p 3478 10.255.255.1 | tee /tmp/stun.out
          grep -Eq 'reflexive addr|UDP reflexive addr' /tmp/stun.out

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): validate STUN after firewall setup'
          git push origin HEAD:main

name: Temporary Periodic Follow-up Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-periodic-followup-validate.yml'
      - 'src/components/Minutes/**'
      - 'supabase/functions/process-minutes-reminders/**'
      - 'supabase/migrations/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:minutes-followup-runtime
      - run: npm run test:followup-reminder

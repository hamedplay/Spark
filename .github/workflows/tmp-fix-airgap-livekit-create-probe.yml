name: Temporary Fix Air-Gap LiveKit Create Probe

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-livekit-create-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Step 20 container-create preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_airgap_livekit_create_probe.py
          bash -n deploy/spark-cli/lib/airgap-runtime.sh
          git diff --check

      - name: Validate daemon container-create probe and offline repair
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl start docker
          docker pull busybox:1.36 >/dev/null

          root="$(mktemp -d)"
          mkdir -p "$root/docker"
          printf '%s\n' 'busybox:1.36' >"$root/docker/images.txt"
          docker save busybox:1.36 | gzip -1 >"$root/docker/docker-images.tar.gz"
          printf '%s %s\n' 'busybox:1.36' "$(docker image inspect --format '{{.Id}}' busybox:1.36)" >"$root/docker/image-ids.txt"

          compose_dir="$(mktemp -d)"
          cat >"$compose_dir/compose.yml" <<'YAML'
          services:
            probe:
              image: busybox:1.36
              command: ['true']
          YAML

          export CONFIG_DIR="$(mktemp -d)"
          export SCRIPT_DIR="$PWD/deploy/spark-cli"
          export SPARK_ROOT="$PWD"
          export MANAGER_CONF="$CONFIG_DIR/manager.conf"
          export AIRGAP_REAL_DOCKER="$(command -v docker)"
          export AIRGAP_REAL_NPM="$(command -v npm || true)"
          CURRENT_LOG="$(mktemp)"
          export CURRENT_LOG

          install_step_2(){ :; }; install_step_3(){ :; }; install_step_4(){ :; }
          install_step_10(){ :; }; install_step_11(){ :; }; install_step_13(){ :; }; install_step_17(){ :; }
          install_step_20(){ :; }
          livekit_prepare_nginx_tls(){ :; }; livekit_public_tls_probe(){ :; }; livekit_turn_tls_probe(){ :; }
          fail(){ echo "FAIL: $*" >&2; }; warn(){ :; }; info(){ :; }; ok(){ :; }
          run_logged(){ local _label="$1"; shift; "$@"; }
          run_visible(){ local _label="$1"; shift; "$@"; }
          source deploy/spark-cli/lib/airgap.sh
          source deploy/spark-cli/lib/airgap-runtime.sh

          livekit_compose(){ docker compose -f "$compose_dir/compose.yml" "$@"; }

          report="$(mktemp)"
          list="$root/docker/images.txt"
          airgap_verify_image_list_container_create "$list"
          airgap_livekit_compose_create_probe "$report"

          docker image rm -f busybox:1.36 >/dev/null
          if airgap_verify_image_list_container_create "$list"; then
            echo 'Expected container-create probe to fail after image removal.' >&2
            exit 1
          fi

          airgap_repair_livekit_container_create "$root" "$list"
          airgap_verify_image_list_container_create "$list"
          airgap_livekit_compose_create_probe "$report"
          echo 'Step 20 daemon create-probe repair: PASS'

      - name: Validate Step 20 guard markers
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'livekit_compose create --no-build --pull never' deploy/spark-cli/lib/airgap-runtime.sh
          grep -Fq 'airgap_livekit_create_failure_is_content_store' deploy/spark-cli/lib/airgap-runtime.sh
          grep -Fq 'Repair LiveKit images after container-create failure' deploy/spark-cli/lib/airgap-runtime.sh
          grep -Fq 'install_step_20_online' deploy/spark-cli/lib/airgap-runtime.sh
          echo 'Step 20 create guard markers: PASS'

      - name: Commit minimal runtime fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-runtime.sh
          git commit -m 'fix(airgap): validate LiveKit container creation before runtime'
          git push origin HEAD:main

# rerun after patch guardrail casing correction

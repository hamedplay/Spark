name: Spark CLI M4.3 Bootstrap Integrate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m43-bootstrap-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('deploy/spark-cli/bootstrap.sh'); s=p.read_text(); old='\"$tmp/roles/database/lifecycle\" \"$tmp/roles/database/schema\"'; new=old+' \"$tmp/roles/application/tasks\" \"$tmp/roles/application/build\" \"$tmp/roles/application/deployment\"'; s=s if '\"$tmp/roles/application/build\"' in s else s.replace(old,new,1); marker='roles/application/tasks/__init__.py\\n'; add='roles/application/tasks/build.py\\nroles/application/tasks/deploy.py\\nroles/application/build/__init__.py\\nroles/application/build/manifest.py\\nroles/application/build/identity.py\\nroles/application/build/builder.py\\nroles/application/deployment/__init__.py\\nroles/application/deployment/models.py\\nroles/application/deployment/lock.py\\nroles/application/deployment/nginx.py\\nroles/application/deployment/health.py\\nroles/application/deployment/activator.py\\n'; s=s if 'roles/application/build/builder.py' in s else s.replace(marker,marker+add,1); olds='\"$stage/roles/database/lifecycle\" \"$stage/roles/database/schema\"'; news=olds+' \"$stage/roles/application/tasks\" \"$stage/roles/application/build\" \"$stage/roles/application/deployment\"'; s=s if '\"$stage/roles/application/build\"' in s else s.replace(olds,news,1); root='for file in \"$tmp\"/roles/*.py; do install -m 0644 \"$file\" \"$stage/roles/$(basename \"$file\")\"; done\\n'; loops='for file in \"$tmp\"/roles/application/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/$(basename \"$file\")\"; done\\ninstall -m 0644 \"$tmp/roles/application/manifest.yaml\" \"$stage/roles/application/manifest.yaml\"\\nfor file in \"$tmp\"/roles/application/tasks/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/tasks/$(basename \"$file\")\"; done\\nfor file in \"$tmp\"/roles/application/build/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/build/$(basename \"$file\")\"; done\\nfor file in \"$tmp\"/roles/application/deployment/*.py; do install -m 0644 \"$file\" \"$stage/roles/application/deployment/$(basename \"$file\")\"; done\\n'; s=s if 'for file in \"$tmp\"/roles/application/build/*.py' in s else s.replace(root,root+loops,1); p.write_text(s)"
      - name: Validate bootstrap integration
        run: |
          bash -n deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/build/builder.py' deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/deployment/activator.py' deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/tasks/deploy.py' deploy/spark-cli/bootstrap.sh
          cd deploy/spark-cli
          python3 -m compileall -q roles/application adapters
          python3 -m unittest discover -s tests/application -p 'test_*.py' -v
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Commit bootstrap integration
        run: |
          git config user.name spark-ci
          git config user.email spark-ci@users.noreply.github.com
          git add deploy/spark-cli/bootstrap.sh
          git commit -m 'feat: install M4.3 static deployment modules with spark manager'
          git push origin HEAD:main

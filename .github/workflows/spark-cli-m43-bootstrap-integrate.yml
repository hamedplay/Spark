name: Spark CLI M4.3 Bootstrap Integrate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m43-bootstrap-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/bootstrap.sh')
          s = p.read_text()
          old = '"$tmp/roles/database/lifecycle" "$tmp/roles/database/schema"'
          new = old + ' "$tmp/roles/application/tasks" "$tmp/roles/application/build" "$tmp/roles/application/deployment"'
          if '"$tmp/roles/application/build"' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          marker = 'roles/application/tasks/__init__.py\n'
          additions = '''roles/application/tasks/build.py
roles/application/tasks/deploy.py
roles/application/build/__init__.py
roles/application/build/manifest.py
roles/application/build/identity.py
roles/application/build/builder.py
roles/application/deployment/__init__.py
roles/application/deployment/models.py
roles/application/deployment/lock.py
roles/application/deployment/nginx.py
roles/application/deployment/health.py
roles/application/deployment/activator.py
'''
          if 'roles/application/build/builder.py' not in s:
              assert marker in s
              s = s.replace(marker, marker + additions, 1)
          old_stage = '"$stage/roles/database/lifecycle" "$stage/roles/database/schema"'
          new_stage = old_stage + ' "$stage/roles/application/tasks" "$stage/roles/application/build" "$stage/roles/application/deployment"'
          if '"$stage/roles/application/build"' not in s:
              assert old_stage in s
              s = s.replace(old_stage, new_stage, 1)
          root_loop = 'for file in "$tmp"/roles/*.py; do install -m 0644 "$file" "$stage/roles/$(basename "$file")"; done\n'
          app_loops = '''for file in "$tmp"/roles/application/*.py; do install -m 0644 "$file" "$stage/roles/application/$(basename "$file")"; done
install -m 0644 "$tmp/roles/application/manifest.yaml" "$stage/roles/application/manifest.yaml"
for file in "$tmp"/roles/application/tasks/*.py; do install -m 0644 "$file" "$stage/roles/application/tasks/$(basename "$file")"; done
for file in "$tmp"/roles/application/build/*.py; do install -m 0644 "$file" "$stage/roles/application/build/$(basename "$file")"; done
for file in "$tmp"/roles/application/deployment/*.py; do install -m 0644 "$file" "$stage/roles/application/deployment/$(basename "$file")"; done
'''
          if 'for file in "$tmp"/roles/application/build/*.py' not in s:
              assert root_loop in s
              s = s.replace(root_loop, root_loop + app_loops, 1)
          p.write_text(s)
          PY
      - name: Validate bootstrap integration
        run: |
          bash -n deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/build/builder.py' deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/deployment/activator.py' deploy/spark-cli/bootstrap.sh
          grep -q 'roles/application/tasks/deploy.py' deploy/spark-cli/bootstrap.sh
          cd deploy/spark-cli
          python3 -m compileall -q roles/application adapters
          python3 -m unittest discover -s tests/application -p 'test_*.py' -v
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Commit bootstrap integration
        run: |
          git config user.name spark-ci
          git config user.email spark-ci@users.noreply.github.com
          git add deploy/spark-cli/bootstrap.sh
          git commit -m 'feat: install M4.3 static deployment modules with spark manager'
          git push origin HEAD:main

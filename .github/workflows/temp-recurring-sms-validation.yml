name: Temporary recurring SMS validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Meeting edit notification tests
        run: node --import tsx scripts/test-meeting-edit-real.ts
      - name: Recurrence tests
        run: npm run test:recurrence
      - name: Build
        run: npm run build

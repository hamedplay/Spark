name: phase4-secret-presence-temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-secret-presence-temp.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret names only
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_WS_URL: ${{ secrets.LIVEKIT_WS_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          for name in LIVEKIT_URL LIVEKIT_WS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET SUPABASE_ACCESS_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
            fi
          done

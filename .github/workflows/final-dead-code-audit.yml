# one-time execution trigger
name: One-time final dead-code audit

on:
  push:
    branches: [main]
    paths:
      - scripts/final-dead-code-audit.mjs
      - .github/workflows/final-dead-code-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit current production graph and exact duplicates
        run: node scripts/final-dead-code-audit.mjs
      - name: Build gate
        run: npm run build
      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.final-dead-code-audit.json
          git commit -m "chore: record final dead-code audit" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

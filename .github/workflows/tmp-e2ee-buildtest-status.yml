name: tmp-e2ee-buildtest-status

on:
  push:
    branches: [main]
    paths:
      - '.tmp-e2ee-buildtest-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - id: static
        name: Verify E2EE entry-point scope
        continue-on-error: true
        shell: bash
        run: |
          grep -Fq 'onStartE2EECall?.()' src/components/Chat/Conversation/ConversationHeader.tsx
          grep -Fq 'title="تماس امن E2EE"' src/components/Chat/Conversation/ConversationHeader.tsx
          grep -Fq 'fixed inset-0 z-[9998]' src/components/Chat/E2EECall/index.tsx
          if grep -Fq "from './IdleView'" src/components/Chat/E2EECall/index.tsx; then exit 1; fi
          if grep -Fq '<IdleView' src/components/Chat/E2EECall/index.tsx; then exit 1; fi
          if grep -Fq 'تماس امن E2EE' src/components/Chat/CallHistoryPage.tsx; then exit 1; fi
          grep -Fq 'e2ee-global-inbox-${currentUserId}' src/context/GlobalCallContext.tsx
          grep -Fq 'Global E2EE incoming call overlay' src/context/GlobalCallContext.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm ci

      - id: build
        name: Build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: test
        name: Test
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Record status and cleanup temporary tooling
        shell: bash
        run: |
          git show 377356cf8b6db31a5cdd1b5acfe8f57892d3a59a:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/tmp-e2ee-buildtest-status.yml
          rm -f .tmp-e2ee-buildtest-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: E2EE validation static-${{ steps.static.outcome }} install-${{ steps.install.outcome }} build-${{ steps.build.outcome }} test-${{ steps.test.outcome }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

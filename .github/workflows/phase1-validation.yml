name: Temporary Phase 1 Baseline Verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase1-validation.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Verify notification failure on pre-refactor baseline
        shell: bash
        run: |
          set +e
          git worktree add /tmp/spark-baseline a78ea9b057916f2ae881efab09b43874d394ebe6
          cd /tmp/spark-baseline
          npm ci > /tmp/baseline-ci.log 2>&1
          ci_status=$?
          test_status=99
          if [ "$ci_status" -eq 0 ]; then
            npm run test:notification-model > /tmp/baseline-test.log 2>&1
            test_status=$?
          else
            echo "npm ci failed" > /tmp/baseline-test.log
          fi

          cd "$GITHUB_WORKSPACE"
          {
            echo "baseline_commit=a78ea9b057916f2ae881efab09b43874d394ebe6"
            echo "npm_ci=$ci_status"
            echo "notification_model_test=$test_status"
            echo "--- baseline test tail ---"
            tail -n 100 /tmp/baseline-test.log
          } > .phase1-baseline-validation-result.txt

          git config user.name "spark-phase1-validator"
          git config user.email "spark-phase1-validator@users.noreply.github.com"
          git add .phase1-baseline-validation-result.txt
          git commit -m "chore: record temporary phase1 baseline validation result"
          git push origin HEAD:main

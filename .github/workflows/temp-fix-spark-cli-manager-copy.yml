name: Temporary Spark CLI manager copy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-spark-cli-manager-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch manager installer copy path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/spark')
          text = path.read_text()
          old = '''  install -d -m 0755 /usr/local/lib
  stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"
  chmod 0755 "$stage"
  backup="/usr/local/lib/spark-manager.previous.$$"
  install -d -m 0755 "${stage}/lib" "${stage}/livekit"
  [[ -d "${source_dir}/../livekit" ]] || { fail "Spark LiveKit deployment assets not found next to manager source."; rm -rf "$stage"; return 1; }
  install -m 0755 "${source_dir}/spark" "${stage}/spark"
  install -m 0644 "${source_dir}/spark-ui.py" "${stage}/spark-ui.py"
  install -m 0644 "${source_dir}/spark-ui-core.py" "${stage}/spark-ui-core.py"
  for file in "${source_dir}"/lib/*.sh; do
    install -m 0644 "$file" "${stage}/lib/$(basename "$file")"
  done
  rsync -a --delete "${source_dir}/../livekit/" "${stage}/livekit/"
'''
          new = '''  install -d -m 0755 /usr/local/lib
  stage="$(mktemp -d /usr/local/lib/spark-manager.new.XXXXXX)"
  chmod 0755 "$stage"
  backup="/usr/local/lib/spark-manager.previous.$$"
  cp -a "${source_dir}/." "$stage/"
  chmod 0755 "${stage}/spark"
'''
          if old not in text:
              raise SystemExit('expected manager copy block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Spark CLI package
        run: |
          bash -n deploy/spark-cli/spark
          test -d deploy/spark-cli/livekit
          test -f deploy/spark-cli/livekit/docker-compose.yml
          ! grep -F '${source_dir}/../livekit' deploy/spark-cli/spark
          grep -F 'cp -a "${source_dir}/." "$stage/"' deploy/spark-cli/spark
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/spark
          git commit -m 'fix(cli): simplify manager payload install'
          git push origin HEAD:main

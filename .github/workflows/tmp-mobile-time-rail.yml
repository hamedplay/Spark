name: Temporary mobile time rail validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mobile-time-rail.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate independent time rail
        run: |
          grep -q 'dir="ltr"' src/components/Calendar/WeekView.tsx
          grep -q 'grid-cols-7' src/components/Calendar/WeekView.tsx
          test "$(grep -c 'sticky right-0 z-40' src/components/Calendar/WeekView.tsx)" -ge 3
          ! grep -q 'grid-cols-\[56px_repeat(7,1fr)\]' src/components/Calendar/WeekView.tsx

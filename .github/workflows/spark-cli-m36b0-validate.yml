name: Spark CLI M3.6-B0 Validation

on:
  push:
    branches: [main]
    paths:
      - 'deploy/spark-cli/**'
      - '.github/workflows/spark-cli-m36b0-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax
        working-directory: deploy/spark-cli
        run: |
          python3 -m compileall -q config roles adapters core database_cli.py
      - name: M3.6 schema tests
        working-directory: deploy/spark-cli
        run: |
          python3 -m unittest discover -s tests/database/schema -p 'test_*.py' -v
      - name: Database regression tests
        working-directory: deploy/spark-cli
        run: |
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Core and architecture regression
        working-directory: deploy/spark-cli
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Read-only boundary
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = (Path('roles/database/schema/catalog.py').read_text() + Path('roles/database/schema/live_inventory.py').read_text()).upper()
          assert 'BEGIN READ ONLY' in text
          for forbidden in ('APPLY_MIGRATION', 'COMPOSE_UP('):
              assert forbidden not in text
          print('read-only boundary OK')
          PY
      - name: Patch B0 bootstrap and shared schema loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          boot = Path('deploy/spark-cli/bootstrap.sh')
          text = boot.read_text()
          needle = 'roles/database/schema/fingerprint.py\n'
          addition = 'roles/database/schema/catalog.py\nroles/database/schema/live_inventory.py\n'
          if addition not in text:
              assert needle in text
              text = text.replace(needle, needle + addition, 1)
              boot.write_text(text)

          loader = Path('deploy/spark-cli/config/loader.py')
          text = loader.read_text()
          needle = 'owned_schemas=tuple(str(value).strip().lower() for value in (schema_data.get("owned_schemas", ()) or ()) if str(value).strip()),\n'
          addition = '            shared_schemas=tuple(str(value).strip().lower() for value in (schema_data.get("shared_schemas", ()) or ()) if str(value).strip()),\n'
          if 'shared_schemas=tuple(' not in text:
              assert needle in text
              text = text.replace(needle, needle + addition, 1)
              loader.write_text(text)
          PY
          python3 -m compileall -q deploy/spark-cli/config deploy/spark-cli/roles deploy/spark-cli/database_cli.py
          cd deploy/spark-cli
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit validated integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'spark-ci'
          git config user.email 'spark-ci@users.noreply.github.com'
          git add deploy/spark-cli/bootstrap.sh deploy/spark-cli/config/loader.py
          git commit -m 'feat: install M3.6-B0 live inventory modules'
          git push origin HEAD:main

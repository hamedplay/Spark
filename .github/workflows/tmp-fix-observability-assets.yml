name: Temporary Fix Observability Assets

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-observability-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch observability asset delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_observability_assets.py
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          git diff --check

      - name: Validate bootstrap downloads complete monitoring tree
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            monitoring/prometheus.yml \
            monitoring/rules/livekit-alerts.yml \
            monitoring/alertmanager.yml \
            monitoring/blackbox.yml \
            monitoring/loki.yml \
            monitoring/alloy.alloy \
            monitoring/grafana/provisioning/datasources/datasources.yml \
            monitoring/grafana/provisioning/dashboards/dashboards.yml \
            monitoring/grafana/dashboards/spark-livekit-overview.json \
            monitoring/grafana/dashboards/spark-livekit-operations.json \
            monitoring/targets/blackbox.json; do
            grep -Fq "$file" deploy/spark-cli/bootstrap.sh
          done
          grep -Fq 'install -d -m 0755 "$(dirname "${tmp}/livekit/${file}")"' deploy/spark-cli/bootstrap.sh
          echo 'Bootstrap observability assets: PASS'

      - name: Validate targeted Step 22 self-heal semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deploy/spark-cli/lib/airgap-ip.sh').read_text()
          assert 'livekit_airgap_sync_observability_assets()' in s
          start=s.index('livekit_airgap_sync_observability_assets()')
          end=s.index('\nlivekit_airgap_observability_config_ready()', start)
          helper=s[start:end]
          assert 'rsync -a --delete' in helper
          assert '${LIVEKIT_SOURCE_DIR}/monitoring' in helper
          assert '${LIVEKIT_ROOT}/monitoring/' in helper
          assert 'LIVEKIT_ENV' not in helper
          assert 'docker-compose.airgap-ip.yml' not in helper
          step=s[s.index('install_step_22() {'):s.index('\nairgap_status() {', s.index('install_step_22() {'))]
          assert step.index('Sync bundled observability assets') < step.index('Generate observability HTTP targets')
          print('Targeted observability self-heal: PASS')
          PY

      - name: Runtime-test monitoring sync isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$(mktemp -d)"
          dst="$(mktemp -d)"
          mkdir -p "$src/monitoring/grafana/dashboards" "$src/monitoring/targets" "$dst/monitoring" "$dst/certs"
          printf 'prometheus\n' >"$src/monitoring/prometheus.yml"
          printf '{}\n' >"$src/monitoring/grafana/dashboards/spark-livekit-overview.json"
          printf '[]\n' >"$src/monitoring/targets/blackbox.json"
          printf 'keep-env\n' >"$dst/.env"
          printf 'keep-override\n' >"$dst/docker-compose.airgap-ip.yml"
          printf 'stale\n' >"$dst/monitoring/stale.txt"

          python3 - deploy/spark-cli/lib/airgap-ip.sh <<'PY' >/tmp/obs-sync-helper.sh
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          start=s.index('livekit_airgap_sync_observability_assets() {')
          end=s.index('\nlivekit_airgap_observability_config_ready()', start)
          print(s[start:end])
          PY

          cat >/tmp/obs-sync-harness.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          LIVEKIT_SOURCE_DIR="$1"
          LIVEKIT_ROOT="$2"
          CURRENT_LOG="$(mktemp)"
          source /tmp/obs-sync-helper.sh
          livekit_airgap_sync_observability_assets
          SH
          bash /tmp/obs-sync-harness.sh "$src" "$dst"

          test -f "$dst/monitoring/prometheus.yml"
          test -f "$dst/monitoring/grafana/dashboards/spark-livekit-overview.json"
          test ! -e "$dst/monitoring/stale.txt"
          grep -Fxq 'keep-env' "$dst/.env"
          grep -Fxq 'keep-override' "$dst/docker-compose.airgap-ip.yml"
          echo 'Runtime monitoring sync isolation: PASS'

      - name: Commit minimal fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/bootstrap.sh deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): restore observability assets before Step 22'
          git pull --rebase origin main
          git push origin HEAD:main

name: Temporary Manager progress check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-progress-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap syntax and progress flags
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/bootstrap.sh
          grep -Fq -- '--progress-bar' deploy/spark-cli/bootstrap.sh
          grep -Fq "[1/3]" deploy/spark-cli/bootstrap.sh
          grep -Fq "[2/3]" deploy/spark-cli/bootstrap.sh
          grep -Fq "[3/3]" deploy/spark-cli/bootstrap.sh
      - name: Run real install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh | sudo bash
          /usr/local/bin/spark --version

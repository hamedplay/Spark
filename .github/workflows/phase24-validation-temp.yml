name: phase24-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Video conference contract and unit tests
        run: npm run test:video-conference

      - name: Runtime runner syntax
        run: |
          node --check tests/video-conference/runtime/phase24IntegrationRuntime.mjs
          node --check tests/video-conference/e2e/phase24ConferenceE2E.mjs
          bash -n tests/video-conference/e2e/run-phase24-e2e.sh
          bash -n tests/video-conference/load/run-phase24-livekit-load.sh
          bash -n deploy/spark-cli/lib/install-livekit.sh

      - name: Integration runner fails closed without credentials
        run: |
          set +e
          node tests/video-conference/runtime/phase24IntegrationRuntime.mjs > /tmp/phase24-integration.out 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "integration runner unexpectedly succeeded without credentials"
            exit 1
          fi
          grep -q "Missing required environment variable" /tmp/phase24-integration.out

      - name: Playwright browser tooling
        run: |
          docker run --rm --init --ipc=host             --entrypoint bash             mcr.microsoft.com/playwright:v1.62.0-noble             -lc '
              set -euo pipefail
              work=/tmp/phase24-playwright
              mkdir -p "$work"
              cd "$work"
              npm init -y >/dev/null
              npm install --no-save --no-audit --no-fund playwright@1.62.0 >/dev/null
              node --input-type=module -e "
                import { chromium } from \"playwright\";
                const browser = await chromium.launch({
                  headless: true,
                  args: [\"--no-sandbox\"],
                });
                console.log(await browser.version());
                await browser.close();
              "
            '

      - name: LiveKit CLI load tooling
        env:
          PHASE24_LOAD_DRY_RUN: "1"
        run: bash tests/video-conference/load/run-phase24-livekit-load.sh

      - name: Build
        run: npm run build

name: Temporary TypeScript 7 compatibility test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-typescript7-compat.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Try TypeScript 7
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev typescript@7.0.2
          npm ls typescript @typescript-eslint/parser @typescript-eslint/eslint-plugin typescript-eslint

      - name: Build with TypeScript 7
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Smoke tests with TypeScript 7
        shell: bash
        run: |
          set -euo pipefail
          npm run test:recurrence
          npm run test:meeting-record
          npm run test:calendar-url
          npm run test:meeting-prefill
          npm run test:layout-presence
          npm run test:user-preferences-mapping
          npm run test:user-preferences-lifecycle

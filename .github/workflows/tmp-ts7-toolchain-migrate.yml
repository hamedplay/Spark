name: Temporary TypeScript 7 toolchain migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-ts7-toolchain-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Replace ESLint stack with Oxlint and TypeScript 7
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --save-dev             @eslint/js             @typescript-eslint/eslint-plugin             @typescript-eslint/parser             eslint             eslint-plugin-react-hooks             eslint-plugin-react-refresh             globals             typescript-eslint
          npm install --save-dev oxlint@latest typescript@7.0.2
          npm pkg set scripts.lint='oxlint . --deny-warnings'

      - name: Clean install
        run: npm ci

      - name: Verify tool versions without running lint
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --version
          node node_modules/oxlint/bin/oxlint --version
          node -e "JSON.parse(require('fs').readFileSync('.oxlintrc.json','utf8')); console.log('oxlint config json ok')"

      - name: Build with TypeScript 7
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:recurrence
          npm run test:meeting-record
          npm run test:calendar-url
          npm run test:meeting-prefill
          npm run test:layout-presence
          npm run test:user-preferences-mapping
          npm run test:user-preferences-lifecycle

      - name: Confirm direct dependencies are current
        shell: bash
        run: npm outdated || true

      - name: Commit migrated toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes."
            exit 0
          fi
          git commit -m "refactor: migrate toolchain to TypeScript 7"
          git push origin HEAD:main

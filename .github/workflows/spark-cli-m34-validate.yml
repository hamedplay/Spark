# validation-revision: 2
name: spark-cli-m34-validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m34-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate M3.4 modules into bootstrap staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/bootstrap.sh')
          text = path.read_text()

          old = 'mkdir -p "$tmp/lib" "$tmp/livekit" "$tmp/architecture" "$tmp/config/environments" "$tmp/roles/database/tasks" "$tmp/secrets" "$tmp/roles/database/package"'
          new = old + ' "$tmp/adapters" "$tmp/roles/database/runtime"'
          if '"$tmp/roles/database/runtime"' not in text:
              if old not in text: raise SystemExit('tmp dir anchor missing')
              text = text.replace(old, new, 1)

          anchor = 'secrets/models.py\n'
          additions = (
              anchor
              + 'adapters/__init__.py\n'
              + 'adapters/command.py\n'
              + 'adapters/apt.py\n'
              + 'adapters/systemd.py\n'
              + 'adapters/docker.py\n'
              + 'roles/database/runtime/__init__.py\n'
              + 'roles/database/runtime/models.py\n'
              + 'roles/database/runtime/detector.py\n'
              + 'roles/database/runtime/installer.py\n'
              + 'roles/database/runtime/firewall.py\n'
              + 'roles/database/runtime/env_builder.py\n'
              + 'roles/database/runtime/compose.py\n'
              + 'roles/database/tasks/runtime.py\n'
              + 'roles/database/tasks/compose.py\n'
          )
          if 'roles/database/runtime/detector.py\n' not in text:
              if anchor not in text: raise SystemExit('file list anchor missing')
              text = text.replace(anchor, additions, 1)

          old = 'install -d -m 0755 "$stage/lib" "$stage/livekit" "$stage/architecture" "$stage/config/environments" "$stage/roles/database/tasks" "$stage/secrets" "$stage/roles/database/package"'
          new = old + ' "$stage/adapters" "$stage/roles/database/runtime"'
          if '"$stage/roles/database/runtime"' not in text:
              if old not in text: raise SystemExit('stage dir anchor missing')
              text = text.replace(old, new, 1)

          anchor = 'for file in "$tmp"/secrets/*.py; do install -m 0644 "$file" "$stage/secrets/$(basename "$file")"; done\n'
          additions = (
              anchor
              + 'for file in "$tmp"/adapters/*.py; do install -m 0644 "$file" "$stage/adapters/$(basename "$file")"; done\n'
              + 'for file in "$tmp"/roles/database/runtime/*.py; do install -m 0644 "$file" "$stage/roles/database/runtime/$(basename "$file")"; done\n'
          )
          if 'stage/roles/database/runtime/$(basename "$file")' not in text:
              if anchor not in text: raise SystemExit('stage copy anchor missing')
              text = text.replace(anchor, additions, 1)

          path.write_text(text)
          PY
          bash -n deploy/spark-cli/bootstrap.sh
          git diff --check

      - name: Python syntax
        working-directory: deploy/spark-cli
        run: python3 -m py_compile adapters/*.py config/*.py secrets/*.py roles/database/*.py roles/database/package/*.py roles/database/runtime/*.py roles/database/tasks/*.py

      - name: Phase 0 baseline smoke tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.smoke.test_manager_baseline -v
      - name: Phase 1 workflow core tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v
      - name: Phase 2 architecture tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -v
      - name: M3 role regression tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/roles -v
      - name: M3 secrets regression tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/secrets -v
      - name: Database package runtime and compose tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/database -v

      - name: Validate architecture profiles
        working-directory: deploy/spark-cli
        run: |
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.staging.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.airgap.yaml python3 spark-architecture validate >/dev/null

      - name: Verify M3.4 source never starts or pulls services
        working-directory: deploy/spark-cli
        run: |
          if grep -REn 'docker compose (up|pull)|docker run' roles/database/runtime roles/database/tasks/runtime.py roles/database/tasks/compose.py; then
            echo 'M3.4 source contains forbidden service/image lifecycle command' >&2
            exit 1
          fi

      - name: Real pinned compose materialization and validation
        working-directory: deploy/spark-cli
        run: |
          before_containers="$(docker ps -aq | sort || true)"
          before_images="$(docker images -q | sort -u || true)"
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from config.models import DatabaseConfig, EnvironmentConfig, NodeConfig, SupabasePackageConfig
          from roles.database.package.manager import SupabasePackageManager, SupabasePackageSpec
          from roles.database.runtime.compose import DatabaseComposeManager
          from secrets.file_provider import FileSecretProvider
          from secrets.generator import SupabaseUpstreamSecretGenerator
          from secrets.models import REQUIRED_DATABASE_SECRETS

          with tempfile.TemporaryDirectory() as tmpdir:
              base = Path(tmpdir)
              destination = base / 'supabase'
              spec = SupabasePackageSpec('self-hosted/v0.8.1', 'https://github.com/supabase/supabase.git', destination)
              SupabasePackageManager().materialize(spec)
              provider = FileSecretProvider(base / 'secrets' / 'database.env')
              generated = SupabaseUpstreamSecretGenerator(destination / 'vendor' / 'upstream').generate()
              provider.set('DASHBOARD_USERNAME', 'supabase')
              for key, value in generated.items(): provider.set(key, value)
              missing = [key for key in REQUIRED_DATABASE_SECRETS if not provider.exists(key)]
              assert not missing, missing
              profile = EnvironmentConfig(
                  name='integration',
                  nodes={
                      'reverse_proxy': NodeConfig(role='reverse_proxy', host='10.10.0.1'),
                      'application': NodeConfig(role='application', host='10.10.0.2'),
                      'database': NodeConfig(role='database', host='10.10.0.3'),
                  },
                  database=DatabaseConfig(
                      supabase=SupabasePackageConfig(release='self-hosted/v0.8.1', destination=str(destination)),
                      secret_file=str(base / 'secrets' / 'database.env'),
                  ),
              )
              manager = DatabaseComposeManager()
              assert manager.materialize(profile, provider) is True
              assert manager.materialize(profile, provider) is False
              result = manager.verify(profile)
              assert result['valid'] is True
              assert result['edge_functions'] is False
              assert (destination / '.env').stat().st_mode & 0o777 == 0o600
              assert 'functions' not in manager.docker.compose_services(destination, destination / '.env')
          PY
          after_containers="$(docker ps -aq | sort || true)"
          after_images="$(docker images -q | sort -u || true)"
          test "$before_containers" = "$after_containers"
          test "$before_images" = "$after_images"

      - name: UI regression self-test
        working-directory: deploy/spark-cli
        run: python3 spark-ui.py --self-test
      - name: Bootstrap structural checks
        working-directory: deploy/spark-cli
        run: |
          bash -n bootstrap.sh
          grep -Fq 'adapters/docker.py' bootstrap.sh
          grep -Fq 'roles/database/runtime/detector.py' bootstrap.sh
          grep -Fq 'roles/database/runtime/compose.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/runtime.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/compose.py' bootstrap.sh
      - name: Commit bootstrap integration after validation
        run: |
          if ! git diff --quiet -- deploy/spark-cli/bootstrap.sh; then
            git config user.name "spark-m34-bot"
            git config user.email "spark-m34-bot@users.noreply.github.com"
            git add deploy/spark-cli/bootstrap.sh
            git commit -m "feat: install M3.4 runtime modules with spark manager"
            git push origin HEAD:main
          fi

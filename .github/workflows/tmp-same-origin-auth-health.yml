name: Temporary same-origin auth health validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-same-origin-auth-health.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate same-origin health helper
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/same-origin.sh
          grep -Fq 'spark_same_origin_auth_health()' deploy/spark-cli/lib/same-origin.sh
          grep -Fq -- '-H "apikey: ${anon}"' deploy/spark-cli/lib/same-origin.sh
          grep -Fq -- '-H "Authorization: Bearer ${anon}"' deploy/spark-cli/lib/same-origin.sh
          grep -Fq 'spark_same_origin_auth_health || return 1' deploy/spark-cli/lib/same-origin.sh
          echo SAME_ORIGIN_AUTH_HEALTH_PASS

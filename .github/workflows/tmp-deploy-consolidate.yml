name: Temporary deploy consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate deploy tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Spark Deploy Consolidator'
          git config user.email 'actions@users.noreply.github.com'

          test -d deploy/spark-cli
          test -d deploy/livekit
          test -f deploy/spark-build.yaml

          git mv deploy/livekit deploy/spark-cli/livekit
          git mv deploy/spark-build.yaml deploy/spark-cli/spark-build.yaml
          git rm -r deploy/manual-production deploy/production

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'deploy/livekit': 'deploy/spark-cli/livekit',
              'deploy/spark-build.yaml': 'deploy/spark-cli/spark-build.yaml',
          }
          skip = {Path('.git')}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated path references:')
          for item in changed:
              print(' -', item)
          PY

          test -d deploy/spark-cli/livekit
          test -f deploy/spark-cli/spark-build.yaml
          test ! -e deploy/livekit
          test ! -e deploy/spark-build.yaml
          test ! -e deploy/manual-production
          test ! -e deploy/production

          if grep -RIn --exclude-dir=.git -E 'deploy/(livekit|spark-build\.yaml)' .; then
            echo 'ERROR: stale pre-consolidation deploy path remains' >&2
            exit 1
          fi

          if grep -RIn --exclude-dir=.git -E 'deploy/(manual-production|production)(/|\b)' .; then
            echo 'ERROR: references to removed legacy deployment trees remain' >&2
            exit 1
          fi

      - name: Validate Spark Manager structure
        shell: bash
        run: |
          set -Eeuo pipefail
          find deploy/spark-cli -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/spark-airgap
          bash -n deploy/spark-cli/spark-migrate
          python3 -m compileall -q deploy/spark-cli
          cd deploy/spark-cli
          PYTHONPATH=. python3 -m unittest discover -s tests/application -p 'test_m43_static_build_deploy.py'
          PYTHONPATH=. python3 -m unittest discover -s tests/architecture -p 'test_*.py'

      - name: Validate frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build

      - name: Commit consolidation and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-deploy-consolidate.yml
          git add -A
          git status --short
          git commit -m 'refactor: consolidate Spark deployment tooling'
          git push origin HEAD:main

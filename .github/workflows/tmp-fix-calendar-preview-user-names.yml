name: Temporary calendar preview user-name fix

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-calendar-preview-user-names.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply scoped patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/CalendarPageCore.tsx')
          text = path.read_text()
          old = """      showMeetingForm ||\n      detailMeeting !== null\n    ) {\n      setOrgUsersEnabled(true);\n    }\n  }, [showCalendarList, showSubscriptionsModal, showMeetingForm, detailMeeting]);"""
          new = """      showMeetingForm ||\n      detailMeeting !== null ||\n      previewMeeting !== null\n    ) {\n      setOrgUsersEnabled(true);\n    }\n  }, [showCalendarList, showSubscriptionsModal, showMeetingForm, detailMeeting, previewMeeting]);"""
          if old not in text:
              raise SystemExit('expected org-user lazy-load block not found')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one target block')
          path.write_text(text.replace(old, new, 1))

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- src/components/CalendarPageCore.tsx
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/components/CalendarPageCore.tsx"
          grep -F 'previewMeeting !== null' src/components/CalendarPageCore.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          rm .github/workflows/tmp-fix-calendar-preview-user-names.yml
          git add src/components/CalendarPageCore.tsx .github/workflows/tmp-fix-calendar-preview-user-names.yml
          git commit -m 'fix(calendar): resolve preview participant names'
          git push origin main

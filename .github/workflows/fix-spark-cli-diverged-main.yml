name: Temporary Spark CLI divergence fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-spark-cli-diverged-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Spark CLI divergence handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old_lines, new_lines, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = '\n'.join(old_lines) + '\n'
              new = '\n'.join(new_lines) + '\n'
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'deploy/spark-cli/lib/update.sh',
              ['  local old_sha target_sha stage backup validation_image=""', '  local functions_next="" functions_prev="" frontend_next="" frontend_prev=""', '  local runtime_switched=0 update_success=0 source_advanced=0'],
              ['  local old_sha target_sha stage backup validation_image="" recovery_ref=""', '  local functions_next="" functions_prev="" frontend_next="" frontend_prev=""', '  local runtime_switched=0 update_success=0 source_advanced=0 history_diverged=0'],
              'update locals',
          )
          replace_once(
              'deploy/spark-cli/lib/update.sh',
              ['  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then', '    fail "origin/main نسبت به نسخه فعلی fast-forward نیست؛ Update خودکار برای جلوگیری از rewrite متوقف شد."', '    return 1', '  fi'],
              ['  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then', '    history_diverged=1', '    warn "تاریخچه local main با origin/main هم‌خط نیست؛ پس از staging/validation کامل، checkout مدیریت‌شده با حفظ recovery ref به origin/main همگام می‌شود."', '  fi'],
              'update divergence guard',
          )
          replace_once(
              'deploy/spark-cli/lib/update.sh',
              ['  if [[ "$old_sha" != "$target_sha" ]]; then', '    run_logged "Fast-forward /opt/spark به origin/main" git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1', '    source_advanced=1', '  fi'],
              ['  if [[ "$old_sha" != "$target_sha" ]]; then', '    if (( history_diverged == 1 )); then', '      recovery_ref="refs/spark-manager/recovery/update-$(date +%Y%m%d-%H%M%S)-${old_sha:0:12}"', '      run_logged "حفظ recovery ref برای source قبلی" git -C "$SPARK_ROOT" update-ref "$recovery_ref" "$old_sha" || return 1', '      run_logged "همگام‌سازی managed checkout با origin/main" git -C "$SPARK_ROOT" reset --hard "$target_sha" || return 1', '      info "Recovery ref: ${recovery_ref}"', '    else', '      run_logged "Fast-forward /opt/spark به origin/main" git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1', '    fi', '    source_advanced=1', '  fi'],
              'update source advance',
          )
          replace_once(
              'deploy/spark-cli/lib/install-base.sh',
              ['    run_logged "Fetch آخرین Spark main" git -C "$SPARK_ROOT" fetch origin main || return 1', '    run_logged "Checkout Spark main" git -C "$SPARK_ROOT" checkout main || return 1', '    run_logged "Fast-forward Spark main" git -C "$SPARK_ROOT" pull --ff-only origin main || return 1'],
              ['    run_logged "Fetch آخرین Spark main" git -C "$SPARK_ROOT" fetch origin main || return 1', '    run_logged "Checkout Spark main" git -C "$SPARK_ROOT" checkout main || return 1', '    local current_sha target_sha recovery_ref', '    current_sha="$(git -C "$SPARK_ROOT" rev-parse HEAD)" || return 1', '    target_sha="$(git -C "$SPARK_ROOT" rev-parse origin/main)" || return 1', '    if [[ "$current_sha" != "$target_sha" ]]; then', '      if git -C "$SPARK_ROOT" merge-base --is-ancestor "$current_sha" "$target_sha"; then', '        run_logged "Fast-forward Spark main" git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1', '      else', '        recovery_ref="refs/spark-manager/recovery/install-$(date +%Y%m%d-%H%M%S)-${current_sha:0:12}"', '        run_logged "حفظ recovery ref برای Spark source قبلی" git -C "$SPARK_ROOT" update-ref "$recovery_ref" "$current_sha" || return 1', '        warn "تاریخچه Spark main بازنویسی شده یا checkout روی lineage قدیمی است؛ managed checkout به origin/main همگام می‌شود."', '        run_logged "همگام‌سازی Spark main با origin/main" git -C "$SPARK_ROOT" reset --hard "$target_sha" || return 1', '        info "Recovery ref: ${recovery_ref}"', '      fi', '    fi'],
              'install step 3',
          )

          ui = Path('deploy/spark-cli/spark-ui-core.py')
          text = ui.read_text(encoding='utf-8')
          old = 'Action("app-update", "Update Spark", "Fast-forward only application/runtime update with staging and rollback; database is never inspected or modified.", "confirm"),'
          new = 'Action("app-update", "Update Spark", "Validated application/runtime update with staging, rollback, and controlled recovery from rewritten main history; database is never inspected or modified.", "confirm"),'
          if old not in text:
              raise SystemExit('UI app-update anchor not found')
          ui.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax
        shell: bash
        run: |
          bash -n deploy/spark-cli/lib/update.sh
          bash -n deploy/spark-cli/lib/install-base.sh
          python3 -m py_compile deploy/spark-cli/spark-ui-core.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-spark-cli-diverged-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/spark-cli/lib/update.sh deploy/spark-cli/lib/install-base.sh deploy/spark-cli/spark-ui-core.py .github/workflows/fix-spark-cli-diverged-main.yml
          git commit -m "fix: recover spark-cli updates from rewritten main history [skip ci]"
          git push origin HEAD:main

name: Temporary calendar timeline global overlay fix

on:
  push:
    paths:
      - '.github/workflows/temporary-calendar-timeline-global-overlay-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Raise full-grid timeline above meeting cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Calendar/MultiDayView.tsx')
          text = path.read_text()
          old = 'style={{ top: `${top}px`, zIndex: 5 }}'
          new = 'style={{ top: `${top}px`, zIndex: 900 }}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one full-grid timeline zIndex 5 marker, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate timeline layers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'style={{ top: `${top}px`, zIndex: 900 }}' src/components/Calendar/MultiDayView.tsx
          grep -Fq 'style={{ top: `${top}px`, zIndex: 1000 }}' src/components/Calendar/MultiDayView.tsx
          grep -Fq 'zIndex: (isBeingDragged || isBeingResized) ? 30 : blockZIndex' src/components/Calendar/CalendarViewShared.tsx

      - name: Build validation
        run: |
          npm ci
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spark-automation'
          git config user.email 'spark-automation@users.noreply.github.com'
          git add src/components/Calendar/MultiDayView.tsx
          git commit -m 'fix(calendar): keep full timeline above meetings'
          git push origin HEAD:main

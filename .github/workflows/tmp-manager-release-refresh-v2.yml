name: Temporary Manager Release Refresh V2

on:
  push:
    paths:
      - '.github/workflows/tmp-manager-release-refresh-v2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified manager release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          NEW = '3.1.0+20260910.1'
          R = Path('deploy/spark-cli')

          def read(name): return (R/name).read_text(encoding='utf-8')
          def write(name, text): (R/name).write_text(text, encoding='utf-8')
          def sub1(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1, flags=re.M)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return out

          t = read('spark')
          write('spark', sub1(t, r'^SPARK_MANAGER_VERSION="[^"]+"$', f'SPARK_MANAGER_VERSION="{NEW}"', 'spark version'))

          t = read('spark-airgap')
          write('spark-airgap', sub1(t, r'^SPARK_MANAGER_VERSION="[^"]+"$', f'SPARK_MANAGER_VERSION="{NEW}"', 'airgap version'))

          t = read('bootstrap.sh')
          t = sub1(t, r'^EXPECTED_VERSION="[^"]+"$', f'EXPECTED_VERSION="{NEW}"', 'bootstrap version')
          t = sub1(t, r'^EXPECTED_UI_VERSION="[^"]+"$', f'EXPECTED_UI_VERSION="{NEW}"', 'bootstrap ui version')
          marker = '''grep -Fq "SPARK_UI_VERSION = \\"${EXPECTED_UI_VERSION}\\"" "$tmp/spark-ui.py" || {\n  echo "Spark UI version validation failed." >&2\n  exit 1\n}\n'''
          if 'Spark UI core version validation failed.' not in t:
              if marker not in t: raise SystemExit('bootstrap UI check marker missing')
              t = t.replace(marker, marker + '''grep -Fq "SPARK_UI_VERSION = \\"${EXPECTED_UI_VERSION}\\"" "$tmp/spark-ui-core.py" || {\n  echo "Spark UI core version validation failed." >&2\n  exit 1\n}\n''', 1)
          write('bootstrap.sh', t)

          t = read('bootstrap-airgap.sh')
          t = sub1(t, r'^EXPECTED_VERSION="[^"]+"$', f'EXPECTED_VERSION="{NEW}"', 'airgap bootstrap version')
          if 'EXPECTED_UI_VERSION=' in t:
              t = sub1(t, r'^EXPECTED_UI_VERSION="[^"]+"$', f'EXPECTED_UI_VERSION="{NEW}"', 'airgap bootstrap ui version')
          else:
              t = t.replace(f'EXPECTED_VERSION="{NEW}"\n', f'EXPECTED_VERSION="{NEW}"\nEXPECTED_UI_VERSION="{NEW}"\n', 1)
          marker = 'python3 "$source_dir/spark-ui.py" --self-test\n'
          if 'Unexpected Spark UI core version.' not in t:
              if marker not in t: raise SystemExit('airgap bootstrap UI check marker missing')
              t = t.replace(marker, marker + '''grep -Fq "SPARK_UI_VERSION = \\"${EXPECTED_UI_VERSION}\\"" "$source_dir/spark-ui.py" || { echo "Unexpected Spark UI adapter version." >&2; exit 1; }\ngrep -Fq "SPARK_UI_VERSION = \\"${EXPECTED_UI_VERSION}\\"" "$source_dir/spark-ui-core.py" || { echo "Unexpected Spark UI core version." >&2; exit 1; }\n''', 1)
          write('bootstrap-airgap.sh', t)

          t = read('spark-ui.py')
          t = sub1(t, r'^SPARK_UI_VERSION = "[^"]+"$', f'SPARK_UI_VERSION = "{NEW}"', 'adapter version')
          t, n = re.subn(r'(?m)^\s*assert SPARK_UI_VERSION == "[^"]+"\s*$', f'    assert SPARK_UI_VERSION == "{NEW}"\n    assert core.SPARK_UI_VERSION == SPARK_UI_VERSION', t, count=1)
          if n != 1: raise SystemExit(f'adapter self-test version assertion: {n}')
          write('spark-ui.py', t)

          t = read('spark-ui-core.py')
          t = sub1(t, r'^SPARK_UI_VERSION = "[^"]+"$', f'SPARK_UI_VERSION = "{NEW}"', 'core version')
          t = t.replace('"""Spark Server Manager v2 single-screen curses UI.', '"""Spark Server Manager v3.1 single-screen curses UI.', 1)
          t, n = re.subn(r'(?m)^\s*assert SPARK_UI_VERSION == "[^"]+"\s*$', f'    assert SPARK_UI_VERSION == "{NEW}"', t, count=1)
          if n != 1: raise SystemExit(f'core self-test version assertion: {n}')

          cleanup = '''    ("Cleanup / Remove", [
              Action("cleanup-database", "Delete Database data", "Stop Supabase and delete only the detected PostgreSQL data bind. The operation refuses to guess the data path.", "confirm"),
              Action("cleanup-supabase", "Delete Supabase runtime", "Delete the complete local Supabase runtime, volumes/data, runtime configuration and runtime secrets.", "confirm"),
              Action("cleanup-frontend", "Delete deployed Frontend", "Delete /var/www/spark only; the local Spark source repository remains.", "confirm"),
              Action("cleanup-source", "Delete Spark source", "Delete the local /opt/spark repository; GitHub and the installed Spark Manager remain.", "confirm"),
              Action("cleanup-logs", "Delete Manager logs", "Delete Spark Manager logs only; system journal and Docker logs are not changed.", "confirm"),
              Action("cleanup-backups", "Backup cleanup / free space", "Safely prune old Spark backups with a configurable retention period, or explicitly delete all retained backups.", "confirm"),
              Action("cleanup-history", "Reset install history", "Clear installation-step DONE markers only. Runtime data and live service state are not changed.", "confirm"),
              Action("cleanup-livekit", "Delete LiveKit runtime", "Remove only the LiveKit runtime and secrets, then restore the legacy Coturn fallback.", "confirm"),
              Action("cleanup-full", "Delete complete Spark project", "Remove Spark-specific runtime, data, configuration, certificates, schedulers, TURN, source, logs and backups while keeping the Manager and shared OS packages.", "confirm"),
              Action("cleanup-manager", "Uninstall Spark Manager", "Remove the installed Spark Manager and /usr/local/bin/spark only; the project runtime is left untouched.", "confirm"),
          ]),
          ("Certificates", ['''
          pat = re.compile(r'    \("Cleanup / Remove", \[\n.*?\n    \]\),\n    \("Certificates", \[', re.S)
          t, n = pat.subn(cleanup, t, count=1)
          if n != 1: raise SystemExit(f'core cleanup registry: {n}')
          write('spark-ui-core.py', t)
          PY

      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          NEW='3.1.0+20260910.1'
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/spark-airgap
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/bootstrap-airgap.sh
          for f in deploy/spark-cli/lib/*.sh; do bash -n "$f"; done

          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for f in ('deploy/spark-cli/spark-ui.py','deploy/spark-cli/spark-ui-core.py'):
              compile(Path(f).read_text(encoding='utf-8'), f, 'exec')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/spark-cli/spark-ui.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import importlib.util, re, sys
          from pathlib import Path
          NEW='3.1.0+20260910.1'
          p=Path('deploy/spark-cli/spark-ui.py')
          s=importlib.util.spec_from_file_location('spark_ui_validation', p)
          m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          m.patch_categories()
          assert m.SPARK_UI_VERSION == NEW
          assert m.core.SPARK_UI_VERSION == NEW
          c=[x for x in m.core.CATEGORIES if x[0]=='Cleanup / Remove']
          assert len(c)==1 and len(c[0][1])==10
          assert [a.action_id for a in c[0][1]] == ['cleanup-database','cleanup-supabase','cleanup-frontend','cleanup-source','cleanup-logs','cleanup-backups','cleanup-history','cleanup-livekit','cleanup-full','cleanup-manager']
          bad=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          assert not any(bad.search(a.label+a.description) for a in c[0][1])
          print('MANAGER_RELEASE=' + NEW)
          print('CLEANUP_ACTIONS=10')
          print('VALIDATION=PASS')
          PY

          rm -rf deploy/spark-cli/__pycache__
          grep -Fq "SPARK_MANAGER_VERSION=\"${NEW}\"" deploy/spark-cli/spark
          grep -Fq "SPARK_MANAGER_VERSION=\"${NEW}\"" deploy/spark-cli/spark-airgap
          grep -Fq "EXPECTED_VERSION=\"${NEW}\"" deploy/spark-cli/bootstrap.sh
          grep -Fq "EXPECTED_UI_VERSION=\"${NEW}\"" deploy/spark-cli/bootstrap.sh
          grep -Fq "EXPECTED_VERSION=\"${NEW}\"" deploy/spark-cli/bootstrap-airgap.sh
          grep -Fq "EXPECTED_UI_VERSION=\"${NEW}\"" deploy/spark-cli/bootstrap-airgap.sh
          grep -Fq "SPARK_UI_VERSION = \"${NEW}\"" deploy/spark-cli/spark-ui.py
          grep -Fq "SPARK_UI_VERSION = \"${NEW}\"" deploy/spark-cli/spark-ui-core.py
          if grep -R -n -E '2\.1\.0\+20260821\.1|SPARK_MANAGER_VERSION="3\.0\.0"|SPARK_UI_VERSION = "3\.0\.0"|EXPECTED_VERSION="3\.0\.0"|EXPECTED_UI_VERSION="3\.0\.0"' deploy/spark-cli --exclude='spark-migrate'; then
            echo 'Stale manager version marker found.' >&2
            exit 1
          fi

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/spark deploy/spark-cli/spark-airgap deploy/spark-cli/bootstrap.sh deploy/spark-cli/bootstrap-airgap.sh deploy/spark-cli/spark-ui.py deploy/spark-cli/spark-ui-core.py
          git diff --cached --check
          git commit -m 'release(manager): v3.1.0 unified UI and Cleanup'
          git push origin HEAD:main

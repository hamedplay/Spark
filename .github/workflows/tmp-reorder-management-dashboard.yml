name: Temporary management dashboard reorder

on:
  push:
    branches: [main]
    paths:
      - 'tmp/management-dashboard-reorder-trigger.txt'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - id: transform
        name: Reorder dashboard panels only
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/ManagementDashboardPage.tsx')
          text = path.read_text(encoding='utf-8')

          trend_anchor = '          <Panel title="روند تکمیل تسک‌ها"'
          unit_anchor = '          <Panel title="عملکرد واحدها"'
          distribution_anchor = '          <Panel title="توزیع تسک‌ها بر اساس وضعیت"'
          meetings_anchor = '          <Panel title="جلسات اخیر"'
          tasks_anchor = '          <Panel title="تسک‌های مهم"'
          schedule_anchor = '          <Panel title="برنامه امروز"'

          for anchor in (trend_anchor, unit_anchor, distribution_anchor, meetings_anchor, tasks_anchor, schedule_anchor):
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected exactly one anchor: {anchor!r}, found {text.count(anchor)}')

          trend_start = text.index(trend_anchor)
          unit_start = text.index(unit_anchor, trend_start)
          distribution_start = text.index(distribution_anchor, unit_start)
          if not (trend_start < unit_start < distribution_start):
              raise SystemExit('unexpected analytics panel order before transform')

          trend_block = text[trend_start:unit_start]
          unit_block = text[unit_start:distribution_start]
          text = text[:trend_start] + unit_block + trend_block + text[distribution_start:]

          meetings_start = text.index(meetings_anchor)
          tasks_start = text.index(tasks_anchor, meetings_start)
          schedule_start = text.index(schedule_anchor, tasks_start)
          if not (meetings_start < tasks_start < schedule_start):
              raise SystemExit('unexpected operational panel order before transform')

          meetings_block = text[meetings_start:tasks_start]
          tasks_block = text[tasks_start:schedule_start]
          text = text[:meetings_start] + tasks_block + meetings_block + text[schedule_start:]

          if not (
              text.index(unit_anchor) < text.index(trend_anchor)
              and text.index(tasks_anchor) < text.index(meetings_anchor) < text.index(schedule_anchor)
          ):
              raise SystemExit('post-transform ordering validation failed')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- src/components/ManagementDashboardPage.tsx
          test "$(git diff --name-only)" = "src/components/ManagementDashboardPage.tsx"

      - name: Setup Node.js
        if: steps.transform.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: Install dependencies
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - id: build
        name: Build
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: test
        name: Test
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Commit result and cleanup temporary tooling
        if: always()
        shell: bash
        run: |
          transform='${{ steps.transform.outcome }}'
          install='${{ steps.install.outcome }}'
          build='${{ steps.build.outcome }}'
          test_result='${{ steps.test.outcome }}'

          git show 3cc52d6d113d3dd8e669fb656f861b45fb5a09fa:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/tmp-reorder-management-dashboard.yml
          rm -f .tmp-management-dashboard-reorder-trigger
          rm -f tmp/management-dashboard-reorder-trigger.txt

          if [ "$transform" = success ] && [ "$install" = success ] && [ "$build" = success ] && [ "$test_result" = success ]; then
            message='fix: reorder management dashboard sections [skip ci]'
          else
            git restore --source=HEAD -- src/components/ManagementDashboardPage.tsx
            message="chore: dashboard reorder validation failed transform-$transform install-$install build-$build test-$test_result [skip ci]"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main

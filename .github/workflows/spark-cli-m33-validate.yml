name: spark-cli-m33-validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m33-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate M3.3 packages into bootstrap staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/bootstrap.sh')
          text = path.read_text()

          old = 'mkdir -p "$tmp/lib" "$tmp/livekit" "$tmp/architecture" "$tmp/config/environments" "$tmp/roles/database/tasks"'
          new = old + ' "$tmp/secrets" "$tmp/roles/database/package"'
          if '"$tmp/roles/database/package"' not in text:
              if old not in text: raise SystemExit('tmp dir anchor missing')
              text = text.replace(old, new, 1)

          anchor = 'roles/database/tasks/preflight.py\n'
          additions = (
              anchor
              + 'roles/database/tasks/package.py\n'
              + 'roles/database/tasks/secrets.py\n'
              + 'roles/database/package/__init__.py\n'
              + 'roles/database/package/manager.py\n'
              + 'roles/database/package/source.py\n'
              + 'roles/database/package/version.py\n'
              + 'roles/database/package/verifier.py\n'
              + 'roles/database/package/overlay.py\n'
              + 'secrets/__init__.py\n'
              + 'secrets/provider.py\n'
              + 'secrets/file_provider.py\n'
              + 'secrets/generator.py\n'
              + 'secrets/redaction.py\n'
              + 'secrets/models.py\n'
          )
          if 'roles/database/tasks/package.py\n' not in text:
              if anchor not in text: raise SystemExit('file list anchor missing')
              text = text.replace(anchor, additions, 1)

          old = 'install -d -m 0755 "$stage/lib" "$stage/livekit" "$stage/architecture" "$stage/config/environments" "$stage/roles/database/tasks"'
          new = old + ' "$stage/secrets" "$stage/roles/database/package"'
          if '"$stage/roles/database/package"' not in text:
              if old not in text: raise SystemExit('stage dir anchor missing')
              text = text.replace(old, new, 1)

          anchor = 'for file in "$tmp"/roles/database/tasks/*.py; do install -m 0644 "$file" "$stage/roles/database/tasks/$(basename "$file")"; done\n'
          additions = (
              anchor
              + 'for file in "$tmp"/roles/database/package/*.py; do install -m 0644 "$file" "$stage/roles/database/package/$(basename "$file")"; done\n'
              + 'for file in "$tmp"/secrets/*.py; do install -m 0644 "$file" "$stage/secrets/$(basename "$file")"; done\n'
          )
          if 'roles/database/package/$(basename "$file")' not in text:
              if anchor not in text: raise SystemExit('stage copy anchor missing')
              text = text.replace(anchor, additions, 1)

          path.write_text(text)
          PY
          bash -n deploy/spark-cli/bootstrap.sh
          git diff --check

      - name: Python syntax
        working-directory: deploy/spark-cli
        run: |
          python3 -m py_compile secrets/*.py roles/database/*.py roles/database/tasks/*.py roles/database/package/*.py config/*.py

      - name: Phase 0 baseline smoke tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.smoke.test_manager_baseline -v

      - name: Phase 1 workflow core tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest tests.test_workflow_core -v

      - name: Phase 2 architecture tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/architecture -v

      - name: M3.1 and M3.2 database tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/roles -v

      - name: M3.3 secrets tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/secrets -v

      - name: M3.3 package and task tests
        working-directory: deploy/spark-cli
        run: python3 -m unittest discover -s tests/database -v

      - name: Architecture profiles remain valid and pinned
        working-directory: deploy/spark-cli
        run: |
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.staging.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.airgap.yaml python3 spark-architecture validate >/dev/null
          grep -Fq 'release: self-hosted/v0.8.1' config/environments/example.production.yaml
          ! grep -REn 'release: (latest|main|master)' config/environments

      - name: Real pinned Supabase package materialization without container start
        working-directory: deploy/spark-cli
        run: |
          before="$(docker ps -aq | sort || true)"
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from roles.database.package.manager import SupabasePackageManager, SupabasePackageSpec
          from roles.database.package.verifier import compose_services, verify_no_edge_functions
          from secrets.generator import SupabaseUpstreamSecretGenerator

          with tempfile.TemporaryDirectory() as tmpdir:
              destination = Path(tmpdir) / 'supabase'
              spec = SupabasePackageSpec(
                  'self-hosted/v0.8.1',
                  'https://github.com/supabase/supabase.git',
                  destination,
              )
              manager = SupabasePackageManager()
              manager.materialize(spec)
              assert manager.detect(spec)['healthy'] is True
              services = compose_services((destination / 'docker-compose.yml').read_text())
              assert 'functions' not in services
              verify_no_edge_functions(destination / 'docker-compose.yml')
              assert (destination / '.supabase-version').read_text() == 'ref=self-hosted/v0.8.1\n'
              assert not (destination / '.env').exists()
              generated = SupabaseUpstreamSecretGenerator(destination / 'vendor' / 'upstream').generate()
              assert generated['SUPABASE_PUBLISHABLE_KEY'].startswith('sb_publishable_')
              assert generated['SUPABASE_SECRET_KEY'].startswith('sb_secret_')
              assert 'JWT_KEYS' in generated and 'JWT_JWKS' in generated
          PY
          after="$(docker ps -aq | sort || true)"
          test "$before" = "$after"

      - name: UI regression self-test
        working-directory: deploy/spark-cli
        run: python3 spark-ui.py --self-test

      - name: Bootstrap structural checks
        working-directory: deploy/spark-cli
        run: |
          bash -n bootstrap.sh
          grep -Fq 'secrets/file_provider.py' bootstrap.sh
          grep -Fq 'roles/database/package/manager.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/package.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/secrets.py' bootstrap.sh

      - name: Commit bootstrap integration only after all validation passes
        run: |
          if ! git diff --quiet -- deploy/spark-cli/bootstrap.sh; then
            git config user.name "spark-m33-bot"
            git config user.email "spark-m33-bot@users.noreply.github.com"
            git add deploy/spark-cli/bootstrap.sh
            git commit -m "feat: install M3.3 secrets and package modules with spark manager"
            git push origin HEAD:main
          fi

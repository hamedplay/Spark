name: Temporary Fix Frontend Step11 Nginx Coupling

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-frontend-step11-nginx-coupling.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Step 11 validation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/install-platform-a.sh')
          text = p.read_text(encoding='utf-8')
          old = '''test_frontend_deploy() {\n  require_file "${SPARK_ROOT}/dist/index.html" || return 1\n  require_file "/var/www/spark/index.html" || return 1\n  require_file "/var/www/spark/sw.js" || return 1\n  require_file "/var/www/spark/pwa-bootstrap.js" || return 1\n  nginx -t || return 1\n}\n'''
          new = '''test_frontend_deploy() {\n  require_file "${SPARK_ROOT}/dist/index.html" || return 1\n  require_file "/var/www/spark/index.html" || return 1\n  require_file "/var/www/spark/sw.js" || return 1\n  require_file "/var/www/spark/pwa-bootstrap.js" || return 1\n}\n'''
          if old not in text:
              raise SystemExit('test_frontend_deploy block not found')
          text = text.replace(old, new, 1)
          text = text.replace('run_logged "test Frontend artifact and Nginx syntax" test_frontend_deploy',
                              'run_logged "Validate frontend artifacts" test_frontend_deploy', 1)
          p.write_text(text, encoding='utf-8')
          PY

          bash -n deploy/spark-cli/lib/install-platform-a.sh
          bash -n deploy/spark-cli/lib/airgap-ip.sh

          python3 - <<'PY'
          from pathlib import Path
          a = Path('deploy/spark-cli/lib/install-platform-a.sh').read_text(encoding='utf-8')
          i = Path('deploy/spark-cli/lib/airgap-ip.sh').read_text(encoding='utf-8')
          start = a.index('test_frontend_deploy() {')
          end = a.index('\n}\n', start) + 3
          block = a[start:end]
          assert 'nginx -t' not in block, block
          assert 'Validate frontend artifacts' in a
          assert 'run_logged "Nginx syntax" nginx -t' in i
          assert 'airgap_ip_test_nginx()' in i
          print('Step 11/12 responsibility validation: PASS')
          PY

          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/install-platform-a.sh
          git commit -m 'fix(installer): decouple frontend validation from nginx'
          git push origin HEAD:main

name: Temporary Internet App Divergence Fix

on:
  push:
    paths:
      - .github/workflows/tmp-fix-internet-app-divergence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("deploy/spark-cli/lib/application.sh")
          s = p.read_text()
          marker = '  info "Target application source : ${target_sha}"\n\n'
          old_guard = '  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then\n    fail "origin/main is not a fast-forward from the current application source; update stopped."\n    return 1\n  fi\n\n'
          new_guard = '  local source_mode="fast-forward" backup_ref=""\n  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then\n    source_mode="authoritative-reset"\n    backup_ref="refs/spark-manager/backups/app-update-$(date -u +%Y%m%dT%H%M%SZ)-${old_sha:0:12}"\n    run_logged "Preserve divergent application source for rollback" git -C "$SPARK_ROOT" update-ref "$backup_ref" "$old_sha" || return 1\n    warn "Local application history diverged from origin/main; clean deployment source will be realigned after build validation."\n    info "Rollback source ref: ${backup_ref}"\n  fi\n\n'
          if old_guard not in s:
              raise SystemExit("fast-forward guard not found")
          s = s.replace(old_guard, new_guard, 1)
          s = s.replace('frontend_next="/var/www/spark.next.$"', 'frontend_next="/var/www/spark.next.$$"', 1)
          s = s.replace('frontend_prev="/var/www/spark.prev.$"', 'frontend_prev="/var/www/spark.prev.$$"', 1)
          s = s.replace('modules_next="${SPARK_ROOT}/node_modules.next.$"', 'modules_next="${SPARK_ROOT}/node_modules.next.$$"', 1)
          s = s.replace('modules_prev="${SPARK_ROOT}/node_modules.prev.$"', 'modules_prev="${SPARK_ROOT}/node_modules.prev.$$"', 1)
          old_activate = '  if [[ "$old_sha" != "$target_sha" ]]; then\n    run_logged "Fast-forward application source to origin/main" \\\n      git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1\n    source_advanced=1\n  fi\n'
          new_activate = '  if [[ "$old_sha" != "$target_sha" ]]; then\n    if [[ "$source_mode" == "fast-forward" ]]; then\n      run_logged "Fast-forward application source to origin/main" git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1\n    else\n      run_logged "Realign clean deployment source to authoritative origin/main" git -C "$SPARK_ROOT" reset --hard "$target_sha" || return 1\n    fi\n    source_advanced=1\n  fi\n'
          if old_activate not in s:
              raise SystemExit("source activation block not found")
          s = s.replace(old_activate, new_activate, 1)
          p.write_text(s)
          PY
          bash -n deploy/spark-cli/lib/application.sh
          grep -Fq 'source_mode="authoritative-reset"' deploy/spark-cli/lib/application.sh
          grep -Fq 'update-ref "$backup_ref" "$old_sha"' deploy/spark-cli/lib/application.sh
          grep -Fq 'reset --hard "$target_sha"' deploy/spark-cli/lib/application.sh
          grep -Fq 'frontend_next="/var/www/spark.next.$$"' deploy/spark-cli/lib/application.sh
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-fix-internet-app-divergence.yml
          git add deploy/spark-cli/lib/application.sh
          git commit -m 'fix: safely realign Internet App updates to origin main'
          git push origin HEAD:main

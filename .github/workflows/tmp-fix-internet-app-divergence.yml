name: Temporary Internet App divergence fix

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-internet-app-divergence.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate Internet App updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/application.sh')
          s = p.read_text(encoding='utf-8')

          old = '''  info "Current application source: ${old_sha}"
  info "Target application source : ${target_sha}"

  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then
    fail "origin/main is not a fast-forward from the current application source; update stopped."
    return 1
  fi

  stage="/opt/spark-app-update-${target_sha:0:12}-$$"
  frontend_next="/var/www/spark.next.$"
  frontend_prev="/var/www/spark.prev.$"
  modules_next="${SPARK_ROOT}/node_modules.next.$"
  modules_prev="${SPARK_ROOT}/node_modules.prev.$"
'''
          new = '''  info "Current application source: ${old_sha}"
  info "Target application source : ${target_sha}"

  local source_mode="fast-forward"
  local backup_ref=""
  if ! git -C "$SPARK_ROOT" merge-base --is-ancestor "$old_sha" "$target_sha"; then
    source_mode="authoritative-reset"
    backup_ref="refs/spark-manager/backups/app-update-$(date -u +%Y%m%dT%H%M%SZ)-${old_sha:0:12}"
    run_logged "Preserve divergent application source for rollback" \
      git -C "$SPARK_ROOT" update-ref "$backup_ref" "$old_sha" || return 1
    warn "Local application history diverged from origin/main; the clean deployment source will be realigned to the authoritative remote after build validation."
    info "Rollback source ref: ${backup_ref}"
  fi

  stage="/opt/spark-app-update-${target_sha:0:12}-$$"
  frontend_next="/var/www/spark.next.$$"
  frontend_prev="/var/www/spark.prev.$$"
  modules_next="${SPARK_ROOT}/node_modules.next.$$"
  modules_prev="${SPARK_ROOT}/node_modules.prev.$$"
'''
          if old not in s:
              raise SystemExit('expected divergence block not found')
          s = s.replace(old, new, 1)

          old2 = '''  if [[ "$old_sha" != "$target_sha" ]]; then
    run_logged "Fast-forward application source to origin/main" \
      git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1
    source_advanced=1
  fi
'''
          new2 = '''  if [[ "$old_sha" != "$target_sha" ]]; then
    if [[ "$source_mode" == "fast-forward" ]]; then
      run_logged "Fast-forward application source to origin/main" \
        git -C "$SPARK_ROOT" merge --ff-only "$target_sha" || return 1
    else
      run_logged "Realign clean deployment source to authoritative origin/main" \
        git -C "$SPARK_ROOT" reset --hard "$target_sha" || return 1
    fi
    source_advanced=1
  fi
'''
          if old2 not in s:
              raise SystemExit('expected source activation block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

          bash -n deploy/spark-cli/lib/application.sh
          grep -Fq 'source_mode="authoritative-reset"' deploy/spark-cli/lib/application.sh
          grep -Fq 'update-ref "$backup_ref" "$old_sha"' deploy/spark-cli/lib/application.sh
          grep -Fq 'reset --hard "$target_sha"' deploy/spark-cli/lib/application.sh
          grep -Fq 'frontend_next="/var/www/spark.next.$$"' deploy/spark-cli/lib/application.sh
          grep -Fq 'modules_next="${SPARK_ROOT}/node_modules.next.$$"' deploy/spark-cli/lib/application.sh

          # Simulate divergent Git history and verify the intended source strategy is valid.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" config user.name test
          git -C "$tmp" config user.email test@example.com
          echo base > "$tmp/f"
          git -C "$tmp" add f && git -C "$tmp" commit -qm base
          base="$(git -C "$tmp" rev-parse HEAD)"
          echo local > "$tmp/f"
          git -C "$tmp" commit -qam local
          local_sha="$(git -C "$tmp" rev-parse HEAD)"
          git -C "$tmp" reset --hard "$base" >/dev/null
          echo remote > "$tmp/f"
          git -C "$tmp" commit -qam remote
          target_sha="$(git -C "$tmp" rev-parse HEAD)"
          ! git -C "$tmp" merge-base --is-ancestor "$local_sha" "$target_sha"
          git -C "$tmp" update-ref refs/spark-manager/backups/test "$local_sha"
          git -C "$tmp" reset --hard "$target_sha" >/dev/null
          [[ "$(git -C "$tmp" rev-parse HEAD)" == "$target_sha" ]]
          [[ "$(git -C "$tmp" rev-parse refs/spark-manager/backups/test)" == "$local_sha" ]]

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-internet-app-divergence.yml
          git add deploy/spark-cli/lib/application.sh
          git commit -m 'fix: allow safe Internet App realignment to origin main'
          git push origin HEAD:main

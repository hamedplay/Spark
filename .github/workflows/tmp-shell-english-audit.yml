name: Temporary Shell English Cleanup

on:
  push:
    paths:
      - '.github/workflows/tmp-shell-english-audit.yml'
      - '.github/scripts/tmp_translate_shells.py'
      - 'deploy/spark-cli/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install temporary translation helper
        run: python3 -m pip install --disable-pip-version-check --quiet deep-translator==1.11.4
      - name: Translate Persian operator text without changing shell logic
        run: python3 .github/scripts/tmp_translate_shells.py
      - name: Enforce English-only shell sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('deploy/spark-cli')
          candidates=sorted(root.rglob('*.sh'))
          for name in ('spark','spark-airgap','spark-migrate'):
              path=root/name
              if path.is_file(): candidates.append(path)
          candidates=sorted(set(candidates))
          pattern=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          hits=[]
          for path in candidates:
              for number,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pattern.search(line): hits.append((path,number,line))
          print(f'SHELL_FILES={len(candidates)}')
          print(f'NON_ENGLISH_LINES={len(hits)}')
          for path,number,line in hits: print(f'{path}:{number}: {line}')
          if hits: raise SystemExit(2)
          PY
      - name: Validate shell syntax and Manager self-test
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/spark-airgap
          bash -n deploy/spark-cli/spark-migrate
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/bootstrap-airgap.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
          for file in deploy/spark-cli/lib/*.sh; do bash -n "$file"; done
          python3 deploy/spark-cli/spark-ui.py --self-test
      - name: Commit translated shell sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- deploy/spark-cli; then
            echo 'No shell translation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli
          git commit -m 'refactor(manager): translate shell sources to English'
          git push origin HEAD:main

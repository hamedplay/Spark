name: Temporary Shell English Cleanup

on:
  push:
    paths:
      - '.github/workflows/tmp-shell-english-audit.yml'
      - 'deploy/spark-cli/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install temporary translation helper
        run: python3 -m pip install --disable-pip-version-check --quiet deep-translator==1.11.4
      - name: Translate Persian operator text without changing shell logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import time
          from deep_translator import GoogleTranslator

          root = Path('deploy/spark-cli')
          candidates = sorted(root.rglob('*.sh'))
          for name in ('spark', 'spark-airgap', 'spark-migrate'):
              path = root / name
              if path.is_file():
                  candidates.append(path)
          candidates = sorted(set(candidates))

          arabic = re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          quoted = re.compile(r'(["\'])(.*?)(?<!\\)\1')
          token_re = re.compile(
              r'\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|\\[nrt\\]|'
              r'https?://[^\s"\']+|'
              r'(?<![A-Za-z0-9_])/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+|'
              r'(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?|'
              r'\b[A-Z][A-Z0-9_]{2,}\b'
          )
          translator = GoogleTranslator(source='auto', target='en')
          cache = {}

          def protect(text):
              tokens = []
              def repl(match):
                  token = match.group(0)
                  marker = f'ZXQ{len(tokens)}QXZ'
                  tokens.append(token)
                  return marker
              return token_re.sub(repl, text), tokens

          def restore(text, tokens):
              for i, token in enumerate(tokens):
                  text = text.replace(f'ZXQ{i}QXZ', token)
              return re.sub(r' {2,}', ' ', text).strip()

          def translate_text(text):
              if not arabic.search(text):
                  return text
              if text in cache:
                  return cache[text]
              protected, tokens = protect(text)
              error = None
              for attempt in range(4):
                  try:
                      translated = translator.translate(protected)
                      translated = restore(translated, tokens)
                      if arabic.search(translated):
                          raise RuntimeError('Arabic-script text remained after translation')
                      cache[text] = translated
                      return translated
                  except Exception as exc:
                      error = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f'Unable to translate {text!r}: {error}')

          def translate_line(line):
              if not arabic.search(line):
                  return line
              matches = list(quoted.finditer(line))
              if matches:
                  out = []
                  pos = 0
                  for match in matches:
                      out.append(line[pos:match.start()])
                      quote = match.group(1)
                      body = match.group(2)
                      if arabic.search(body):
                          body = translate_text(body)
                          if quote == '"':
                              body = body.replace('"', '\\"')
                          else:
                              body = body.replace("'", '’')
                      out.append(quote + body + quote)
                      pos = match.end()
                  out.append(line[pos:])
                  result = ''.join(out)
                  if arabic.search(result):
                      hash_pos = result.find('#')
                      if hash_pos >= 0 and arabic.search(result[hash_pos + 1:]):
                          result = result[:hash_pos + 1] + ' ' + translate_text(result[hash_pos + 1:].strip())
                  return result
              hash_pos = line.find('#')
              if hash_pos >= 0:
                  return line[:hash_pos + 1] + ' ' + translate_text(line[hash_pos + 1:].strip())
              raise RuntimeError(f'Arabic-script text is outside a quoted string/comment: {line!r}')

          changed = []
          for path in candidates:
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              output = []
              for line in lines:
                  ending = '\n' if line.endswith('\n') else ''
                  body = line[:-1] if ending else line
                  output.append(translate_line(body) + ending)
              updated = ''.join(output)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'TRANSLATED_FILES={len(changed)}')
          for path in changed:
              print(path)
          PY
      - name: Enforce English-only shell sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('deploy/spark-cli')
          candidates = sorted(root.rglob('*.sh'))
          for name in ('spark', 'spark-airgap', 'spark-migrate'):
              path = root / name
              if path.is_file(): candidates.append(path)
          candidates = sorted(set(candidates))
          pattern = re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          hits=[]
          for path in candidates:
              for number,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pattern.search(line): hits.append((path,number,line))
          print(f'SHELL_FILES={len(candidates)}')
          print(f'NON_ENGLISH_LINES={len(hits)}')
          for path,number,line in hits: print(f'{path}:{number}: {line}')
          if hits: raise SystemExit(2)
          PY
      - name: Validate shell syntax and Manager self-test
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/spark-airgap
          bash -n deploy/spark-cli/spark-migrate
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/bootstrap-airgap.sh
          bash -n deploy/spark-cli/apply-daily-report-scheduler.sh
          for file in deploy/spark-cli/lib/*.sh; do bash -n "$file"; done
          python3 deploy/spark-cli/spark-ui.py --self-test
      - name: Commit translated shell sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- deploy/spark-cli; then
            echo 'No shell translation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli
          git commit -m 'refactor(manager): translate shell sources to English'
          git push origin HEAD:main

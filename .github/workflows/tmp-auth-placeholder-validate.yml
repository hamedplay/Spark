name: Temporary Auth Placeholder Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/auth-placeholder-theme.css'
      - 'src/main.tsx'
      - '.github/workflows/tmp-auth-placeholder-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Record validation
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'source_commit=%s\ninstall=success\nbuild=success\n' "$SOURCE_SHA" > tmp-auth-placeholder-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp-auth-placeholder-validation.txt
          git commit -m 'chore: record auth placeholder validation'
          git push

name: Temporary multi-day time rail validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-multiday-time-rail.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate multi-day sticky rail containment
        run: |
          ! grep -q 'className="relative flex overflow-hidden bg-white dark:bg-slate-950"' src/components/Calendar/MultiDayView.tsx
          grep -q 'sticky right-0 z-20 w-14' src/components/Calendar/MultiDayView.tsx
          grep -q 'relative grid flex-1 overflow-hidden bg-white' src/components/Calendar/MultiDayView.tsx

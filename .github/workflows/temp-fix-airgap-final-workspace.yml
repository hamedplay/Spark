name: temp-fix-airgap-final-workspace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-airgap-final-workspace.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply scoped final Air-Gap workspace fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/airgap-observability-quiet.sh')
          s = p.read_text()
          old = '''  mkdir -p "$output_root"\n  work="$(mktemp -d)"\n  trap '[[ -z "${work:-}" ]] || rm -rf -- "$work"' EXIT\n'''
          new = '''  mkdir -p "$output_root"\n  # This is the final airgap_build_bundle override loaded by spark-airgap. Keep\n  # the multi-GB workspace on the operator-selected output filesystem instead\n  # of /tmp, which is commonly a small tmpfs on production hosts.\n  work="$(mktemp -d "${output_root}/.spark-airgap-build.XXXXXX")"\n  trap '[[ -z "${work:-}" ]] || rm -rf -- "$work"' EXIT\n'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one final workspace anchor, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate actual runtime path
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/lib/airgap-observability-quiet.sh
          bash -n deploy/spark-cli/lib/airgap-build.sh
          bash -n deploy/spark-cli/spark-airgap
          git diff --check
          test "$(git diff --name-only)" = 'deploy/spark-cli/lib/airgap-observability-quiet.sh'
          grep -F 'work="$(mktemp -d "${output_root}/.spark-airgap-build.XXXXXX")"' deploy/spark-cli/lib/airgap-observability-quiet.sh
          grep -F 'module_path="${SCRIPT_DIR}/lib/airgap-observability-quiet.sh"' deploy/spark-cli/spark-airgap
          python3 - <<'PY'
          from pathlib import Path
          base = Path('deploy/spark-cli/lib/airgap-build.sh').read_text()
          final = Path('deploy/spark-cli/lib/airgap-observability-quiet.sh').read_text()
          expected='work="$(mktemp -d "${output_root}/.spark-airgap-build.XXXXXX")"'
          assert expected in base, 'base builder workspace is not output-root scoped'
          assert expected in final, 'final runtime override workspace is not output-root scoped'
          # Prevent the exact regression that caused repeated /tmp exhaustion.
          final_fn = final.split('airgap_build_bundle() (',1)[1]
          assert 'work="$(mktemp -d)"' not in final_fn, 'final runtime override still uses /tmp'
          PY
      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name spark-maintenance
          git config user.email spark-maintenance@users.noreply.github.com
          git add deploy/spark-cli/lib/airgap-observability-quiet.sh
          git commit -m 'fix(airgap): honor output filesystem in final builder'
          git push origin HEAD:main

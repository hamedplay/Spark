name: Temporary auth pointer glow validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: work/auth-pointer-glow-20260818
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Build production bundle
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Verify candidate scope
        id: scope
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(src/auth-pointer-glow\.ts|src/auth-pointer-glow\.css|src/main\.tsx|\.github/workflows/auth-pointer-glow-validate\.yml|\.tmp-auth-pointer-glow-validation-(ok|failed))$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files changed:\n%s\n' "$unexpected"
            exit 1
          fi
          grep -q "import './auth-pointer-glow.ts';" src/main.tsx
          grep -q "pointermove" src/auth-pointer-glow.ts
          grep -q "prefers-reduced-motion" src/auth-pointer-glow.ts
          grep -q "spark-auth-pointer-glow" src/auth-pointer-glow.css

      - name: Persist result on candidate branch
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
        run: |
          set -euo pipefail
          rm -f .tmp-auth-pointer-glow-validation-ok .tmp-auth-pointer-glow-validation-failed
          if [[ "$INSTALL_OUTCOME" == "success" && "$BUILD_OUTCOME" == "success" && "$SCOPE_OUTCOME" == "success" ]]; then
            marker=.tmp-auth-pointer-glow-validation-ok
          else
            marker=.tmp-auth-pointer-glow-validation-failed
          fi
          printf 'install=%s\nbuild=%s\nscope=%s\n' "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$SCOPE_OUTCOME" > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .tmp-auth-pointer-glow-validation-ok .tmp-auth-pointer-glow-validation-failed
          git commit -m "chore: record auth pointer glow validation" || true
          git push origin HEAD:work/auth-pointer-glow-20260818
          [[ "$marker" == ".tmp-auth-pointer-glow-validation-ok" ]]

name: Temporary Application gzip action validation

on:
  push:
    branches: [main]
    paths:
      - 'deploy/spark-cli/lib/application-maintenance.sh'
      - 'deploy/spark-cli/spark-ui.py'
      - 'deploy/spark-cli/spark'
      - '.github/workflows/app-nginx-gzip-temp.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and Python syntax
        run: |
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/lib/application-maintenance.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py
      - name: Validate Application menu wiring
        run: |
          grep -Fq 'core.Action("app-nginx-gzip", "Optimize Nginx Gzip"' deploy/spark-cli/spark-ui.py
          grep -Fq 'app-nginx-gzip) application_optimize_nginx_gzip ;;' deploy/spark-cli/spark
          grep -Fq 'application_optimize_nginx_gzip()' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'Apply Nginx gzip performance profile' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'Verify effective Nginx gzip profile' deploy/spark-cli/lib/application-maintenance.sh

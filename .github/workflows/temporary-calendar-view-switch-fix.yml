name: Temporary calendar view switch fix

on:
  push:
    paths:
      - '.github/workflows/temporary-calendar-view-switch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch calendar view switching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('src/components/CalendarPageCore.tsx')
          text = core.read_text()
          old = "type ViewMode = 'month' | 'week' | 'day' | 'list-week' | 'list-month';"
          if old not in text:
              raise SystemExit('old ViewMode type not found')
          text = text.replace(old, "import type { CalendarViewMode } from './Calendar/utils';\n\ntype ViewMode = CalendarViewMode;", 1)
          core.write_text(text)

          toolbar = Path('src/components/Calendar/CalendarToolbar.tsx')
          text = toolbar.read_text()

          old = "import { toJalaali, toFarsiDigits } from './utils';"
          new = "import { toJalaali, toFarsiDigits } from './utils';\nimport type { CalendarViewMode } from './utils';"
          if old not in text:
              raise SystemExit('toolbar utils import not found')
          text = text.replace(old, new, 1)

          text = text.replace("interface ViewOption { key: string; label: string; }", "interface ViewOption { key: CalendarViewMode; label: string; }")
          text = text.replace("  viewMode: string;\n  setViewMode: React.Dispatch<React.SetStateAction<string>>;", "  viewMode: CalendarViewMode;\n  setViewMode: React.Dispatch<React.SetStateAction<CalendarViewMode>>;")

          anchor = "  const viewControl = (\n"
          handler = "  const selectViewMode = (nextView: CalendarViewMode) => {\n    setViewMode(nextView);\n    localStorage.setItem('user_prefs_calendar_view', nextView);\n    setShowViewDropdown(false);\n  };\n\n"
          if anchor not in text:
              raise SystemExit('viewControl anchor not found')
          text = text.replace(anchor, handler + anchor, 1)

          text = text.replace(
              '<div className="relative flex-shrink-0">\n      <button\n        onClick={() => setShowViewDropdown(o => !o)}',
              '<div className="relative z-[1000] flex-shrink-0 pointer-events-auto">\n      <button\n        type="button"\n        onClick={() => setShowViewDropdown(o => !o)}',
              1,
          )

          text = text.replace(
              'className="absolute left-0 top-full z-[120] mt-1 min-w-[160px] overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-[0_14px_40px_rgba(15,23,42,0.18)] dark:border-slate-700 dark:bg-slate-900" role="menu"',
              'className="absolute left-0 top-full z-[1100] mt-1 min-w-[160px] overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-[0_14px_40px_rgba(15,23,42,0.18)] pointer-events-auto dark:border-slate-700 dark:bg-slate-900" role="menu" onPointerDown={e => e.stopPropagation()}',
              1,
          )

          old_block = """            <button\n              key={v.key}\n              onClick={() => {\n                setViewMode(v.key);\n                localStorage.setItem('user_prefs_calendar_view', v.key);\n                setShowViewDropdown(false);\n              }}"""
          new_block = """            <button\n              key={v.key}\n              type=\"button\"\n              onPointerDown={e => { e.preventDefault(); e.stopPropagation(); }}\n              onClick={() => selectViewMode(v.key)}"""
          if old_block not in text:
              raise SystemExit('view option block not found')
          text = text.replace(old_block, new_block, 1)

          toolbar.write_text(text)
          PY

      - name: Validate calendar view switching wiring
        run: |
          grep -Fq "type ViewMode = CalendarViewMode;" src/components/CalendarPageCore.tsx
          grep -Fq "viewMode: CalendarViewMode;" src/components/Calendar/CalendarToolbar.tsx
          grep -Fq "const selectViewMode = (nextView: CalendarViewMode)" src/components/Calendar/CalendarToolbar.tsx
          grep -Fq 'type="button"' src/components/Calendar/CalendarToolbar.tsx
          grep -Fq 'onClick={() => selectViewMode(v.key)}' src/components/Calendar/CalendarToolbar.tsx
          grep -Fq 'pointer-events-auto' src/components/Calendar/CalendarToolbar.tsx

      - name: Commit patch
        run: |
          git config user.name "spark-automation"
          git config user.email "spark-automation@users.noreply.github.com"
          git add src/components/CalendarPageCore.tsx src/components/Calendar/CalendarToolbar.tsx
          git commit -m "fix(calendar): restore toolbar view switching"
          git push origin HEAD:main

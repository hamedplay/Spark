name: standalone-prejoin-responsive-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify responsive prejoin architecture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const page = fs.readFileSync('src/components/VideoConference/StandaloneConferencePage.tsx', 'utf8');
          const devices = fs.readFileSync('src/components/VideoConference/DeviceSelector.tsx', 'utf8');
          if (page.includes('max-w-md overflow-hidden rounded-2xl')) throw new Error('mobile-width prejoin wrapper still exists');
          if (!page.includes('max-w-[1480px]')) throw new Error('desktop responsive width missing');
          if (!page.includes('compactViewport')) throw new Error('compact responsive device layout not enabled');
          if (!page.includes('بازگشت به اسپارک')) throw new Error('explicit back action missing');
          if (!page.includes("window.location.replace('/')")) throw new Error('back fallback to Spark missing');
          if (!page.includes('صفحه مستقل و امن جلسه')) throw new Error('standalone session context missing');
          if (!page.includes('رضایت ضبط جلسه')) throw new Error('recording consent missing');
          if (!devices.includes('lg:grid-cols-[minmax(0,1.45fr)_minmax(320px,0.72fr)]')) throw new Error('responsive device selector grid missing');
          console.log('standalone prejoin responsive architecture verified');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit

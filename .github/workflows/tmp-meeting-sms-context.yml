name: Temporary meeting sms context validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-meeting-sms-context.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate meeting SMS context propagation
        run: |
          grep -q "meetingId?: string | null" src/features/notifications/types/notificationProducer.ts
          grep -q "meetingId:.*payload.meetingId" src/features/notifications/services/notificationProducerOrchestration.ts
          grep -q "meetingId:.*input.meetingId" src/features/notifications/gateways/smsNotificationGateway.ts
          grep -q "meetingId: diff.meeting_id" src/components/CalendarMeetingForm/commitEdit.ts
          grep -q "meetingId: meetingId" src/components/CalendarMeetingForm/services.ts
          grep -q "meetingContext?.start_time" src/features/meetings/commands/deleteMeetingPermanently.ts
          grep -q "meetingId: meeting.id" src/components/MeetingInboxButton.tsx

name: Temporary decision table visibility fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'tmp-decision-table-visibility-run' && contains(github.event.issue.body, 'spark-decision-table-visibility-20260820')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - id: transform
        name: Apply minimal visibility fix
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/components/Minutes/MyDecisionsPage.tsx'): [
                  ('<table className="w-full text-sm">', '<table className="min-w-[980px] w-full text-sm">'),
                  ('<div className="max-w-xs truncate font-medium text-gray-900 dark:text-white">{dec.title}</div>', '<div className="min-w-64 max-w-sm whitespace-normal break-words font-medium leading-5 text-gray-900 dark:text-white">{dec.title}</div>'),
                  ('<div className="text-xs text-gray-400 dark:text-gray-500">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}</div>', '<div className="whitespace-nowrap text-xs text-gray-400 dark:text-gray-500">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}</div>'),
                  ('<td className="px-4 py-3 text-xs text-gray-500">\n        {dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}\n      </td>', '<td className="whitespace-nowrap px-4 py-3 text-xs text-gray-500">\n        {dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}\n      </td>'),
                  ('<h3 className="mobile-line-clamp-2 text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}</h3>', '<h3 className="break-words text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}</h3>'),
              ],
              Path('src/components/Minutes/DecisionsFollowupPage.tsx'): [
                  ('<table className="w-full text-sm">', '<table className="min-w-[1180px] w-full text-sm">'),
                  ('<div className="max-w-48 truncate font-medium text-gray-900 dark:text-white">{dec.title}</div>', '<div className="min-w-56 max-w-xs whitespace-normal break-words font-medium leading-5 text-gray-900 dark:text-white">{dec.title}</div>'),
                  ('<div className="text-gray-400">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}</div>', '<div className="whitespace-nowrap text-gray-400">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}</div>'),
                  ('<td className="px-3 py-3 text-xs text-gray-500">{dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}</td>', '<td className="whitespace-nowrap px-3 py-3 text-xs text-gray-500">{dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}</td>'),
                  ('<td className="px-3 py-3 text-xs text-gray-500">\n        {dec.latest_followup_at ? formatJalaliDateForDisplay(dec.latest_followup_at) : \'—\'}\n      </td>', '<td className="whitespace-nowrap px-3 py-3 text-xs text-gray-500">\n        {dec.latest_followup_at ? formatJalaliDateForDisplay(dec.latest_followup_at) : \'—\'}\n      </td>'),
                  ('<h3 className="mobile-line-clamp-2 text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}</h3>', '<h3 className="break-words text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}</h3>'),
                  ('<span className="truncate">{dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}</span>', '<span className="whitespace-nowrap">{dec.due_date ? formatJalaliDateForDisplay(dec.due_date) : \'—\'}</span>'),
                  ('<span className="truncate">{dec.latest_followup_at ? formatJalaliDateForDisplay(dec.latest_followup_at) : \'—\'}</span>', '<span className="whitespace-nowrap">{dec.latest_followup_at ? formatJalaliDateForDisplay(dec.latest_followup_at) : \'—\'}</span>'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          my = Path('src/components/Minutes/MyDecisionsPage.tsx').read_text(encoding='utf-8')
          follow = Path('src/components/Minutes/DecisionsFollowupPage.tsx').read_text(encoding='utf-8')

          checks = [
              ('my desktop full text', 'min-w-64 max-w-sm whitespace-normal break-words' in my),
              ('my mobile full text', 'mobile-line-clamp-2 text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}' not in my),
              ('my meeting date nowrap', 'whitespace-nowrap text-xs text-gray-400 dark:text-gray-500">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}' in my),
              ('my due date nowrap', 'whitespace-nowrap px-4 py-3 text-xs text-gray-500' in my),
              ('follow desktop full text', 'min-w-56 max-w-xs whitespace-normal break-words' in follow),
              ('follow mobile full text', 'mobile-line-clamp-2 text-sm font-semibold leading-6 text-gray-900 dark:text-white">{dec.title}' not in follow),
              ('follow meeting date nowrap', 'whitespace-nowrap text-gray-400">{formatJalaliDateForDisplay(dec.meeting_date_snapshot)}' in follow),
              ('follow due date nowrap', 'whitespace-nowrap px-3 py-3 text-xs text-gray-500">{dec.due_date ?' in follow),
              ('follow mobile due nowrap', 'whitespace-nowrap">{dec.due_date ? formatJalaliDateForDisplay(dec.due_date)' in follow),
              ('follow mobile latest nowrap', 'whitespace-nowrap">{dec.latest_followup_at ? formatJalaliDateForDisplay(dec.latest_followup_at)' in follow),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('post-transform assertions failed: ' + ', '.join(failed))
          PY

          git diff --check -- src/components/Minutes/MyDecisionsPage.tsx src/components/Minutes/DecisionsFollowupPage.tsx
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'src/components/Minutes/DecisionsFollowupPage.tsx' 'src/components/Minutes/MyDecisionsPage.tsx')"

      - name: Setup Node.js
        if: steps.transform.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        name: Install dependencies
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - id: build
        name: Build
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: decisions_test
        name: Decision hierarchy test
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run test:minutes-decisions

      - id: followup_test
        name: Follow-up runtime test
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run test:minutes-followup-runtime

      - id: deadline_test
        name: Decision deadline test
        if: steps.transform.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run test:decision-deadline-filters

      - name: Commit validated result and remove temporary runner
        if: always()
        shell: bash
        run: |
          transform='${{ steps.transform.outcome }}'
          install='${{ steps.install.outcome }}'
          build='${{ steps.build.outcome }}'
          decisions='${{ steps.decisions_test.outcome }}'
          followup='${{ steps.followup_test.outcome }}'
          deadline='${{ steps.deadline_test.outcome }}'

          rm -f .github/workflows/tmp-decision-table-visibility.yml

          if [ "$transform" = success ] && [ "$install" = success ] && [ "$build" = success ] && [ "$decisions" = success ] && [ "$followup" = success ] && [ "$deadline" = success ]; then
            message='fix(minutes): show full decision table content [skip ci]'
          else
            git restore --source=HEAD -- src/components/Minutes/MyDecisionsPage.tsx src/components/Minutes/DecisionsFollowupPage.tsx
            message="chore: decision table visibility validation failed transform-$transform install-$install build-$build decisions-$decisions followup-$followup deadline-$deadline [skip ci]"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main

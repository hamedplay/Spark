name: Temporary Quay MinIO Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-quay-minio-debug.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply scoped Air-Gap MinIO fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/airgap-build.sh')
          s = p.read_text()
          helper = base64.b64decode('').decode()
          marker = 'airgap_prepare_bundle_image() {\n'
          if marker not in s:
              raise SystemExit('airgap_prepare_bundle_image marker not found')
          if 'airgap_prepare_pinned_minio_image()' in s:
              raise SystemExit('helper already present')
          s = s.replace(marker, helper + marker, 1)
          old = 'airgap_prepare_bundle_image() {\n  local image="$1" meta="${2}/metadata/edge-runtime.env"\n  local runtime_image expected_id actual_id platform\n'
          new = old + '  case "$image" in\n    quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z|quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z)\n      airgap_prepare_pinned_minio_image "$image"\n      return $?\n      ;;\n  esac\n'
          if old not in s:
              raise SystemExit('bundle image function prologue not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Syntax check
        shell: bash
        run: bash -n deploy/spark-cli/lib/airgap-build.sh
      - name: Validate pinned MinIO bundle preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          fail(){ echo "FAIL: $*" >&2; }
          info(){ echo "INFO: $*"; }
          SCRIPT_DIR="$PWD/deploy/spark-cli"
          source "$SCRIPT_DIR/lib/airgap-build.sh"
          root="$(mktemp -d)"
          mkdir -p "$root/metadata"
          airgap_prepare_bundle_image 'quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z' "$root"
          airgap_prepare_bundle_image 'quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z' "$root"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' 'quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z')" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' 'quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z')" = linux/amd64
          docker run --rm --pull=never --entrypoint minio 'quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z' --version | grep -F 'RELEASE.2025-04-22T22-12-26Z'
          docker run --rm --pull=never --entrypoint /bin/sh 'quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z' -ec 'mc --version' | grep -F 'RELEASE.2025-08-13T08-35-41Z'
          printf '%s\n' \
            'quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z' \
            'quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z' >"$root/images.txt"
          airgap_export_linux_amd64_images "$root/images.txt" "$root/images.tar"
          test -s "$root/images.tar"
      - name: Verify scoped diff
        shell: bash
        run: |
          set -Eeuo pipefail
          files="$(git diff --name-only | sort)"
          test "$files" = 'deploy/spark-cli/lib/airgap-build.sh'
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add deploy/spark-cli/lib/airgap-build.sh
          git rm .github/workflows/temp-quay-minio-debug.yml
          git commit -m 'fix(airgap): build pinned MinIO images from releases'
          git push origin HEAD:main

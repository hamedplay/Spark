name: Temporary Quay MinIO Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-quay-minio-debug.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test MinIO server image as mc init
        shell: bash
        run: |
          set -Eeuo pipefail
          image='quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z'
          docker pull --platform linux/amd64 "$image"
          docker image inspect --format 'id={{.Id}} os={{.Os}} arch={{.Architecture}} repo={{json .RepoDigests}} entry={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}}' "$image"
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "$image" -ec 'command -v mc; mc --version'
          docker image save "$image" >/tmp/minio-server.tar
          test -s /tmp/minio-server.tar

name: Temporary fast Manager fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fast-manager-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Manager speed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('deploy/spark-cli/bootstrap.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('[[ ! -f "$source_dir/spark-architecture" ]] || bash -n "$source_dir/spark-architecture"\n', '')
          s = s.replace('[[ ! -f "$source_dir/spark-database" ]] || bash -n "$source_dir/spark-database"\n', '')
          s = s.replace('python3 - "$source_dir/spark-ui.py" "$source_dir/spark-ui-core.py" <<\'PYCODE\'', 'python3 - "$source_dir/spark-ui.py" "$source_dir/spark-ui-core.py" "$source_dir/spark-architecture" "$source_dir/spark-database" <<\'PYCODE\'')
          p.write_text(s, encoding='utf-8')

          p = Path('deploy/spark-cli/spark')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r'\n  if ! version_output="\$\(\$CLI_PATH --version 2>/dev/null\)" \|\| \[\[ "\$version_output" != "Spark Server Manager \$\{SPARK_MANAGER_VERSION\}" \]\]; then\n.*?\n  fi\n',
              r'\n  if ! "\$CLI_PATH" --ui-self-test >/dev/null 2>&1; then\n.*?\n  fi\n',
          ]
          for pattern in patterns:
              s, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Expected active Manager validation block not found')
          p.write_text(s, encoding='utf-8')
          PY

          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/spark
          python3 -m py_compile deploy/spark-cli/spark-ui.py deploy/spark-cli/spark-ui-core.py deploy/spark-cli/spark-architecture deploy/spark-cli/spark-database

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('deploy/spark-cli/spark').read_text(encoding='utf-8')
          m = re.search(r'install_manager_from_dir\(\) \{(.*?)\n\}\n\nself_update\(\)', s, re.S)
          if not m:
              raise SystemExit('active install_manager_from_dir not found')
          body = m.group(1)
          for token in ('version_output', '--ui-self-test', 'SPARK_MANAGER_VERSION'):
              if token in body:
                  raise SystemExit('slow Manager validation remains in active local installer: ' + token)
          PY

          ! grep -nE 'SHA256SUMS|sha256sum|VERSION_MISMATCH|Synchronizing final integration package|commits/main' \
            deploy/spark-cli/bootstrap.sh \
            deploy/spark-cli/lib/airgap-manager.sh \
            deploy/spark-cli/lib/airgap-full-source.sh \
            deploy/spark-cli/lib/spark-manager-airgap \
            deploy/spark-cli/spark-manager-airgap-bootstrap \
            deploy/spark-cli/bootstrap-full-source-airgap.sh

          git config user.name 'Spark Manager Automation'
          git config user.email 'spark-manager@users.noreply.github.com'
          git add deploy/spark-cli/bootstrap.sh deploy/spark-cli/spark
          git commit -m 'fix: remove remaining Manager update waits'
          git push origin HEAD:main

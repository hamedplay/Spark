name: exit-menu-theme-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify exit menu matches chat surface
        run: |
          node <<'NODE'
          const fs = require('fs');
          const exit = fs.readFileSync('src/features/video-conference/components/controls/RoomMediaControls.tsx', 'utf8');
          const chat = fs.readFileSync('src/features/video-conference/components/controls/ConferenceTools.tsx', 'utf8');
          if (!exit.includes('bg-slate-900/95 p-2 shadow-2xl backdrop-blur')) throw new Error('exit menu chat surface token missing');
          if (exit.includes('bg-slate-900/98')) throw new Error('unsupported old exit background still present');
          if (!chat.includes('bg-slate-900/95 shadow-2xl backdrop-blur')) throw new Error('chat surface baseline missing');
          console.log('exit menu surface matches conference chat theme');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit

name: Temporary Bootstrap Smoke

on:
  push:
    paths:
      - 'deploy/spark-cli/bootstrap.sh'
      - '.github/workflows/tmp-bootstrap-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Run public bootstrap exactly as documented
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh?nocache=$(date +%s)" | sudo bash
          /usr/local/bin/spark --version
          /usr/local/bin/spark-airgap --version
          /usr/local/bin/spark --ui-self-test
          test "$(/usr/local/bin/spark --version)" = 'Spark Server Manager 3.1.0+20260910.1'
          test "$(/usr/local/bin/spark-airgap --version)" = 'Spark Air-Gapped Installer 3.1.0+20260910.1'

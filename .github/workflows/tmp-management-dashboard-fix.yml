name: Temporary management dashboard fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-management-dashboard-fix.yml'

permissions:
  contents: write

concurrency:
  group: tmp-management-dashboard-fix
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Transform latest main, validate, and commit atomically
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: validating latest main"
            git fetch origin main
            git reset --hard origin/main
            base_sha="$(git rev-parse HEAD)"

            # Fix only the overly-broad matcher in the temporary runner itself.
            # Product source is still untouched until the runner executes.
            python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp-management-dashboard-fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace(
              "tests/app/layoutNavigation.test.ts",
              """    userPermissions: null,\\n    minutesFollowupAllowed: true,\\n""",
              """    userPermissions: null,\\n    managementDashboardAllowed: true,\\n    minutesFollowupAllowed: true,\\n""",
              expected=1,
          )'''
          new = '''replace(
              "tests/app/layoutNavigation.test.ts",
              """    isAdmin: true,\\n    sparkVisible: true,\\n    userPermissions: null,\\n    minutesFollowupAllowed: true,\\n""",
              """    isAdmin: true,\\n    sparkVisible: true,\\n    userPermissions: null,\\n    managementDashboardAllowed: true,\\n    minutesFollowupAllowed: true,\\n""",
          )'''
          if text.count(old) != 1:
              raise SystemExit('temporary runner matcher shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

            python3 scripts/tmp-management-dashboard-fix.py

            npm ci
            npm run test:layout-navigation
            npm run test:minutes-integration
            npm run build

            git diff --check
            test -f supabase/migrations/20260819171500_harden_management_dashboard_access.sql
            grep -q "has_management_dashboard_access_v1" src/AuthenticatedApp.tsx
            grep -q "managementDashboardAllowed" src/app/layout/navigationMenu.ts
            grep -q "openDecision(alert)" src/components/ManagementDashboardPage.tsx
            grep -q "focusTaskId" src/components/TasksPage.tsx
            grep -q "focusMeetingId" src/features/meetings/pages/MeetingsPage.tsx
            grep -q "focusDecisionId" src/components/Minutes/Detail/TabDecisions.tsx

            # Verify only the intended product/test/migration files plus our temp runner changed.
            python3 - <<'PY'
          import subprocess

          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = {line[3:] for line in status.splitlines() if line.strip()}
          expected = {
              'scripts/tmp-management-dashboard-fix.py',
              'src/AuthenticatedApp.tsx',
              'src/app/navigation/pageRendererTypes.ts',
              'src/app/navigation/PageRenderer.tsx',
              'src/app/layout/AppShell.tsx',
              'src/components/Layout.tsx',
              'src/app/layout/components/LayoutSidebar.tsx',
              'src/app/layout/navigationMenu.ts',
              'tests/app/layoutNavigation.test.ts',
              'src/components/ManagementDashboardPage.tsx',
              'src/components/TasksPage.tsx',
              'src/features/meetings/pages/MeetingsPage.tsx',
              'src/components/Minutes/Detail/TabDecisions.tsx',
              'supabase/migrations/20260819171500_harden_management_dashboard_access.sql',
          }
          if changed != expected:
              raise SystemExit(f'unexpected working tree changes: {sorted(changed)}')
          print('Scoped working tree verified')
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm scripts/tmp-management-dashboard-fix.py .github/workflows/tmp-management-dashboard-fix.yml
            git add src tests supabase/migrations/20260819171500_harden_management_dashboard_access.sql
            git diff --cached --check
            git commit -m "fix: secure management dashboard drill-down [skip ci]"

            git fetch origin main
            latest_sha="$(git rev-parse origin/main)"
            if [ "$latest_sha" != "$base_sha" ]; then
              overlap="$(git diff --name-only "$base_sha"..origin/main -- \
                src/AuthenticatedApp.tsx \
                src/app/navigation/pageRendererTypes.ts \
                src/app/navigation/PageRenderer.tsx \
                src/app/layout/AppShell.tsx \
                src/components/Layout.tsx \
                src/app/layout/components/LayoutSidebar.tsx \
                src/app/layout/navigationMenu.ts \
                tests/app/layoutNavigation.test.ts \
                src/components/ManagementDashboardPage.tsx \
                src/components/TasksPage.tsx \
                src/features/meetings/pages/MeetingsPage.tsx \
                src/components/Minutes/Detail/TabDecisions.tsx \
                supabase/migrations/20260819171500_harden_management_dashboard_access.sql)"
              if [ -n "$overlap" ]; then
                echo "Scoped files changed during validation; retrying latest main:"
                echo "$overlap"
                continue
              fi
              git rebase origin/main
            fi

            if git push origin HEAD:main; then
              echo "Validated dashboard fix committed; temporary dashboard tooling removed"
              exit 0
            fi

            echo "Push raced with another main update; retrying"
          done

          echo "Could not obtain a safely validated main revision after 5 attempts"
          exit 1

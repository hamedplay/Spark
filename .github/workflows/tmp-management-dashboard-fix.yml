name: Temporary management dashboard fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-management-dashboard-fix.yml'

permissions:
  contents: write

concurrency:
  group: tmp-management-dashboard-fix
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trigger revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before transformation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "VALIDATION_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply scoped transformation
        run: python3 scripts/tmp-management-dashboard-fix.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate navigation authorization
        run: npm run test:layout-navigation

      - name: Validate minutes integration contracts
        run: npm run test:minutes-integration

      - name: Production build
        run: npm run build

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f supabase/migrations/20260819171500_harden_management_dashboard_access.sql
          grep -q "has_management_dashboard_access_v1" src/AuthenticatedApp.tsx
          grep -q "managementDashboardAllowed" src/app/layout/navigationMenu.ts
          grep -q "openDecision(alert)" src/components/ManagementDashboardPage.tsx
          grep -q "focusTaskId" src/components/TasksPage.tsx
          grep -q "focusMeetingId" src/features/meetings/pages/MeetingsPage.tsx
          grep -q "focusDecisionId" src/components/Minutes/Detail/TabDecisions.tsx

      - name: Commit validated source and safely integrate latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-management-dashboard-fix.py .github/workflows/tmp-management-dashboard-fix.yml
          git add src tests supabase/migrations/20260819171500_harden_management_dashboard_access.sql
          git diff --cached --check
          git commit -m "fix: secure management dashboard drill-down"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATION_BASE" ]; then
            overlap="$(git diff --name-only "$VALIDATION_BASE"..origin/main -- \
              src/AuthenticatedApp.tsx \
              src/app/navigation/pageRendererTypes.ts \
              src/app/navigation/PageRenderer.tsx \
              src/app/layout/AppShell.tsx \
              src/components/Layout.tsx \
              src/app/layout/components/LayoutSidebar.tsx \
              src/app/layout/navigationMenu.ts \
              tests/app/layoutNavigation.test.ts \
              src/components/ManagementDashboardPage.tsx \
              src/components/TasksPage.tsx \
              src/features/meetings/pages/MeetingsPage.tsx \
              src/components/Minutes/Detail/TabDecisions.tsx \
              supabase/migrations/20260819171500_harden_management_dashboard_access.sql)"
            if [ -n "$overlap" ]; then
              echo "Scoped files changed during validation; refusing an unvalidated merge:"
              echo "$overlap"
              exit 1
            fi
            git rebase origin/main
          fi

          git push origin HEAD:main

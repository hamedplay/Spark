name: Temporary fast Manager final check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fast-manager-final-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Manager update call paths
        run: |
          set -euo pipefail
          echo 'install_manager_from_dir references:'
          grep -RFn 'install_manager_from_dir' deploy/spark-cli || true
          echo 'Manager checksum/revision gate references in active fast paths:'
          ! grep -nE 'SHA256SUMS|sha256sum|VERSION_MISMATCH|Synchronizing final integration package|commits/main' \
            deploy/spark-cli/bootstrap.sh \
            deploy/spark-cli/lib/airgap-manager.sh \
            deploy/spark-cli/lib/airgap-full-source.sh \
            deploy/spark-cli/lib/spark-manager-airgap \
            deploy/spark-cli/spark-manager-airgap-bootstrap \
            deploy/spark-cli/bootstrap-full-source-airgap.sh
      - name: Run real fast Manager install
        run: |
          set -euo pipefail
          start=$(date +%s)
          sudo bash deploy/spark-cli/bootstrap.sh
          elapsed=$(( $(date +%s) - start ))
          echo "Manager install elapsed seconds: $elapsed"
          test -x /usr/local/bin/spark
          /usr/local/bin/spark --version
          test -L /usr/local/bin/spark-airgap
          test -L /usr/local/bin/spark-architecture
          test -L /usr/local/bin/spark-database
          test -L /usr/local/bin/spark-manager-airgap
          echo 'FAST_MANAGER_INSTALL_PASS'

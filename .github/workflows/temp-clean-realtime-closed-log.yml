name: Temporary Realtime Closed Log Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-clean-realtime-closed-log.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove expected CLOSED warning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Chat/ChatConversationView.tsx')
          text = path.read_text()
          old = """\n      if (status === 'CLOSED') {\n        console.warn('⚠️ Realtime channel closed');\n      }\n"""
          if old not in text:
              raise SystemExit('expected CLOSED warning block not found')
          text = text.replace(old, '\n', 1)
          path.write_text(text)
          PY

      - name: Verify scoped diff
        shell: bash
        run: |
          git diff -- src/components/Chat/ChatConversationView.tsx
          test "$(git diff --name-only | tr '\n' ' ')" = "src/components/Chat/ChatConversationView.tsx "
          ! grep -Fq "Realtime channel closed" src/components/Chat/ChatConversationView.tsx
          grep -Fq "Realtime channel error" src/components/Chat/ChatConversationView.tsx
          grep -Fq "Realtime timed out" src/components/Chat/ChatConversationView.tsx

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add src/components/Chat/ChatConversationView.tsx
          git rm .github/workflows/temp-clean-realtime-closed-log.yml
          git commit -m "fix(chat): stop warning on expected realtime close"
          git push origin HEAD:main

# diagnosis-revision: 3
name: spark-cli-m35-diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m35-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Diagnose Supabase core health gate
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from config.models import DatabaseConfig, DatabaseStartupConfig, EnvironmentConfig, NodeConfig, PostgresStartupConfig, SupabasePackageConfig
          from roles.database.package.manager import SupabasePackageManager, SupabasePackageSpec
          from roles.database.runtime.compose import DatabaseComposeManager
          from roles.database.lifecycle.images import DatabaseImageManager
          from roles.database.lifecycle.postgres import PostgresLifecycleManager
          from roles.database.lifecycle.supabase import SupabaseLifecycleManager
          from secrets.file_provider import FileSecretProvider
          from secrets.generator import SupabaseUpstreamSecretGenerator

          base = Path(tempfile.mkdtemp(prefix='spark-m35-diag-'))
          destination = base / 'supabase'
          SupabasePackageManager().materialize(SupabasePackageSpec('self-hosted/v0.8.1','https://github.com/supabase/supabase.git',destination))
          provider = FileSecretProvider(base/'secrets'/'database.env')
          provider.set('DASHBOARD_USERNAME','supabase')
          for key,value in SupabaseUpstreamSecretGenerator(destination/'vendor'/'upstream').generate().items(): provider.set(key,value)
          profile = EnvironmentConfig(name='integration',nodes={
              'reverse_proxy':NodeConfig(role='reverse_proxy',host='127.0.0.1'),
              'application':NodeConfig(role='application',host='127.0.0.1'),
              'database':NodeConfig(role='database',host='127.0.0.1')},database=DatabaseConfig(
              supabase=SupabasePackageConfig(release='self-hosted/v0.8.1',destination=str(destination)),
              secret_file=str(base/'secrets'/'database.env'),
              startup=DatabaseStartupConfig(postgres=PostgresStartupConfig(normal_timeout_seconds=120,initialization_timeout_seconds=600),supabase_timeout_seconds=120,image_pull_timeout_seconds=1200)))
          DatabaseComposeManager().materialize(profile,provider)
          DatabaseImageManager().acquire(profile)
          postgres=PostgresLifecycleManager(poll_interval_seconds=2)
          print('postgres_first_start=',postgres.start(profile))
          print('postgres_second_start=',postgres.start(profile))
          supabase=SupabaseLifecycleManager(poll_interval_seconds=2)
          try:
              supabase.start(profile,provider)
              print('supabase_start=SUCCESS')
          except Exception as exc:
              print('supabase_start_error=',str(exc))
              aggregate,states=supabase.detect(profile)
              print('aggregate=',aggregate.value)
              for state in states:
                  print(f'{state.capability.value}={state.state.value}/{state.docker_health or "no-health"}/{state.service_name}')
              raise
          PY

name: Temp Calendar Similar Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/components/CalendarMeetingForm/DateTimeSection.tsx'
      - '.github/workflows/tmp-validate-calendar-similar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

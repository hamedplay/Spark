name: Temporary owner delegate validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-owner-delegate-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Meeting delegation regression tests
        run: npm run test:meeting-delegation
      - name: Owner delegate wiring checks
        run: |
          grep -q "assign_meeting_owner_delegate" src/components/Calendar/MeetingOwnerDelegateModal.tsx
          grep -q "setShowOwnerDelegate(true)" src/components/Calendar/MeetingDetailModal.tsx
          grep -q "status = 'pending'" supabase/migrations/20260827050635_guard_meeting_owner_delegate_existing_participant.sql

          python3 - "$tmp/docker-compose.yml" <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1], encoding='utf-8'))
          p=d['services']['supavisor']['ports']
          assert '127.0.0.1:5433:5432/tcp' in p, p
          assert '0.0.0.0:5432:5432/tcp' in p, p
          assert '127.0.0.1:6543:6543/tcp' in p, p
          PY
          patch_database_external_mapping close
          python3 - "$tmp/docker-compose.yml" <<'PY'
          import sys,yaml
          d=yaml.safe_load(open(sys.argv[1], encoding='utf-8'))
          p=d['services']['supavisor']['ports']
          assert '127.0.0.1:5433:5432/tcp' in p, p
          assert '0.0.0.0:5432:5432/tcp' not in p, p
          assert '127.0.0.1:6543:6543/tcp' in p, p
          PY

      - name: Validate scoped contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'security-credentials) show_operator_credentials' deploy/spark-cli/spark
          grep -Fq 'db-open) open_database_external_access' deploy/spark-cli/spark
          grep -Fq 'db-close) close_database_external_access' deploy/spark-cli/spark
          grep -Fq '0.0.0.0:5432:5432/tcp' deploy/spark-cli/lib/admin.sh
          grep -Fq 'https://${API_DOMAIN}:8443' deploy/spark-cli/lib/admin.sh
          grep -Fq 'curl -fsSkL' deploy/spark-cli/lib/admin.sh
          grep -Fq 'DASHBOARD_PASSWORD' deploy/spark-cli/lib/admin.sh
          grep -Fq 'POSTGRES_PASSWORD' deploy/spark-cli/lib/admin.sh
          if grep -Fq 'SERVICE_ROLE_KEY"' <(sed -n '/show_operator_credentials()/,/^}/p' deploy/spark-cli/lib/admin.sh); then
            echo 'operator credential view must not expose service role key' >&2
            exit 1
          fi
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' deploy/spark-cli/bootstrap.sh deploy/spark-cli/lib/admin.sh deploy/spark-cli/spark deploy/spark-cli/spark-ui.py | sort)"

      - name: Commit validated change and clean temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-spark-cli-access-fix.yml .spark-cli-access-fix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add -- deploy/spark-cli/bootstrap.sh deploy/spark-cli/spark deploy/spark-cli/spark-ui.py deploy/spark-cli/lib/admin.sh .github/workflows/tmp-spark-cli-access-fix.yml .spark-cli-access-fix-trigger
          git diff --cached --check
          git commit -m 'fix: make Spark CLI access controls operational [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

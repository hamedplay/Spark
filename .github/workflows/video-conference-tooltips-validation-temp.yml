name: video-conference-tooltips-validation-temp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - name: Verify tooltip architecture and icon labels
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tooltip = fs.readFileSync('src/components/VideoConference/useConferenceTooltips.ts', 'utf8');
          const archive = fs.readFileSync('src/components/VideoConference/Page/ConferenceArchiveList.tsx', 'utf8');
          const preflight = fs.readFileSync('src/components/VideoConference/PreflightDeviceSelector.tsx', 'utf8');
          const tools = fs.readFileSync('src/features/video-conference/components/controls/ConferenceToolsBar.tsx', 'utf8');
          const media = fs.readFileSync('src/features/video-conference/components/controls/RoomMediaControls.tsx', 'utf8');
          const tile = fs.readFileSync('src/features/video-conference/components/LiveKitParticipantTile.tsx', 'utf8');
          const devices = fs.readFileSync('src/components/VideoConference/DeviceSelector.tsx', 'utf8');

          for (const required of [
            "document.addEventListener('pointerover'",
            "document.addEventListener('focusin'",
            "control.getAttribute('aria-label')",
            "control.querySelector('svg')",
            "bg-slate-900/95",
            'subscribers += 1',
          ]) {
            if (!tooltip.includes(required)) throw new Error(`tooltip engine missing: ${required}`);
          }

          for (const [name, file] of [['lobby', archive], ['prejoin', preflight], ['room', tools]]) {
            if (!file.includes('useConferenceTooltips')) throw new Error(`${name} tooltip mount missing`);
          }

          const requiredLabels = [
            [tools, 'گفتگوی جلسه'],
            [tools, 'شرکت‌کنندگان'],
            [tools, 'بالا بردن دست'],
            [tools, 'شروع ضبط'],
            [tools, 'قفل جلسه'],
            [media, 'قطع میکروفون'],
            [media, 'خاموش کردن دوربین'],
            [media, 'اشتراک صفحه'],
            [media, 'خروج یا اتمام جلسه'],
            [tile, 'نمایش تمام‌صفحه'],
            [tile, 'تصویر در تصویر'],
            [tile, 'کاهش بزرگ‌نمایی'],
            [tile, 'افزایش بزرگ‌نمایی'],
            [devices, 'فعال کردن میکروفون'],
          ];
          for (const [file, label] of requiredLabels) {
            if (!file.includes(label)) throw new Error(`missing conference icon label: ${label}`);
          }
          console.log('Video conference tooltip coverage verified');
          NODE
      - name: Build
        run: npm run build
      - name: Video conference unit tests
        run: npm run test:video-conference:unit

name: Temporary Print Signature Footer Validation

on:
  push:
    paths:
      - '.github/workflows/tmp-print-signature-footer-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate print footer structure
        run: |
          grep -q "variant === 'print'" src/components/Minutes/MinutesDocumentLayout.tsx
          grep -q "mp-print-signature-footer" src/components/Minutes/MinutesDocumentLayout.tsx
          grep -q "position: fixed" src/components/Minutes/minutes-print.css
          grep -q "margin: 18mm 16mm 30mm 16mm" src/components/Minutes/minutes-print.css
          grep -q "variant === 'preview' && showParticipants" src/components/Minutes/MinutesDocumentLayout.tsx

name: Temporary Two Dependency Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-two-deps.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update requested dependencies
        run: |
          npm install @supabase/supabase-js@2.117.3 @vitejs/plugin-react@6.1.2 --save-exact

      - name: Verify requested versions
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies['@supabase/supabase-js'] !== '2.117.3') throw new Error('supabase version mismatch');
          if (p.devDependencies['@vitejs/plugin-react'] !== '6.1.2') throw new Error('vite plugin version mismatch');
          NODE
          npm ls @supabase/supabase-js @vitejs/plugin-react

      - name: Build
        run: npm run build

      - name: Verify scoped diff
        run: |
          git status --short
          files="$(git diff --name-only | sort)"
          expected=$'package-lock.json\npackage.json'
          test "$files" = "$expected"

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add package.json package-lock.json
          git rm .github/workflows/temp-update-two-deps.yml
          git commit -m "chore(deps): update supabase and vite react plugin"
          git push origin HEAD:main

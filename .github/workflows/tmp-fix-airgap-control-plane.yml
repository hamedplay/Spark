name: Temporary Fix AirGap Control Plane

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve current Air-Gap Manager control plane in step 03
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('deploy/spark-cli/lib/airgap.sh')
          text = p.read_text(encoding='utf-8')
          marker = '''  python3 "${source_dir}/spark-ui.py" --self-test >/dev/null || return 1\n\n  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n'''
          replacement = '''  python3 "${source_dir}/spark-ui.py" --self-test >/dev/null || return 1\n\n  # The installed Manager is the Air-Gap control plane. Do not downgrade it to\n  # the application snapshot embedded in an older offline bundle during step 03.\n  if [[ -x /usr/local/bin/spark && -x /usr/local/bin/spark-airgap && -x /usr/local/bin/spark-migrate ]]; then\n    local installed_manager_version installed_airgap_version\n    installed_manager_version="$(/usr/local/bin/spark --version 2>/dev/null || true)"\n    installed_airgap_version="$(/usr/local/bin/spark-airgap --version 2>/dev/null || true)"\n    if [[ "$installed_manager_version" == "Spark Server Manager ${SPARK_MANAGER_VERSION}" \\\n          && "$installed_airgap_version" == "Spark Air-Gapped Installer ${SPARK_MANAGER_VERSION}" ]]; then\n      info "Preserving current Spark Manager control plane ${SPARK_MANAGER_VERSION}; bundled Spark application source remains pinned to its verified snapshot."\n      return 0\n    fi\n  fi\n\n  stage="$(mktemp -d /usr/local/lib/spark-manager.airgap.XXXXXX)"\n'''
          if marker not in text:
              raise SystemExit('airgap Manager install marker not found')
          p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Validate control-plane guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/lib/airgap.sh
          grep -Fq 'Preserving current Spark Manager control plane' deploy/spark-cli/lib/airgap.sh
          grep -Fq 'Spark Server Manager ${SPARK_MANAGER_VERSION}' deploy/spark-cli/lib/airgap.sh
          grep -Fq 'Spark Air-Gapped Installer ${SPARK_MANAGER_VERSION}' deploy/spark-cli/lib/airgap.sh
          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap.sh
          git commit -m 'fix(airgap): preserve newer Manager control plane'
          git push origin HEAD:main

name: Temporary meeting card video removal validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-meeting-card-video-removal.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate meeting card video action removed
        run: |
          ! grep -q "ویدیوکنفرانس جلسه" src/features/meetings/components/MeetingCard/index.tsx
          ! grep -q "onOpenVideoConference" src/features/meetings/components/MeetingCard/index.tsx
          ! grep -q "onOpenVideoConference" src/features/meetings/pages/MeetingsPage.tsx

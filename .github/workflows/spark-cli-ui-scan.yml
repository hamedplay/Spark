name: One-time Spark Manager UI refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-ui-scan.yml'

permissions:
  contents: write

jobs:
  refresh-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply English terminal UI and Spark welcome screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('deploy/spark-cli')

          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')

          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8')

          def replace_func(text, name, replacement):
              pattern = re.compile(rf'(?ms)^{re.escape(name)}\(\) \{{\n.*?^\}}\n')
              new, count = pattern.subn(replacement.rstrip() + '\n', text, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not replace function {name}: matches={count}')
              return new

          # Entry point -------------------------------------------------------
          spark = read('spark')
          spark = spark.replace('SPARK_MANAGER_VERSION="1.0.1"', 'SPARK_MANAGER_VERSION="1.1.0"', 1)
          if "C_DIM=$'\\033[2m'" not in spark:
              spark = spark.replace("C_BOLD=$'\\033[1m'\n", "C_BOLD=$'\\033[1m'\nC_DIM=$'\\033[2m'\nC_WHITE=$'\\033[37m'\nC_MAGENTA=$'\\033[35m'\n", 1)

          main_menu = r'''main_menu() {
            welcome_screen
            while true; do
              title

              menu_section "DEPLOYMENT"
              menu_option "1" "Install / Configure Spark" "Guided 20-step single-host deployment"
              menu_option "2" "Health Checks & Logs" "Validate services and inspect runtime logs"
              menu_option "3" "Update Spark Application" "GitHub, migrations, functions and frontend"

              menu_section "SYSTEM"
              menu_option "4" "Update Linux Packages" "APT packages and reboot status"
              menu_option "5" "Node.js / npm / Audit" "Dependencies, audit and maintenance"
              menu_option "8" "Resource Monitor" "CPU, memory, disk, processes and containers"

              menu_section "SECURITY & ACCESS"
              menu_option "6" "Open Supabase Admin Access" "TLS 8443 restricted to ADMIN_CIDR"
              menu_option "7" "Close Supabase Admin Access" "Remove temporary admin gateway"
              menu_option "11" "TLS Certificate Management" "Inspect and renew certificates"

              menu_section "OPERATIONS"
              menu_option "9" "Backup Management" "Database and configuration backups"
              menu_option "10" "Service Management" "Status, restart and reload operations"
              menu_option "12" "Version & Security Info" "Runtime and deployment version details"
              menu_option "13" "Update Spark Manager" "Refresh this management console"

              printf '\n'
              menu_option "0" "Exit" "Close Spark Server Manager"
              menu_hint "Select an option and press Enter."
              read -r -p "  Select: " choice
              case "$choice" in
                0) exit 0 ;;
                1) install_menu ;;
                2) test_menu ;;
                3) update_spark || true; pause ;;
                4) linux_update || true; pause ;;
                5) npm_menu ;;
                6) open_supabase_admin_access || true; pause ;;
                7) close_supabase_admin_access || true; pause ;;
                8) resource_status; pause ;;
                9) backup_menu ;;
                10) service_menu ;;
                11) certificate_menu ;;
                12) version_info; pause ;;
                13) self_update || true; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          spark = replace_func(spark, 'main_menu', main_menu)
          spark = spark.replace('بدون option منوی تعاملی باز می‌شود.', 'Run without an option to open the interactive control center.')
          spark = spark.replace('  --version       نمایش نسخه', '  --version       Show Spark Manager version')
          spark = spark.replace('  --test          اجرای Validation کامل', '  --test          Run full validation')
          spark = spark.replace('  --update        اجرای Update برنامه', '  --update        Update Spark application')
          spark = spark.replace('  --resources     نمایش وضعیت منابع', '  --resources     Show server resource usage')
          spark = spark.replace('run_visible "Validation کامل" test_full_validation', 'run_visible "Full validation" test_full_validation')
          spark = spark.replace('fail "Option ناشناخته: $1"', 'fail "Unknown option: $1"')
          write('spark', spark)

          # Core theme / common prompts --------------------------------------
          core = read('lib/core.sh')
          core = replace_func(core, 'pause', r'''pause() {
            printf '\n'
            read -r -p "Press Enter to continue..." _
          }''')

          themed_title = r'''title() {
            clear_screen
            local host
            host="$(hostname -s 2>/dev/null || hostname)"
            printf '%s┌──────────────────────────────────────────────────────────────────────┐%s\n' "$C_GREEN" "$C_RESET"
            printf '%s│%s  %s%sSPARK SERVER MANAGER%s   %sProduction Infrastructure Control%s\n' "$C_GREEN" "$C_RESET" "$C_BOLD" "$C_WHITE" "$C_RESET" "$C_DIM" "$C_RESET"
            printf '%s│%s  %sHost:%s %-24s %sVersion:%s %s\n' "$C_GREEN" "$C_RESET" "$C_DIM" "$C_RESET" "$host" "$C_DIM" "$C_RESET" "$SPARK_MANAGER_VERSION"
            printf '%s└──────────────────────────────────────────────────────────────────────┘%s\n' "$C_GREEN" "$C_RESET"
          }

          welcome_screen() {
            clear_screen
            printf '%s%s' "$C_GREEN" "$C_BOLD"
            cat <<'EOF'
   ███████╗██████╗  █████╗ ██████╗ ██╗  ██╗
   ██╔════╝██╔══██╗██╔══██╗██╔══██╗██║ ██╔╝
   ███████╗██████╔╝███████║██████╔╝█████╔╝
   ╚════██║██╔═══╝ ██╔══██║██╔══██╗██╔═██╗
   ███████║██║     ██║  ██║██║  ██║██║  ██╗
   ╚══════╝╚═╝     ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝
EOF
            printf '%s\n' "$C_RESET"
            printf '%s%sWelcome to Spark Server Manager%s\n' "$C_BOLD" "$C_CYAN" "$C_RESET"
            printf '%sProduction deployment, operations and infrastructure control for Spark.%s\n' "$C_DIM" "$C_RESET"
            printf '%sSafe guided actions · validation-first workflow · production-aware defaults%s\n\n' "$C_DIM" "$C_RESET"
            printf '%sManager version:%s %s   %sHost:%s %s\n' "$C_DIM" "$C_RESET" "$SPARK_MANAGER_VERSION" "$C_DIM" "$C_RESET" "$(hostname -s 2>/dev/null || hostname)"
            printf '%sRepository:%s github.com/hamedplay/Spark\n\n' "$C_DIM" "$C_RESET"
            read -r -p "Press Enter to open the control center..." _
          }

          menu_section() {
            printf '\n%s%s▸ %s%s\n' "$C_BOLD" "$C_GREEN" "$1" "$C_RESET"
          }

          menu_option() {
            local key="$1" label="$2" detail="${3:-}"
            printf '  %s[%2s]%s  %s%-30s%s %s%s%s\n' "$C_CYAN" "$key" "$C_RESET" "$C_BOLD" "$label" "$C_RESET" "$C_DIM" "$detail" "$C_RESET"
          }

          menu_option_status() {
            local key="$1" badge="$2" label="$3"
            printf '  %s[%2s]%s  %s %-44s\n' "$C_CYAN" "$key" "$C_RESET" "$badge" "$label"
          }

          menu_hint() {
            printf '\n  %s%s%s\n\n' "$C_DIM" "$1" "$C_RESET"
          }'''
          core = replace_func(core, 'title', themed_title)

          replacements = {
              'آخرین خروجی خطا:': 'Failure output:',
              '$label نتیجه هشدار/یافته دارد (exit=$rc)': '$label completed with warnings/findings (exit=$rc)',
              'برای تأیید عبارت ${word} را وارد کنید: ': 'Type ${word} to confirm: ',
              'دامنه اصلی': 'Primary application domain',
              'دامنه www': 'WWW domain',
              'دامنه API': 'API domain',
              'دامنه TURN': 'TURN domain',
              'Public IPv4 سرور': 'Server public IPv4',
              'Private IPv4 سرور (اگر NAT ندارید همان Public IP)': 'Server private IPv4 (use public IP when no NAT is present)',
              'CIDR مدیریتی مجاز برای SSH': 'Allowed administrative CIDR for SSH',
              "Email برای Let's Encrypt": "Email for Let's Encrypt",
              'دامنه معتبر نیست.': 'Invalid domain.',
              'IPv4 معتبر نیست.': 'Invalid IPv4 address.',
              'CIDR معتبر نیست؛ مثال: 203.0.113.10/32': 'Invalid CIDR; example: 203.0.113.10/32',
              'Email معتبر نیست.': 'Invalid email address.',
              'پورت TURN باید عددی باشد.': 'TURN ports must be numeric.',
              'بازه TURN نامعتبر است.': 'Invalid TURN relay port range.',
              'تنظیمات در ${MANAGER_CONF} ذخیره شد (mode 600).': 'Configuration saved to ${MANAGER_CONF} (mode 600).',
              'Public IPv4 که DNS باید به آن اشاره کند': 'Public IPv4 address referenced by DNS',
              'این مقادیر تنظیم نشده‌اند: ${missing[*]}': 'These required values are not configured: ${missing[*]}',
              'ابتدا مرحله 2 نصب را اجرا کنید.': 'Run installation step 2 first.',
              'Spark Manager entrypoint پیدا نشد: ${source_dir}/spark': 'Spark Manager entrypoint not found: ${source_dir}/spark',
              'Spark Manager module پیدا نشد: ${module}.sh': 'Spark Manager module not found: ${module}.sh',
          }
          for old, new in replacements.items():
              core = core.replace(old, new)
          write('lib/core.sh', core)

          # Installation menu -------------------------------------------------
          install_c = read('lib/install-platform-c.sh')
          install_c = install_c.replace('fail "اجرای زنجیره‌ای در مرحله ${n} متوقف شد."', 'fail "Sequential installation stopped at step ${n}."')
          install_c = install_c.replace('ok "تمام مراحل 1 تا 20 با موفقیت اجرا شدند."', 'ok "All installation steps 1 through 20 completed successfully."')
          install_menu = r'''install_menu() {
            while true; do
              title
              menu_section "SINGLE-HOST INSTALLATION"
              menu_hint "Workflow source: deploy/manual-production/single-host.md"
              menu_option_status "1"  "$(step_badge 1)"  "DNS verification"
              menu_option_status "2"  "$(step_badge 2)"  "Installation values & configuration"
              menu_option_status "3"  "$(step_badge 3)"  "Base packages + Docker + Node.js 24"
              menu_option_status "4"  "$(step_badge 4)"  "Clone / update Spark repository"
              menu_option_status "5"  "$(step_badge 5)"  "Fetch pinned Supabase source"
              menu_option_status "6"  "$(step_badge 6)"  "Generate Supabase secrets"
              menu_option_status "7"  "$(step_badge 7)"  "Configure Supabase environment"
              menu_option_status "8"  "$(step_badge 8)"  "Sync Edge Functions + main router"
              menu_option_status "9"  "$(step_badge 9)"  "Provider / worker environment"
              menu_option_status "10" "$(step_badge 10)" "Docker Compose hardening & configuration"
              menu_option_status "11" "$(step_badge 11)" "Validate and start Supabase"
              menu_option_status "12" "$(step_badge 12)" "Apply Spark database migrations"
              menu_option_status "13" "$(step_badge 13)" "Build and deploy frontend"
              menu_option_status "14" "$(step_badge 14)" "Bootstrap Nginx"
              menu_option_status "15" "$(step_badge 15)" "Issue TLS certificates"
              menu_option_status "16" "$(step_badge 16)" "Configure production Nginx"
              menu_option_status "17" "$(step_badge 17)" "Configure local schedulers"
              menu_option_status "18" "$(step_badge 18)" "Configure TURN / Coturn"
              menu_option_status "19" "$(step_badge 19)" "Configure Certbot renewal hook"
              menu_option_status "20" "$(step_badge 20)" "Configure production firewall"
              printf '\n'
              menu_option "21" "Run all steps" "Execute steps 1 → 20 in order"
              menu_option "0" "Back" "Return to the main control center"
              menu_hint "Completed steps are marked with a green check."
              read -r -p "  Select: " choice
              case "$choice" in
                0) return ;;
                [1-9]|1[0-9]|20) run_install_step "$choice" || true; pause ;;
                21) run_all_install || true; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          install_c = replace_func(install_c, 'install_menu', install_menu)
          write('lib/install-platform-c.sh', install_c)

          # Tests / logs / backup menus --------------------------------------
          tests = read('lib/tests-backup.sh')
          tests = tests.replace('fail "Supabase compose پیدا نشد."', 'fail "Supabase compose file was not found."')
          tests = tests.replace('نام service برای نمایش 200 خط log (Enter=بازگشت): ', 'Service name to show the last 200 log lines (Enter=Back): ')
          tests = tests.replace('fail "Service نامعتبر."', 'fail "Invalid service."')
          tests = tests.replace('info "Backup PostgreSQL..."', 'info "Backing up PostgreSQL..."')

          test_menu = r'''test_menu() {
            while true; do
              title
              menu_section "HEALTH CHECKS & LOGS"
              menu_option "1" "Full Validation" "End-to-end platform validation"
              menu_option "2" "Frontend" "HTTPS and application response"
              menu_option "3" "API / Auth / Functions" "Public API and function routing"
              menu_option "4" "Docker Status" "Container and service state"
              menu_option "5" "Docker Service Logs" "Inspect logs for a selected service"
              menu_option "6" "Nginx Status & Logs" "Web gateway service diagnostics"
              menu_option "7" "Scheduler Status & Logs" "Timers and scheduled function runs"
              menu_option "8" "TURN Status & Logs" "Coturn and STUN validation"
              menu_option "9" "DB / API Exposure Check" "Detect unintended public bindings"
              menu_option "10" "DNS & TLS" "DNS records and certificate validation"
              menu_option "11" "Listening Ports & UFW" "Network listeners and firewall state"
              menu_option "12" "Migration Dry Run" "Preview pending database migrations"
              printf '\n'
              menu_option "0" "Back" "Return to the main control center"
              menu_hint "Failed checks keep their detailed output in /var/log/spark-manager/."
              read -r -p "  Select: " choice
              case "$choice" in
                0) return ;;
                1) new_log "test-full"; run_visible "Full validation" test_full_validation || true; pause ;;
                2) new_log "test-frontend"; run_visible "Frontend" test_frontend || true; pause ;;
                3) new_log "test-api"; run_visible "API" test_api || true; pause ;;
                4) new_log "test-docker"; run_visible "Docker status" compose ps || true; pause ;;
                5) docker_logs_menu ;;
                6)
                  new_log "test-nginx"
                  run_report "Nginx status" systemctl status nginx --no-pager
                  journalctl -u nginx -n 120 --no-pager 2>&1 | tee -a "$CURRENT_LOG" || true
                  pause ;;
                7) new_log "test-schedulers"; run_report "Scheduler status" test_schedulers; scheduler_logs; pause ;;
                8)
                  new_log "test-turn"
                  run_report "TURN test" test_turn
                  journalctl -u coturn -n 120 --no-pager 2>&1 | tee -a "$CURRENT_LOG" || true
                  pause ;;
                9) new_log "test-exposure"; run_visible "Public exposure check" test_db_exposure || true; pause ;;
                10) new_log "test-dns-ssl"; run_visible "DNS/TLS" test_ssl_dns || true; pause ;;
                11)
                  new_log "test-ports-firewall"
                  run_report "Listening ports" ss -lntup
                  run_report "UFW" ufw status verbose
                  pause ;;
                12) new_log "test-migration-dryrun"; run_visible "Migration dry-run" migration_dry_run "$SPARK_ROOT" || true; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          tests = replace_func(tests, 'test_menu', test_menu)

          backup_menu = r'''backup_menu() {
            while true; do
              title
              menu_section "BACKUP MANAGEMENT"
              menu_option "1" "Create Manual Backup" "PostgreSQL database + runtime configuration"
              menu_option "2" "List Backups" "Show the most recent backup directories"
              printf '\n'
              menu_option "0" "Back" "Return to the main control center"
              read -r -p "  Select: " c
              case "$c" in
                0) return ;;
                1)
                  new_log "backup-manual"
                  if run_visible "Create backup" create_backup manual; then ok "Backup created successfully."; fi
                  pause ;;
                2) new_log "backup-list"; run_report "Backups" list_backups; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          tests = replace_func(tests, 'backup_menu', backup_menu)
          write('lib/tests-backup.sh', tests)

          # Admin / maintenance menus ----------------------------------------
          admin = read('lib/admin.sh')
          npm_menu = r'''npm_menu() {
            while true; do
              title
              menu_section "NODE.JS / NPM / AUDIT"
              menu_option "1" "Show Versions" "Node.js and npm versions"
              menu_option "2" "Update npm" "Update global npm within major version 11"
              menu_option "3" "Install Dependencies" "Run npm ci in the Spark repository"
              menu_option "4" "Full npm Audit" "Audit production and development dependencies"
              menu_option "5" "Production npm Audit" "Audit with --omit=dev"
              menu_option "6" "Outdated Packages" "Show available dependency updates"
              menu_option "7" "Audit Fix Dry Run" "Preview fixes without modifying files"
              printf '\n'
              menu_option "0" "Back" "Return to the main control center"
              read -r -p "  Select: " c
              new_log "npm-maintenance"
              case "$c" in
                0) return ;;
                1) run_report "Versions" bash -c 'node --version; npm --version'; pause ;;
                2) run_visible "Update npm" npm install -g 'npm@^11.6.2' || true; pause ;;
                3) run_visible "npm ci" bash -c "cd '$SPARK_ROOT' && npm ci" || true; pause ;;
                4) run_report "npm audit" bash -c "cd '$SPARK_ROOT' && npm audit"; pause ;;
                5) run_report "npm audit production" bash -c "cd '$SPARK_ROOT' && npm audit --omit=dev"; pause ;;
                6) run_report "npm outdated" bash -c "cd '$SPARK_ROOT' && npm outdated"; pause ;;
                7) run_report "npm audit fix dry-run" bash -c "cd '$SPARK_ROOT' && npm audit fix --dry-run"; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          admin = replace_func(admin, 'npm_menu', npm_menu)

          service_menu = r'''service_menu() {
            while true; do
              title
              menu_section "SERVICE MANAGEMENT"
              menu_option "1" "Show Service Status" "Nginx, Coturn, Docker and Spark timers"
              menu_option "2" "Restart Functions + Worker" "Recreate Edge Functions and avatar worker"
              menu_option "3" "Reload Nginx" "Validate configuration before reload"
              menu_option "4" "Restart Coturn" "Restart TURN service"
              menu_option "5" "Restart Supabase Stack" "Controlled recreate of all Supabase services"
              menu_option "6" "Restart Scheduler Timers" "Restart all Spark systemd timers"
              printf '\n'
              menu_option "0" "Back" "Return to the main control center"
              read -r -p "  Select: " c
              new_log "service-management"
              case "$c" in
                0) return ;;
                1)
                  run_report "Nginx" systemctl status nginx --no-pager
                  run_report "Coturn" systemctl status coturn --no-pager
                  run_report "Docker" compose ps
                  run_report "Timers" systemctl list-timers 'spark-*' --no-pager
                  pause ;;
                2) run_visible "Restart Functions + Worker" bash -c "cd '$SUPABASE_ROOT' && docker compose up -d --force-recreate functions avatar-worker" || true; pause ;;
                3) run_visible "Nginx test/reload" bash -c 'nginx -t && systemctl reload nginx' || true; pause ;;
                4) run_visible "Restart Coturn" systemctl restart coturn || true; pause ;;
                5)
                  if confirm_word "The entire Supabase stack will be recreated and may cause a brief service interruption." "RESTART"; then
                    run_visible "Restart Supabase stack" bash -c "cd '$SUPABASE_ROOT' && docker compose up -d --force-recreate" || true
                  fi
                  pause ;;
                6)
                  run_visible "Restart timers" bash -c 'systemctl restart spark-daily-report.timer spark-minutes-reminder.timer spark-decision-due.timer spark-notification-outbox.timer' || true
                  pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          admin = replace_func(admin, 'service_menu', service_menu)

          certificate_menu = r'''certificate_menu() {
            while true; do
              title
              menu_section "TLS CERTIFICATE MANAGEMENT"
              menu_option "1" "Show Certificates" "Display Certbot-managed certificates"
              menu_option "2" "Renewal Dry Run" "Validate the renewal workflow"
              menu_option "3" "Run Certbot Renew" "Execute certificate renewal"
              printf '\n'
              menu_option "0" "Back" "Return to the main control center"
              read -r -p "  Select: " c
              new_log "certificate-management"
              case "$c" in
                0) return ;;
                1) run_report "Certificates" certbot certificates; pause ;;
                2) run_visible "Renewal dry-run" certbot renew --dry-run || true; pause ;;
                3) run_visible "Certbot renew" certbot renew || true; pause ;;
                *) fail "Invalid option"; sleep 1 ;;
              esac
            done
          }'''
          admin = replace_func(admin, 'certificate_menu', certificate_menu)

          admin_replacements = {
              'برای تکمیل update، reboot لازم است.': 'A reboot is required to complete the update.',
              'Reboot اجباری گزارش نشده است.': 'No mandatory reboot is currently reported.',
              'Nginx Production فعال نیست؛ ابتدا مرحله 16 نصب را اجرا کنید.': 'Production Nginx is not active; run installation step 16 first.',
              'برای حفظ معماری، Docker port 8000 عمومی نمی‌شود. یک Gateway مدیریتی TLS روی 8443 فقط برای ${ADMIN_CIDR} ساخته می‌شود.': 'Docker port 8000 will remain private. A TLS admin gateway on 8443 will be created only for ${ADMIN_CIDR}.',
              'لغو شد.': 'Cancelled.',
              'UFW allow 8443 فقط از ADMIN_CIDR': 'Allow TCP 8443 only from ADMIN_CIDR',
              'دسترسی مدیریتی: https://${API_DOMAIN}:8443 — فقط ${ADMIN_CIDR}': 'Admin access: https://${API_DOMAIN}:8443 — restricted to ${ADMIN_CIDR}',
              'Kong همچنان فقط روی 127.0.0.1:8000 bind است.': 'Kong remains bound only to 127.0.0.1:8000.',
              'Port 8443 listen نشد.': 'Port 8443 did not start listening.',
              'دسترسی مدیریتی مستقیم Supabase بسته شد.': 'Direct Supabase administrative access has been closed.',
              'هنوز listener دیگری روی 8443 وجود دارد؛ بررسی دستی لازم است.': 'Another listener is still using port 8443; manual inspection is required.',
              'دریافت ${file}': 'Download ${file}',
              'Entrypoint دانلودشده syntax معتبر ندارد.': 'Downloaded entrypoint has invalid Bash syntax.',
              'یکی از moduleهای دانلودشده syntax معتبر ندارد.': 'A downloaded module has invalid Bash syntax.',
              'نصب atomically Spark Manager': 'Install Spark Manager atomically',
              'Spark Manager به‌روز شد. برای بارگذاری نسخه جدید، از منو خارج و دوباره spark را اجرا کنید.': 'Spark Manager updated successfully. Exit and run spark again to load the new version.',
          }
          for old, new in admin_replacements.items():
              admin = admin.replace(old, new)
          write('lib/admin.sh', admin)

          # Validate that menu-facing functions contain no Persian text -------
          persian = re.compile(r'[\u0600-\u06ff]')
          menu_functions = {
              'spark': ['main_menu'],
              'lib/core.sh': ['pause', 'title', 'welcome_screen', 'menu_section', 'menu_option', 'menu_option_status', 'menu_hint'],
              'lib/install-platform-c.sh': ['install_menu'],
              'lib/tests-backup.sh': ['docker_logs_menu', 'test_menu', 'backup_menu'],
              'lib/admin.sh': ['npm_menu', 'service_menu', 'certificate_menu'],
          }
          for rel, names in menu_functions.items():
              text = read(rel)
              for name in names:
                  m = re.search(rf'(?ms)^{re.escape(name)}\(\) \{{\n.*?^\}}\n', text)
                  if not m:
                      raise RuntimeError(f'Missing expected UI function {rel}:{name}')
                  if persian.search(m.group(0)):
                      raise RuntimeError(f'Persian text remains in menu function {rel}:{name}')

          # Entire spark entry/help must also be English.
          if persian.search(read('spark')):
              raise RuntimeError('Persian text remains in Spark entrypoint/help')

          print('Spark Manager UI transformation completed.')
          PY

      - name: Validate Bash syntax and UI contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/bootstrap.sh
          for file in deploy/spark-cli/lib/*.sh; do bash -n "$file"; done
          grep -q 'SPARK_MANAGER_VERSION="1.1.0"' deploy/spark-cli/spark
          grep -q 'Welcome to Spark Server Manager' deploy/spark-cli/lib/core.sh
          grep -q 'DEPLOYMENT' deploy/spark-cli/spark
          grep -q 'HEALTH CHECKS & LOGS' deploy/spark-cli/lib/tests-backup.sh
          grep -q 'SINGLE-HOST INSTALLATION' deploy/spark-cli/lib/install-platform-c.sh
          grep -q 'NODE.JS / NPM / AUDIT' deploy/spark-cli/lib/admin.sh
          test "$(grep -RhE '^install_step_([1-9]|1[0-9]|20)\(\)' deploy/spark-cli/lib | wc -l)" -eq 20

      - name: Commit validated UI and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/spark-cli-ui-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/spark-cli/spark deploy/spark-cli/lib/core.sh deploy/spark-cli/lib/install-platform-c.sh deploy/spark-cli/lib/tests-backup.sh deploy/spark-cli/lib/admin.sh .github/workflows/spark-cli-ui-scan.yml
          git diff --cached --check
          git commit -m "feat: refresh Spark Manager terminal UI"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

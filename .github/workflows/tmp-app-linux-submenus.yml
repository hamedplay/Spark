name: Temporary app-linux submenu validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-app-linux-submenus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/spark
          for f in deploy/spark-cli/lib/*.sh; do bash -n "$f"; done
          bash -n deploy/spark-cli/bootstrap-base.sh
          python3 -m py_compile deploy/spark-cli/spark-ui.py
          python3 deploy/spark-cli/spark-ui.py --self-test

          for action in             app-update app-update-offline app-npm-update app-node-update app-npm-outdated app-active-version             linux-update resources linux-network linux-firewall linux-version linux-package-version             linux-reboot linux-history-delete linux-log-delete linux-cache-delete linux-user-active
          do
            grep -Fq "$action)" deploy/spark-cli/spark
          done

          grep -Fq 'lib/application-maintenance.sh' deploy/spark-cli/bootstrap-base.sh
          grep -Fq 'lib/linux-system.sh' deploy/spark-cli/bootstrap-base.sh
          grep -Fq 'source "${SCRIPT_DIR}/lib/application-maintenance.sh"' deploy/spark-cli/lib/runtime-fixes.sh
          grep -Fq 'source "${SCRIPT_DIR}/lib/linux-system.sh"' deploy/spark-cli/lib/runtime-fixes.sh

      - name: Enforce application layer boundary
        shell: bash
        run: |
          set -euo pipefail
          file=deploy/spark-cli/lib/application-maintenance.sh
          ! grep -Eq 'psql|supabase_migrations|docker[[:space:]]+compose|install_step_[0-9]+|spark_database_' "$file"
          grep -Fq '/opt/spark-airgap' "$file"
          grep -Fq 'sources/spark.git.bundle' "$file"
          grep -Fq 'frontend-node-modules.tar.gz' "$file"
          grep -Fq 'npm update --no-audit --no-fund' "$file"
          grep -Fq 'apt-get install -y --only-upgrade nodejs' "$file"

      - name: Real frontend build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VITE_SUPABASE_URL=https://example.invalid           VITE_SUPABASE_ANON_KEY=test-anon-key           npm run build
          test -s dist/index.html

      - name: Linux destructive-action guards
        shell: bash
        run: |
          set -euo pipefail
          file=deploy/spark-cli/lib/linux-system.sh
          grep -Fq '"REBOOT"' "$file"
          grep -Fq '"DELETE-HISTORY"' "$file"
          grep -Fq '"DELETE-LOGS"' "$file"
          grep -Fq '"DELETE-CACHE"' "$file"
          grep -Fq 'ufw status verbose' "$file"
          grep -Fq 'ip -br address' "$file"
          grep -Fq 'loginctl list-users' "$file"

name: spark-cli-m35-bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m35-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch bootstrap for M3.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/bootstrap.sh')
          text = path.read_text()
          if 'DATABASE_CLI_PATH=' not in text:
              text = text.replace('ARCHITECTURE_CLI_PATH="/usr/local/bin/spark-architecture"\n', 'ARCHITECTURE_CLI_PATH="/usr/local/bin/spark-architecture"\nDATABASE_CLI_PATH="/usr/local/bin/spark-database"\n', 1)
          old = '"$tmp/adapters" "$tmp/roles/database/runtime"'
          if '"$tmp/roles/database/lifecycle"' not in text:
              text = text.replace(old, old + ' "$tmp/roles/database/lifecycle"', 1)
          anchor = 'roles/database/tasks/compose.py\n'
          additions = (
              anchor
              + 'roles/database/tasks/images.py\n'
              + 'roles/database/tasks/postgres.py\n'
              + 'roles/database/tasks/supabase.py\n'
              + 'roles/database/lifecycle/__init__.py\n'
              + 'roles/database/lifecycle/models.py\n'
              + 'roles/database/lifecycle/images.py\n'
              + 'roles/database/lifecycle/postgres.py\n'
              + 'roles/database/lifecycle/supabase.py\n'
              + 'roles/database/lifecycle/diagnostics.py\n'
              + 'database_cli.py\n'
              + 'spark-database\n'
          )
          if 'roles/database/lifecycle/postgres.py\n' not in text:
              if anchor not in text: raise SystemExit('task file-list anchor missing')
              text = text.replace(anchor, additions, 1)
          old = '"$stage/adapters" "$stage/roles/database/runtime"'
          if '"$stage/roles/database/lifecycle"' not in text:
              if old not in text: raise SystemExit('stage dir anchor missing')
              text = text.replace(old, old + ' "$stage/roles/database/lifecycle"', 1)
          if 'install -m 0755 "$tmp/spark-database" "$stage/spark-database"' not in text:
              marker = 'install -m 0755 "$tmp/spark-architecture" "$stage/spark-architecture"\n'
              if marker not in text: raise SystemExit('entrypoint install anchor missing')
              text = text.replace(marker, marker + 'install -m 0755 "$tmp/spark-database" "$stage/spark-database"\ninstall -m 0644 "$tmp/database_cli.py" "$stage/database_cli.py"\n', 1)
          anchor = 'for file in "$tmp"/roles/database/runtime/*.py; do install -m 0644 "$file" "$stage/roles/database/runtime/$(basename "$file")"; done\n'
          if 'stage/roles/database/lifecycle/$(basename "$file")' not in text:
              if anchor not in text: raise SystemExit('lifecycle stage anchor missing')
              text = text.replace(anchor, anchor + 'for file in "$tmp"/roles/database/lifecycle/*.py; do install -m 0644 "$file" "$stage/roles/database/lifecycle/$(basename "$file")"; done\n', 1)
          rollback = 'rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$ARCHITECTURE_CLI_PATH" "$MIGRATE_PATH"'
          if rollback in text:
              text = text.replace(rollback, 'rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$ARCHITECTURE_CLI_PATH" "$DATABASE_CLI_PATH" "$MIGRATE_PATH"', 1)
          rollback_link = '[[ -x "$TARGET/spark-architecture" ]] && ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\n'
          if '[[ -x "$TARGET/spark-database" ]]' not in text and rollback_link in text:
              text = text.replace(rollback_link, rollback_link + '    [[ -x "$TARGET/spark-database" ]] && ln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"\n', 1)
          main_link = 'ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\n'
          tail = text.split('chmod 0755 "$TARGET"', 1)
          if len(tail) == 2 and 'ln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"' not in tail[1]:
              text = text.replace(main_link, main_link + 'ln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"\n', 1)
          ui_marker = 'if ! "$CLI_PATH" --ui-self-test >/dev/null 2>&1; then\n'
          if 'Spark database lifecycle CLI smoke test failed' not in text:
              smoke = 'if ! "$DATABASE_CLI_PATH" --help >/dev/null 2>&1; then\n  echo "Spark database lifecycle CLI smoke test failed; rolling back." >&2\n  rollback_install\n  exit 1\nfi\n'
              if ui_marker not in text: raise SystemExit('smoke-test anchor missing')
              text = text.replace(ui_marker, smoke + ui_marker, 1)
          path.write_text(text)
          PY
          bash -n deploy/spark-cli/bootstrap.sh
          git diff --check
      - name: Validate staged modules and regression
        working-directory: deploy/spark-cli
        run: |
          python3 -m py_compile core/*.py adapters/*.py config/*.py secrets/*.py roles/database/*.py roles/database/package/*.py roles/database/runtime/*.py roles/database/lifecycle/*.py roles/database/tasks/*.py database_cli.py spark-database
          python3 -m unittest tests.smoke.test_manager_baseline -v
          python3 -m unittest tests.test_workflow_core -v
          python3 -m unittest discover -s tests/database -v
          python3 spark-database --help >/dev/null
          bash -n bootstrap.sh
          grep -Fq 'spark-database' bootstrap.sh
          grep -Fq 'roles/database/lifecycle/postgres.py' bootstrap.sh
          grep -Fq 'roles/database/lifecycle/supabase.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/images.py' bootstrap.sh
      - name: Commit bootstrap integration
        run: |
          git config user.name "spark-m35-bot"
          git config user.email "spark-m35-bot@users.noreply.github.com"
          git add deploy/spark-cli/bootstrap.sh
          if ! git diff --cached --quiet; then
            git commit -m "feat: install M3.5 database lifecycle modules with spark manager"
            git push origin HEAD:main
          fi

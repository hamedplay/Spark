name: Temporary Fix Air-Gap Observability

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-airgap-observability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Air-Gap observability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/tmp_fix_airgap_observability.py
          bash -n deploy/spark-cli/lib/airgap-build.sh
          bash -n deploy/spark-cli/lib/airgap-ip.sh
          git diff --check

      - name: Validate builder includes observability profile images
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq -- '--profile observability config --images' deploy/spark-cli/lib/airgap-build.sh
          echo 'Air-Gap builder observability image collection: PASS'

      - name: Validate Air-Gap Step 22 avoids Internet pull
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deploy/spark-cli/lib/airgap-ip.sh').read_text()
          start=s.index('install_step_22() {')
          end=s.index('\nairgap_status() {', start)
          block=s[start:end]
          assert 'livekit_observability_compose pull' not in block
          assert 'livekit_airgap_observability_images_ready' in block
          assert 'airgap_reload_image_archive' in block
          assert 'no Internet pull was attempted' in block
          print('Air-Gap Step 22 offline semantics: PASS')
          PY

      - name: Validate observability diagnostics with stubs
        shell: bash
        run: |
          set -Eeuo pipefail
          f='deploy/spark-cli/lib/airgap-ip.sh'
          python3 - "$f" <<'PY' >/tmp/obs-functions.sh
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          start=s.index('livekit_airgap_observability_config_ready() {')
          end=s.index('\ninstall_step_22() {', start)
          print(s[start:end])
          PY

          root="$(mktemp -d)"
          mkdir -p "$root/monitoring/rules" \
                   "$root/monitoring/grafana/provisioning/datasources" \
                   "$root/monitoring/grafana/provisioning/dashboards" \
                   "$root/monitoring/grafana/dashboards" \
                   "$root/monitoring/targets"
          for f in prometheus.yml alertmanager.yml blackbox.yml loki.yml alloy.alloy; do : >"$root/monitoring/$f"; done
          : >"$root/monitoring/rules/livekit-alerts.yml"
          : >"$root/monitoring/grafana/provisioning/datasources/datasources.yml"
          : >"$root/monitoring/grafana/provisioning/dashboards/dashboards.yml"
          printf '{}\n' >"$root/monitoring/grafana/dashboards/spark-livekit-overview.json"
          printf '{}\n' >"$root/monitoring/grafana/dashboards/spark-livekit-operations.json"
          printf '[]\n' >"$root/monitoring/targets/blackbox.json"

          cat >/tmp/obs-harness.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          LIVEKIT_ROOT="$1"
          CURRENT_LOG="$(mktemp)"
          livekit_observability_compose(){ [[ "${1:-}" == config && "${2:-}" == --quiet ]]; }
          source /tmp/obs-functions.sh
          livekit_airgap_observability_config_ready
          rm -f "$LIVEKIT_ROOT/monitoring/loki.yml"
          if livekit_airgap_observability_config_ready; then
            echo 'ERROR: missing observability file was accepted' >&2
            exit 1
          fi
          grep -Fq 'Missing observability file:' "$CURRENT_LOG"
          echo 'Air-Gap observability config diagnostics: PASS'
          SH
          bash /tmp/obs-harness.sh "$root"

      - name: Commit minimal fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/airgap-build.sh deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(airgap): make observability fully offline'
          git pull --rebase origin main
          git push origin HEAD:main

name: Spark Manager one-time installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-manager-install-once.yml'
      - '.spark-tmp/**'

permissions:
  contents: write

concurrency:
  group: spark-manager-one-time-main
  cancel-in-progress: false

jobs:
  install-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .spark-tmp/payload.00 .spark-tmp/payload.01 .spark-tmp/payload.02 .spark-tmp/payload.03 | base64 -d > /tmp/spark-manager.tar.gz
          echo '81a9c041625610225961af07b6a6120f0107d5f239ffaf4ed7a1af83c96dc9e9  /tmp/spark-manager.tar.gz' | sha256sum -c -
          tar -tzf /tmp/spark-manager.tar.gz
          rm -rf deploy/spark-cli
          tar -xzf /tmp/spark-manager.tar.gz

      - name: Validate Bash and module contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/bootstrap.sh
          for file in deploy/spark-cli/lib/*.sh; do bash -n "$file"; done
          test "$(grep -RhE '^install_step_([1-9]|1[0-9]|20)\(\)' deploy/spark-cli/lib | wc -l)" -eq 20
          for n in $(seq 1 20); do grep -Rq "^install_step_${n}()" deploy/spark-cli/lib; done
          python3 - <<'PY'
          from pathlib import Path
          entry=Path('deploy/spark-cli/spark').read_text()
          modules=['core','install-base','install-platform-a','install-platform-b','install-platform-c','tests-backup','update','admin']
          for module in modules:
              assert module in entry
              assert Path('deploy/spark-cli/lib', module + '.sh').is_file()
          print('module-contract-ok')
          PY
          bad="$(grep -RIn 'npm audit fix' deploy/spark-cli --include='*.sh' | grep -v -- '--dry-run' || true)"
          test -z "$bad"
          deploy/spark-cli/spark --version

      - name: Validate Compose transformer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/runtime" "$tmp/repo/worker" "$tmp/config" "$tmp/state/steps" "$tmp/log" "$tmp/backup"
          cat > "$tmp/runtime/docker-compose.yml" <<'YAML'
          services:
            kong:
              image: kong
              ports: ["8000:8000"]
            db:
              image: postgres
              ports: ["5432:5432"]
            supavisor:
              image: supavisor
              ports: ["5433:5432"]
            auth:
              image: auth
              environment:
                KEEP_ME: yes
            functions:
              image: functions
              env_file: [.env]
              environment:
                KEEP_FUNCTION: value
          YAML
          export SPARK_ROOT="$tmp/repo" SUPABASE_ROOT="$tmp/runtime" SUPABASE_SOURCE="$tmp/source"
          export CONFIG_DIR="$tmp/config" MANAGER_CONF="$tmp/config/manager.conf" STATE_DIR="$tmp/state" STEP_DIR="$tmp/state/steps" LOG_DIR="$tmp/log" BACKUP_DIR="$tmp/backup" CLI_PATH="$tmp/spark"
          export C_RESET='' C_GREEN='' C_RED='' C_YELLOW='' C_BLUE='' C_CYAN='' C_BOLD='' CURRENT_LOG="$tmp/log/test.log"
          : > "$CURRENT_LOG"
          source deploy/spark-cli/lib/core.sh
          source deploy/spark-cli/lib/install-platform-a.sh
          patch_compose
          python3 - "$tmp/runtime/docker-compose.yml" <<'PY'
          import sys,yaml
          s=yaml.safe_load(open(sys.argv[1]))['services']
          assert s['kong']['ports']==['127.0.0.1:8000:8000/tcp']
          assert 'ports' not in s['db']
          assert s['supavisor']['ports']==['127.0.0.1:5433:5432/tcp','127.0.0.1:6543:6543/tcp']
          assert s['auth']['environment']['KEEP_ME'] is True
          assert s['auth']['environment']['GOTRUE_HOOK_SEND_SMS_ENABLED']=='true'
          assert '/etc/spark/functions-extra.env' in s['functions']['env_file']
          assert s['functions']['environment']['KEEP_FUNCTION']=='value'
          assert 'avatar-worker' in s
          print('compose-transform-ok')
          PY

      - name: Commit permanent files and clean temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .spark-tmp
          rm -f .github/workflows/spark-manager-install-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A deploy/spark-cli deploy/manual-production/README.md .spark-tmp .github/workflows/spark-manager-install-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat: add Spark server management CLI'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: tmp-action-center-issue-runner

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: ${{ github.event.issue.title == 'tmp-action-center-validator-trigger-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12

      - name: Apply exact fix
        run: |
          python3 scripts/tmp-action-center-fix.py
          grep -Fq 'onClick={props.onOverdue}' src/components/Tasks/TasksWorkspaceChrome.tsx
          grep -Fq "setDashboardTaskView('overdue')" src/components/TasksPage.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted selector regression test
        run: |
          cat > tests/.tmp-action-center-selectors.test.ts <<'TS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { filterTasks } from '../src/components/Tasks/taskPageSelectors';

          const active = { id: 'active', title: 'active', description: '', tags: [], status: 'pending', archived: false, current_assignee_id: 'u1', created_by_id: 'u2', user_id: 'u2' } as any;
          const completed = { id: 'completed', title: 'completed', description: '', tags: [], status: 'completed', archived: true, current_assignee_id: 'u1', created_by_id: 'u2', user_id: 'u2' } as any;
          const common = { tasks: [active, completed], searchTerm: '', taskTab: 'all' as const, personalProjectFilter: 'all', userId: 'u1' };

          test('all excludes archived actions', () => assert.deepEqual(filterTasks({ ...common, statusFilter: 'all' }).map(t => t.id), ['active']));
          test('completed includes auto-archived completed actions', () => assert.deepEqual(filterTasks({ ...common, statusFilter: 'completed' }).map(t => t.id), ['completed']));
          test('archived explicitly exposes archived actions', () => assert.deepEqual(filterTasks({ ...common, statusFilter: 'archived' }).map(t => t.id), ['completed']));
          TS
          node --import tsx --test tests/.tmp-action-center-selectors.test.ts
          rm -f tests/.tmp-action-center-selectors.test.ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit validated fix and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f tests/.tmp-action-center-selectors.test.ts
          git show 119ae9f55c9469c0b5c79f2e2862080e6bf1b3a3:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/tmp-action-center-validator.yml
          rm -f .github/workflows/tmp-action-center-issue-runner.yml
          rm -f scripts/tmp-action-center-fix.py
          rm -f .tmp-action-center-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(tasks): make action center metrics functional [skip ci]'
          git push origin HEAD:main
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Cleanup after failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git reset --hard HEAD || true
          rm -f tests/.tmp-action-center-selectors.test.ts
          git show 119ae9f55c9469c0b5c79f2e2862080e6bf1b3a3:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/tmp-action-center-validator.yml
          rm -f .github/workflows/tmp-action-center-issue-runner.yml
          rm -f scripts/tmp-action-center-fix.py
          rm -f .tmp-action-center-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: cleanup tmp action center [skip ci]' || true
          git push origin HEAD:main || true
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason not_planned || true

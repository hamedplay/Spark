name: Temporary Fix Supabase Env Validator

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-supabase-env-validator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch validators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in [
              'deploy/spark-cli/lib/install-base.sh',
              'deploy/spark-cli/lib/airgap-ip.sh',
          ]:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              start = text.index('test_supabase_env() {')
              end = text.index('\n}\n\ninstall_step_6() {', start)
              block = text[start:end+2]
              if '\n  return 0\n}' in block:
                  continue
              old = '\n  done\n}'
              if old not in block:
                  raise SystemExit(f'expected validator tail not found in {filename}')
              block = block.rsplit(old, 1)[0] + '\n  done\n  return 0\n}'
              text = text[:start] + block + text[end+2:]
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and validator semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/lib/install-base.sh
          bash -n deploy/spark-cli/lib/airgap-ip.sh

          for f in deploy/spark-cli/lib/install-base.sh deploy/spark-cli/lib/airgap-ip.sh; do
            awk '/^test_supabase_env\(\) \{/{p=1} p{print} p && /^\}$/{exit}' "$f" | grep -Fq 'return 0'
          done

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          awk '/^test_supabase_env\(\) \{/{p=1} p{print} p && /^\}$/{exit}' deploy/spark-cli/lib/airgap-ip.sh >"$work/validator.sh"
          cat >"$work/test.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          SUPABASE_ROOT=/tmp/spark-validator
          AIRGAP_SERVER_IP=10.20.30.40
          API_DOMAIN=10.20.30.40
          APP_DOMAIN=10.20.30.40
          mkdir -p "$SUPABASE_ROOT"
          touch "$SUPABASE_ROOT/.env"
          declare -A V=(
            [COMPOSE_FILE]=docker-compose.yml
            [SUPABASE_PUBLIC_URL]=http://10.20.30.40
            [API_EXTERNAL_URL]=http://10.20.30.40/auth/v1
            [SITE_URL]=http://10.20.30.40
            [PROXY_DOMAIN]=10.20.30.40
            [POSTGRES_HOST]=db
            [POSTGRES_DB]=postgres
            [POSTGRES_PORT]=5432
            [FUNCTIONS_VERIFY_JWT]=false
            [POOLER_TENANT_ID]=spark-a
            [STORAGE_TENANT_ID]=spark-b
            [SEND_SMS_HOOK_SECRET]=whsec_ok
            [PHONE_RATE_LIMIT_PEPPER]=pepper
            [PHONE_PASSWORD_RESET_SECRET]=reset
            [DAILY_REPORT_CRON_SECRET]=daily
            [NOTIFICATION_OUTBOX_CRON_SECRET]=outbox
            [MINUTES_REMINDER_CRON_SECRET]=minutes
            [DECISION_DUE_CRON_SECRET]=decision
            [OPENAI_API_KEY]=''
            [SMTP_HOST]=''
            [SMTP_USER]=''
            [SMTP_PASS]=''
            [GOOGLE_PROJECT_ID]=''
            [GOOGLE_PROJECT_NUMBER]=''
          )
          env_get() { printf '%s' "${V[$2]-}"; }
          is_placeholder_value() {
            local value="${1:-}"
            [[ -z "$value" ]] && return 1
            [[ "$value" == *CHANGE_ME* || "$value" == *xxxxxxxx* ]]
          }
          airgap_ip_base_url() { printf 'http://%s' "$AIRGAP_SERVER_IP"; }
          source "$1"
          test_supabase_env
          V[GOOGLE_PROJECT_NUMBER]=CHANGE_ME
          if test_supabase_env; then
            echo 'validator accepted placeholder unexpectedly' >&2
            exit 1
          fi
          EOF
          chmod +x "$work/test.sh"
          "$work/test.sh" "$work/validator.sh"

          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/spark-cli/lib/install-base.sh deploy/spark-cli/lib/airgap-ip.sh
          git commit -m 'fix(manager): return success from valid Supabase env checks'
          git push origin HEAD:main

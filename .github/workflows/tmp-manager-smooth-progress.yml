name: Temporary Manager smooth progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manager-smooth-progress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/spark-cli/bootstrap.sh
          grep -Fq 'select.select' deploy/spark-cli/bootstrap.sh
          grep -Fq '\033[2K' deploy/spark-cli/bootstrap.sh
      - name: Validate smooth PTY progress
        shell: bash
        run: |
          set -euo pipefail
          script -qefc "curl -fsSL https://raw.githubusercontent.com/hamedplay/Spark/main/deploy/spark-cli/bootstrap.sh | sudo bash" /tmp/manager-pty.log
          tr '\r' '\n' < /tmp/manager-pty.log | sed -r 's/\x1B\[[0-9;]*[mK]//g' > /tmp/manager-clean.log
          grep -Eo '[[:space:]][0-9]{1,3}%' /tmp/manager-clean.log | tr -d ' %' | sort -nu > /tmp/percents.txt
          cat /tmp/percents.txt
          count=$(wc -l < /tmp/percents.txt)
          test "$count" -ge 20
          grep -qx '100' /tmp/percents.txt
          /usr/local/bin/spark --version

name: Temporary Dependency Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-node-deps.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Update requested dependencies
        run: |
          npm install --save \
            docx@9.10.0 \
            livekit-client@2.22.4 \
            lucide-react@1.55.0 \
            uuid@14.0.3
          npm install --save-dev \
            dotenv@18.0.7 \
            oxlint@1.87.0 \
            postcss@8.5.29 \
            vite@8.3.4

      - name: Verify requested versions
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const expected = {
            dependencies: {
              docx: '^9.10.0',
              'livekit-client': '^2.22.4',
              'lucide-react': '^1.55.0',
              uuid: '^14.0.3',
            },
            devDependencies: {
              dotenv: '^18.0.7',
              oxlint: '^1.87.0',
              postcss: '^8.5.29',
              vite: '^8.3.4',
            },
          };
          for (const [section, entries] of Object.entries(expected)) {
            for (const [name, version] of Object.entries(entries)) {
              if (p[section]?.[name] !== version) {
                throw new Error(`${section}.${name}: expected ${version}, got ${p[section]?.[name]}`);
              }
            }
          }
          NODE
          npm ls --depth=0 \
            docx livekit-client lucide-react uuid dotenv oxlint postcss vite

      - name: Build
        run: npm run build

      - name: Verify scoped diff
        run: |
          git diff -- package.json package-lock.json
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "package-lock.json package.json "

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "hamedplay"
          git config user.email "hamedkhaleghi493@gmail.com"
          git add package.json package-lock.json
          git rm .github/workflows/temp-update-node-deps.yml
          git commit -m "chore(deps): update frontend dependencies"
          git push origin HEAD:main

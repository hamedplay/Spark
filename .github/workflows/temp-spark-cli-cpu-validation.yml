name: Temporary Spark CLI CPU Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Spark CLI Compose CPU override
        run: |
          cat > /tmp/livekit.env <<'EOF'
          LIVEKIT_DOMAIN=meet.example.com
          LIVEKIT_TURN_DOMAIN=turn.example.com
          LIVEKIT_INGRESS_DOMAIN=ingress.example.com
          LIVEKIT_API_KEY=testkey
          LIVEKIT_API_SECRET=testsecret
          LIVEKIT_WEBHOOK_URL=https://api.example.com/webhook
          LIVEKIT_REDIS_ADDRESS=127.0.0.1:6379
          S3_ACCESS_KEY=testaccess
          S3_SECRET_KEY=testsecret
          S3_REGION=us-east-1
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_BUCKET=testbucket
          LIVEKIT_SERVER_IMAGE=livekit/livekit-server:v1.13.5
          LIVEKIT_EGRESS_IMAGE=livekit/egress:v1.13.0
          LIVEKIT_INGRESS_IMAGE=livekit/ingress:v1.5.0
          REDIS_IMAGE=redis:7.4.5-alpine
          CADDY_IMAGE=caddy:2.10.2-alpine
          MINIO_IMAGE=minio/minio:RELEASE.2025-04-22T22-12-26Z
          MINIO_MC_IMAGE=minio/mc:RELEASE.2025-08-13T08-35-41Z
          PROMETHEUS_IMAGE=prom/prometheus:v3.14.0
          ALERTMANAGER_IMAGE=prom/alertmanager:v0.34.0
          GRAFANA_IMAGE=grafana/grafana:13.2.0
          LOKI_IMAGE=grafana/loki:3.7.0
          ALLOY_IMAGE=grafana/alloy:v1.19.0
          NODE_EXPORTER_IMAGE=prom/node-exporter:v1.12.1
          BLACKBOX_EXPORTER_IMAGE=prom/blackbox-exporter:v0.28.0
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=testpassword
          LIVEKIT_CPU_LIMIT=4.0
          EGRESS_CPU_LIMIT=4.0
          INGRESS_CPU_LIMIT=4.0
          EOF
          docker compose \
            -f deploy/livekit/docker-compose.yml \
            -f deploy/livekit/docker-compose.spark-cli.yml \
            --env-file /tmp/livekit.env config --format json > /tmp/config.json
          python3 - <<'PY'
          import json
          cfg=json.load(open('/tmp/config.json'))
          for svc in ('livekit','egress','ingress'):
              cpus=cfg['services'][svc].get('cpus')
              assert float(cpus) == 2.0, (svc, cpus)
          PY

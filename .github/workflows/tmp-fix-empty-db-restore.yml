name: Temp Empty DB Restore Fix

on:
  push:
    branches: [main]
    paths:
      - 'tmp_patch_empty_db_restore.py'
      - '.github/workflows/tmp-fix-empty-db-restore.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tmp_patch_empty_db_restore.py
      - name: Validate shell syntax
        run: bash -n deploy/spark-cli/lib/tests-backup.sh
      - name: Validate contract
        run: |
          grep -Fq 'postgres_database_exists()' deploy/spark-cli/lib/tests-backup.sh
          grep -Fq 'postgres.absent' deploy/spark-cli/lib/tests-backup.sh
          grep -Fq "Target database 'postgres' is absent; restore will create it" deploy/spark-cli/lib/tests-backup.sh
          grep -Fq 'if (( safety_had_postgres == 1 )); then' deploy/spark-cli/lib/tests-backup.sh
      - name: Commit implementation
        run: |
          git config user.name spark-automation
          git config user.email spark-automation@users.noreply.github.com
          git add deploy/spark-cli/lib/tests-backup.sh
          git commit -m 'fix(manager): restore backup into empty postgres target'
          git push origin HEAD:main

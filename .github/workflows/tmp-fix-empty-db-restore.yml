name: Temp Empty DB Restore Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-empty-db-restore.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch restore flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/spark-cli/lib/tests-backup.sh')
          s = p.read_text()

          marker = '''restore_stop_non_db_services() {
'''
          helper = '''postgres_database_exists() {
  restore_ensure_db_writable 180 || return 1
  [[ "$(compose exec -T db psql -X -U postgres -d template1 -Atqc "SELECT 1 FROM pg_database WHERE datname='postgres';" 2>/dev/null || true)" == "1" ]]
}

restore_stop_non_db_services() {
'''
          assert s.count(marker) == 1
          s = s.replace(marker, helper, 1)

          old = '''  elif [[ -f "${SUPABASE_ROOT}/docker-compose.yml" ]] && compose config --services | grep -Fxq db; then
    info "Backup PostgreSQL recovery snapshot..." >&2
    if ! compose exec -T db pg_dump -U postgres -d postgres -Fc >"${dest}/postgres.dump"; then
      rm -rf "$dest"
      fail "PostgreSQL recovery snapshot failed."
      return 1
    fi
    chmod 600 "${dest}/postgres.dump"
  fi
'''
          new = '''  elif [[ -f "${SUPABASE_ROOT}/docker-compose.yml" ]] && compose config --services | grep -Fxq db; then
    if postgres_database_exists; then
      info "Backup PostgreSQL recovery snapshot..." >&2
      if ! compose exec -T db pg_dump -U postgres -d postgres -Fc >"${dest}/postgres.dump"; then
        rm -rf "$dest"
        fail "PostgreSQL recovery snapshot failed."
        return 1
      fi
      chmod 600 "${dest}/postgres.dump"
    elif [[ "$kind" == "pre-restore" ]]; then
      info "Database 'postgres' does not exist yet; recording empty-target safety state." >&2
      : >"${dest}/postgres.absent"
      chmod 600 "${dest}/postgres.absent"
    else
      rm -rf "$dest"
      fail "PostgreSQL database 'postgres' does not exist; recovery snapshot cannot be created."
      return 1
    fi
  fi
'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '''restore_plain_database_from_file() {
  local path="$1" safety_dir safety_dump db_access_was_active=0 restore_rc=0 rollback_rc=0
'''
          new = '''restore_plain_database_from_file() {
  local path="$1" safety_dir safety_dump safety_absent_marker
  local safety_had_postgres=0 db_access_was_active=0 restore_rc=0 rollback_rc=0
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''  safety_dump="${safety_dir}/postgres.dump"
  [[ -s "$safety_dump" ]] || {
    fail "Safety backup does not contain postgres.dump. Restore was not started."
    return 1
  }
  printf 'Safety backup : %s\\n' "$safety_dir"
'''
          new = '''  safety_dump="${safety_dir}/postgres.dump"
  safety_absent_marker="${safety_dir}/postgres.absent"
  if [[ -s "$safety_dump" ]]; then
    safety_had_postgres=1
  elif [[ -f "$safety_absent_marker" ]]; then
    safety_had_postgres=0
    info "Target database 'postgres' is absent; restore will create it from the supplied backup."
  else
    fail "Safety backup contains neither postgres.dump nor postgres.absent state marker. Restore was not started."
    return 1
  fi
  printf 'Safety backup : %s\\n' "$safety_dir"
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    if (( rollback_rc == 0 )); then
      restore_custom_safety_dump "$safety_dump" >>"${CURRENT_LOG:-/dev/null}" 2>&1
      rollback_rc=$?
    fi
'''
          new = '''    if (( rollback_rc == 0 )); then
      if (( safety_had_postgres == 1 )); then
        restore_custom_safety_dump "$safety_dump" >>"${CURRENT_LOG:-/dev/null}" 2>&1
        rollback_rc=$?
      else
        restore_drop_postgres_database >>"${CURRENT_LOG:-/dev/null}" 2>&1
        rollback_rc=$?
      fi
    fi
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate shell syntax
        run: bash -n deploy/spark-cli/lib/tests-backup.sh

      - name: Validate empty-target restore contract
        run: |
          set -euo pipefail
          grep -Fq 'postgres_database_exists()' deploy/spark-cli/lib/tests-backup.sh
          grep -Fq 'postgres.absent' deploy/spark-cli/lib/tests-backup.sh
          grep -Fq "Target database 'postgres' is absent; restore will create it" deploy/spark-cli/lib/tests-backup.sh
          grep -Fq 'if (( safety_had_postgres == 1 )); then' deploy/spark-cli/lib/tests-backup.sh
          grep -Fq 'restore_drop_postgres_database' deploy/spark-cli/lib/tests-backup.sh

      - name: Commit implementation
        run: |
          git config user.name spark-automation
          git config user.email spark-automation@users.noreply.github.com
          git add deploy/spark-cli/lib/tests-backup.sh
          git commit -m 'fix(manager): restore backup into empty postgres target'
          git push origin HEAD:main

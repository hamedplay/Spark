# trigger-2
name: Temporary Spark source refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-refresh-spark-sources.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v6
        with:
          fetch-depth: 4

      - name: Apply scoped Spark CLI source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          core = Path('deploy/spark-cli/lib/core.sh')
          text = core.read_text(encoding='utf-8')
          for line in [
              "    printf 'SUPABASE_REF=%q\\n' \"${SUPABASE_REF:-}\"\n",
              "    printf 'SUPABASE_COMMIT=%q\\n' \"${SUPABASE_COMMIT:-}\"\n",
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'core.sh: expected config line not found exactly once: {line!r}')
              text = text.replace(line, '')
          core.write_text(text, encoding='utf-8')

          path = Path('deploy/spark-cli/lib/install-base.sh')
          text = path.read_text(encoding='utf-8')
          old = '  require_dir "${SPARK_ROOT}/supabase/migrations" || return 1\n'
          if text.count(old) != 1:
              raise SystemExit('install-base.sh: stale Spark migrations requirement mismatch')
          text = text.replace(old, '')
          old = '    run_logged "Clone کردن Spark" git clone "$REPO_URL" "$SPARK_ROOT" || return 1\n'
          new = '    run_logged "Clone آخرین main از Spark" git clone --branch main --single-branch "$REPO_URL" "$SPARK_ROOT" || return 1\n'
          if text.count(old) != 1:
              raise SystemExit('install-base.sh: Spark clone command mismatch')
          text = text.replace(old, new)

          pattern = re.compile(r'test_supabase_source\(\) \{.*?\n\}\n\ninstall_step_5\(\) \{.*?\n\}\n\n(?=generate_jwt\(\))', re.S)
          replacement = r'''test_supabase_source() {
  require_dir "${SUPABASE_SOURCE}/.git" || return 1
  require_file "${SUPABASE_SOURCE}/docker/docker-compose.yml" || return 1
  require_file "${SUPABASE_ROOT}/docker-compose.yml" || return 1
  require_file "${SUPABASE_ROOT}/.env" || return 1
  [[ "$(git -C "$SUPABASE_SOURCE" remote get-url origin)" == "https://github.com/supabase/supabase.git" ]] || return 1
  [[ "$(git -C "$SUPABASE_SOURCE" branch --show-current)" == "main" ]] || return 1
  local actual latest
  actual="$(git -C "$SUPABASE_SOURCE" rev-parse HEAD)" || return 1
  latest="$(git -C "$SUPABASE_SOURCE" rev-parse origin/main)" || return 1
  [[ "$actual" == "$latest" ]] || return 1
}

install_step_5() {
  title
  new_log "install-05-supabase-latest"

  if [[ -d "${SUPABASE_SOURCE}/.git" ]]; then
    if [[ -n "$(git -C "$SUPABASE_SOURCE" status --porcelain)" ]]; then
      fail "${SUPABASE_SOURCE} تغییرات commit نشده دارد؛ برای جلوگیری از overwrite مرحله متوقف شد."
      git -C "$SUPABASE_SOURCE" status --short | tee -a "$CURRENT_LOG"
      return 1
    fi
    run_logged "Fetch آخرین Supabase main" git -C "$SUPABASE_SOURCE" fetch origin main || return 1
    run_logged "Checkout Supabase main" git -C "$SUPABASE_SOURCE" checkout main || return 1
    run_logged "Fast-forward Supabase main" git -C "$SUPABASE_SOURCE" pull --ff-only origin main || return 1
  elif [[ -e "$SUPABASE_SOURCE" ]]; then
    fail "${SUPABASE_SOURCE} وجود دارد ولی Git repository نیست."
    return 1
  else
    run_logged "Clone آخرین Supabase رسمی" git clone --branch main --single-branch https://github.com/supabase/supabase.git "$SUPABASE_SOURCE" || return 1
  fi

  if [[ -f "${SUPABASE_ROOT}/.env" ]]; then
    warn "${SUPABASE_ROOT} از قبل فعال است؛ Source رسمی به آخرین main به‌روزرسانی شد ولی runtime/config زنده overwrite نمی‌شود."
    rm -f "${SUPABASE_ROOT}/.spark-supabase-source-commit"
  else
    rm -rf "$SUPABASE_ROOT"
    mkdir -p "$SUPABASE_ROOT"
    run_logged "کپی آخرین Docker snapshot رسمی Supabase" cp -a "${SUPABASE_SOURCE}/docker/." "$SUPABASE_ROOT/" || return 1
    run_logged "ایجاد .env اولیه" cp "${SUPABASE_ROOT}/.env.example" "${SUPABASE_ROOT}/.env" || return 1
    chmod 600 "${SUPABASE_ROOT}/.env"
    rm -f "${SUPABASE_ROOT}/.spark-supabase-source-commit"
  fi

  if run_logged "تست آخرین Supabase source و runtime" test_supabase_source; then
    mark_step 5
  else
    unmark_step 5
    return 1
  fi
}

'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'install-base.sh: Supabase step replacement count={n}')
          path.write_text(text, encoding='utf-8')

          replace_exact('deploy/spark-cli/lib/install-platform-c.sh',
                        "    printf '  5) %s دریافت Supabase pin شده\\n' \"$(step_badge 5)\"\n",
                        "    printf '  5) %s دریافت آخرین Supabase رسمی\\n' \"$(step_badge 5)\"\n")

          replace_exact('deploy/spark-cli/spark-ui.py',
                        'Action("install-05", "05  Pinned Supabase source", "Install or validate the reviewed Supabase source pin.", "confirm"),',
                        'Action("install-05", "05  Latest Supabase source", "Download or fast-forward the official Supabase main branch; fresh installs build runtime from that source.", "controlled"),')
          replace_exact('deploy/spark-cli/spark-ui.py',
                        'Show OS, runtime, Spark and pinned Supabase versions.',
                        'Show OS, runtime, Spark and Supabase versions.')

          replace_exact('deploy/spark-cli/lib/update.sh',
                        'test_supabase_source >>"$CURRENT_LOG" 2>&1 || { fail "Supabase pin/runtime provenance معتبر نیست؛ ابتدا مرحله 5 نصب را بررسی کنید."; return 1; }',
                        'test_supabase_source >>"$CURRENT_LOG" 2>&1 || { fail "Supabase source/runtime معتبر نیست؛ ابتدا مرحله 5 نصب را بررسی کنید."; return 1; }')

          replace_exact('deploy/spark-cli/README.md',
                        'Supabase source pin باقی می‌ماند.',
                        'Supabase source باقی می‌ماند.')
          PY

      - name: Validate without lint
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/spark-cli/spark
          bash -n deploy/spark-cli/bootstrap.sh
          bash -n deploy/spark-cli/spark-migrate
          for file in deploy/spark-cli/lib/*.sh; do bash -n "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/spark-ui.py')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          python3 deploy/spark-cli/spark-ui.py --self-test
          ! grep -q 'supabase/migrations' deploy/spark-cli/lib/install-base.sh
          ! grep -Eq 'SUPABASE_REF|SUPABASE_COMMIT|Checkout Supabase pin|tag/commit بررسی‌شده' deploy/spark-cli/lib/core.sh deploy/spark-cli/lib/install-base.sh deploy/spark-cli/spark-ui.py
          grep -q 'git clone --branch main --single-branch "$REPO_URL"' deploy/spark-cli/lib/install-base.sh
          grep -q 'git clone --branch main --single-branch https://github.com/supabase/supabase.git' deploy/spark-cli/lib/install-base.sh
          grep -q 'Fast-forward Supabase main' deploy/spark-cli/lib/install-base.sh
          git diff --check

      - name: Remove temporary tooling and commit final state
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout HEAD~3 -- .github/workflows/ci.yml
          rm -f .github/workflows/tmp-refresh-spark-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            deploy/spark-cli/README.md \
            deploy/spark-cli/lib/core.sh \
            deploy/spark-cli/lib/install-base.sh \
            deploy/spark-cli/lib/install-platform-c.sh \
            deploy/spark-cli/lib/update.sh \
            deploy/spark-cli/spark-ui.py
          git add -u -- .github/workflows/tmp-refresh-spark-sources.yml
          git diff --cached --check
          git commit -m 'Make Spark and Supabase install sources track latest main [skip ci]'
          git push origin HEAD:main

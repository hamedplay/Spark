name: One-time repair final duplicate matcher

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-final-duplicate-consolidator.mjs
      - .github/workflows/patch-final-duplicate-consolidator.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Repair matcher
        run: node scripts/patch-final-duplicate-consolidator.mjs
      - name: Commit repaired consolidator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/consolidate-final-exact-duplicates.mjs
          git commit -m "fix: align final duplicate matcher with current source"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

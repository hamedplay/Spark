name: Temp Offline App Pipeline

on:
  push:
    branches:
      - main
    paths:
      - tmp_patch_offline_app_pipeline.py
      - .github/workflows/tmp-offline-app-pipeline.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 tmp_patch_offline_app_pipeline.py

      - name: Validate shell
        run: |
          bash -n deploy/spark-cli/lib/spark-manager-airgap
          bash -n deploy/spark-cli/lib/application-maintenance.sh

      - name: Validate bundle contract
        run: |
          grep -Fq -- '--unshallow origin main' deploy/spark-cli/lib/spark-manager-airgap
          grep -Fq 'source_ref="refs/heads/main"' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'Import generated Offline App bundle into empty repository' deploy/spark-cli/lib/application-maintenance.sh
          grep -Fq 'Offline App Git bundle is incomplete and cannot be imported into an empty repository.' deploy/spark-cli/lib/application-maintenance.sh

      - name: Regression test Git bundle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git init -q "$work/origin"
          git -C "$work/origin" config user.email test@example.com
          git -C "$work/origin" config user.name test
          for n in 1 2 3 4; do
            echo "$n" >> "$work/origin/history.txt"
            git -C "$work/origin" add history.txt
            git -C "$work/origin" commit -qm "c$n"
          done
          git clone -q --depth=1 "file://$work/origin" "$work/source"
          test "$(git -C "$work/source" rev-parse --is-shallow-repository)" = true
          git -C "$work/source" fetch -q --unshallow origin master
          target="$(git -C "$work/source" rev-parse origin/master)"
          git init --bare -q "$work/bare"
          git -C "$work/bare" fetch -q "$work/source" "$target"
          git -C "$work/bare" update-ref refs/heads/main "$target"
          git -C "$work/bare" bundle create "$work/app.bundle" refs/heads/main
          git init -q "$work/verify"
          git -C "$work/verify" bundle verify "$work/app.bundle" >/dev/null
          git -C "$work/verify" fetch -q "$work/app.bundle" refs/heads/main
          test "$(git -C "$work/verify" rev-parse FETCH_HEAD)" = "$target"
          test "$(git -C "$work/verify" rev-list --count FETCH_HEAD)" -eq 4
          git -C "$work/verify" rev-list --objects FETCH_HEAD >/dev/null

      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit patch
        run: |
          git config user.name spark-automation
          git config user.email spark-automation@users.noreply.github.com
          git add deploy/spark-cli/lib/application-maintenance.sh
          git commit -m 'fix(manager): make offline app update package self-contained'
          git push origin HEAD:main

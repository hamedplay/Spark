# validation-revision: 2
name: spark-cli-m35-validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m35-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate M3.5 into bootstrap staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/bootstrap.sh')
          text = path.read_text()
          if 'DATABASE_CLI_PATH=' not in text:
              text = text.replace('ARCHITECTURE_CLI_PATH="/usr/local/bin/spark-architecture"\n', 'ARCHITECTURE_CLI_PATH="/usr/local/bin/spark-architecture"\nDATABASE_CLI_PATH="/usr/local/bin/spark-database"\n', 1)
          old = '"$tmp/adapters" "$tmp/roles/database/runtime"'
          if '"$tmp/roles/database/lifecycle"' not in text:
              text = text.replace(old, old + ' "$tmp/roles/database/lifecycle"', 1)
          anchor = 'roles/database/tasks/compose.py\n'
          additions = (
              anchor
              + 'roles/database/tasks/images.py\n'
              + 'roles/database/tasks/postgres.py\n'
              + 'roles/database/tasks/supabase.py\n'
              + 'roles/database/lifecycle/__init__.py\n'
              + 'roles/database/lifecycle/models.py\n'
              + 'roles/database/lifecycle/images.py\n'
              + 'roles/database/lifecycle/postgres.py\n'
              + 'roles/database/lifecycle/supabase.py\n'
              + 'roles/database/lifecycle/diagnostics.py\n'
              + 'database_cli.py\n'
              + 'spark-database\n'
          )
          if 'roles/database/lifecycle/postgres.py\n' not in text:
              text = text.replace(anchor, additions, 1)
          old = '"$stage/adapters" "$stage/roles/database/runtime"'
          if '"$stage/roles/database/lifecycle"' not in text:
              text = text.replace(old, old + ' "$stage/roles/database/lifecycle"', 1)
          if 'install -m 0755 "$tmp/spark-database" "$stage/spark-database"' not in text:
              text = text.replace('install -m 0755 "$tmp/spark-architecture" "$stage/spark-architecture"\n', 'install -m 0755 "$tmp/spark-architecture" "$stage/spark-architecture"\ninstall -m 0755 "$tmp/spark-database" "$stage/spark-database"\ninstall -m 0644 "$tmp/database_cli.py" "$stage/database_cli.py"\n', 1)
          anchor = 'for file in "$tmp"/roles/database/runtime/*.py; do install -m 0644 "$file" "$stage/roles/database/runtime/$(basename "$file")"; done\n'
          if 'stage/roles/database/lifecycle/$(basename "$file")' not in text:
              text = text.replace(anchor, anchor + 'for file in "$tmp"/roles/database/lifecycle/*.py; do install -m 0644 "$file" "$stage/roles/database/lifecycle/$(basename "$file")"; done\n', 1)
          if '"$DATABASE_CLI_PATH"' not in text.split('rollback_install() {',1)[1]:
              text = text.replace('rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$ARCHITECTURE_CLI_PATH" "$MIGRATE_PATH"', 'rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$ARCHITECTURE_CLI_PATH" "$DATABASE_CLI_PATH" "$MIGRATE_PATH"', 1)
              text = text.replace('[[ -x "$TARGET/spark-architecture" ]] && ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\n', '[[ -x "$TARGET/spark-architecture" ]] && ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\n    [[ -x "$TARGET/spark-database" ]] && ln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"\n', 1)
          if 'ln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"' not in text.split('chmod 0755 "$TARGET"',1)[1]:
              text = text.replace('ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\n', 'ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\nln -sfn "$TARGET/spark-database" "$DATABASE_CLI_PATH"\n', 1)
          marker = 'if ! "$CLI_PATH" --ui-self-test >/dev/null 2>&1; then\n'
          if 'Spark database lifecycle CLI smoke test failed' not in text:
              smoke = 'if ! "$DATABASE_CLI_PATH" --help >/dev/null 2>&1; then\n  echo "Spark database lifecycle CLI smoke test failed; rolling back." >&2\n  rollback_install\n  exit 1\nfi\n'
              text = text.replace(marker, smoke + marker, 1)
          path.write_text(text)
          PY
          bash -n deploy/spark-cli/bootstrap.sh
          git diff --check

      - name: Python syntax
        working-directory: deploy/spark-cli
        run: |
          python3 -m py_compile core/*.py adapters/*.py config/*.py secrets/*.py roles/database/*.py roles/database/package/*.py roles/database/runtime/*.py roles/database/lifecycle/*.py roles/database/tasks/*.py database_cli.py spark-database

      - name: Regression and M3.5 unit tests
        working-directory: deploy/spark-cli
        run: |
          python3 -m unittest tests.smoke.test_manager_baseline -v
          python3 -m unittest tests.test_workflow_core -v
          python3 -m unittest discover -s tests/architecture -v
          python3 -m unittest discover -s tests/roles -v
          python3 -m unittest discover -s tests/secrets -v
          python3 -m unittest discover -s tests/database -v
          python3 spark-ui.py --self-test

      - name: Validate architecture profiles
        working-directory: deploy/spark-cli
        run: |
          SPARK_ENV_PROFILE=config/environments/example.production.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.staging.yaml python3 spark-architecture validate >/dev/null
          SPARK_ENV_PROFILE=config/environments/example.airgap.yaml python3 spark-architecture validate >/dev/null
          python3 spark-database --help >/dev/null

      - name: Destructive safety gate
        working-directory: deploy/spark-cli
        run: |
          if grep -REn 'compose[[:space:]]+down[[:space:]]+-v|docker[[:space:]]+volume[[:space:]]+rm|rm[[:space:]]+-rf.*volumes/db/data|DROP[[:space:]]+DATABASE' roles/database/lifecycle roles/database/tasks/images.py roles/database/tasks/postgres.py roles/database/tasks/supabase.py database_cli.py; then
            echo 'Forbidden destructive lifecycle operation detected' >&2
            exit 1
          fi

      - name: Real v0.8.1 data-plane integration
        working-directory: deploy/spark-cli
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from config.models import DatabaseConfig, DatabaseStartupConfig, EnvironmentConfig, NodeConfig, PostgresStartupConfig, SupabasePackageConfig
          from roles.database.package.manager import SupabasePackageManager, SupabasePackageSpec
          from roles.database.runtime.compose import DatabaseComposeManager
          from roles.database.lifecycle.images import DatabaseImageManager
          from roles.database.lifecycle.postgres import PostgresLifecycleManager
          from roles.database.lifecycle.supabase import SupabaseLifecycleManager
          from secrets.file_provider import FileSecretProvider
          from secrets.generator import SupabaseUpstreamSecretGenerator
          from secrets.models import REQUIRED_DATABASE_SECRETS

          base = Path(tempfile.mkdtemp(prefix='spark-m35-'))
          destination = base / 'supabase'
          SupabasePackageManager().materialize(SupabasePackageSpec('self-hosted/v0.8.1', 'https://github.com/supabase/supabase.git', destination))
          provider = FileSecretProvider(base / 'secrets' / 'database.env')
          provider.set('DASHBOARD_USERNAME', 'supabase')
          for key, value in SupabaseUpstreamSecretGenerator(destination / 'vendor' / 'upstream').generate().items():
              provider.set(key, value)
          assert not [key for key in REQUIRED_DATABASE_SECRETS if not provider.exists(key)]
          profile = EnvironmentConfig(
              name='integration',
              nodes={
                  'reverse_proxy': NodeConfig(role='reverse_proxy', host='127.0.0.1'),
                  'application': NodeConfig(role='application', host='127.0.0.1'),
                  'database': NodeConfig(role='database', host='127.0.0.1'),
              },
              database=DatabaseConfig(
                  supabase=SupabasePackageConfig(release='self-hosted/v0.8.1', destination=str(destination)),
                  secret_file=str(base / 'secrets' / 'database.env'),
                  startup=DatabaseStartupConfig(
                      postgres=PostgresStartupConfig(normal_timeout_seconds=120, initialization_timeout_seconds=600),
                      supabase_timeout_seconds=360,
                      image_pull_timeout_seconds=1200,
                  ),
              ),
          )
          compose = DatabaseComposeManager()
          assert compose.materialize(profile, provider)
          compose.verify(profile)
          assert list((destination / 'volumes' / 'db' / 'data').iterdir()) == []
          images = DatabaseImageManager()
          assert images.acquire(profile)
          assert not images.acquire(profile)
          postgres = PostgresLifecycleManager(poll_interval_seconds=2)
          assert postgres.start(profile)
          pg = postgres.verify(profile)
          assert pg.pg_isready and pg.sql_probe
          assert not postgres.start(profile)
          supabase = SupabaseLifecycleManager(poll_interval_seconds=2)
          assert supabase.start(profile, provider)
          verified = supabase.verify(profile, provider)
          assert verified['aggregate'] == 'HEALTHY'
          assert not supabase.start(profile, provider)
          services = set(supabase.docker.compose_services(destination, destination / '.env', profile.database.compose.project_name))
          images_map = supabase.docker.compose_service_images(destination, destination / '.env', profile.database.compose.project_name)
          assert 'functions' not in services
          assert all('edge-runtime' not in ref.lower() for ref in images_map.values())
          print('M3.5 real integration GREEN')
          PY
          if docker ps --format '{{.Image}}' | grep -qi 'edge-runtime'; then
            echo 'Edge Runtime container unexpectedly running' >&2
            exit 1
          fi

      - name: Bootstrap structural checks
        working-directory: deploy/spark-cli
        run: |
          bash -n bootstrap.sh
          grep -Fq 'spark-database' bootstrap.sh
          grep -Fq 'roles/database/lifecycle/postgres.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/images.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/postgres.py' bootstrap.sh
          grep -Fq 'roles/database/tasks/supabase.py' bootstrap.sh

      - name: Commit bootstrap integration after validation
        run: |
          if ! git diff --quiet -- deploy/spark-cli/bootstrap.sh; then
            git config user.name "spark-m35-bot"
            git config user.email "spark-m35-bot@users.noreply.github.com"
            git add deploy/spark-cli/bootstrap.sh
            git commit -m "feat: install M3.5 database lifecycle modules with spark manager"
            git push origin HEAD:main
          fi

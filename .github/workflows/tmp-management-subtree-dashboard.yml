name: Temporary management subtree dashboard validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-management-subtree-dashboard.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build

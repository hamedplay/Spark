  require_manager_values || return 1
  require_file "${SUPABASE_ROOT}/.env" || return 1
}

ufw_is_active() {
  ufw status 2>/dev/null | grep -q '^Status: active'
}

ufw_allow_temporary_port() {
  local port="$1" marker="${STATE_DIR}/ufw-${1}-spark-manager.rule"
  rm -f "$marker"
  if ! ufw_is_active; then
    warn "UFW غیرفعال است؛ Spark Manager این عملیات را به مرحله Firewall وابسته نمی‌کند."
    warn "TCP/${port} در صورت وجود مسیر شبکه می‌تواند از بیرون قابل دسترس باشد؛ بعد از کار دسترسی را ببندید."
    return 0
  fi
  if ufw status 2>/dev/null | grep -Eq "^${port}/tcp[[:space:]]+ALLOW"; then
    info "TCP/${port} از قبل در UFW مجاز است؛ rule موجود دست‌کاری نمی‌شود."
    return 0
  fi
  run_logged "Allow temporary TCP/${port} in UFW" ufw allow "${port}/tcp" || return 1
  : >"$marker"
  chmod 600 "$marker"
}

ufw_remove_temporary_port() {
  local port="$1" marker="${STATE_DIR}/ufw-${1}-spark-manager.rule"
  if [[ -f "$marker" ]] && ufw_is_active; then
    set +e
    ufw --force delete allow "${port}/tcp" >>"$CURRENT_LOG" 2>&1
    set -e
  fi
  rm -f "$marker"
}


          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          python3 deploy/spark-cli/spark-ui.py --self-test
          if grep -RniE 'CIDR|ADMIN_CIDR|\.cidr' deploy/spark-cli; then
            echo 'CIDR coupling still exists in deploy/spark-cli' >&2
            exit 1
          fi
          grep -q 'diagnostic-installation' deploy/spark-cli/spark
          grep -q -- '--install-status' deploy/spark-cli/spark
          grep -q 'installation_status()' deploy/spark-cli/lib/install-platform-c.sh
          grep -q 'SPARK_MANAGER_VERSION="2.0.1"' deploy/spark-cli/spark
          grep -q 'SPARK_UI_VERSION = "2.0.1"' deploy/spark-cli/spark-ui.py
          git diff --check

      - name: Commit scoped result and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/spark-cli-simplify.yml
          git add deploy/spark-cli .github/workflows/spark-cli-simplify.yml
          git diff --cached --check
          git config user.name 'hamedplay'

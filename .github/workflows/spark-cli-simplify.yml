          studio_block = r'''write_supabase_studio_gateway() {
  cat >/etc/nginx/sites-available/spark-supabase-admin <<EOF
server {
    listen 8443 ssl;
    server_name ${API_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection \$spark_connection_upgrade;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
EOF
}

open_supabase_studio_access() {
  local dashboard_user dashboard_password backup had_previous=0
  external_access_requirements || return 1
  require_file "/etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem" || return 1
  require_file "/etc/letsencrypt/live/${API_DOMAIN}/privkey.pem" || return 1
  if [[ ! -e /etc/nginx/sites-enabled/spark ]]; then fail "Nginx Production فعال نیست؛ ابتدا مرحله 16 نصب را اجرا کنید."; return 1; fi
  dashboard_user="$(env_get "${SUPABASE_ROOT}/.env" DASHBOARD_USERNAME)"
  dashboard_password="$(env_get "${SUPABASE_ROOT}/.env" DASHBOARD_PASSWORD)"
  dashboard_user="${dashboard_user:-supabase}"
  [[ -n "$dashboard_password" ]] || { fail "DASHBOARD_PASSWORD موجود نیست."; return 1; }
  if ! confirm_word "Supabase Studio روی https://${API_DOMAIN}:8443 موقتاً باز می‌شود و با Credential داشبورد محافظت می‌شود. محدودیت IP در Spark Manager اعمال نمی‌شود." "OPEN"; then warn "لغو شد."; return 1; fi
  backup="$(mktemp)"
  if [[ -f /etc/nginx/sites-available/spark-supabase-admin ]]; then cp -a /etc/nginx/sites-available/spark-supabase-admin "$backup"; had_previous=1; fi
  if ! ufw_allow_temporary_port 8443; then rm -f "$backup"; return 1; fi
  write_supabase_studio_gateway
  ln -sfn /etc/nginx/sites-available/spark-supabase-admin /etc/nginx/sites-enabled/spark-supabase-admin
  if ! run_logged "Nginx config test" nginx -t || ! run_logged "Reload Nginx" systemctl reload nginx; then
    ufw_remove_temporary_port 8443
    if (( had_previous )); then cp -a "$backup" /etc/nginx/sites-available/spark-supabase-admin; ln -sfn /etc/nginx/sites-available/spark-supabase-admin /etc/nginx/sites-enabled/spark-supabase-admin; else rm -f /etc/nginx/sites-enabled/spark-supabase-admin /etc/nginx/sites-available/spark-supabase-admin; fi
    nginx -t >>"$CURRENT_LOG" 2>&1 && systemctl reload nginx >>"$CURRENT_LOG" 2>&1 || true
    rm -f "$backup"; return 1
  fi
  if ! studio_external_is_open; then
    fail "Nginx روی 8443 listen نشد؛ تغییرات rollback می‌شوند."; ufw_remove_temporary_port 8443
    if (( had_previous )); then cp -a "$backup" /etc/nginx/sites-available/spark-supabase-admin; else rm -f /etc/nginx/sites-enabled/spark-supabase-admin /etc/nginx/sites-available/spark-supabase-admin; fi
    nginx -t >>"$CURRENT_LOG" 2>&1 && systemctl reload nginx >>"$CURRENT_LOG" 2>&1 || true
    rm -f "$backup"; return 1
  fi
  if ! curl -fsSkL --connect-timeout 5 --max-time 15 --resolve "${API_DOMAIN}:8443:127.0.0.1" -u "${dashboard_user}:${dashboard_password}" "https://${API_DOMAIN}:8443/" -o /dev/null; then
    fail "8443 باز شد ولی Supabase Studio با Credential فعلی پاسخ معتبر نداد؛ تغییرات rollback می‌شوند."; ufw_remove_temporary_port 8443
    if (( had_previous )); then cp -a "$backup" /etc/nginx/sites-available/spark-supabase-admin; ln -sfn /etc/nginx/sites-available/spark-supabase-admin /etc/nginx/sites-enabled/spark-supabase-admin; else rm -f /etc/nginx/sites-enabled/spark-supabase-admin /etc/nginx/sites-available/spark-supabase-admin; fi
    nginx -t >>"$CURRENT_LOG" 2>&1 && systemctl reload nginx >>"$CURRENT_LOG" 2>&1 || true
    rm -f "$backup"; return 1
  fi
  rm -f "$backup"
  ok "Supabase Studio باز شد: https://${API_DOMAIN}:8443"
  info "Username=${dashboard_user}؛ رمز را از گزینه نمایش Credentialها ببینید."
}

close_supabase_studio_access() {
  rm -f /etc/nginx/sites-enabled/spark-supabase-admin /etc/nginx/sites-available/spark-supabase-admin
  ufw_remove_temporary_port 8443
  run_logged "Nginx config test" nginx -t || return 1
  run_logged "Reload Nginx" systemctl reload nginx || return 1
  if studio_external_is_open; then fail "هنوز listener مدیریتی روی 8443 باقی مانده است."; ss -lntp | grep ':8443' | tee -a "$CURRENT_LOG" || true; return 1; fi
  ok "دسترسی خارجی Supabase Studio بسته شد."
}


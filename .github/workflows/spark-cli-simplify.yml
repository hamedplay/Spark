# trigger: apply scoped Spark CLI cleanup
name: Spark CLI architecture cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-simplify.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply scoped Spark CLI cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('deploy/spark-cli')

          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')

          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              out, count = re.subn(pattern, repl, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, got {count}')
              return out

          text = read('lib/core.sh')
          text = replace_once(text, "    printf 'ADMIN_CIDR=%q\\n' \"${ADMIN_CIDR:-}\"\n", "", 'core save_config')
          text = sub_once(text, r"\nvalid_cidr\(\) \{.*?^\}\n\nvalid_domain\(\) \{", "\nvalid_domain() {", 'core valid_cidr')
          text = sub_once(text, r"  while true; do\n    prompt_default v \"CIDR مدیریتی مجاز برای SSH\" .*?^  done\n", "", 'core CIDR prompt')
          text = replace_once(text,
              '  for key in APP_DOMAIN WWW_DOMAIN API_DOMAIN TURN_DOMAIN TURN_PUBLIC_IP TURN_PRIVATE_IP ADMIN_CIDR LE_EMAIL TURN_MIN_PORT TURN_MAX_PORT; do\n',
              '  for key in APP_DOMAIN WWW_DOMAIN API_DOMAIN TURN_DOMAIN TURN_PUBLIC_IP TURN_PRIVATE_IP LE_EMAIL TURN_MIN_PORT TURN_MAX_PORT; do\n',
              'core required values')
          write('lib/core.sh', text)

          text = read('lib/install-base.sh')
          text = replace_once(text, '  valid_cidr "$ADMIN_CIDR" || return 1\n', '', 'install-base CIDR test')
          write('lib/install-base.sh', text)

          text = read('lib/install-platform-c.sh')
          text = sub_once(text, r"\nssh_client_in_admin_cidr\(\) \{.*?^\}\n\ntest_firewall\(\) \{", "\ntest_firewall() {", 'remove SSH CIDR helper')
          new_firewall_and_status = r'''install_step_20() {
  title
  new_log "install-20-firewall"
  require_manager_values || return 1
  if ! confirm_word "این مرحله UFW را reset می‌کند و فقط پورت‌های لازم Spark را مجاز می‌کند: SSH، HTTP/HTTPS و TURN." "FIREWALL"; then
    warn "تغییر Firewall لغو شد."
    return 1
  fi
  run_logged "Reset UFW" ufw --force reset || return 1
  run_logged "Default deny incoming" ufw default deny incoming || return 1
  run_logged "Default allow outgoing" ufw default allow outgoing || return 1
  run_logged "Allow SSH" ufw allow 22/tcp || return 1
  run_logged "Allow HTTP" ufw allow 80/tcp || return 1
  run_logged "Allow HTTPS" ufw allow 443/tcp || return 1
  run_logged "Allow TURN TCP" ufw allow 3478/tcp || return 1
  run_logged "Allow TURN UDP" ufw allow 3478/udp || return 1
  run_logged "Allow TURNS TCP" ufw allow 5349/tcp || return 1
  run_logged "Allow TURN relay UDP" ufw allow "${TURN_MIN_PORT}:${TURN_MAX_PORT}/udp" || return 1
  run_logged "Enable UFW" ufw --force enable || return 1
  if run_logged "تست Firewall و عدم exposure داخلی" test_firewall; then
    mark_step 20
  else
    unmark_step 20
    return 1
  fi
}

test_nginx_bootstrap_or_production() {
  nginx -t >/dev/null 2>&1 || return 1
  systemctl is-active --quiet nginx || return 1
  [[ -L /etc/nginx/sites-enabled/spark || -L /etc/nginx/sites-enabled/spark-bootstrap ]]
}

test_migrations_current() {
  local migrations_dir="${SPARK_ROOT}/supabase/migrations"
  local local_versions remote_versions pending
  require_dir "$migrations_dir" || return 1
  require_file "${SUPABASE_ROOT}/docker-compose.yml" || return 1
  local_versions="$(find "$migrations_dir" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -nE 's/^([0-9]{14})_.*/\1/p' | sort -u)"
  [[ -n "$local_versions" ]] || return 1
  remote_versions="$(compose exec -T db psql -U postgres -d postgres -Atqc 'select version from supabase_migrations.schema_migrations order by version;' 2>/dev/null | tr -d '\r' | sort -u)" || return 1
  pending="$(comm -23 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions"))"
  [[ -z "$pending" ]]
}

installation_step_name() {
  case "$1" in
    1) printf 'DNS' ;;
    2) printf 'Configuration' ;;
    3) printf 'Base packages' ;;
    4) printf 'Spark repository' ;;
    5) printf 'Supabase pin' ;;
    6) printf 'Supabase secrets' ;;
    7) printf 'Supabase environment' ;;
    8) printf 'Edge Functions sync' ;;
    9) printf 'Provider / worker env' ;;
    10) printf 'Docker Compose' ;;
    11) printf 'Supabase runtime' ;;
    12) printf 'Database migrations' ;;
    13) printf 'Frontend deploy' ;;
    14) printf 'Nginx bootstrap' ;;
    15) printf 'TLS certificates' ;;
    16) printf 'Nginx production' ;;
    17) printf 'Schedulers' ;;
    18) printf 'TURN / Coturn' ;;
    19) printf 'Certbot renewal' ;;
    20) printf 'Firewall / UFW' ;;
    *) return 1 ;;
  esac
}

installation_step_check() {
  case "$1" in
    1) test_dns ;;
    2) test_values ;;
    3) test_base_packages ;;
    4) test_spark_repo ;;
    5) test_supabase_source ;;
    6) test_supabase_secrets ;;
    7) test_supabase_env ;;
    8) test_function_sync ;;
    9) test_provider_env ;;
    10) test_compose_security ;;
    11) test_supabase_health ;;
    12) test_migrations_current ;;
    13) test_frontend_deploy ;;
    14) test_nginx_bootstrap_or_production ;;
    15) test_certificates ;;
    16) test_nginx_production ;;
    17) test_schedulers ;;
    18) test_turn ;;
    19) test_certbot_hook ;;
    20) test_firewall ;;
    *) return 1 ;;
  esac
}

installation_status() {
  local n name actual recorded formatted
  local installed=() missing=()
  printf '\n%s\n' 'Spark installation state — actual probe vs saved history'
  printf '%s\n' '────────────────────────────────────────────────────────────────────────'
  printf '%-4s %-18s %-10s %s\n' 'No.' 'Actual' 'History' 'Component'
  printf '%s\n' '────────────────────────────────────────────────────────────────────────'
  for n in $(seq 1 20); do
    name="$(installation_step_name "$n")"
    printf -v formatted '%02d' "$n"
    if installation_step_check "$n" >/dev/null 2>&1; then
      actual='INSTALLED'; installed+=("$formatted")
    else
      actual='NOT INSTALLED'; missing+=("$formatted")
    fi
    if [[ -f "${STEP_DIR}/${n}.ok" ]]; then recorded='saved'; else recorded='-'; fi
    printf '%-4s %-18s %-10s %s\n' "$formatted" "$actual" "$recorded" "$name"
  done
  printf '%s\n' '────────────────────────────────────────────────────────────────────────'
  printf 'Installed     : %s\n' "${installed[*]:-(none)}"
  printf 'Not installed : %s\n' "${missing[*]:-(none)}"
  printf '\nHistory فقط نشان می‌دهد مرحله قبلاً با موفقیت اجرا شده؛ ستون Actual وضعیت واقعی همین سرور را تست می‌کند.\n'
  return 0
}


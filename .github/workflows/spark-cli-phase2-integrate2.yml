name: spark-cli-phase2-integrate2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-phase2-integrate2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply controlled Phase 2 bridges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ui = Path('deploy/spark-cli/spark-ui.py')
          text = ui.read_text()
          if 'ARCHITECTURE_ACTIONS = [' not in text:
              text = text.replace('\n\nCLEANUP_ACTIONS = [', '''

          ARCHITECTURE_ACTIONS = [
              core.Action("architecture-overview", "Architecture Overview", "Render the active Spark environment topology from its profile."),
              core.Action("architecture-profile", "Environment Profile", "Show active profile metadata and configuration readiness."),
              core.Action("architecture-validate", "Validate Architecture", "Run static schema, role and network-policy validation."),
              core.Action("architecture-network", "Network Connectivity", "Test only connections that are valid to measure from the current host role."),
              core.Action("architecture-status", "Deployment Status", "Show configuration readiness without claiming components are installed."),
          ]

          CLEANUP_ACTIONS = ['''.replace('          ', ''), 1)

          old = '            rebuilt.append((category, new_actions))\n            rebuilt.append(("Installation Air-Gapped", AIRGAP_ACTIONS))\n            continue'
          new = '            rebuilt.append((category, new_actions))\n            rebuilt.append(("Installation Air-Gapped", AIRGAP_ACTIONS))\n            rebuilt.append(("Architecture & Provisioning", ARCHITECTURE_ACTIONS))\n            continue'
          if 'Architecture & Provisioning' not in text:
              if old not in text:
                  raise SystemExit('spark-ui installation integration point not found')
              text = text.replace(old, new, 1)

          old_route = '        spark_path = str(airgap_path)\n    return _original_task_process_init(self, spark_path, action_id, args, rows, cols)'
          new_route = (
              '        spark_path = str(airgap_path)\n'
              '    if action_id.startswith("architecture-"):\n'
              '        candidates = [\n'
              '            Path("/usr/local/bin/spark-architecture"),\n'
              '            core.SPARK_ROOT / "deploy/spark-cli/spark-architecture",\n'
              '        ]\n'
              '        architecture_path = next((path for path in candidates if path.is_file() and os.access(path, os.X_OK)), None)\n'
              '        if architecture_path is None:\n'
              '            raise FileNotFoundError("spark-architecture is not installed; update Spark Manager first")\n'
              '        spark_path = str(architecture_path)\n'
              '    return _original_task_process_init(self, spark_path, action_id, args, rows, cols)'
          )
          if 'action_id.startswith("architecture-")' not in text:
              if old_route not in text:
                  raise SystemExit('spark-ui route integration point not found')
              text = text.replace(old_route, new_route, 1)

          old_check = '    if len(airgap_sections) != 1:\n        raise RuntimeError("Installation Air-Gapped category is missing or duplicated")'
          if 'architecture_sections =' not in text:
              new_check = old_check + '\n    architecture_sections = [category for category, _ in core.CATEGORIES if category == "Architecture & Provisioning"]\n    if len(architecture_sections) != 1:\n        raise RuntimeError("Architecture & Provisioning category is missing or duplicated")'
              if old_check not in text:
                  raise SystemExit('spark-ui self-test integration point not found')
              text = text.replace(old_check, new_check, 1)
          ui.write_text(text)

          bootstrap = Path('deploy/spark-cli/bootstrap.sh')
          text = bootstrap.read_text()
          if 'ARCHITECTURE_CLI_PATH=' not in text:
              text = text.replace('AIRGAP_CLI_PATH="/usr/local/bin/spark-airgap"\n', 'AIRGAP_CLI_PATH="/usr/local/bin/spark-airgap"\nARCHITECTURE_CLI_PATH="/usr/local/bin/spark-architecture"\n', 1)
          if '"$tmp/architecture"' not in text:
              text = text.replace('mkdir -p "$tmp/lib" "$tmp/livekit"', 'mkdir -p "$tmp/lib" "$tmp/livekit" "$tmp/architecture" "$tmp/config/environments"', 1)
          if '  spark-architecture\n' not in text:
              block = '''  spark-airgap
          spark-architecture
          architecture/__init__.py
          architecture/cli.py
          architecture/controller.py
          architecture/connectivity.py
          architecture/host_context.py
          architecture/renderer.py
          architecture/status.py
          architecture/validator.py
          config/__init__.py
          config/loader.py
          config/models.py
          config/schema.py
          config/yaml_loader.py
          config/environments/example.production.yaml
          config/environments/example.staging.yaml
          config/environments/example.airgap.yaml
          bootstrap-airgap.sh'''.replace('        ', '')
              text = text.replace('  spark-airgap\n  bootstrap-airgap.sh', block, 1)
          if '"$stage/architecture"' not in text:
              text = text.replace('install -d -m 0755 "$stage/lib" "$stage/livekit"', 'install -d -m 0755 "$stage/lib" "$stage/livekit" "$stage/architecture" "$stage/config/environments"', 1)
          if 'install -m 0755 "$tmp/spark-architecture"' not in text:
              text = text.replace('install -m 0755 "$tmp/spark-airgap" "$stage/spark-airgap"\n', 'install -m 0755 "$tmp/spark-airgap" "$stage/spark-airgap"\ninstall -m 0755 "$tmp/spark-architecture" "$stage/spark-architecture"\n', 1)
          if '"$stage/architecture/$(basename "$file")"' not in text:
              text = text.replace('install -m 0644 "$tmp/spark-ui-core.py" "$stage/spark-ui-core.py"\n', 'install -m 0644 "$tmp/spark-ui-core.py" "$stage/spark-ui-core.py"\nfor file in "$tmp"/architecture/*.py; do install -m 0644 "$file" "$stage/architecture/$(basename "$file")"; done\nfor file in "$tmp"/config/*.py; do install -m 0644 "$file" "$stage/config/$(basename "$file")"; done\nfor file in "$tmp"/config/environments/*.yaml; do install -m 0644 "$file" "$stage/config/environments/$(basename "$file")"; done\n', 1)
          text = text.replace('rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$MIGRATE_PATH"', 'rm -f "$CLI_PATH" "$AIRGAP_CLI_PATH" "$ARCHITECTURE_CLI_PATH" "$MIGRATE_PATH"', 1)
          if '[[ -x "$TARGET/spark-architecture" ]]' not in text:
              text = text.replace('[[ -x "$TARGET/spark-airgap" ]] && ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"', '[[ -x "$TARGET/spark-airgap" ]] && ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\n    [[ -x "$TARGET/spark-architecture" ]] && ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"', 1)
          if 'ln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"' not in text.split('if ! version_output=')[0].split('rollback_install() {')[-1]:
              text = text.replace('ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"', 'ln -sfn "$TARGET/spark-airgap" "$AIRGAP_CLI_PATH"\nln -sfn "$TARGET/spark-architecture" "$ARCHITECTURE_CLI_PATH"\nln -sfn "$MIGRATE_TARGET/spark-migrate" "$MIGRATE_PATH"', 1)
          if 'SPARK_ENV_PROFILE="$tmp/config/environments/example.production.yaml"' not in text:
              text = text.replace('python3 "$tmp/spark-ui.py" --self-test\n', 'python3 "$tmp/spark-ui.py" --self-test\nSPARK_ENV_PROFILE="$tmp/config/environments/example.production.yaml" python3 "$tmp/spark-architecture" validate >/dev/null\n', 1)
          bootstrap.write_text(text)

          fixture = Path('deploy/spark-cli/tests/fixtures/menu_registry.json')
          data = json.loads(fixture.read_text())
          if 'Architecture & Provisioning' not in data:
              ordered = {}
              for key, value in data.items():
                  ordered[key] = value
                  if key == 'Installation Air-Gapped':
                      ordered['Architecture & Provisioning'] = ['architecture-overview', 'architecture-profile', 'architecture-validate', 'architecture-network', 'architecture-status']
              fixture.write_text(json.dumps(ordered, indent=2) + '\n')
          PY
          python3 -m py_compile deploy/spark-cli/spark-ui.py deploy/spark-cli/spark-architecture deploy/spark-cli/architecture/*.py deploy/spark-cli/config/*.py
          bash -n deploy/spark-cli/bootstrap.sh
          git diff --check
          git config user.name "spark-phase2-bot"
          git config user.email "spark-phase2-bot@users.noreply.github.com"
          git add deploy/spark-cli/spark-ui.py deploy/spark-cli/bootstrap.sh deploy/spark-cli/tests/fixtures/menu_registry.json
          git commit -m "feat: integrate architecture profiles into spark manager"
          git push origin HEAD:main

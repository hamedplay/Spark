name: Temporary Meeting Regression Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-meeting-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Recurrence tests
        run: npm run test:recurrence

      - name: Notification producer tests
        run: npm run test:notification-producer

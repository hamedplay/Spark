name: Temporary Security Portal Alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused security portal alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('src/components/PortalConfigPage.tsx')
          text = portal.read_text()
          old_loader = """  const loadConfigs = useCallback(async () => {\n    const { data } = await supabase.from('system_config').select('*').order('section').order('key');\n    if (data) setConfigs(data as ConfigEntry[]);\n  }, []);"""
          new_loader = """  const loadConfigs = useCallback(async () => {\n    // Security configuration contains internal runtime flags and secret material.\n    // Never fetch the whole security section into the browser; only request the\n    // explicitly allow-listed operational controls used by this page.\n    const securityKeys = Array.from(VISIBLE_SECURITY_CONFIG_KEYS);\n    const [nonSecurityResult, securityResult] = await Promise.all([\n      supabase\n        .from('system_config')\n        .select('*')\n        .neq('section', 'security')\n        .order('section')\n        .order('key'),\n      supabase\n        .from('system_config')\n        .select('*')\n        .eq('section', 'security')\n        .in('key', securityKeys)\n        .order('key'),\n    ]);\n\n    if (nonSecurityResult.error || securityResult.error) {\n      console.error('[PortalConfig] failed to load configuration', nonSecurityResult.error || securityResult.error);\n      return;\n    }\n\n    const rows = [\n      ...(nonSecurityResult.data ?? []),\n      ...(securityResult.data ?? []),\n    ] as ConfigEntry[];\n    rows.sort((a, b) => a.section.localeCompare(b.section) || a.key.localeCompare(b.key));\n    setConfigs(rows);\n  }, []);"""
          if old_loader in text:
              text = text.replace(old_loader, new_loader, 1)
          elif new_loader not in text:
              raise SystemExit('PortalConfig loadConfigs pattern drifted; refusing blind edit')
          text = text.replace('SectionCard title="امنیت و دسترسی" icon={Shield} color="red"', 'SectionCard title="وضعیت دسترسی سامانه" icon={Shield} color="red"', 1)
          old_maintenance = """            <SectionCard title=\"وضعیت دسترسی سامانه\" icon={Shield} color=\"red\">\n              {cfgs('security').filter(c => VISIBLE_SECURITY_CONFIG_KEYS.has(c.key)).map(c => <ConfigField key={c.id} entry={c} onSave={saveConfig} />)}\n            </SectionCard>"""
          new_maintenance = """            {isAdmin ? (\n              <SectionCard title=\"وضعیت دسترسی سامانه\" icon={Shield} color=\"red\">\n                {cfgs('security').filter(c => VISIBLE_SECURITY_CONFIG_KEYS.has(c.key)).map(c => <ConfigField key={c.id} entry={c} onSave={saveConfig} />)}\n              </SectionCard>\n            ) : (\n              <div className=\"rounded-2xl border border-slate-200 bg-white px-4 py-3 text-xs text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400\">\n                وضعیت تعمیر و نگهداری فقط توسط مدیر سامانه قابل تغییر است. تنظیمات امنیتی تخصصی پایین‌تر همچنان بر اساس سطح دسترسی Security Admin کنترل می‌شوند.\n              </div>\n            )}"""
          if old_maintenance in text:
              text = text.replace(old_maintenance, new_maintenance, 1)
          elif new_maintenance not in text:
              raise SystemExit('PortalConfig maintenance block drifted; refusing blind edit')
          portal.write_text(text)

          console = Path('src/features/security-settings/components/SecuritySettingsConsole.tsx')
          text = console.read_text()
          text = text.replace('label="ورود با تلفن"', 'label="ورود با موبایل و رمز عبور"', 1)
          text = text.replace('label="اجازه احراز هویت TOTP"', 'label="اجازه استفاده از TOTP در سیاست MFA"', 1)
          old_start = '      <SectionCard title="احراز هویت سفارشی" icon={Shield}>'
          next_marker = '      <MfaPolicyImpactCard impact={state.impact} visible={showImpact} />'
          new_sms_block = '''      <SectionCard title="MFA پیامکی" icon={Shield}>
        <ToggleRow
          label="فعال‌سازی MFA پیامکی"
          value={draft.custom_mfa_enabled}
          onChange={(v) => setDraft({
            ...draft,
            custom_mfa_enabled: v,
            custom_mfa_required: false,
            custom_mfa_allowed_factors: v ? ['sms'] : draft.custom_mfa_allowed_factors,
          })}
        />
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <NumberRow label="مهلت کد پیامکی (ثانیه)" value={draft.custom_mfa_challenge_ttl_seconds} min={30} max={3600} onChange={(v) => setDraft({ ...draft, custom_mfa_challenge_ttl_seconds: v })} />
          <NumberRow label="حداکثر تلاش کد پیامکی" value={draft.custom_mfa_max_attempts} min={1} max={20} onChange={(v) => setDraft({ ...draft, custom_mfa_max_attempts: v })} />
          <NumberRow label="حداکثر ارسال مجدد" value={draft.custom_mfa_max_resends} min={0} max={10} onChange={(v) => setDraft({ ...draft, custom_mfa_max_resends: v })} />
        </div>
        <p className="text-xs text-gray-500 dark:text-gray-400">
          در Runtime فعلی، روش‌های MFA حساب فقط TOTP و SMS هستند. بله صرفاً می‌تواند کانال کمکی ارسال باشد و Email/Recovery به‌عنوان روش مستقل ورود فعال نیستند.
        </p>
      </SectionCard>

'''
          if old_start in text:
              start = text.index(old_start)
              end = text.index(next_marker, start)
              text = text[:start] + new_sms_block + text[end:]
          elif '      <SectionCard title="MFA پیامکی" icon={Shield}>' not in text:
              raise SystemExit('SecuritySettingsConsole custom MFA block drifted; refusing blind edit')
          console.write_text(text)

          types = Path('src/features/security-settings/types/securitySettings.ts')
          text = types.read_text()
          marker = "  | 'SETTINGS_NOT_FOUND'\n  | 'UNKNOWN_SECURITY_ERROR';"
          replacement = "  | 'SETTINGS_NOT_FOUND'\n  | 'CUSTOM_MFA_FACTOR_UNSUPPORTED'\n  | 'CUSTOM_MFA_REQUIRED_UNSUPPORTED'\n  | 'SMS_MFA_FACTOR_REQUIRED'\n  | 'SMS_MFA_NOT_READY'\n  | 'ACTIVE_SMS_MFA_USERS'\n  | 'UNKNOWN_SECURITY_ERROR';"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif "  | 'ACTIVE_SMS_MFA_USERS'" not in text:
              raise SystemExit('SecurityErrorCode marker drifted')
          msg_marker = "  SETTINGS_NOT_FOUND: 'تنظیمات امنیتی یافت نشد.',\n  UNKNOWN_SECURITY_ERROR: 'خطای ناشناخته رخ داد.',"
          msg_replacement = "  SETTINGS_NOT_FOUND: 'تنظیمات امنیتی یافت نشد.',\n  CUSTOM_MFA_FACTOR_UNSUPPORTED: 'در نسخه فعلی فقط SMS به‌عنوان روش MFA سفارشی پشتیبانی می‌شود.',\n  CUSTOM_MFA_REQUIRED_UNSUPPORTED: 'الزام عمومی MFA سفارشی در Runtime فعلی پشتیبانی نمی‌شود.',\n  SMS_MFA_FACTOR_REQUIRED: 'برای فعال‌سازی MFA پیامکی، عامل SMS باید فعال باشد.',\n  SMS_MFA_NOT_READY: 'سرویس‌دهنده فعال پیامک برای MFA یافت نشد.',\n  ACTIVE_SMS_MFA_USERS: 'تا زمانی که کاربر فعال با MFA پیامکی وجود دارد، این زیرساخت قابل غیرفعال‌سازی نیست.',\n  UNKNOWN_SECURITY_ERROR: 'خطای ناشناخته رخ داد.',"
          if msg_marker in text:
              text = text.replace(msg_marker, msg_replacement, 1)
          elif 'ACTIVE_SMS_MFA_USERS:' not in text:
              raise SystemExit('security error message marker drifted')
          known_marker = "    'UNAUTHORIZED', 'SESSION_INVALID', 'SECURITY_ADMIN_REQUIRED', 'SETTINGS_NOT_FOUND',\n  ];"
          known_replacement = "    'UNAUTHORIZED', 'SESSION_INVALID', 'SECURITY_ADMIN_REQUIRED', 'SETTINGS_NOT_FOUND',\n    'CUSTOM_MFA_FACTOR_UNSUPPORTED', 'CUSTOM_MFA_REQUIRED_UNSUPPORTED',\n    'SMS_MFA_FACTOR_REQUIRED', 'SMS_MFA_NOT_READY', 'ACTIVE_SMS_MFA_USERS',\n  ];"
          if known_marker in text:
              text = text.replace(known_marker, known_replacement, 1)
          elif "'ACTIVE_SMS_MFA_USERS'," not in text:
              raise SystemExit('mapSecurityError marker drifted')
          types.write_text(text)

          test = Path('tests/auth/authSecurityConfig.test.ts')
          text = test.read_text()
          const_marker = "const hardeningMigration = read('supabase/migrations/20260914093000_align_security_portal_runtime_controls.sql');"
          const_replacement = const_marker + "\nconst smsMfaMigration = read('supabase/migrations/20260914100000_align_sms_mfa_security_controls.sql');"
          if const_marker in text and 'const smsMfaMigration' not in text:
              text = text.replace(const_marker, const_replacement, 1)
          test_marker = "  it('blocks authenticated browser access to security secret rows', () => {"
          new_test = """  it('keeps the admin MFA controls aligned with the canonical SMS runtime', () => {\n    assert.match(securityConsole, /MFA پیامکی/);\n    assert.match(securityConsole, /custom_mfa_allowed_factors: v \\? \\['sms'\\]/);\n    assert.doesNotMatch(securityConsole, /title=\"احراز هویت سفارشی\"/);\n    assert.match(smsMfaMigration, /CUSTOM_MFA_FACTOR_UNSUPPORTED/);\n    assert.match(smsMfaMigration, /ACTIVE_SMS_MFA_USERS/);\n    assert.match(smsMfaMigration, /mfa_method = 'sms'/);\n  });\n\n"""
          if test_marker in text and "canonical SMS runtime" not in text:
              text = text.replace(test_marker, new_test + test_marker, 1)
          test.write_text(text)
          PY
      - name: Build
        run: npm run build
      - name: Auth security configuration tests
        run: npm run test:auth-security-config
      - name: Commit aligned source if needed
        run: |
          if git diff --quiet; then
            echo 'No source alignment changes to commit.'
            exit 0
          fi
          git config user.name 'hamedplay'
          git config user.email 'hamedkhaleghi493@gmail.com'
          git add src/components/PortalConfigPage.tsx src/features/security-settings/components/SecuritySettingsConsole.tsx src/features/security-settings/types/securitySettings.ts tests/auth/authSecurityConfig.test.ts
          git commit -m 'fix(security): align sms mfa admin controls'
          git push origin HEAD:main

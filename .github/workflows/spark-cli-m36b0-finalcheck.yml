name: Spark CLI M3.6-B0 Final Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-cli-m36b0-finalcheck.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exclude function owner from canonical fingerprint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/spark-cli/roles/database/schema/live_inventory.py')
          text = path.read_text()
          old = '''    canonical = {
        key: payload[key]
        for key in (
            "schemas", "tables", "columns", "constraints", "indexes", "functions", "triggers",
            "policies", "types", "sequences", "views", "extensions", "dependencies",
        )
    }
    canonical["grants"] = grants
'''
          new = '''    functions = {
        name: {k: v for k, v in item.items() if k != "owner"}
        for name, item in payload["functions"].items()
    }
    canonical = {
        key: payload[key]
        for key in (
            "schemas", "tables", "columns", "constraints", "indexes", "triggers",
            "policies", "types", "sequences", "views", "extensions", "dependencies",
        )
    }
    canonical["functions"] = functions
    canonical["grants"] = grants
'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          test = Path('deploy/spark-cli/tests/database/schema/test_live_inventory.py')
          text = test.read_text()
          anchor = '''        self.assertEqual(canonical_fingerprint(first), canonical_fingerprint(second))
'''
          addition = '''        self.assertEqual(canonical_fingerprint(first), canonical_fingerprint(second))

        with_owner = json.loads(json.dumps(first))
        with_owner["functions"] = {
            "public.f()": {"owner": "old_postgres", "security": "INVOKER", "definition_sha256": "abc"}
        }
        other_owner = json.loads(json.dumps(with_owner))
        other_owner["functions"]["public.f()"]["owner"] = "new_postgres"
        self.assertEqual(canonical_fingerprint(with_owner), canonical_fingerprint(other_owner))
'''
          assert anchor in text
          test.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Validate
        working-directory: deploy/spark-cli
        run: |
          python3 -m compileall -q roles config database_cli.py
          python3 -m unittest discover -s tests/database/schema -p 'test_*.py' -v
          python3 -m unittest discover -s tests/database -p 'test_*.py' -v
      - name: Commit fix
        run: |
          git config user.name 'spark-ci'
          git config user.email 'spark-ci@users.noreply.github.com'
          git add deploy/spark-cli/roles/database/schema/live_inventory.py deploy/spark-cli/tests/database/schema/test_live_inventory.py
          git commit -m 'fix: exclude environment owner noise from schema fingerprint'
          git push origin HEAD:main

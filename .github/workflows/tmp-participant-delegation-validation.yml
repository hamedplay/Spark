name: Temporary participant delegation validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-participant-delegation-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate pending delegation wiring
        run: |
          grep -q "get_my_meeting_delegations_v1" src/components/Calendar/useCalendarDataActions.ts
          grep -q "درخواست جانشینی از طرف" src/components/MeetingInboxButton.tsx
          grep -q "به کارتابل او ارسال شد" src/components/MeetingInboxButton.tsx
          grep -q "status = 'pending'" supabase/migrations/20260827070521_make_participant_delegation_acceptance_driven.sql
          grep -q "participant_user_ids" supabase/migrations/20260827070937_fix_participant_delegation_accept_aliases.sql

name: Temporary maintenance mode fix validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-maintenance-mode-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch focused maintenance-mode paths
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/components/PortalConfigPage.tsx')
          text = page.read_text()
          import_anchor = "import { ConfigField } from './PortalConfig/ConfigField';\n"
          import_line = "import { MaintenanceModeField } from './PortalConfig/MaintenanceModeField';\n"
          if import_line not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          save_anchor = """  const saveConfig = async (id: string, value: string) => {
    const cfg = configs.find(c => c.id === id);
"""
          save_replacement = """  const saveConfig = async (id: string, value: string) => {
    const cfg = configs.find(c => c.id === id);
"""
          assert save_anchor in text

          handler_anchor = """  const cfgs = (section: string) => configs.filter(c => c.section === section);
"""
          handler = """  const saveMaintenanceMode = async (id: string, value: string): Promise<boolean> => {
    const cfg = configs.find(c => c.id === id);
    if (!cfg || cfg.section !== 'security' || cfg.key !== 'maintenance_mode') {
      toast.error('تنظیم حالت تعمیر و نگهداری نامعتبر است');
      return false;
    }

    const enabled = value === 'true';
    const { data, error } = await supabase.rpc('set_maintenance_mode', { p_enabled: enabled });
    if (error) {
      console.error('[PortalConfig] maintenance mode RPC failed', error);
      toast.error('اعمال حالت تعمیر و نگهداری انجام نشد');
      return false;
    }

    const result = data as { ok?: boolean; error?: string } | null;
    if (!result?.ok) {
      const message = result?.error === 'ADMIN_REQUIRED'
        ? 'فقط مدیر سامانه اجازه تغییر حالت تعمیر و نگهداری را دارد'
        : result?.error === 'SESSION_INVALID' || result?.error === 'SESSION_NOT_FULLY_AUTHORIZED'
          ? 'نشست شما برای این تغییر معتبر نیست؛ دوباره وارد شوید'
          : 'اعمال حالت تعمیر و نگهداری انجام نشد';
      toast.error(message);
      return false;
    }

    setConfigs(prev => prev.map(c => c.id === id ? { ...c, value } : c));
    window.dispatchEvent(new CustomEvent('maintenance-mode-changed', { detail: { enabled } }));
    toast.success(enabled ? 'حالت تعمیر و نگهداری فعال شد' : 'حالت تعمیر و نگهداری غیرفعال شد');
    logAudit({
      module: 'system_config',
      action: 'maintenance_mode_changed',
      entity_name: 'security.maintenance_mode',
      details: enabled ? 'فعال شد' : 'غیرفعال شد',
      severity: 'warning',
    });
    return true;
  };

  const cfgs = (section: string) => configs.filter(c => c.section === section);
"""
          if 'const saveMaintenanceMode = async' not in text:
              assert handler_anchor in text
              text = text.replace(handler_anchor, handler, 1)

          render_anchor = """                {cfgs('security').filter(c => VISIBLE_SECURITY_CONFIG_KEYS.has(c.key)).map(c => <ConfigField key={c.id} entry={c} onSave={saveConfig} />)}
"""
          render_replacement = """                {cfgs('security').filter(c => VISIBLE_SECURITY_CONFIG_KEYS.has(c.key)).map(c => (
                  c.key === 'maintenance_mode'
                    ? <MaintenanceModeField key={c.id} entry={c} onSave={saveMaintenanceMode} />
                    : <ConfigField key={c.id} entry={c} onSave={saveConfig} />
                ))}
"""
          if '<MaintenanceModeField' not in text:
              assert render_anchor in text
              text = text.replace(render_anchor, render_replacement, 1)
          page.write_text(text)

          runtime = Path('src/app/hooks/useAppRuntimeConfig.ts')
          text = runtime.read_text()
          event_anchor = """    const handleSparkVisibleEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ visible?: boolean }>).detail;
      if (typeof detail?.visible === 'boolean') {
        setConfig((current) => ({ ...current, sparkVisible: detail.visible === true }));
      }
    };
    window.addEventListener('spark-visible-changed', handleSparkVisibleEvent);
"""
          event_replacement = """    const handleSparkVisibleEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ visible?: boolean }>).detail;
      if (typeof detail?.visible === 'boolean') {
        setConfig((current) => ({ ...current, sparkVisible: detail.visible === true }));
      }
    };
    const handleMaintenanceModeEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ enabled?: boolean }>).detail;
      if (typeof detail?.enabled === 'boolean') {
        setConfig((current) => ({ ...current, maintenanceMode: detail.enabled === true }));
      }
    };
    window.addEventListener('spark-visible-changed', handleSparkVisibleEvent);
    window.addEventListener('maintenance-mode-changed', handleMaintenanceModeEvent);
"""
          if 'handleMaintenanceModeEvent' not in text:
              assert event_anchor in text
              text = text.replace(event_anchor, event_replacement, 1)
          cleanup_anchor = """      window.removeEventListener('spark-visible-changed', handleSparkVisibleEvent);
      void supabase.removeChannel(channel);
"""
          cleanup_replacement = """      window.removeEventListener('spark-visible-changed', handleSparkVisibleEvent);
      window.removeEventListener('maintenance-mode-changed', handleMaintenanceModeEvent);
      void supabase.removeChannel(channel);
"""
          if "removeEventListener('maintenance-mode-changed'" not in text:
              assert cleanup_anchor in text
              text = text.replace(cleanup_anchor, cleanup_replacement, 1)
          runtime.write_text(text)

          repair = Path('deploy/spark-cli/apply-db-repairs.sh')
          text = repair.read_text()
          var_anchor = 'LOCKED_ACCOUNTS_MIGRATION="${DB_REPAIR_ROOT}/20260914134500_preserve_lock_history_on_manual_unlock.sql"\n'
          vars_new = var_anchor + 'MAINTENANCE_CONTROL_RPC="${DB_REPAIR_ROOT}/20260914142000_maintenance_mode_control_rpc.sql"\nMAINTENANCE_VISIBILITY="${DB_REPAIR_ROOT}/20260914142500_maintenance_mode_runtime_visibility.sql"\n'
          if 'MAINTENANCE_CONTROL_RPC=' not in text:
              assert var_anchor in text
              text = text.replace(var_anchor, vars_new, 1)

          function_anchor = """list_state="$(list_contract_state 2>/dev/null || true)"
"""
          maintenance_function = """maintenance_mode_state() {
  compose exec -T db psql -X -U postgres -d postgres -Atqc \\
    "SELECT CASE
       WHEN to_regprocedure('public.set_maintenance_mode(boolean)') IS NOT NULL
        AND has_function_privilege('authenticated', 'public.set_maintenance_mode(boolean)', 'EXECUTE')
        AND NOT has_function_privilege('anon', 'public.set_maintenance_mode(boolean)', 'EXECUTE')
        AND EXISTS (
          SELECT 1 FROM pg_policies
          WHERE schemaname = 'public'
            AND tablename = 'system_config'
            AND policyname = 'system_config_authenticated_read_maintenance_mode'
            AND cmd = 'SELECT'
        )
       THEN 'ready' ELSE 'stale' END;"
}

list_state="$(list_contract_state 2>/dev/null || true)"
"""
          if 'maintenance_mode_state()' not in text:
              assert function_anchor in text
              text = text.replace(function_anchor, maintenance_function, 1)

          flow_anchor = """compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c \\
  "NOTIFY pgrst, 'reload schema';" >/dev/null

list_state="$(list_contract_state)"
clear_state="$(clear_contract_state)"
locked_state="$(locked_accounts_state)"
[[ "$list_state" == "ready" && "$clear_state" == "ready" && "$locked_state" == "ready" ]] || {
"""
          flow_replacement = """maintenance_state="$(maintenance_mode_state 2>/dev/null || true)"
if [[ "$maintenance_state" != "ready" ]]; then
  require_repair_file "$MAINTENANCE_CONTROL_RPC"
  require_repair_file "$MAINTENANCE_VISIBILITY"
  echo "Spark DB repair: installing maintenance-mode control contract..."
  compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <"$MAINTENANCE_CONTROL_RPC"
  compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <"$MAINTENANCE_VISIBILITY"
else
  echo "Spark DB repair: maintenance-mode control contract is current."
fi

compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c \\
  "NOTIFY pgrst, 'reload schema';" >/dev/null

list_state="$(list_contract_state)"
clear_state="$(clear_contract_state)"
locked_state="$(locked_accounts_state)"
maintenance_state="$(maintenance_mode_state)"
[[ "$list_state" == "ready" && "$clear_state" == "ready" && "$locked_state" == "ready" && "$maintenance_state" == "ready" ]] || {
"""
          if 'installing maintenance-mode control contract' not in text:
              assert flow_anchor in text
              text = text.replace(flow_anchor, flow_replacement, 1)

          validation_old = """        OR (p.proname = 'security_admin_unlock_account' AND pg_get_function_identity_arguments(p.oid) = 'p_user_id uuid')
      )
"""
          validation_new = """        OR (p.proname = 'security_admin_unlock_account' AND pg_get_function_identity_arguments(p.oid) = 'p_user_id uuid')
        OR (p.proname = 'set_maintenance_mode' AND pg_get_function_identity_arguments(p.oid) = 'p_enabled boolean')
      )
"""
          if "p.proname = 'set_maintenance_mode'" not in text:
              assert validation_old in text
              text = text.replace(validation_old, validation_new, 1)
          text = text.replace('[[ "$validation" == "4" ]]', '[[ "$validation" == "5" ]]')
          repair.write_text(text)
          PY

      - name: Validate deploy shell
        run: bash -n deploy/spark-cli/apply-db-repairs.sh

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify focused maintenance contract
        run: |
          grep -Fq "supabase.rpc('set_maintenance_mode'" src/components/PortalConfigPage.tsx
          grep -Fq '<MaintenanceModeField' src/components/PortalConfigPage.tsx
          grep -Fq "maintenance-mode-changed" src/app/hooks/useAppRuntimeConfig.ts
          grep -Fq 'MAINTENANCE_CONTROL_RPC=' deploy/spark-cli/apply-db-repairs.sh
          grep -Fq 'system_config_authenticated_read_maintenance_mode' deploy/spark-cli/db-repairs/20260914142500_maintenance_mode_runtime_visibility.sql
          grep -Fq 'ADMIN_REQUIRED' deploy/spark-cli/db-repairs/20260914142000_maintenance_mode_control_rpc.sql

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PortalConfigPage.tsx src/app/hooks/useAppRuntimeConfig.ts deploy/spark-cli/apply-db-repairs.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(security): make maintenance mode effective'
          git push origin HEAD:main

name: tmp-fix-chat-call-signaling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-chat-call-signaling.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'cleanup tmp chat call signaling') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply exact signaling fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/context/GlobalCallContext.tsx')
          text = path.read_text()
          old = ".channel(`incoming-calls-${currentUserId}-${Date.now()}`)"
          new = ".channel(`incoming-calls-${currentUserId}`)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one mismatched incoming-call topic, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F '.channel(`incoming-calls-${currentUserId}`)' src/context/GlobalCallContext.tsx
          if grep -Fq '.channel(`incoming-calls-${currentUserId}-${Date.now()}`)' src/context/GlobalCallContext.tsx; then
            echo 'stale timestamped incoming-call topic still present' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-chat-call-signaling.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/GlobalCallContext.tsx .github/workflows/tmp-fix-chat-call-signaling.yml
          git diff --cached --check
          git commit -m 'fix(chat): restore incoming call signaling [skip ci]'
          git push origin HEAD:main

      - name: Cleanup temporary workflow if validation fails
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD || true
          rm -f .github/workflows/tmp-fix-chat-call-signaling.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: cleanup tmp chat call signaling [skip ci]' || true
          git push origin HEAD:main || true

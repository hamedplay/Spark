name: Temporary action decision notification validator

on:
  push:
    branches: [main]
    paths:
      - '.tmp-action-decision-notification-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - id: transform
        name: Apply scoped transform
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            src/components/Tasks/utils.ts \
            src/components/TasksPage.tsx \
            src/components/Tasks/ReferModal.tsx \
            src/components/Tasks/AddNoteModal.tsx \
            src/components/NotificationsConfig/constants.ts \
            src/components/NotificationsConfig/GroupsTab.tsx \
            src/config/templateCatalog.ts; do
            printf '%s %s\n' "$path" "$(git rev-parse HEAD:"$path")" >> /tmp/notification-target-shas
          done
          python3 .tmp-fix-action-decision-notifications.py
          git diff --check

      - id: node
        name: Setup Node 24.18.1
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - id: install
        name: Install dependencies
        if: steps.transform.outcome == 'success' && steps.node.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - id: build
        name: Build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: tests
        name: Notification tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run test:notification-model
          npm run test:notification-producer-model
          npm run test:notification-producer

      - id: contract
        name: Verify action decision notification contract
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          utils = Path('src/components/Tasks/utils.ts').read_text(encoding='utf-8')
          tasks = Path('src/components/TasksPage.tsx').read_text(encoding='utf-8')
          refer = Path('src/components/Tasks/ReferModal.tsx').read_text(encoding='utf-8')
          note = Path('src/components/Tasks/AddNoteModal.tsx').read_text(encoding='utf-8')
          constants = Path('src/components/NotificationsConfig/constants.ts').read_text(encoding='utf-8')
          groups = Path('src/components/NotificationsConfig/GroupsTab.tsx').read_text(encoding='utf-8')
          catalog = Path('src/config/templateCatalog.ts').read_text(encoding='utf-8')
          migration_path = Path('.tmp-action-decision-migration-path').read_text(encoding='utf-8').strip()
          migration = Path(migration_path).read_text(encoding='utf-8')

          canonical = ('assign','reminder','complete','note_added','referred','status_in_progress','status_pending')
          for event in canonical:
              assert f"key: '{event}'" in constants
          assert "task_assign" not in constants
          assert "task_reminder" not in constants
          assert "task_complete" not in constants
          assert "eventType: options.eventType ?? 'assign'" in utils
          assert "eventType: 'referred'" in refer
          assert "eventType: 'note_added'" in note
          assert "? 'status_pending'" in tasks
          assert "{ eventType: notificationEventType }" in tasks
          assert "REGISTRY_CATEGORY_LABELS.has(n.category)" in groups
          assert "!REGISTRY_CATEGORIES.includes(n.category)" not in groups
          for event in ('note_added','referred','status_in_progress','status_pending'):
              assert f"key: '{event}'" in catalog
          assert "p_template_category = 'task'" in migration
          assert "notification_type = p_template_event_type" in migration
          assert "GROUP_RULE_DISABLED" in migration
          print('notification contract passed')
          PY
          git diff --check

      - id: freshness
        name: Confirm target source files are still current
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          while read -r path sha; do
            test "$sha" = "$(git rev-parse origin/main:"$path")"
          done < /tmp/notification-target-shas

      - name: Commit validated fix or clean failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          transform='${{ steps.transform.outcome }}'
          node='${{ steps.node.outcome }}'
          install='${{ steps.install.outcome }}'
          build='${{ steps.build.outcome }}'
          tests='${{ steps.tests.outcome }}'
          contract='${{ steps.contract.outcome }}'
          freshness='${{ steps.freshness.outcome }}'

          migration_path=''
          if [ -f .tmp-action-decision-migration-path ]; then
            migration_path="$(cat .tmp-action-decision-migration-path)"
          fi

          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace("      - '.tmp-action-decision-notification-trigger'\n", '')
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/tmp-fix-action-decision-notifications-push.yml
          rm -f .tmp-fix-action-decision-notifications.py
          rm -f .tmp-action-decision-notification-trigger
          rm -f .tmp-action-decision-migration-path

          if [ "$transform" = success ] && [ "$node" = success ] && [ "$install" = success ] && [ "$build" = success ] && [ "$tests" = success ] && [ "$contract" = success ] && [ "$freshness" = success ]; then
            message='fix(notifications): align action and decision controls [skip ci]'
          else
            git restore --source=HEAD -- \
              src/components/Tasks/utils.ts \
              src/components/TasksPage.tsx \
              src/components/Tasks/ReferModal.tsx \
              src/components/Tasks/AddNoteModal.tsx \
              src/components/NotificationsConfig/constants.ts \
              src/components/NotificationsConfig/GroupsTab.tsx \
              src/config/templateCatalog.ts
            if [ -n "$migration_path" ]; then rm -f "$migration_path"; fi
            message="chore: notification validation failed transform-$transform node-$node install-$install build-$build tests-$tests contract-$contract freshness-$freshness [skip ci]"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="سیستم مدیریت حرفه‌ای جلسات، پیگیری تصمیمات و همکاری تیمی" />

    <!-- Preload the small, immediately visible Spark shell assets so the loader/login
         can paint with the branded logo and Vazirmatn without waiting for CSS/JS
         discovery. These are same-origin static assets and do not change runtime behavior. -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/logo_spark.png" as="image" type="image/png" fetchpriority="high" />

    <!-- Production API traffic is same-origin; no DNS-specific API preconnect. -->

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="اسپارک" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Android Chrome PWA -->
    <meta name="application-name" content="اسپارک" />

    <!-- Windows / Edge -->
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-TileImage" content="/logo_spark.png" />
    <meta name="msapplication-config" content="none" />

    <link rel="manifest" href="/manifest.json" />
    <!-- Use the smaller existing icon for ordinary browser chrome; larger
         touch icons remain available to platforms that explicitly need them. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo_spark.png" />
    <link rel="apple-touch-icon" href="/logo_spark.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo_spark.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <title>اسپارک - سامانه هوشمند مدیریت سازمانی</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/pwa-bootstrap.js" defer></script>
  </body>
</html>
